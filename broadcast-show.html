<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>W3BC Program Output</title><style>:root{--c:#22d3e5;--l:#29343b}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.frame{position:absolute;inset:0;background:#05080a;border:2px solid #1c252b;display:grid;grid-template-rows:72px 1fr 82px}.head{display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid var(--l);background:#070a0c}.brand{display:flex;align-items:center;gap:14px}.brand img{width:68px;height:50px;object-fit:contain}.brand b{letter-spacing:.12em}.brand small{display:block;color:#738087;font-size:8px;letter-spacing:.17em;margin-top:4px}.live{font-size:10px;border:1px solid #7a2c31;color:#ff7479;padding:7px 10px}.stage{position:relative;overflow:hidden}.cameraFull{position:absolute;inset:0;background:transparent}.cameraFull:after{content:'FULL CAMERA';position:absolute;inset:20px;border:1px dashed rgba(34,211,229,.18);display:grid;place-items:center;color:rgba(34,211,229,.18);font-size:22px;font-weight:900;letter-spacing:.18em}.lower{position:absolute;left:34px;bottom:28px;min-width:330px;border-left:4px solid var(--c);background:rgba(5,9,11,.92);padding:13px 18px}.lower b{font-size:22px}.lower span{display:block;color:var(--c);font-size:10px;margin-top:4px}.split{height:100%;display:grid;grid-template-columns:1fr 350px}.content{padding:5vh 4vw;background:radial-gradient(circle at 70% 40%,rgba(34,211,229,.09),transparent 38%);display:flex;flex-direction:column;justify-content:center}.ey{color:var(--c);font-size:10px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}.content h1{font-size:clamp(50px,5.5vw,86px);line-height:.92;letter-spacing:-.055em;margin:15px 0;max-width:900px}.content p{font-size:18px;line-height:1.5;color:#aeb8bd;max-width:760px}.rail{border-left:1px solid var(--l);background:#080c0e;display:flex;flex-direction:column}.rhead{height:48px;padding:0 15px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--l);color:var(--c);font-size:9px;font-weight:900;letter-spacing:.12em}.rrow{padding:12px 14px;border-bottom:1px solid #242d32;font-size:10px}.rrow.active{background:var(--c);color:#041013}.rrow small{display:block;margin-top:3px;opacity:.62}.cam{margin-top:auto;height:210px;border-top:1px solid var(--l);position:relative}.cam:before{content:'CAMERA';position:absolute;inset:8px;border:1px solid var(--c);display:grid;place-items:center;color:rgba(34,211,229,.25);font-weight:900;letter-spacing:.15em}.chart{height:100%;display:grid;grid-template-columns:1fr 300px}.chartarea{position:relative;background:linear-gradient(rgba(34,211,229,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(34,211,229,.035) 1px,transparent 1px);background-size:60px 60px}.chartarea svg{position:absolute;inset:5%;width:90%;height:90%}.ticker{border-top:1px solid var(--l);display:grid;grid-template-columns:220px 1fr 260px;background:#080b0d}.sig{padding:0 20px;display:flex;align-items:center;color:var(--c);font-weight:900;font-size:12px;border-right:1px solid var(--l)}.tick{display:flex;align-items:center;padding:0 20px;color:#aeb8bd;font-size:11px}.seg{display:flex;align-items:center;justify-content:center;border-left:1px solid var(--l);font-size:10px}.seg b{color:var(--c);margin-left:7px}.newschildren{margin-top:20px;border-top:1px solid var(--l);max-width:760px}.newschildren div{padding:10px 0;border-bottom:1px solid #20282d;font-size:11px;color:#7f8b92}.newschildren .active{color:#fff}.newschildren .active:before{content:'▶ ';color:var(--c)}.guestgrid{height:100%;display:grid;grid-template-columns:1fr 1fr;gap:2px;background:#1c252b}.guest{background:transparent;position:relative}.guest:after{content:'CAMERA';position:absolute;inset:20px;border:1px solid rgba(34,211,229,.3);display:grid;place-items:center;color:rgba(34,211,229,.22);font-weight:900}.panelgrid{height:100%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px;background:#1c252b}.panelgrid .guest{background:#05080a}</style></head><body><div class="frame"><header class="head"><div class="brand"><img src="assets/w3bc-logo-white.png"><div><b>W3BC LIVE</b><small>MEDIA · MARKETS · CULTURE</small></div></div><div class="live">● LIVE</div></header><main class="stage" id="stage"></main><footer class="ticker"><div class="sig">W3BC SIGNAL · LIVE</div><div class="tick" id="tick">Independent intelligence for what matters.</div><div class="seg">ON AIR <b id="seg"></b></div></footer></div><script>const KEY='w3bcShowStateV1',ch=new BroadcastChannel('w3bc-show');let s=JSON.parse(localStorage.getItem(KEY)||'null');const chartSvg=`<svg viewBox="0 0 1000 560" preserveAspectRatio="none"><g stroke="#243139" stroke-width="1">${[100,200,300,400,500].map(y=>`<line x1="0" y1="${y}" x2="1000" y2="${y}"/>`).join('')}</g><g>${Array.from({length:32},(_,i)=>{let x=25+i*30,o=280+Math.sin(i*.7)*90,c=o+(Math.random()-.5)*70,h=Math.min(o,c)-35,l=Math.max(o,c)+35,up=c<o;return `<line x1="${x}" y1="${h}" x2="${x}" y2="${l}" stroke="${up?'#22d3e5':'#7f8b92'}"/><rect x="${x-7}" y="${Math.min(o,c)}" width="14" height="${Math.max(8,Math.abs(c-o))}" fill="${up?'#22d3e5':'#59666e'}"/>`}).join('')}</g><path d="M20 410 C130 380 180 430 280 330 S440 350 520 250 S680 300 760 180 S900 220 980 120" fill="none" stroke="#8cedf5" stroke-width="3"/></svg>`;function paint(){if(!s)return;const x=s.segments[s.current];seg.textContent=x.name.toUpperCase();tick.textContent=x.desc;if(x.kind==='camera'){stage.innerHTML=`<div class="cameraFull"><div class="lower"><b>J CHAINS</b><span>@JCHAINS · W3BC MEDIA</span></div></div>`;return}if(x.kind==='markets'){stage.innerHTML=`<div class="chart"><div class="chartarea">${chartSvg}<div class="lower"><b>${s.symbol} · ${s.timeframe}</b><span>W3BC MARKETS NOW</span></div></div><div class="rail"><div class="rhead"><span>MARKETS NOW</span><span>LIVE</span></div><div class="rrow active">${s.symbol}<small>${s.timeframe} chart</small></div><div class="rrow">KEY LEVELS<small>Support · resistance · targets</small></div><div class="cam"></div></div></div>`;return}if(x.kind==='interview'){stage.innerHTML=`<div class="guestgrid"><div class="guest"></div><div class="guest"></div></div>`;return}if(x.kind==='panel'){stage.innerHTML=`<div class="panelgrid">${'<div class="guest"></div>'.repeat(4)}</div>`;return}const children=x.children||[];stage.innerHTML=`<div class="split"><div class="content"><div class="ey">${x.name}</div><h1>${x.kind==='news'?(children[s.child]||x.name):x.name}</h1><p>${x.desc}</p>${children.length?`<div class="newschildren">${children.map((c,i)=>`<div class="${i===s.child?'active':''}">${c}</div>`).join('')}</div>`:''}</div><aside class="rail"><div class="rhead"><span>SHOW RUNDOWN</span><span>${s.current+1}/${s.segments.length}</span></div>${s.segments.map((z,i)=>`<div class="rrow ${i===s.current?'active':''}">${String(i+1).padStart(2,'0')} · ${z.name}<small>${i===s.current?'NOW':'UP NEXT'}</small></div>`).join('')}<div class="cam"></div></aside></div>`}ch.onmessage=e=>{if(e.data?.type==='state'){s=e.data.state;paint()}};addEventListener('storage',e=>{if(e.key===KEY){s=JSON.parse(e.newValue);paint()}});ch.postMessage({type:'hello'});paint();</script></body></html>
