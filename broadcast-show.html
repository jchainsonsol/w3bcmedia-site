<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>W3BC Program Output</title><style>:root{--c:#22d3e5;--l:#29343b}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.frame{position:absolute;inset:0;background:radial-gradient(circle at 55% 42%,rgba(34,211,229,.045),transparent 42%),#05080a;border:2px solid #1c252b;display:grid;grid-template-rows:72px 1fr 92px}.head{display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid var(--l);background:#070a0c}.brand{display:flex;align-items:center;gap:14px}.brand img{width:68px;height:50px;object-fit:contain}.brand b{letter-spacing:.12em}.brand small{display:block;color:#738087;font-size:8px;letter-spacing:.17em;margin-top:4px}.livewrap{display:flex;gap:12px;align-items:center}.power{font-size:9px;color:#8d989e;border-right:1px solid #303a40;padding-right:14px;text-transform:uppercase}.power b{color:var(--c);margin-left:6px}.live{font-size:10px;border:1px solid #7a2c31;color:#ff7479;padding:7px 10px}.stage{position:relative;overflow:hidden}.cameraFull{position:absolute;inset:0}.cameraFull:after{content:'FULL CAMERA';position:absolute;inset:22px;border:1px dashed rgba(34,211,229,.12);display:grid;place-items:center;color:rgba(34,211,229,.12);font-size:22px;font-weight:900;letter-spacing:.18em}.lower{position:absolute;left:38px;bottom:34px;min-width:360px;border-left:4px solid var(--c);background:linear-gradient(90deg,rgba(5,9,11,.96),rgba(5,9,11,.76));padding:14px 19px}.lower b{font-size:23px}.lower span{display:block;color:var(--c);font-size:10px;margin-top:4px}.split,.desk{height:100%;display:grid;grid-template-columns:1fr 350px}.content,.deskMain{padding:4.5vh 4vw;background:radial-gradient(circle at 70% 40%,rgba(34,211,229,.10),transparent 38%);display:flex;flex-direction:column;justify-content:center}.ey{color:var(--c);font-size:10px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}.content h1,.deskMain h1{font-size:clamp(48px,5vw,78px);line-height:.94;letter-spacing:-.05em;margin:14px 0;max-width:900px}.content p,.deskMain p{font-size:17px;line-height:1.5;color:#aeb8bd;max-width:780px}.rail{border-left:1px solid var(--l);background:#080c0e;position:relative;height:100%;overflow:hidden;padding-bottom:205px}.rundownArea{height:100%;overflow:hidden}.rhead{height:48px;padding:0 15px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--l);color:var(--c);font-size:9px;font-weight:900;letter-spacing:.12em}.rrow{padding:11px 14px;border-bottom:1px solid #242d32;font-size:10px;transition:.2s}.rrow.complete{color:#5d686f;background:#070a0c}.rrow.complete small{color:#4c565d}.rrow.active{background:linear-gradient(90deg,var(--c),#25b7c6);color:#041013;font-weight:900}.rrow.upnext{color:#d7dde0}.rrow small{display:block;margin-top:3px;opacity:.72;font-size:8px;letter-spacing:.06em}.newsProgress{border-bottom:1px solid #263139;background:#0a1013;padding:7px 10px}.newsProgressHead{display:flex;justify-content:space-between;color:#7f8b92;font-size:7px;font-weight:900;letter-spacing:.11em;text-transform:uppercase;margin-bottom:5px}.newsKeywords{display:grid;gap:3px}.newsKey{display:grid;grid-template-columns:18px 1fr;gap:6px;align-items:center;padding:4px 5px;border-left:2px solid #263139;color:#59656c;font-size:8px;font-weight:800;letter-spacing:.03em;min-height:21px}.newsKey.done{color:#465158;opacity:.6}.newsKey.current{color:#fff;border-left-color:var(--c);background:rgba(34,211,229,.08)}.newsKey.current b{color:var(--c)}.newsKey.next{color:#9ca7ad}.newsKey b{font-size:7px;color:#6e7b82}.cam{position:absolute;left:0;right:0;bottom:0;height:205px;border-top:1px solid var(--l);background:#080c0e}.cam:before{content:'CAMERA';position:absolute;inset:8px;border:1px solid var(--c);display:grid;place-items:center;color:rgba(34,211,229,.22);font-weight:900;letter-spacing:.15em}.storySummary{max-width:790px;font-size:18px!important;color:#c2c9cd!important;line-height:1.52!important;margin:3px 0 20px!important}.takeaways{display:flex;gap:10px;flex-wrap:wrap;max-width:850px}.takeaway{min-width:145px;max-width:245px;border:1px solid #2a363d;background:#091013;padding:13px 15px}.takeaway label{display:block;color:#77858c;font-size:8px;letter-spacing:.12em;text-transform:uppercase}.takeaway strong{display:block;color:var(--c);font-size:25px;line-height:1.05;margin-top:6px}.quote{margin-top:14px;max-width:790px;border-left:3px solid var(--c);padding:10px 15px;background:linear-gradient(90deg,rgba(34,211,229,.07),transparent);font-size:15px;line-height:1.45;color:#d8dde0}.quote span{display:block;color:#748188;font-size:8px;letter-spacing:.1em;margin-bottom:5px}.chart{height:100%;display:grid;grid-template-columns:1fr 310px}.chartarea{position:relative;background:linear-gradient(rgba(34,211,229,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(34,211,229,.035) 1px,transparent 1px);background-size:60px 60px}.chartarea svg{position:absolute;inset:5%;width:90%;height:90%}.stat{padding:15px;border-bottom:1px solid #263139}.stat label{display:block;color:#748188;font-size:8px;letter-spacing:.12em}.stat strong{display:block;font-size:18px;margin-top:5px}.scorecard{border:1px solid #2a353c;margin-top:20px;max-width:720px;display:grid;grid-template-columns:1fr 160px}.scorecard div{padding:16px}.scorecard .big{border-left:1px solid #2a353c;text-align:center}.scorecard .big strong{font-size:30px;color:var(--c)}.odds{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px;max-width:700px}.odd{border:1px solid #2b373e;padding:15px;background:#0a0f12}.odd label{font-size:8px;color:#75838a;letter-spacing:.1em}.odd strong{display:block;font-size:22px;margin-top:5px}.guestgrid{height:100%;display:grid;grid-template-columns:1fr 1fr;gap:2px;background:#1c252b}.guest{position:relative}.guest:after{content:'CAMERA';position:absolute;inset:20px;border:1px solid rgba(34,211,229,.3);display:grid;place-items:center;color:rgba(34,211,229,.22);font-weight:900}.panelgrid{height:100%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px;background:#1c252b}.footer{border-top:1px solid var(--l);display:grid;grid-template-rows:42px 48px;background:#080b0d}.crawl{display:grid;grid-template-columns:155px 1fr;border-bottom:1px solid #222c31;overflow:hidden}.crawlLabel{background:var(--c);color:#041013;display:flex;align-items:center;padding:0 18px;font-size:10px;font-weight:950;letter-spacing:.08em}.crawlWindow{overflow:hidden;display:flex;align-items:center;white-space:nowrap}.crawlTrack{display:inline-block;padding-left:100%;animation:crawl 42s linear infinite;color:#d4dade;font-size:11px}.crawlTrack span{margin-right:55px}.crawlTrack i{color:var(--c);font-style:normal;margin-right:10px}@keyframes crawl{from{transform:translateX(0)}to{transform:translateX(-100%)}}.bottom{display:grid;grid-template-columns:220px 1fr 290px}.sig{padding:0 20px;display:flex;align-items:center;color:var(--c);font-weight:900;font-size:11px;border-right:1px solid var(--l)}.sponsor{display:flex;align-items:center;padding:0 20px;font-size:10px;color:#9ba6ab}.sponsor strong{color:#fff;margin:0 7px}.seg{display:flex;align-items:center;justify-content:center;border-left:1px solid var(--l);font-size:9px}.seg b{color:var(--c);margin-left:7px}</style></head><body><div class="frame"><header class="head"><div class="brand"><img src="assets/w3bc-logo-white.png"><div><b>W3BC LIVE</b><small>MEDIA · MARKETS · CULTURE</small></div></div><div class="livewrap"><div class="power" id="power"></div><div class="live">● LIVE</div></div></header><main class="stage" id="stage"></main><footer class="footer"><div class="crawl"><div class="crawlLabel">W3BC UPDATE</div><div class="crawlWindow"><div class="crawlTrack" id="crawl"></div></div></div><div class="bottom"><div class="sig">W3BC SIGNAL · LIVE</div><div class="sponsor">W3BC PARTNER <strong id="spName">W3BC MEDIA</strong><span id="spMsg">Turn Your Moment Into Momentum</span></div><div class="seg">ON AIR <b id="seg"></b></div></div></footer></div><script>const KEY='w3bcShowStateV1',ch=new BroadcastChannel('w3bc-show');let s=JSON.parse(localStorage.getItem(KEY)||'null'),spTimer,spI=0;const chartSvg=`<svg viewBox="0 0 1000 560" preserveAspectRatio="none"><path d="M20 410 C130 380 180 430 280 330 S440 350 520 250 S680 300 760 180 S900 220 980 120" fill="none" stroke="#8cedf5" stroke-width="3"/></svg>`;const storyDefaults=[{headline:'The financial system is moving onchain — piece by piece.',summary:'Tokenization is moving from theory into infrastructure. Governments, financial institutions and DeFi protocols are increasingly testing how traditional assets can be issued, settled and used onchain.',stats:[['THE SHIFT','RWA'],['FOCUS','SETTLEMENT'],['TREND','ONCHAIN']],quote:'The important story is not one product — it is the financial architecture being built underneath the market.'},{headline:'Japan tests blockchain around government bond activity.',summary:'Japan is exploring how blockchain infrastructure could improve parts of the government bond lifecycle, another signal that tokenization is expanding beyond private-market experiments.',stats:[['ASSET','BONDS'],['MARKET','JAPAN']],quote:'Government debt is one of the clearest tests of whether tokenized finance can operate at institutional scale.'},{headline:'Real-world assets are becoming productive inside DeFi.',summary:'Tokenized real-world assets are increasingly being used as financial building blocks rather than simply represented onchain, connecting traditional yield and collateral with decentralized markets.',stats:[['SECTOR','RWA'],['USE CASE','DEFI']],quote:'The next phase is utility: tokenized assets that can actually move, settle, collateralize and earn.'}];const newsKeywords=['ONCHAIN','JAPAN BONDS','RWA DEFI','COMPOUND','TOKENIZED STOCKS','BTC ETF','STABLECOINS'];function active(){return(s?.segments||[]).filter(x=>x.enabled!==false)}function rotateSponsor(){let a=s?.sponsors||[];if(!a.length)return;let x=a[spI++%a.length];spName.textContent=x.name;spMsg.textContent=x.msg}function setupSponsor(){clearInterval(spTimer);rotateSponsor();spTimer=setInterval(rotateSponsor,180000)}function newsProgress(){let keys=(s.segments?.[s.current]?.children||[]).map((_,i)=>newsKeywords[i]||`STORY ${i+1}`);let start=Math.max(0,Math.min(s.child-1,keys.length-3));let visible=keys.slice(start,start+3);return `<div class="newsProgress"><div class="newsProgressHead"><span>NEWS DESK STORIES</span><span>${s.child+1}/${keys.length}</span></div><div class="newsKeywords">${visible.map((k,j)=>{let i=start+j;return `<div class="newsKey ${i<s.child?'done':i===s.child?'current':'next'}"><b>${String(i+1).padStart(2,'0')}</b><span>${k}</span></div>`}).join('')}</div></div>`}function rail(x,a,pos){return `<aside class="rail"><div class="rundownArea"><div class="rhead"><span>SHOW RUNDOWN</span><span>${pos+1}/${a.length}</span></div>${a.map((z,i)=>{let cls=z===x?'active':i<pos?'complete':'upnext';let status=z===x?'NOW':i>pos?'UP NEXT':'COMPLETE';return `<div class="rrow ${cls}">${String(i+1).padStart(2,'0')} · ${z.name}<small>${status}</small></div>${z===x&&x.kind==='news'?newsProgress():''}`}).join('')}</div><div class="cam"></div></aside>`}function story(x){let d=(s.newsStories&&s.newsStories[s.child])||storyDefaults[s.child]||{headline:x.children?.[s.child]||'News Desk',summary:'Story summary will populate from the daily W3BC news package.',stats:[],quote:''};return `<div class="split"><div class="content"><div class="ey">NEWS DESK · STORY ${String(s.child+1).padStart(2,'0')}</div><h1>${d.headline}</h1><p class="storySummary">${d.summary}</p>${d.stats?.length?`<div class="takeaways">${d.stats.map(v=>`<div class="takeaway"><label>${v[0]}</label><strong>${v[1]}</strong></div>`).join('')}</div>`:''}${d.quote?`<div class="quote"><span>KEY TAKEAWAY / QUOTE</span>${d.quote}</div>`:''}</div>${rail(x,active(),active().indexOf(x))}</div>`}function paint(){if(!s)return;let x=s.segments[s.current],a=active(),pos=a.indexOf(x);seg.textContent=x.name.toUpperCase();power.innerHTML=x.sponsor?`POWERED BY <b>${x.sponsor}</b>`:'';crawl.innerHTML=(s.ticker||[]).map((t,i)=>`<span><i>${i%2?'●':'◆'}</i>${t}</span>`).join('');if(x.kind==='camera'){stage.innerHTML=`<div class="cameraFull"><div class="lower"><b>J CHAINS</b><span>@JCHAINS · W3BC MEDIA</span></div></div>`;return}if(x.kind==='markets'){let m=s.market||{};stage.innerHTML=`<div class="chart"><div class="chartarea">${chartSvg}<div class="lower"><b>${m.symbol||s.symbol} · ${m.timeframe||s.timeframe}</b><span>MARKETS NOW · POWERED BY BITUNIX</span></div></div>${rail(x,a,pos)}</div>`;return}if(x.kind==='news'){stage.innerHTML=story(x);return}if(x.kind==='interview'){stage.innerHTML=`<div class="guestgrid"><div class="guest"></div><div class="guest"></div></div>`;return}if(x.kind==='panel'){stage.innerHTML=`<div class="panelgrid">${'<div class="guest"></div>'.repeat(4)}</div>`;return}if(x.kind==='ai'){stage.innerHTML=`<div class="desk"><div class="deskMain"><div class="ey">AI + TECHNOLOGY</div><h1>${s.ai?.headline||x.name}</h1><p>${s.ai?.detail||x.desc}</p><div class="scorecard"><div><div class="ey">W3BC SIGNAL</div><p>What matters, what is noise, and what changes next.</p></div><div class="big"><strong>AI</strong></div></div></div>${rail(x,a,pos)}</div>`;return}if(x.kind==='sports'){stage.innerHTML=`<div class="desk"><div class="deskMain"><div class="ey">SPORTS DESK</div><h1>${s.sports?.headline||x.name}</h1><p>${s.sports?.detail||x.desc}</p></div>${rail(x,a,pos)}</div>`;return}if(x.kind==='betting'){let b=s.betting||{};stage.innerHTML=`<div class="desk"><div class="deskMain"><div class="ey">BETTING DESK · POWERED BY BC.GAME</div><h1>${b.event||'Featured Betting Market'}</h1><div class="odds"><div class="odd"><label>CURRENT LINE</label><strong>${b.line||'-110'}</strong></div><div class="odd"><label>LINE MOVEMENT</label><strong>${b.movement||'Pending'}</strong></div></div><p>${b.note||x.desc}</p></div>${rail(x,a,pos)}</div>`;return}stage.innerHTML=`<div class="split"><div class="content"><div class="ey">${x.name}</div><h1>${x.name}</h1><p>${x.desc}</p></div>${rail(x,a,pos)}</div>`}ch.onmessage=e=>{if(e.data?.type==='state'){s=e.data.state;paint();setupSponsor()}};addEventListener('storage',e=>{if(e.key===KEY){s=JSON.parse(e.newValue);paint();setupSponsor()}});ch.postMessage({type:'hello'});paint();setupSponsor();</script></body></html>
