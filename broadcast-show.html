<style>
:root{--c:#22d3e5;--l:#29343b;--green:#42d9a0;--red:#ff6c76;--yellow:#ffd166}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.frame{position:absolute;inset:0;background:radial-gradient(circle at 55% 42%,rgba(34,211,229,.045),transparent 42%),#05080a;border:2px solid #1c252b;display:grid;grid-template-rows:72px 1fr 92px}.head{display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid var(--l);background:#070a0c}.brand{display:flex;align-items:center;gap:14px}.brand img{width:68px;height:50px;object-fit:contain}.brand b{letter-spacing:.12em}.brand small{display:block;color:#738087;font-size:8px;letter-spacing:.17em;margin-top:4px}.livewrap{display:flex;gap:12px;align-items:center}.power{font-size:9px;color:#8d989e;border-right:1px solid #303a40;padding-right:14px;text-transform:uppercase}.power b{color:var(--c);margin-left:6px}.live{font-size:10px;border:1px solid #7a2c31;color:#ff7479;padding:7px 10px}.stage{position:relative;overflow:hidden}.cameraFull{position:absolute;inset:0}.cameraFull:after{content:'FULL CAMERA';position:absolute;inset:22px;border:1px dashed rgba(34,211,229,.12);display:grid;place-items:center;color:rgba(34,211,229,.12);font-size:22px;font-weight:900;letter-spacing:.18em}.lower{position:absolute;left:30px;bottom:22px;min-width:330px;border-left:4px solid var(--c);background:linear-gradient(90deg,rgba(5,9,11,.96),rgba(5,9,11,.76));padding:11px 16px;z-index:4}.lower b{font-size:20px}.lower span{display:block;color:var(--c);font-size:9px;margin-top:4px}
.split,.desk,.chart,.trenches{height:100%;display:grid;grid-template-columns:1fr 310px}.content,.deskMain{padding:4.5vh 4vw;background:radial-gradient(circle at 70% 40%,rgba(34,211,229,.10),transparent 38%);display:flex;flex-direction:column;justify-content:center}.ey{color:var(--c);font-size:10px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}.content h1,.deskMain h1{font-size:clamp(48px,5vw,78px);line-height:.94;letter-spacing:-.05em;margin:14px 0;max-width:900px}.content p,.deskMain p{font-size:17px;line-height:1.5;color:#aeb8bd;max-width:780px}
.rail{border-left:1px solid var(--l);background:#080c0e;position:relative;height:100%;overflow:hidden;padding-bottom:205px}.rundownArea{height:100%;overflow:hidden}.rhead{height:48px;padding:0 13px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--l);color:var(--c);font-size:11px;font-weight:900;letter-spacing:.1em}.rrow{padding:10px 12px;border-bottom:1px solid #242d32;font-size:11px;line-height:1.15}.rrow.complete{color:#5d686f;background:#070a0c}.rrow.active{background:linear-gradient(90deg,var(--c),#25b7c6);color:#041013;font-weight:900}.rrow.upnext{color:#d7dde0}.rrow small{display:block;margin-top:3px;opacity:.72;font-size:8px;letter-spacing:.06em}.newsProgress{border-bottom:1px solid #263139;background:#0a1013;padding:6px 8px}.newsProgressHead{display:flex;justify-content:space-between;color:#7f8b92;font-size:8px;font-weight:900;letter-spacing:.1em;margin-bottom:4px}.newsKeywords{display:grid;gap:2px}.newsKey{display:grid;grid-template-columns:20px 1fr;gap:6px;padding:4px 5px;border-left:2px solid #263139;color:#59656c;font-size:9px;font-weight:800}.newsKey.current{color:#fff;border-left-color:var(--c);background:rgba(34,211,229,.08)}.newsKey.current b{color:var(--c)}.newsKey.next{color:#9ca7ad}.cam{position:absolute;left:0;right:0;bottom:0;height:205px;border-top:1px solid var(--l);background:#080c0e}.cam:before{content:'CAMERA';position:absolute;inset:8px;border:1px solid var(--c);display:grid;place-items:center;color:rgba(34,211,229,.22);font-weight:900;letter-spacing:.15em}
.storySummary{max-width:790px;font-size:18px!important;color:#c2c9cd!important;line-height:1.52!important;margin:3px 0 20px!important}.takeaways{display:flex;gap:10px;flex-wrap:wrap}.takeaway{min-width:145px;border:1px solid #2a363d;background:#091013;padding:13px 15px}.takeaway label{display:block;color:#77858c;font-size:8px}.takeaway strong{display:block;color:var(--c);font-size:25px;margin-top:6px}.quote{margin-top:14px;max-width:790px;border-left:3px solid var(--c);padding:10px 15px;background:linear-gradient(90deg,rgba(34,211,229,.07),transparent);font-size:15px;color:#d8dde0}.quote span{display:block;color:#748188;font-size:8px;margin-bottom:5px}
.chartarea{position:relative;overflow:hidden;background:#070b0d}.marketTop{height:60px;border-bottom:1px solid #243037;display:flex;align-items:center;gap:18px;padding:0 22px}.marketSymbol{font-size:22px;font-weight:950}.marketPrice{font-size:20px;font-weight:900}.marketChange{font-size:11px;font-weight:900}.marketChange.up{color:var(--green)}.marketChange.down{color:var(--red)}.marketMeta{font-size:9px;color:#77858c;margin-left:auto;text-align:right}.chartStatus{position:absolute;top:76px;left:20px;font-size:9px;color:#718087;z-index:5}.drawStatus{position:absolute;top:76px;right:20px;z-index:6;background:#0b1114;border:1px solid #334047;color:var(--c);font-size:9px;font-weight:900;padding:7px 9px;display:none}.drawStatus.on{display:block}.chartCanvas{position:absolute;left:0;right:0;top:60px;bottom:0;background:#06090b;cursor:crosshair}.chartCanvas canvas{width:100%;height:100%;display:block}.chartTooltip{position:absolute;z-index:9;pointer-events:none;display:none;background:rgba(7,11,13,.96);border:1px solid #334049;padding:7px 9px;font-size:9px;line-height:1.5;color:#dce3e6;box-shadow:0 8px 25px rgba(0,0,0,.35)}
.scorecard{border:1px solid #2a353c;margin-top:20px;max-width:720px;display:grid;grid-template-columns:1fr 160px}.scorecard div{padding:16px}.scorecard .big{border-left:1px solid #2a353c;text-align:center}.scorecard .big strong{font-size:30px;color:var(--c)}.odds{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px;max-width:700px}.odd{border:1px solid #2b373e;padding:15px;background:#0a0f12}.odd label{font-size:8px;color:#75838a}.odd strong{display:block;font-size:22px;margin-top:5px}
.trenchesMain{padding:28px 32px;background:radial-gradient(circle at 60% 45%,rgba(139,92,246,.12),transparent 42%),#06090b;display:grid;grid-template-rows:auto 1fr;gap:18px}.trenchHead{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid #263139;padding-bottom:14px}.trenchHead h1{font-size:44px;margin:5px 0 0;letter-spacing:-.04em}.trenchTag{color:#a98cff;font-size:10px;font-weight:900;letter-spacing:.12em}.tokenGrid{display:grid;grid-template-columns:1.25fr .75fr;gap:14px;min-height:0}.tokenHero,.tokenStats{border:1px solid #28343b;background:rgba(8,13,16,.84)}.tokenHero{padding:24px;display:flex;flex-direction:column;justify-content:center}.tokenTicker{font-size:60px;font-weight:950;letter-spacing:-.05em}.tokenName{color:#9ba6ac;font-size:14px;margin-top:3px}.contract{margin-top:18px;color:#6f7d84;font-family:monospace;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.trenchSignal{margin-top:22px;border-left:3px solid #9b75ff;padding:12px 14px;background:linear-gradient(90deg,rgba(139,92,246,.11),transparent)}.trenchSignal b{display:block;color:#b9a2ff;font-size:9px;letter-spacing:.12em}.trenchSignal span{display:block;font-size:16px;margin-top:6px}.tokenStats{display:grid;grid-template-rows:repeat(4,1fr)}.tstat{padding:15px;border-bottom:1px solid #253037}.tstat:last-child{border:0}.tstat label{display:block;color:#75828a;font-size:8px;letter-spacing:.1em}.tstat strong{display:block;font-size:23px;margin-top:5px;color:#fff}.loading{color:#77858c}.guestgrid{height:100%;display:grid;grid-template-columns:1fr 1fr;gap:2px;background:#1c252b}.guest{position:relative}.guest:after{content:'CAMERA';position:absolute;inset:20px;border:1px solid rgba(34,211,229,.3);display:grid;place-items:center;color:rgba(34,211,229,.22);font-weight:900}.panelgrid{height:100%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px;background:#1c252b}
.footer{border-top:1px solid var(--l);display:grid;grid-template-rows:42px 48px;background:#080b0d}.crawl{display:grid;grid-template-columns:155px 1fr;border-bottom:1px solid #222c31;overflow:hidden}.crawlLabel{background:var(--c);color:#041013;display:flex;align-items:center;padding:0 18px;font-size:10px;font-weight:950}.crawlWindow{overflow:hidden;display:flex;align-items:center;white-space:nowrap}.crawlTrack{display:inline-block;padding-left:100%;animation:crawl 42s linear infinite;color:#d4dade;font-size:11px}.crawlTrack span{margin-right:55px}.crawlTrack i{color:var(--c);font-style:normal;margin-right:10px}@keyframes crawl{from{transform:translateX(0)}to{transform:translateX(-100%)}}.bottom{display:grid;grid-template-columns:220px 1fr 290px}.sig{padding:0 20px;display:flex;align-items:center;color:var(--c);font-weight:900;font-size:11px;border-right:1px solid var(--l)}.sponsor{display:flex;align-items:center;padding:0 20px;font-size:10px;color:#9ba6ab}.sponsor strong{color:#fff;margin:0 7px}.seg{display:flex;align-items:center;justify-content:center;border-left:1px solid var(--l);font-size:9px}.seg b{color:var(--c);margin-left:7px}
</style>

<body>
<div class="frame"><header class="head"><div class="brand"><img src="assets/w3bc-logo-white.png"><div><b>W3BC LIVE</b><small>MEDIA · MARKETS · CULTURE</small></div></div><div class="livewrap"><div class="power" id="power"></div><div class="live">● LIVE</div></div></header><main class="stage" id="stage"></main><footer class="footer"><div class="crawl"><div class="crawlLabel">W3BC UPDATE</div><div class="crawlWindow"><div class="crawlTrack" id="crawl"></div></div></div><div class="bottom"><div class="sig">W3BC SIGNAL · LIVE</div><div class="sponsor">W3BC PARTNER <strong id="spName">W3BC MEDIA</strong><span id="spMsg">Turn Your Moment Into Momentum</span></div><div class="seg">ON AIR <b id="seg"></b></div></div></footer></div>
<script>
const KEY='w3bcShowStateV1',ch=new BroadcastChannel('w3bc-show');
let s=JSON.parse(localStorage.getItem(KEY)||'null'),spTimer,spI=0,marketReq=0,marketPoints=[],chartModel=null,pendingTrend=null;
const newsKeywords=['ONCHAIN','JAPAN BONDS','RWA DEFI','COMPOUND','TOKENIZED STOCKS','BTC ETF','STABLECOINS'];
function active(){return(s?.segments||[]).filter(x=>x.enabled!==false)}
function rotateSponsor(){let a=s?.sponsors||[];if(!a.length)return;let x=a[spI++%a.length];spName.textContent=x.name;spMsg.textContent=x.msg}
function setupSponsor(){clearInterval(spTimer);rotateSponsor();spTimer=setInterval(rotateSponsor,180000)}
function newsProgress(){let keys=(s.segments?.[s.current]?.children||[]).map((_,i)=>newsKeywords[i]||`STORY ${i+1}`);let start=Math.max(0,Math.min(s.child-1,keys.length-3));return `<div class="newsProgress"><div class="newsProgressHead"><span>NEWS DESK STORIES</span><span>${s.child+1}/${keys.length}</span></div><div class="newsKeywords">${keys.slice(start,start+3).map((k,j)=>{let i=start+j;return `<div class="newsKey ${i<s.child?'done':i===s.child?'current':'next'}"><b>${String(i+1).padStart(2,'0')}</b><span>${k}</span></div>`}).join('')}</div></div>`}
function rail(x,a,pos){return `<aside class="rail"><div class="rundownArea"><div class="rhead"><span>SHOW RUNDOWN</span><span>${pos+1}/${a.length}</span></div>${a.map((z,i)=>`<div class="rrow ${z===x?'active':i<pos?'complete':'upnext'}">${String(i+1).padStart(2,'0')} · ${z.name}<small>${z===x?'NOW':i>pos?'UP NEXT':'COMPLETE'}</small></div>${z===x&&x.kind==='news'?newsProgress():''}`).join('')}</div><div class="cam"></div></aside>`}
function story(x){let d=s.newsStories?.[s.child]||{headline:x.children?.[s.child]||'News Desk',summary:'Story summary will populate from the daily W3BC news package.',stats:[],quote:''};return `<div class="split"><div class="content"><div class="ey">NEWS DESK · STORY ${String(s.child+1).padStart(2,'0')}</div><h1>${d.headline}</h1><p class="storySummary">${d.summary}</p>${d.stats?.length?`<div class="takeaways">${d.stats.filter(v=>v?.[0]&&v?.[1]).map(v=>`<div class="takeaway"><label>${v[0]}</label><strong>${v[1]}</strong></div>`).join('')}</div>`:''}${d.quote?`<div class="quote"><span>KEY TAKEAWAY / QUOTE</span>${d.quote}</div>`:''}</div>${rail(x,active(),active().indexOf(x))}</div>`}
function marketScene(x,a,pos){let m=s.market||{};return `<div class="chart"><div class="chartarea"><div class="marketTop"><div class="marketSymbol">${m.display||'BTC'}/USDT</div><div class="marketPrice" id="marketPrice">—</div><div class="marketChange" id="marketChange">LIVE</div><div class="marketMeta">${m.timeframe||'15m'} · NATIVE W3BC TA CHART<br>POWERED BY BITUNIX</div></div><div class="chartStatus" id="chartStatus">Loading market data…</div><div class="drawStatus" id="drawStatus"></div><div class="chartCanvas" id="chartCanvas"><canvas id="marketCanvas"></canvas><div class="chartTooltip" id="chartTooltip"></div></div><div class="lower"><b>${m.display||'BTC'} · ${m.timeframe||'15m'}</b><span>MARKETS NOW · W3BC LIVE</span></div></div>${rail(x,a,pos)}</div>`}
function fmtPrice(v){v=+v;if(!isFinite(v))return'—';let d=v<.01?7:v<1?5:v<100?3:2;return v.toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:d})}
function fmtTime(ts,tf){let d=new Date(ts);if(tf==='1d')return d.toLocaleDateString(undefined,{month:'short',day:'numeric'});return d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}
function normalizePoints(raw){return raw.map(k=>({time:+k[0],open:+k[1],high:+k[2],low:+k[3],close:+k[4],volume:+k[5]}))}
function calcModel(points,W,H){let m=s.market||{},levels=m.levels||[],trend=m.trendlines||[];let lows=points.map(p=>p.low),highs=points.map(p=>p.high);levels.forEach(l=>{if(isFinite(+l.price)){lows.push(+l.price);highs.push(+l.price)}});trend.forEach(t=>{if(t.a&&t.b){lows.push(+t.a.price,+t.b.price);highs.push(+t.a.price,+t.b.price)}});let lo=Math.min(...lows),hi=Math.max(...highs),pad=(hi-lo||Math.abs(hi)||1)*.08;lo-=pad;hi+=pad;let left=12,right=82,top=18,bottom=38,plotW=W-left-right,plotH=H-top-bottom;return{W,H,left,right,top,bottom,plotW,plotH,lo,hi,range:hi-lo||1,x:i=>left+(i+.5)*plotW/points.length,y:p=>top+(hi-p)/(hi-lo||1)*plotH,price:y=>hi-(y-top)/plotH*(hi-lo||1),index:x=>Math.max(0,Math.min(points.length-1,Math.floor((x-left)/plotW*points.length))),timeX:ts=>{let a=points[0].time,b=points.at(-1).time;return left+(ts-a)/(b-a||1)*plotW}}}
function drawGrid(g,M,points){g.save();g.strokeStyle='rgba(90,110,120,.16)';g.lineWidth=1;g.fillStyle='#758188';g.font='10px sans-serif';g.textBaseline='middle';for(let i=0;i<=5;i++){let y=M.top+i*M.plotH/5;g.beginPath();g.moveTo(M.left,y);g.lineTo(M.left+M.plotW,y);g.stroke();let p=M.hi-i*M.range/5;g.fillText(fmtPrice(p),M.left+M.plotW+9,y)}g.textAlign='center';g.textBaseline='top';for(let i=0;i<=6;i++){let idx=Math.min(points.length-1,Math.round(i*(points.length-1)/6)),x=M.x(idx);g.beginPath();g.moveTo(x,M.top);g.lineTo(x,M.top+M.plotH);g.stroke();g.fillText(fmtTime(points[idx].time,s.market?.timeframe),x,M.top+M.plotH+8)}g.restore()}
function levelColor(type){return type==='support'?'#42d9a0':type==='resistance'?'#ff6c76':'#ffd166'}
function drawLevels(g,M){(s.market?.levels||[]).forEach(l=>{let p=+l.price;if(!isFinite(p))return;let y=M.y(p),col=levelColor(l.type);g.save();g.strokeStyle=col;g.setLineDash([7,5]);g.lineWidth=1.5;g.beginPath();g.moveTo(M.left,y);g.lineTo(M.left+M.plotW,y);g.stroke();g.setLineDash([]);g.fillStyle=col;g.font='bold 10px sans-serif';g.fillText(`${(l.label||l.type||'LEVEL').toUpperCase()}  ${fmtPrice(p)}`,M.left+7,y-7);g.restore()})}
function drawTrendlines(g,M){(s.market?.trendlines||[]).forEach(t=>{if(!t.a||!t.b)return;let x1=M.timeX(+t.a.time),y1=M.y(+t.a.price),x2=M.timeX(+t.b.time),y2=M.y(+t.b.price);g.save();g.strokeStyle='#ffd166';g.lineWidth=2;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();g.fillStyle='#ffd166';g.beginPath();g.arc(x1,y1,3,0,Math.PI*2);g.arc(x2,y2,3,0,Math.PI*2);g.fill();g.restore()});if(pendingTrend){let x=M.timeX(pendingTrend.time),y=M.y(pendingTrend.price);g.save();g.fillStyle='#ffd166';g.beginPath();g.arc(x,y,5,0,Math.PI*2);g.fill();g.restore()}}
function drawCandles(g,M,points){let bw=Math.max(2,Math.min(9,M.plotW/points.length*.62));points.forEach((p,i)=>{let x=M.x(i),yo=M.y(p.open),yc=M.y(p.close),yh=M.y(p.high),yl=M.y(p.low),up=p.close>=p.open,col=up?'#42d9a0':'#ff6c76';g.strokeStyle=col;g.fillStyle=col;g.lineWidth=1.2;g.beginPath();g.moveTo(x,yh);g.lineTo(x,yl);g.stroke();let y=Math.min(yo,yc),h=Math.max(1,Math.abs(yc-yo));g.fillRect(x-bw/2,y,bw,h)})}
function renderChart(cross){let c=document.getElementById('marketCanvas');if(!c||!marketPoints.length)return;let box=c.getBoundingClientRect(),d=window.devicePixelRatio||1;c.width=Math.round(box.width*d);c.height=Math.round(box.height*d);let g=c.getContext('2d');g.setTransform(d,0,0,d,0,0);let W=box.width,H=box.height;g.clearRect(0,0,W,H);let M=calcModel(marketPoints,W,H);chartModel=M;drawGrid(g,M,marketPoints);drawCandles(g,M,marketPoints);drawLevels(g,M);drawTrendlines(g,M);if(cross&&cross.x>=M.left&&cross.x<=M.left+M.plotW&&cross.y>=M.top&&cross.y<=M.top+M.plotH){g.save();g.strokeStyle='rgba(220,232,237,.38)';g.setLineDash([4,4]);g.beginPath();g.moveTo(cross.x,M.top);g.lineTo(cross.x,M.top+M.plotH);g.moveTo(M.left,cross.y);g.lineTo(M.left+M.plotW,cross.y);g.stroke();g.setLineDash([]);let idx=M.index(cross.x),p=marketPoints[idx],price=M.price(cross.y);g.fillStyle='#dce3e6';g.font='10px sans-serif';g.fillText(fmtPrice(price),M.left+M.plotW+9,cross.y-6);g.restore();let tt=document.getElementById('chartTooltip');if(tt){tt.style.display='block';tt.style.left=Math.min(cross.x+12,W-170)+'px';tt.style.top=Math.max(8,cross.y-42)+'px';tt.innerHTML=`${fmtTime(p.time,s.market?.timeframe)}<br>O ${fmtPrice(p.open)} · H ${fmtPrice(p.high)}<br>L ${fmtPrice(p.low)} · C ${fmtPrice(p.close)}`}}else{let tt=document.getElementById('chartTooltip');if(tt)tt.style.display='none'}}
function updateMarketHeader(){let last=marketPoints.at(-1),first=marketPoints[0];if(!last)return;let chg=(last.close-first.open)/first.open*100,pe=document.getElementById('marketPrice'),ce=document.getElementById('marketChange'),st=document.getElementById('chartStatus');if(pe)pe.textContent='$'+fmtPrice(last.close);if(ce){ce.textContent=(chg>=0?'+':'')+chg.toFixed(2)+'%';ce.className='marketChange '+(chg>=0?'up':'down')}if(st)st.textContent=`Live candles · ${marketPoints.length} bars · O ${fmtPrice(last.open)} H ${fmtPrice(last.high)} L ${fmtPrice(last.low)} C ${fmtPrice(last.close)}`}
function updateDrawStatus(){let el=document.getElementById('drawStatus'),m=s.market?.drawMode||'none';if(!el)return;if(m==='none'){el.className='drawStatus';el.textContent='';return}el.className='drawStatus on';el.textContent=m==='trend'?(pendingTrend?'TRENDLINE: CLICK END POINT':'TRENDLINE: CLICK START POINT'):`${m.toUpperCase()}: CLICK CHART`}
function persistProgramState(){localStorage.setItem(KEY,JSON.stringify(s));ch.postMessage({type:'program-state',state:s})}
function chartPointFromEvent(e){let c=document.getElementById('marketCanvas'),r=c.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,M=chartModel;if(!M||x<M.left||x>M.left+M.plotW||y<M.top||y>M.top+M.plotH)return null;let idx=M.index(x),p=marketPoints[idx];return{x,y,time:p.time,price:M.price(y)}}
function bindChart(){let c=document.getElementById('marketCanvas');if(!c)return;c.onmousemove=e=>{let r=c.getBoundingClientRect();renderChart({x:e.clientX-r.left,y:e.clientY-r.top})};c.onmouseleave=()=>renderChart();c.onclick=e=>{let pt=chartPointFromEvent(e),mode=s.market?.drawMode||'none';if(!pt||mode==='none')return;if(mode==='trend'){if(!pendingTrend){pendingTrend={time:pt.time,price:pt.price};updateDrawStatus();renderChart()}else{s.market.trendlines=s.market.trendlines||[];s.market.trendlines.push({id:Date.now(),type:'trend',a:pendingTrend,b:{time:pt.time,price:pt.price}});pendingTrend=null;s.market.drawMode='none';persistProgramState();updateDrawStatus();renderChart()}}else{let type=mode;s.market.levels=s.market.levels||[];s.market.levels.push({id:Date.now(),type,price:+pt.price.toFixed(8),label:type.toUpperCase()});s.market.drawMode='none';persistProgramState();updateDrawStatus();renderChart()}}}
async function loadMarket(){let id=++marketReq,m=s.market||{},tf=m.timeframe||'15m',symbol=(m.symbol||'BTCUSDT').replace(/[-/]/g,'').toUpperCase();try{let url=`https://api.binance.com/api/v3/klines?symbol=${encodeURIComponent(symbol)}&interval=${encodeURIComponent(tf)}&limit=120`;let r=await fetch(url);if(!r.ok)throw Error('feed unavailable');let data=await r.json();if(id!==marketReq)return;marketPoints=normalizePoints(data);updateMarketHeader();renderChart();bindChart();updateDrawStatus()}catch(e){let st=document.getElementById('chartStatus');if(st)st.textContent='Live feed unavailable for this symbol. Try another market.'}}
function trenchesScene(x,a,pos){let t=s.trenches||{};return `<div class="trenches"><div class="trenchesMain"><div class="trenchHead"><div><div class="trenchTag">THE TRENCHES · SILVER BULL DESK</div><h1>${t.focus||'Meme Market Focus'}</h1></div><div class="ey">SOLANA · MEMES · COMMUNITY</div></div><div class="tokenGrid"><div class="tokenHero"><div class="tokenTicker">${t.symbol||'$JCHAINS'}</div><div class="tokenName" id="trenchName">${t.name||'JCHAINS'}</div><div class="contract">${t.address||t.query||''}</div><div class="trenchSignal"><b>W3BC TRENCH SIGNAL</b><span id="trenchSignal">Loading liquidity, volume and market activity…</span></div></div><div class="tokenStats"><div class="tstat"><label>PRICE</label><strong id="trenchPrice" class="loading">—</strong></div><div class="tstat"><label>24H CHANGE</label><strong id="trenchChange" class="loading">—</strong></div><div class="tstat"><label>24H VOLUME</label><strong id="trenchVolume" class="loading">—</strong></div><div class="tstat"><label>LIQUIDITY</label><strong id="trenchLiquidity" class="loading">—</strong></div></div></div></div>${rail(x,a,pos)}</div>`}
function money(n){n=+n||0;if(n>=1e9)return'$'+(n/1e9).toFixed(2)+'B';if(n>=1e6)return'$'+(n/1e6).toFixed(2)+'M';if(n>=1e3)return'$'+(n/1e3).toFixed(1)+'K';return'$'+n.toLocaleString(undefined,{maximumFractionDigits:6})}
async function loadTrenches(){let q=s.trenches?.query||s.trenches?.address;if(!q)return;try{let r=await fetch('https://api.dexscreener.com/latest/dex/search?q='+encodeURIComponent(q));if(!r.ok)throw Error();let pairs=(await r.json()).pairs||[],p=pairs.find(x=>x.chainId==='solana')||pairs[0];if(!p)throw Error();trenchName.textContent=(p.baseToken?.name||'TOKEN')+' · '+(p.dexId||'DEX').toUpperCase();trenchPrice.textContent='$'+Number(p.priceUsd||0).toLocaleString(undefined,{maximumFractionDigits:8});let ch=+(p.priceChange?.h24||0);trenchChange.textContent=(ch>=0?'+':'')+ch.toFixed(2)+'%';trenchChange.style.color=ch>=0?'var(--green)':'var(--red)';trenchVolume.textContent=money(p.volume?.h24);trenchLiquidity.textContent=money(p.liquidity?.usd);trenchSignal.textContent=`${money(p.volume?.h24)} volume / ${money(p.liquidity?.usd)} liquidity · ${ch>=0?'positive':'negative'} 24H momentum.`}catch(e){trenchSignal.textContent='No matching live Solana market found. Try the contract or pair address.'}}
function paint(){if(!s||!s.segments?.length)return;pendingTrend=null;marketPoints=[];chartModel=null;let x=s.segments[s.current],a=active(),pos=a.indexOf(x);seg.textContent=x.name.toUpperCase();power.innerHTML=x.sponsor?`POWERED BY <b>${x.sponsor}</b>`:'';crawl.innerHTML=(s.ticker||[]).map((t,i)=>`<span><i>${i%2?'●':'◆'}</i>${t}</span>`).join('');if(x.kind==='camera'){stage.innerHTML=`<div class="cameraFull"><div class="lower"><b>J CHAINS</b><span>@JCHAINS · W3BC MEDIA</span></div></div>`;return}if(x.kind==='markets'){stage.innerHTML=marketScene(x,a,pos);setTimeout(loadMarket,0);return}if(x.kind==='news'){stage.innerHTML=story(x);return}if(x.kind==='trenches'){stage.innerHTML=trenchesScene(x,a,pos);setTimeout(loadTrenches,0);return}if(x.kind==='interview'){stage.innerHTML=`<div class="guestgrid"><div class="guest"></div><div class="guest"></div></div>`;return}if(x.kind==='panel'){stage.innerHTML=`<div class="panelgrid">${'<div class="guest"></div>'.repeat(4)}</div>`;return}if(x.kind==='ai'){stage.innerHTML=`<div class="desk"><div class="deskMain"><div class="ey">AI + TECHNOLOGY</div><h1>${s.ai?.headline||x.name}</h1><p>${s.ai?.detail||x.desc}</p><div class="scorecard"><div><div class="ey">W3BC SIGNAL</div><p>What matters, what is noise, and what changes next.</p></div><div class="big"><strong>AI</strong></div></div></div>${rail(x,a,pos)}</div>`;return}if(x.kind==='sports'){stage.innerHTML=`<div class="desk"><div class="deskMain"><div class="ey">SPORTS DESK</div><h1>${s.sports?.headline||x.name}</h1><p>${s.sports?.detail||x.desc}</p></div>${rail(x,a,pos)}</div>`;return}if(x.kind==='betting'){let b=s.betting||{};stage.innerHTML=`<div class="desk"><div class="deskMain"><div class="ey">BETTING DESK · POWERED BY BC.GAME</div><h1>${b.event||'Featured Betting Market'}</h1><div class="odds"><div class="odd"><label>CURRENT LINE</label><strong>${b.line||'-110'}</strong></div><div class="odd"><label>LINE MOVEMENT</label><strong>${b.movement||'Pending'}</strong></div></div><p>${b.note||x.desc}</p></div>${rail(x,a,pos)}</div>`;return}stage.innerHTML=`<div class="split"><div class="content"><div class="ey">${x.name}</div><h1>${x.name}</h1><p>${x.desc}</p></div>${rail(x,a,pos)}</div>`}
ch.onmessage=e=>{if(e.data?.type==='state'){s=e.data.state;paint();setupSponsor()}};
addEventListener('storage',e=>{if(e.key===KEY){let incoming=JSON.parse(e.newValue);if(incoming){s=incoming;paint();setupSponsor()}}});
addEventListener('resize',()=>{if(s?.segments?.[s.current]?.kind==='markets'&&marketPoints.length)renderChart()});
ch.postMessage({type:'hello'});paint();setupSponsor();
</script>
</body>
</html>
