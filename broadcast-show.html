;padding:0 18px;font-size:9px;color:#9ba6ab}.sponsor strong{color:#fff;margin:0 6px}.seg{display:flex;align-items:center;justify-content:center;border-left:1px solid var(--l);font-size:8px}.seg b{color:var(--c);margin-left:6px}</style></head><body><div class="frame" id="frame"><header class="head"><div class="brand"><img src="assets/w3bc-logo-white.png"><div><b>W3BC LIVE</b><small>MEDIA · MARKETS · CULTURE</small></div></div><div class="livewrap"><div class="power" id="power"></div><div class="live">● LIVE</div></div></header><main class="stage" id="stage"></main><footer class="footer"><div class="crawl"><div class="crawlLabel">W3BC UPDATE</div><div class="crawlWindow"><div class="crawlTrack" id="crawl"></div></div></div><div class="prices"><div class="priceLabel">MARKETS</div><div class="priceWindow"><div class="priceTrack" id="priceTrack"><span>Loading live prices…</span></div></div></div><div class="bottom"><div class="sig">W3BC SIGNAL · LIVE</div><div class="sponsor">W3BC PARTNER <strong id="spName">W3BC MEDIA</strong><span id="spMsg">Turn Your Moment Into Momentum</span></div><div class="seg">ON AIR <b id="seg"></b></div></div></footer></div><script>const KEY='w3bcShowStateV1',ch=new BroadcastChannel('w3bc-show');let s=JSON.parse(localStorage.getItem(KEY)||'null')||{},spI=0,marketPoints=[],chartModel=null,pendingTrend=null,marketIndicators={smma21:null,ema200:null,smmaSeries:[],emaSeries:[]},autoTA={support:null,resistance:null,target:null};const newsKeys=['ONCHAIN','JAPAN BONDS','RWA DEFI','COMPOUND','TOKENIZED STOCKS','BTC ETF','STABLECOINS'];function active(){return(s.segments||[]).filter(x=>x.enabled!==false)}function esc(v=''){return String(v).replace(/</g,'&lt;').replace(/>/g,'&gt;')}function rotateSponsor(){let a=s.sponsors||[];if(!a.length)return;let x=a[spI++%a.length];spName.textContent=x.name||'W3BC MEDIA';spMsg.textContent=x.msg||''}setInterval(rotateSponsor,180000);function newsProgress(){let total=s.newsStories?.length||s.segments?.[s.current]?.children?.length||0,start=Math.max(0,Math.min((s.child||0)-1,total-3));return `<div class="newsProgress"><div class="newsProgressHead"><span>NEWS DESK</span><span>${(s.child||0)+1}/${total||1}</span></div><div class="newsKeywords">${Array.from({length:Math.min(3,total)},(_,j)=>{let i=start+j,d=s.newsStories?.[i],k=d?.headline?d.headline.split(' ').slice(0,3).join(' '):(newsKeys[i]||`STORY ${i+1}`);return `<div class="newsKey ${i===s.child?'current':'next'}"><b>${String(i+1).padStart(2,'0')}</b><span>${esc(k)}</span></div>`}).join('')}</div></div>`}function rail(x,a,pos,market=false){let rows=a.map((z,i)=>`<div class="rrow ${z===x?'active':i<pos?'complete':'upnext'}">${String(i+1).padStart(2,'0')} · ${esc(z.name)}<small>${z===x?'NOW':i>pos?'UP NEXT':'COMPLETE'}</small></div>${z===x&&x.kind==='news'?newsProgress():''}`).join('');return `<aside class="rail ${market?'marketRail':''}"><div class="rundownArea"><div class="rhead"><span>SHOW RUNDOWN</span><span>${pos+1}/${a.length}</span></div>${rows}</div>${market?strategyHTML():''}<div class="cam"></div></aside>`}function strategyHTML(){return `<div class="marketStrategy"><div class="strategyHead"><span>W3BC STRATEGY</span><span class="strategyBias mixed" id="strategyBias">LOADING</span></div><div class="strategyGrid"><div class="strategyCell"><label>21D SMMA</label><strong id="smmaValue">—</strong></div><div class="strategyCell"><label>200D EMA</label><strong id="emaValue">—</strong></div><div class="strategyCell"><label>AUTO SUPPORT</label><strong id="supportValue">—</strong></div><div class="strategyCell"><label>AUTO TARGET</label><strong id="targetValue">—</strong></div></div><div class="strategySetup" id="strategySetup"><b>SETUP</b> Calculating structure…</div></div>`}function overlayScene(x){let a=active(),pos=a.indexOf(x),next=a.slice(pos+1,pos+4);let type=x.name.toLowerCase().includes('close')?'FINAL WORD':x.kind==='interview'?'INTERVIEW':'WELCOME TO W3BC LIVE';if(x.kind==='interview')return `<div class="overlayStage"><div class="interviewFrames"><div class="guestFrame"><span>J CHAINS · @JCHAINS</span></div><div class="guestFrame"><span>GUEST</span></div></div></div>`;return `<div class="overlayStage"><div class="overlayLower"><div class="k">${type}</div><h1>${esc(x.name)}</h1><p>${x.name.toLowerCase().includes('close')?'Final takeaways · what matters next · see you tomorrow':'Markets · News · Technology · Sports · Betting · The Trenches'}</p></div><div class="coming"><div class="title">COMING UP</div>${next.map(z=>`<div class="comingRow">${esc(z.name)}</div>`).join('')}</div></div>`}function xspaceScene(x,a,pos){return `<div class="xspace"><div class="xspaceMain"><div class="xspaceFrame"></div></div>${rail(x,a,pos)}</div>`}function viewerFactText(p=''){let x=String(p).replace(/^Pre-show[^.]*\.\s*/i,'').replace(/^The supplied[^.]*\.\s*/i,'').trim();if(x.length>115)x=x.slice(0,112).replace(/\s+\S*$/,'')+'…';return x}function storyScene(x,a,pos){let d=s.newsStories?.[s.child]||{},points=(d.points||[]).filter(Boolean);if(!points.length&&d.summary)points=d.summary.split(/\.\s+/).filter(Boolean);let facts=points.filter(p=>!/pre-show|supplied by|use the live|on-air number|screenshot/i.test(p)).slice(0,3);if(facts.length<3)facts=points.slice(0,3);let labels=['KEY FACT','MARKET SIGNAL','WHY IT MATTERS'];let takeaway=d.takeaway||d.key||'';return `<div class="split"><div class="content"><div class="ey">NEWS DESK · STORY ${String((s.child||0)+1).padStart(2,'0')}</div><h1>${esc(d.headline||'W3BC News Desk')}</h1>${facts.length?`<div class="viewerFacts">${facts.map((p,i)=>`<div class="viewerFact"><b>${labels[i]||'KEY POINT'}</b><span>${esc(viewerFactText(p))}</span></div>`).join('')}</div>`:''}${takeaway?`<div class="takeaway"><span>W3BC TAKEAWAY</span>${esc(takeaway)}</div>`:''}</div>${rail(x,a,pos)}</div>`}function marketScene(x,a,pos){let m=s.market||{};return `<div class="chart"><div class="chartarea"><div class="marketTop"><div class="marketSymbol">${esc(m.display||'BTC')}/USDT</div><div class="marketPrice" id="marketPrice">—</div><div class="marketChange" id="marketChange">LIVE</div><div class="marketMeta">${esc(m.timeframe||'15m')} · W3BC TA CHART<br>POWERED BY BITUNIX</div></div><div class="chartStatus" id="chartStatus">Loading market data…</div><div class="drawStatus" id="drawStatus"></div><div class="chartCanvas"><canvas id="marketCanvas"></canvas><div class="chartTooltip" id="chartTooltip"></div><div class="indLegend"><span class="smma">21D SMMA</span><span class="ema">200D EMA</span></div></div></div>${rail(x,a,pos,true)}</div>`}function trenchesScene(x,a,pos){let t=s.trenches||{};return `<div class="trenches"><div class="trenchesMain"><div class="trenchHead"><div><div class="trenchTag">THE TRENCHES · SILVER BULL DESK</div><h1>Silver Bull Focus</h1></div><div class="ey">SOLANA · MEMES · COMMUNITY</div></div><div class="tokenGrid"><div class="tokenHero"><div class="tokenTicker">${esc(t.symbol||'$JCHAINS')}</div><div class="tokenName" id="trenchName">${esc(t.name||'JCHAINS')}</div><div class="contract">${esc(t.address||t.query||'')}</div><div class="trenchSignal"><b>W3BC TRENCH SIGNAL</b><span id="trenchSignal">Loading market activity…</span></div></div><div class="tokenStats"><div class="tstat"><label>PRICE</label><strong id="trenchPrice">—</strong></div><div class="tstat"><label>24H CHANGE</label><strong id="trenchChange">—</strong></div><div class="tstat"><label>24H VOLUME</label><strong id="trenchVolume">—</strong></div><div class="tstat"><label>LIQUIDITY</label><strong id="trenchLiquidity">—</strong></div></div></div></div>${rail(x,a,pos)}</div>`}function fmt(v){v=+v;if(!isFinite(v))return'—';return v.toLocaleString(undefined,{maximumFractionDigits:v<1?6:2})}function fmtTime(ts,tf){let d=new Date(ts);return tf==='1w'?d.toLocaleDateString(undefined,{month:'short',day:'numeric'}):d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}function calcSMMAseries(data,p){let out=[],cl=data.map(x=>+x[4]);if(cl.length<p)return out;let v=cl.slice(0,p).reduce((a,b)=>a+b,0)/p;out.push({time:+data[p-1][0],value:v});for(let i=p;i<cl.length;i++){v=(v*(p-1)+cl[i])/p;out.push({time:+data[i][0],value:v})}return out}function calcEMAseries(data,p){let out=[],cl=data.map(x=>+x[4]);if(cl.length<p)return out;let v=cl.slice(0,p).reduce((a,b)=>a+b,0)/p,k=2/(p+1);out.push({time:+data[p-1][0],value:v});for(let i=p;i<cl.length;i++){v=cl[i]*k+v*(1-k);out.push({time:+data[i][0],value:v})}return out}function calcModel(W,H){let lo=Math.min(...marketPoints.map(p=>p.low)),hi=Math.max(...marketPoints.map(p=>p.high)),pad=(hi-lo||1)*.1;lo-=pad;hi+=pad;let left=12,right=78,top=18,bottom=34,pw=W-left-right,ph=H-top-bottom;return{left,right,top,bottom,pw,ph,lo,hi,range:hi-lo,x:i=>left+(i+.5)*pw/marketPoints.length,y:p=>top+(hi-p)/(hi-lo)*ph,price:y=>hi-(y-top)/ph*(hi-lo),index:x=>Math.max(0,Math.min(marketPoints.length-1,Math.floor((x-left)/pw*marketPoints.length))),timeX:ts=>left+(ts-marketPoints[0].time)/(marketPoints.at(-1).time-marketPoints[0].time||1)*pw}}function indicatorAt(series,ts){if(!series.length)return null;if(ts<=series[0].time)return series[0].value;if(ts>=series.at(-1).time)return series.at(-1).value;for(let i=1;i<series.length;i++)if(series[i].time>=ts){let a=series[i-1],b=series[i],f=(ts-a.time)/(b.time-a.time||1);return a.value+(b.value-a.value)*f}return series.at(-1).value}function drawGrid(g,M,W,H){g.strokeStyle='rgba(90,110,120,.16)';g.fillStyle='#758188';g.font='9px sans-serif';for(let i=0;i<=5;i++){let y=M.top+i*M.ph/5;g.beginPath();g.moveTo(M.left,y);g.lineTo(M.left+M.pw,y);g.stroke();g.fillText(fmt(M.hi-i*M.range/5),M.left+M.pw+7,y+3)}g.textAlign='center';for(let i=0;i<=6;i++){let idx=Math.min(marketPoints.length-1,Math.round(i*(marketPoints.length-1)/6)),x=M.x(idx);g.beginPath();g.moveTo(x,M.top);g.lineTo(x,M.top+M.ph);g.stroke();g.fillText(fmtTime(marketPoints[idx].time,s.market?.timeframe),x,M.top+M.ph+15)}g.textAlign='left'}function drawCandles(g,M){let bw=Math.max(2,Math.min(8,M.pw/marketPoints.length*.62));marketPoints.forEach((p,i)=>{let x=M.x(i),yo=M.y(p.open),yc=M.y(p.close),yh=M.y(p.high),yl=M.y(p.low),col=p.close>=p.open?'#42d9a0':'#ff6c76';g.strokeStyle=g.fillStyle=col;g.beginPath();g.moveTo(x,yh);g.lineTo(x,yl);g.stroke();g.fillRect(x-bw/2,Math.min(yo,yc),bw,Math.max(1,Math.abs(yc-yo)))})}function drawCurve(g,M,series,color,label){let started=false;g.strokeStyle=color;g.lineWidth=2;g.beginPath();marketPoints.forEach((p,i)=>{let v=indicatorAt(series,p.time),y=M.y(v);if(!isFinite(v)||y<M.top||y>M.top+M.ph){started=false;return}let x=M.x(i);if(!started){g.moveTo(x,y);started=true}else g.lineTo(x,y)});g.stroke();let v=series.at(-1)?.value;if(isFinite(v)){g.fillStyle=color;g.font='bold 9px sans-serif';g.textAlign='right';let y=M.y(v);if(y<M.top)y=M.top+12;if(y>M.top+M.ph)y=M.top+M.ph-5;g.fillText(`${label} ${fmt(v)}`,M.left+M.pw-5,y);g.textAlign='left'}}function drawLevels(g,M){let arr=[...(s.market?.levels||[])];if(isFinite(autoTA.support))arr.push({type:'support',price:autoTA.support,label:'AUTO SUPPORT'});if(isFinite(autoTA.resistance))arr.push({type:'resistance',price:autoTA.resistance,label:'AUTO RESIST'});arr.forEach(l=>{let y=M.y(+l.price);if(y<M.top||y>M.top+M.ph)return;let col=l.type==='support'?'#42d9a0':l.type==='resistance'?'#ff6c76':'#ffd166';g.strokeStyle=col;g.setLineDash([6,5]);g.beginPath();g.moveTo(M.left,y);g.lineTo(M.left+M.pw,y);g.stroke();g.setLineDash([]);g.fillStyle=col;g.font='bold 8px sans-serif';g.fillText(`${l.label||l.type} ${fmt(l.price)}`,M.left+6,y-5)})}function drawTrend(g,M){(s.market?.trendlines||[]).forEach(t=>{if(!t.a||!t.b)return;g.strokeStyle='#ffd166';g.lineWidth=2;g.beginPath();g.moveTo(M.timeX(+t.a.time),M.y(+t.a.price));g.lineTo(M.timeX(+t.b.time),M.y(+t.b.price));g.stroke()});if(pendingTrend){g.fillStyle='#ffd166';g.beginPath();g.arc(M.timeX(pendingTrend.time),M.y(pendingTrend.price),5,0,Math.PI*2);g.fill()}}function renderChart(cross){let c=document.getElementById('marketCanvas');if(!c||!marketPoints.length)return;let r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;let g=c.getContext('2d');g.setTransform(d,0,0,d,0,0);chartModel=calcModel(r.width,r.height);g.clearRect(0,0,r.width,r.height);drawGrid(g,chartModel,r.width,r.height);drawCandles(g,chartModel);drawCurve(g,chartModel,marketIndicators.smmaSeries,'#22d3e5','21D SMMA');drawCurve(g,chartModel,marketIndicators.emaSeries,'#a98cff','200D EMA');drawLevels(g,chartModel);drawTrend(g,chartModel);if(cross){g.strokeStyle='rgba(220,232,237,.35)';g.setLineDash([4,4]);g.beginPath();g.moveTo(cross.x,chartModel.top);g.lineTo(cross.x,chartModel.top+chartModel.ph);g.moveTo(chartModel.left,cross.y);g.lineTo(chartModel.left+chartModel.pw,cross.y);g.stroke();g.setLineDash([]);let p=marketPoints[chartModel.index(cross.x)],tt=chartTooltip;tt.style.display='block';tt.style.left=Math.min(cross.x+10,r.width-165)+'px';tt.style.top=Math.max(8,cross.y-42)+'px';tt.innerHTML=`${fmtTime(p.time,s.market?.timeframe)}<br>O ${fmt(p.open)} H ${fmt(p.high)}<br>L ${fmt(p.low)} C ${fmt(p.close)}`}else if(document.getElementById('chartTooltip'))chartTooltip.style.display='none'}function swings(){if(marketPoints.length<15)return;let lows=[],highs=[];for(let i=3;i<marketPoints.length-3;i++){let p=marketPoints[i],lo=true,hi=true;for(let j=i-3;j<=i+3;j++){if(j===i)continue;if(marketPoints[j].low<=p.low)lo=false;if(marketPoints[j].high>=p.high)hi=false}if(lo)lows.push(p.low);if(hi)highs.push(p.high)}let last=marketPoints.at(-1).close;autoTA.support=lows.filter(v=>v<last).sort((a,b)=>b-a)[0]??Math.min(...marketPoints.slice(-20).map(p=>p.low));autoTA.resistance=highs.filter(v=>v>last).sort((a,b)=>a-b)[0]??Math.max(...marketPoints.slice(-20).map(p=>p.high));autoTA.target=autoTA.resistance}function updateStrategy(){let last=marketPoints.at(-1)?.close,sm=marketIndicators.smma21,em=marketIndicators.ema200;if(!isFinite(last)||!isFinite(sm)||!isFinite(em))return;swings();let bias=last>sm&&last>em?'BULLISH':last<sm&&last<em?'BEARISH':'MIXED';strategyBias.textContent=bias;strategyBias.className='strategyBias '+(bias==='BULLISH'?'bull':bias==='BEARISH'?'bear':'mixed');smmaValue.textContent=fmt(sm);emaValue.textContent=fmt(em);supportValue.textContent=fmt(autoTA.support);targetValue.textContent=fmt(bias==='BEARISH'?autoTA.support:autoTA.resistance);let text=bias==='BULLISH'?`Above both daily averages. Hold ${fmt(autoTA.support)} · next structure ${fmt(autoTA.resistance)}.`:bias==='BEARISH'?`Below both daily averages. Reclaim ${fmt(autoTA.resistance)} to improve structure.`:`Mixed higher-timeframe structure. Support ${fmt(autoTA.support)} · resistance ${fmt(autoTA.resistance)}.`;strategySetup.innerHTML='<b>SETUP</b> '+text;renderChart()}function chartPoint(e){let c=marketCanvas,r=c.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,M=chartModel;if(!M||x<M.left||x>M.left+M.pw||y<M.top||y>M.top+M.ph)return null;let p=marketPoints[M.index(x)];return{time:p.time,price:M.price(y)}}function bindChart(){marketCanvas.onmousemove=e=>{let r=marketCanvas.getBoundingClientRect();renderChart({x:e.clientX-r.left,y:e.clientY-r.top})};marketCanvas.onmouseleave=()=>renderChart();marketCanvas.onclick=e=>{let p=chartPoint(e),mode=s.market?.drawMode||'none';if(!p||mode==='none')return;if(mode==='trend'){if(!pendingTrend){pendingTrend=p;renderChart()}else{s.market.trendlines=s.market.trendlines||[];s.market.trendlines.push({id:Date.now(),a:pendingTrend,b:p});pendingTrend=null;s.market.drawMode='none';persist()}}else{s.market.levels=s.market.levels||[];s.market.levels.push({id:Date.now(),type:mode,price:p.price,label:mode.toUpperCase()});s.market.drawMode='none';persist()}}}function persist(){localStorage.setItem(KEY,JSON.stringify(s));ch.postMessage({type:'program-state',state:s});paint()}async function loadMarket(){let m=s.market||{},symbol=(m.symbol||'BTCUSDT').replace(/[-/]/g,''),tf=m.timeframe||'15m';try{let [r,d]=await Promise.all([fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${tf}&limit=120`),fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=1d&limit=320`)]);let raw=await r.json(),daily=await d.json();marketPoints=raw.map(k=>({time:+k[0],open:+k[1],high:+k[2],low:+k[3],close:+k[4]}));marketIndicators.smmaSeries=calcSMMAseries(daily,21);marketIndicators.emaSeries=calcEMAseries(daily,200);marketIndicators.smma21=marketIndicators.smmaSeries.at(-1)?.value;marketIndicators.ema200=marketIndicators.emaSeries.at(-1)?.value;let last=marketPoints.at(-1),first=marketPoints[0],chg=(last.close-first.open)/first.open*100;marketPrice.textContent='$'+fmt(last.close);marketChange.textContent=(chg>=0?'+':'')+chg.toFixed(2)+'%';marketChange.className='marketChange '+(chg>=0?'up':'down');chartStatus.textContent=`Live candles · ${marketPoints.length} bars · O ${fmt(last.open)} H ${fmt(last.high)} L ${fmt(last.low)} C ${fmt(last.close)}`;renderChart();bindChart();updateStrategy()}catch(e){if(document.getElementById('chartStatus'))chartStatus.textContent='Market feed unavailable.'}}function money(n){n=+n||0;if(n>=1e9)return'$'+(n/1e9).toFixed(2)+'B';if(n>=1e6)return'$'+(n/1e6).toFixed(2)+'M';if(n>=1e3)return'$'+(n/1e3).toFixed(1)+'K';return'$'+fmt(n)}async function loadTrenches(){let q=s.trenches?.query||s.trenches?.address;if(!q)return;try{let r=await fetch('https://api.dexscreener.com/latest/dex/search?q='+encodeURIComponent(q)),pairs=(await r.json()).pairs||[],p=pairs.find(x=>x.chainId==='solana');if(!p)throw Error();trenchName.textContent=(p.baseToken?.name||'TOKEN')+' · '+(p.dexId||'DEX').toUpperCase();trenchPrice.textContent='$'+fmt(p.priceUsd);let c=+(p.priceChange?.h24||0);trenchChange.textContent=(c>=0?'+':'')+c.toFixed(2)+'%';trenchChange.style.color=c>=0?'var(--green)':'var(--red)';trenchVolume.textContent=money(p.volume?.h24);trenchLiquidity.textContent=money(p.liquidity?.usd);trenchSignal.textContent=`${money(p.volume?.h24)} volume · ${money(p.liquidity?.usd)} liquidity · ${c>=0?'positive':'negative'} 24H momentum.`}catch(e){trenchSignal.textContent='No matching live Solana market found.'}}async function loadPriceTicker(){let list=(s.marketTicker||['BTC','ETH','SOL','LINK','XRP']).slice(0,8);try{let data=await Promise.all(list.map(async t=>{let r=await fetch(`https://api.binance.com/api/v3/ticker/24hr?symbol=${t}USDT`);let d=await r.json();return{t,p:+d.lastPrice,c:+d.priceChangePercent}}));priceTrack.innerHTML=data.map(x=>`<span class="priceItem"><b>${x.t}</b> $${fmt(x.p)} <span class="${x.c>=0?'up':'down'}">${x.c>=0?'▲':'▼'} ${Math.abs(x.c).toFixed(2)}%</span></span>`).join('')}catch(e){priceTrack.textContent='Live market ticker unavailable.'}}function paint(){if(!s.segments?.length)return;let x=s.segments[s.current]||s.segments[0],a=active(),pos=a.indexOf(x);frame.classList.toggle('overlayMode',['camera','interview'].includes(x.kind));seg.textContent=(x.name||'').toUpperCase();power.innerHTML=x.sponsor?`POWERED BY <b>${esc(x.sponsor)}</b>`:'';crawl.innerHTML=(s.ticker||[]).filter(Boolean).map((t,i)=>`<span><i>${i%2?'●':'◆'}</i>${esc(t)}</span>`).join('')||'<span>W3BC LIVE · Independent intelligence for what matters.</span>';if(['camera','interview'].includes(x.kind)){stage.innerHTML=overlayScene(x);return}if(x.kind==='xspace'){stage.innerHTML=xspaceScene(x,a,pos);return}if(x.kind==='markets'){stage.innerHTML=marketScene(x,a,pos);setTimeout(loadMarket,0);return}if(x.kind==='news'){stage.innerHTML=storyScene(x,a,pos);return}if(x.kind==='trenches'){stage.innerHTML=trenchesScene(x,a,pos);setTimeout(loadTrenches,0);return}if(x.kind==='ai'){stage.innerHTML=`<div class="desk"><div class="deskMain"><div class="ey">AI + TECHNOLOGY</div><h1>${esc(s.ai?.headline||x.name)}</h1><p>${esc(s.ai?.detail||'Agents, models, chips and infrastructure.')}</p></div>${rail(x,a,pos)}</div>`;return}if(x.kind==='sports'){stage.innerHTML=`<div class="desk"><div class="deskMain"><div class="ey">SPORTS DESK</div><h1>${esc(s.sports?.headline||x.name)}</h1><p>${esc(s.sports?.detail||'Major games, injuries and storylines.')}</p></div>${rail(x,a,pos)}</div>`;return}if(x.kind==='betting'){let b=s.betting||{};stage.innerHTML=`<div class="desk"><div class="deskMain"><div class="ey">BETTING DESK · POWERED BY BC.GAME</div><h1>${esc(b.event||'Featured Betting Market')}</h1><div class="odds"><div class="odd"><label>CURRENT LINE</label><strong>${esc(b.line||'—')}</strong></div><div class="odd"><label>LINE MOVEMENT</label><strong>${esc(b.movement||'—')}</strong></div></div><p>${esc(b.note||'Context before picks.')}</p></div>${rail(x,a,pos)}</div>`;return}if(x.kind==='panel'){frame.classList.add('overlayMode');stage.innerHTML=`<div class="overlayStage"><div class="interviewFrames" style="grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr">${['J CHAINS','GUEST 2','GUEST 3','GUEST 4'].map(n=>`<div class="guestFrame"><span>${n}</span></div>`).join('')}</div></div>`;return}stage.innerHTML=`<div class="desk"><div class="deskMain"><div class="ey">${esc(x.name)}</div><h1>${esc(x.name)}</h1></div>${rail(x,a,pos)}</div>`}ch.onmessage=e=>{if(e.data?.type==='state'&&e.data.state){s=e.data.state;paint();loadPriceTicker()}};addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){s=JSON.parse(e.newValue);paint();loadPriceTicker()}});addEventListener('resize',()=>{if(s.segments?.[s.current]?.kind==='markets'&&marketPoints.length)renderChart()});ch.postMessage({type:'hello'});paint();rotateSponsor();loadPriceTicker();setInterval(loadPriceTicker,30000);</script></body></html>
