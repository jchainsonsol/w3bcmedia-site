<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>W3BC Program Output</title><style>:root{--c:#22d3e5;--c2:#8cedf5;--l:#29343b;--g:#58dfa2}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.frame{position:absolute;inset:0;background:radial-gradient(circle at 55% 42%,rgba(34,211,229,.045),transparent 42%),#05080a;border:2px solid #1c252b;display:grid;grid-template-rows:72px 1fr 92px}.head{display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid var(--l);background:rgba(7,10,12,.97)}.brand{display:flex;align-items:center;gap:14px}.brand img{width:68px;height:50px;object-fit:contain}.brand b{letter-spacing:.12em}.brand small{display:block;color:#738087;font-size:8px;letter-spacing:.17em;margin-top:4px}.livewrap{display:flex;gap:12px;align-items:center}.sponsorTop{font-size:9px;color:#9aa5aa;border-right:1px solid #303a40;padding-right:14px}.sponsorTop b{color:var(--c);margin-left:5px}.live{font-size:10px;border:1px solid #7a2c31;color:#ff7479;padding:7px 10px}.stage{position:relative;overflow:hidden}.cameraFull{position:absolute;inset:0;background:transparent}.cameraFull:after{content:'FULL CAMERA';position:absolute;inset:22px;border:1px dashed rgba(34,211,229,.12);display:grid;place-items:center;color:rgba(34,211,229,.12);font-size:22px;font-weight:900;letter-spacing:.18em}.lower{position:absolute;left:38px;bottom:34px;min-width:360px;border-left:4px solid var(--c);background:linear-gradient(90deg,rgba(5,9,11,.96),rgba(5,9,11,.76));padding:14px 19px;box-shadow:0 14px 40px rgba(0,0,0,.35)}.lower b{font-size:23px}.lower span{display:block;color:var(--c);font-size:10px;margin-top:4px}.split{height:100%;display:grid;grid-template-columns:1fr 350px}.content{padding:5vh 4vw;background:radial-gradient(circle at 70% 40%,rgba(34,211,229,.10),transparent 38%);display:flex;flex-direction:column;justify-content:center;position:relative}.content:after{content:'';position:absolute;right:6%;top:15%;width:220px;height:220px;border:1px solid rgba(34,211,229,.08);transform:rotate(45deg);pointer-events:none}.ey{color:var(--c);font-size:10px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}.content h1{font-size:clamp(50px,5.5vw,86px);line-height:.92;letter-spacing:-.055em;margin:15px 0;max-width:900px;position:relative;z-index:2}.content p{font-size:18px;line-height:1.5;color:#aeb8bd;max-width:760px;position:relative;z-index:2}.rail{border-left:1px solid var(--l);background:rgba(8,12,14,.98);display:flex;flex-direction:column}.rhead{height:48px;padding:0 15px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--l);color:var(--c);font-size:9px;font-weight:900;letter-spacing:.12em}.rrow{padding:11px 14px;border-bottom:1px solid #242d32;font-size:10px}.rrow.active{background:linear-gradient(90deg,var(--c),#25b7c6);color:#041013}.rrow small{display:block;margin-top:3px;opacity:.62}.cam{margin-top:auto;height:205px;border-top:1px solid var(--l);position:relative}.cam:before{content:'CAMERA';position:absolute;inset:8px;border:1px solid var(--c);display:grid;place-items:center;color:rgba(34,211,229,.22);font-weight:900;letter-spacing:.15em}.chart{height:100%;display:grid;grid-template-columns:1fr 300px}.chartarea{position:relative;background:linear-gradient(rgba(34,211,229,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(34,211,229,.035) 1px,transparent 1px);background-size:60px 60px}.chartarea svg{position:absolute;inset:5%;width:90%;height:90%}.footer{border-top:1px solid var(--l);display:grid;grid-template-rows:42px 48px;background:#080b0d}.crawl{display:grid;grid-template-columns:155px 1fr;border-bottom:1px solid #222c31;overflow:hidden}.crawlLabel{background:var(--c);color:#041013;display:flex;align-items:center;padding:0 18px;font-size:10px;font-weight:950;letter-spacing:.08em}.crawlWindow{overflow:hidden;display:flex;align-items:center;white-space:nowrap}.crawlTrack{display:inline-block;padding-left:100%;animation:crawl 42s linear infinite;color:#d4dade;font-size:11px}.crawlTrack span{margin-right:55px}.crawlTrack i{color:var(--c);font-style:normal;margin-right:10px}@keyframes crawl{from{transform:translateX(0)}to{transform:translateX(-100%)}}.bottom{display:grid;grid-template-columns:220px 1fr 290px}.sig{padding:0 20px;display:flex;align-items:center;color:var(--c);font-weight:900;font-size:11px;border-right:1px solid var(--l)}.sponsor{display:flex;align-items:center;padding:0 20px;font-size:10px;color:#9ba6ab}.sponsor strong{color:#fff;margin:0 7px}.seg{display:flex;align-items:center;justify-content:center;border-left:1px solid var(--l);font-size:9px}.seg b{color:var(--c);margin-left:7px}.newschildren{margin-top:20px;border-top:1px solid var(--l);max-width:760px}.newschildren div{padding:10px 0;border-bottom:1px solid #20282d;font-size:11px;color:#7f8b92}.newschildren .active{color:#fff}.newschildren .active:before{content:'▶ ';color:var(--c)}.guestgrid{height:100%;display:grid;grid-template-columns:1fr 1fr;gap:2px;background:#1c252b}.guest{background:transparent;position:relative}.guest:after{content:'CAMERA';position:absolute;inset:20px;border:1px solid rgba(34,211,229,.3);display:grid;place-items:center;color:rgba(34,211,229,.22);font-weight:900}.panelgrid{height:100%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px;background:#1c252b}.panelgrid .guest{background:#05080a}</style></head><body><div class="frame"><header class="head"><div class="brand"><img src="assets/w3bc-logo-white.png"><div><b>W3BC LIVE</b><small>MEDIA · MARKETS · CULTURE</small></div></div><div class="livewrap"><div class="sponsorTop">PRESENTED BY <b id="spTop">W3BC MEDIA</b></div><div class="live">● LIVE</div></div></header><main class="stage" id="stage"></main><footer class="footer"><div class="crawl"><div class="crawlLabel">W3BC UPDATE</div><div class="crawlWindow"><div class="crawlTrack" id="crawl"></div></div></div><div class="bottom"><div class="sig">W3BC SIGNAL · LIVE</div><div class="sponsor">THIS HOUR <strong id="spName">W3BC MEDIA</strong><span id="spMsg">Turn Your Moment Into Momentum</span></div><div class="seg">ON AIR <b id="seg"></b></div></div></footer></div><script>const KEY='w3bcShowStateV1',ch=new BroadcastChannel('w3bc-show');let s=JSON.parse(localStorage.getItem(KEY)||'null'),spTimer;const chartSvg=`<svg viewBox="0 0 1000 560" preserveAspectRatio="none"><g stroke="#243139">${[100,200,300,400,500].map(y=>`<line x1="0" y1="${y}" x2="1000" y2="${y}"/>`).join('')}</g><path d="M20 410 C130 380 180 430 280 330 S440 350 520 250 S680 300 760 180 S900 220 980 120" fill="none" stroke="#8cedf5" stroke-width="3"/><g fill="#22d3e5">${Array.from({length:25},(_,i)=>`<rect x="${25+i*38}" y="${180+Math.sin(i*.65)*90}" width="12" height="${45+Math.abs(Math.sin(i))*55}"/>`).join('')}</g></svg>`;function active(){return(s?.segments||[]).filter(x=>x.enabled!==false)}function sponsor(){let a=s?.sponsors||[];if(!a.length)return;let i=(s.sponsorIndex||0)%a.length,x=a[i];spTop.textContent=x.name;spName.textContent=x.name;spMsg.textContent=x.msg;s.sponsorIndex=(i+1)%a.length;localStorage.setItem(KEY,JSON.stringify(s))}function setupSponsor(){clearInterval(spTimer);sponsor();spTimer=setInterval(sponsor,180000)}function paint(){if(!s)return;let x=s.segments[s.current],a=active(),pos=a.indexOf(x);seg.textContent=x.name.toUpperCase();crawl.innerHTML=(s.ticker||[]).map((t,i)=>`<span><i>${i%2?'●':'◆'}</i>${t}</span>`).join('')||'<span>W3BC LIVE · Independent intelligence for what matters.</span>';if(x.kind==='camera'){stage.innerHTML=`<div class="cameraFull"><div class="lower"><b>J CHAINS</b><span>@JCHAINS · W3BC MEDIA</span></div></div>`;return}if(x.kind==='markets'){stage.innerHTML=`<div class="chart"><div class="chartarea">${chartSvg}<div class="lower"><b>${s.symbol} · ${s.timeframe}</b><span>W3BC MARKETS NOW</span></div></div><div class="rail"><div class="rhead"><span>MARKETS NOW</span><span>LIVE</span></div><div class="rrow active">${s.symbol}<small>${s.timeframe} chart</small></div><div class="rrow">KEY LEVELS<small>Support · resistance · targets</small></div><div class="cam"></div></div></div>`;return}if(x.kind==='interview'){stage.innerHTML=`<div class="guestgrid"><div class="guest"></div><div class="guest"></div></div>`;return}if(x.kind==='panel'){stage.innerHTML=`<div class="panelgrid">${'<div class="guest"></div>'.repeat(4)}</div>`;return}let children=x.children||[];stage.innerHTML=`<div class="split"><div class="content"><div class="ey">${x.name}</div><h1>${x.kind==='news'?(children[s.child]||x.name):x.name}</h1><p>${x.desc}</p>${children.length?`<div class="newschildren">${children.map((c,i)=>`<div class="${i===s.child?'active':''}">${c}</div>`).join('')}</div>`:''}</div><aside class="rail"><div class="rhead"><span>SHOW RUNDOWN</span><span>${pos+1}/${a.length}</span></div>${a.map((z,i)=>`<div class="rrow ${z===x?'active':''}">${String(i+1).padStart(2,'0')} · ${z.name}<small>${z===x?'NOW':i>pos?'UP NEXT':'COMPLETE'}</small></div>`).join('')}<div class="cam"></div></aside></div>`}ch.onmessage=e=>{if(e.data?.type==='state'){s=e.data.state;paint();setupSponsor()}};addEventListener('storage',e=>{if(e.key===KEY){s=JSON.parse(e.newValue);paint();setupSponsor()}});ch.postMessage({type:'hello'});paint();setupSponsor();</script></body></html>
