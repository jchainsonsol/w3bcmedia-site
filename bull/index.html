<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#03050a"><title>Silver Bull Bros.</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03050a;touch-action:none}iframe{border:0;width:100%;height:100%;display:block}.touch{position:fixed;inset:0;pointer-events:none}.btn{position:absolute;pointer-events:auto;width:86px;height:86px;border-radius:50%;display:grid;place-items:center;background:rgba(7,14,24,.62);border:2px solid rgba(255,255,255,.28);color:#fff;font:900 27px/1 system-ui;backdrop-filter:blur(7px);user-select:none;-webkit-user-select:none}.btn.on{transform:scale(.94);background:rgba(44,113,172,.88)}#left{left:22px;bottom:24px}#right{left:120px;bottom:24px}#jump{right:28px;bottom:28px;width:100px;height:100px;border-color:rgba(56,240,154,.72);background:rgba(16,75,56,.68);font-size:18px}.hidden{display:none}</style></head><body><iframe id="game" allow="gamepad *; fullscreen *" allowfullscreen></iframe><div id="touch" class="touch"><div id="left" class="btn">◀</div><div id="right" class="btn">▶</div><div id="jump" class="btn">JUMP</div></div><script>
const f=document.getElementById('game'),touchUI=document.getElementById('touch');const portrait=()=>innerHeight>innerWidth*1.12;let mobile=portrait();
function key(code,down){try{const w=f.contentWindow,d=w.document;const keyMap={ArrowLeft:'ArrowLeft',ArrowRight:'ArrowRight',Space:' '};const ev=new KeyboardEvent(down?'keydown':'keyup',{code,key:keyMap[code],bubbles:true});w.dispatchEvent(ev);d.dispatchEvent(ev)}catch(e){}}
function bind(id,code){const el=document.getElementById(id);const on=e=>{e.preventDefault();el.classList.add('on');key(code,true)};const off=e=>{e.preventDefault();el.classList.remove('on');key(code,false)};['pointerdown','touchstart'].forEach(n=>el.addEventListener(n,on,{passive:false}));['pointerup','pointercancel','pointerleave','touchend','touchcancel'].forEach(n=>el.addEventListener(n,off,{passive:false}))}bind('left','ArrowLeft');bind('right','ArrowRight');bind('jump','Space');
function load(){mobile=portrait();f.src=mobile?'../games/silver-bull-bros/mobile.html':'../games/silver-bull-bros/';touchUI.classList.toggle('hidden',mobile)}
function startGame(){if(mobile)return;try{const w=f.contentWindow,d=w.document;w.focus();const down=new KeyboardEvent('keydown',{code:'Enter',key:'Enter',bubbles:true});const up=new KeyboardEvent('keyup',{code:'Enter',key:'Enter',bubbles:true});w.dispatchEvent(down);d.dispatchEvent(down);setTimeout(()=>{w.dispatchEvent(up);d.dispatchEvent(up)},70)}catch(e){}}
f.addEventListener('load',()=>{if(!mobile){setTimeout(startGame,350);setTimeout(startGame,900)}});let timer;addEventListener('resize',()=>{clearTimeout(timer);timer=setTimeout(()=>{if(portrait()!==mobile)load()},220)});load();
</script></body></html>
