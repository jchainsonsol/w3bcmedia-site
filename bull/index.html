<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#02050a">
<title>Silver Bull Bros.</title>
<style>
:root{--green:#49f08f;--panel:rgba(4,8,14,.78)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02050a;font-family:Inter,system-ui,-apple-system,sans-serif}
body{touch-action:manipulation}
.hero{position:fixed;inset:0;background:#02050a url('../games/silver-bull-bros/assets/menu-home.jpg') center 38%/cover no-repeat}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.03) 45%,rgba(0,0,0,.38) 72%,rgba(0,0,0,.78) 100%);pointer-events:none}
.menu{position:fixed;z-index:2;left:50%;bottom:max(28px,env(safe-area-inset-bottom));transform:translateX(-50%);display:grid;grid-template-columns:minmax(180px,310px) minmax(180px,310px);gap:14px;width:min(680px,calc(100vw - 30px))}
button,a{appearance:none;-webkit-appearance:none;border:1px solid rgba(255,255,255,.28);border-radius:14px;min-height:62px;padding:0 20px;display:grid;place-items:center;text-decoration:none;font:900 17px/1 system-ui;letter-spacing:.06em;color:white;background:var(--panel);backdrop-filter:blur(10px);box-shadow:0 10px 28px rgba(0,0,0,.4)}
#play{background:linear-gradient(180deg,rgba(57,238,142,.95),rgba(18,137,77,.96));color:#04110a;border-color:#7dffc0}
button:active,a:active{transform:scale(.98)}
.note{position:fixed;z-index:2;top:max(12px,env(safe-area-inset-top));right:14px;padding:8px 11px;border-radius:999px;background:rgba(0,0,0,.48);color:#dce7f3;font:800 10px monospace;letter-spacing:.08em}
@media (orientation:portrait){
  .hero{background-position:center top}
  .menu{grid-template-columns:1fr;bottom:max(22px,env(safe-area-inset-bottom));width:min(420px,calc(100vw - 28px))}
  button,a{min-height:58px}
  .note{font-size:9px}
}
</style>
</head>
<body>
<div class="hero"></div>
<div class="note">TOUCH + PSG1 CONTROLLER</div>
<div class="menu">
  <button id="play" type="button">PLAY GAME</button>
  <a href="../games/silver-bull-bros/select/">WORLD SELECT</a>
</div>
<script>
function launch(){
  const portrait = innerHeight > innerWidth * 1.12;
  location.href = portrait ? '../games/silver-bull-bros/mobile.html' : '../games/silver-bull-bros/';
}
document.getElementById('play').addEventListener('click',launch);
</script>
</body>
</html>
