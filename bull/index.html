<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Silver Bull Bros.</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03050a}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="game" src="../games/silver-bull-bros/" allow="gamepad *; fullscreen *" allowfullscreen></iframe><script>
const f=document.getElementById('game');let prev=false;
function fireEnter(){try{const w=f.contentWindow,d=f.contentDocument||w.document;const down=new KeyboardEvent('keydown',{code:'Enter',key:'Enter',bubbles:true});const up=new KeyboardEvent('keyup',{code:'Enter',key:'Enter',bubbles:true});w.dispatchEvent(down);d.dispatchEvent(down);setTimeout(()=>{w.dispatchEvent(up);d.dispatchEvent(up)},60)}catch(e){}}
function poll(){const p=navigator.getGamepads?.()[0];const pressed=!!(p&&(p.buttons?.[0]?.pressed||p.buttons?.[1]?.pressed||p.buttons?.[8]?.pressed||p.buttons?.[9]?.pressed));if(pressed&&!prev)fireEnter();prev=pressed;requestAnimationFrame(poll)}
f.addEventListener('load',()=>{f.contentWindow?.focus();});addEventListener('pointerdown',()=>{f.contentWindow?.focus();fireEnter()},{once:true});requestAnimationFrame(poll);
</script></body></html>
