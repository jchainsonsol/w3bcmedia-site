<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Silver Bull Bros.</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03050a}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="game" src="../games/silver-bull-bros/" allow="gamepad *; fullscreen *" allowfullscreen></iframe><script>
const f=document.getElementById('game');
function startGame(){try{const w=f.contentWindow,d=w.document;w.focus();const down=new KeyboardEvent('keydown',{code:'Enter',key:'Enter',keyCode:13,which:13,bubbles:true});const up=new KeyboardEvent('keyup',{code:'Enter',key:'Enter',keyCode:13,which:13,bubbles:true});w.dispatchEvent(down);d.dispatchEvent(down);setTimeout(()=>{w.dispatchEvent(up);d.dispatchEvent(up)},80)}catch(e){}}
f.addEventListener('load',()=>{setTimeout(startGame,500);setTimeout(startGame,1300)});
addEventListener('pointerdown',startGame);
</script></body></html>
