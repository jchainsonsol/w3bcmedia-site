<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>W3BC Desk Stories</title><style>:root{--c:#22d3e5;--bg:#05080a;--p:#0a1013;--l:#28343b;--m:#91a0a6;--v:#a98cff;--g:#42d9a0}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{height:100%;display:grid;grid-template-rows:58px 1fr;background:radial-gradient(circle at 72% 35%,rgba(34,211,229,.08),transparent 38%),var(--bg)}.top{border-bottom:1px solid var(--l);display:flex;align-items:center;justify-content:space-between;padding:0 22px}.ey{color:var(--c);font-size:13px;font-weight:950;letter-spacing:.13em}.count{font-size:11px;color:var(--m);font-weight:900}.content{padding:26px 30px;overflow:hidden;display:flex;flex-direction:column;justify-content:center}.headline{font-size:clamp(34px,3.2vw,56px);line-height:.98;letter-spacing:-.04em;font-weight:950;max-width:1000px;margin:0 0 18px}.points{display:grid;gap:8px;max-width:980px}.point{display:grid;grid-template-columns:30px 1fr;gap:10px;border-bottom:1px solid #202a30;padding:8px 0;font-size:17px;line-height:1.32;color:#d2dade}.point b{color:var(--c);font-size:11px;padding-top:3px}.stats{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.stat{border:1px solid #2c3940;background:#091013;padding:9px 12px;min-width:130px}.stat label{display:block;color:#819096;font-size:9px;letter-spacing:.08em}.stat strong{display:block;color:var(--c);font-size:21px;margin-top:4px}.quote{margin-top:12px;border-left:3px solid var(--v);padding:10px 13px;background:linear-gradient(90deg,rgba(169,140,255,.1),transparent);font-size:14px;line-height:1.35;color:#e1e5e8}.take{margin-top:12px;border-left:3px solid var(--c);padding:10px 13px;background:linear-gradient(90deg,rgba(34,211,229,.09),transparent);font-size:15px;line-height:1.38;max-width:1000px}.take span{display:block;color:var(--c);font-size:10px;font-weight:950;letter-spacing:.1em;margin-bottom:4px}</style></head><body><div class="wrap"><div class="top"><div class="ey" id="desk">W3BC DESK</div><div class="count" id="count"></div></div><main class="content"><h1 class="headline" id="headline">Loading…</h1><div class="points" id="points"></div><div class="stats" id="stats"></div><div class="quote" id="quote" style="display:none"></div><div class="take" id="take" style="display:none"><span>W3BC TAKEAWAY</span><div id="takeText"></div></div></main></div><script>const KEY='w3bcShowStateV1',desk=new URLSearchParams(location.search).get('desk')||'ai',$=id=>document.getElementById(id);function esc(v=''){return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function render(){let s={};try{s=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}let arr=desk==='sports'?(s.sportsStories||[]):(s.aiStories||[]),idx=desk==='sports'?(s.sportsChild||0):(s.aiChild||0),x=arr[idx]||{};$('desk').textContent=desk==='sports'?'SPORTS DESK':'AI + TECHNOLOGY';$('count').textContent=`STORY ${Math.min(idx+1,Math.max(arr.length,1))} / ${Math.max(arr.length,1)}`;$('headline').textContent=x.headline||(desk==='sports'?'Sports Desk':'AI + Technology');$('points').innerHTML=(x.points||[]).filter(Boolean).map((p,i)=>`<div class="point"><b>${String(i+1).padStart(2,'0')}</b><span>${esc(p)}</span></div>`).join('');$('stats').innerHTML=(x.stats||[]).filter(v=>v&&v[0]&&v[1]).map(v=>`<div class="stat"><label>${esc(v[0])}</label><strong>${esc(v[1])}</strong></div>`).join('');if(x.quote){$('quote').style.display='block';$('quote').textContent='“'+x.quote+'”'}else $('quote').style.display='none';if(x.takeaway){$('take').style.display='block';$('takeText').textContent=x.takeaway}else $('take').style.display='none'}render();window.addEventListener('storage',e=>{if(e.key===KEY)render()});setInterval(render,500);</script></body></html>
