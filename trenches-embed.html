ze:20px;line-height:1.05;order:1}.quickRead{padding:12px 14px;overflow:hidden}.quickRead h3{font-size:9px;color:var(--v);letter-spacing:.1em;margin:0 0 8px}.flag{display:flex;gap:7px;align-items:flex-start;font-size:11px;line-height:1.25;padding:5px 0;border-bottom:1px solid #1c252a}.flag:last-child{border:0}.dot{width:7px;height:7px;border-radius:50%;margin-top:3px;flex:none}.dot.g{background:var(--g)}.dot.y{background:var(--y)}.dot.r{background:var(--r)}.bottom{display:grid;grid-template-columns:1.35fr 1fr 1fr;border-top:1px solid var(--l);background:#080c0e}.panel{padding:12px 14px;border-right:1px solid var(--l);overflow:hidden}.panel:last-child{border-right:0}.panelHead{display:flex;justify-content:space-between;align-items:center;font-size:10px;margin-bottom:8px}.panelHead b{letter-spacing:.06em}.grade{font-size:10px;font-weight:950;padding:4px 7px;border:1px solid #39464d}.grade.good{color:var(--g);border-color:#315a48}.grade.warn{color:var(--y);border-color:#5d5328}.grade.bad{color:var(--r);border-color:#63363b}.signal{font-size:12px;line-height:1.35;color:#d1d8db}.signal strong{color:#fff}.metrics{display:grid;gap:7px}.metricTop{display:flex;justify-content:space-between;font-size:9px}.metricTop span{color:#a2adb2}.bar{height:7px;background:#151d22}.fill{height:100%;background:linear-gradient(90deg,var(--v),var(--c));width:0}.checks{font-size:11px;line-height:1.45;color:#c9d1d5}.checks b{color:#fff}.good{color:var(--g)}.bad{color:var(--r)}.warn{color:var(--y)}</style></head><body><div class="wrap"><header class="top"><div><div class="tag">THE TRENCHES · BLACK BOX</div><div class="tokenline"><div class="title" id="title">LOADING…</div><div class="meta" id="meta">DEXSCREENER MARKET INTELLIGENCE</div></div></div><div class="score"><strong id="score">—</strong><div class="scoreText"><b id="grade">WAIT</b><span>BLACK BOX SCORE / 100</span></div></div></header><main class="main"><section class="chart"><div class="chartMsg" id="msg">Finding best market…</div><iframe id="chart" style="display:none"></iframe></section><aside class="side"><div class="stats"><div class="stat"><label>PRICE</label><strong id="price">—</strong></div><div class="stat"><label>24H CHANGE</label><strong id="change">—</strong></div><div class="stat"><label>LIQUIDITY</label><strong id="liq">—</strong></div><div class="stat"><label>24H VOLUME</label><strong id="vol">—</strong></div><div class="stat"><label>MARKET CAP</label><strong id="mc">—</strong></div><div class="stat"><label>LIQ / MCAP</label><strong id="liqmc">—</strong></div><div class="stat"><label>24H BUYS / SELLS</label><strong id="flow">—</strong></div><div class="stat"><label>PAIR AGE</label><strong id="age">—</strong></div></div><div class="quickRead"><h3>RED FLAGS + CONFIRMATIONS</h3><div id="flags"></div></div></aside></main><footer class="bottom"><section class="panel"><div class="panelHead"><b>W3BC INVESTMENT SIGNAL</b><span class="grade" id="signalGrade">WAIT</span></div><div class="signal" id="signal">Loading market structure…</div></section><section class="panel"><div class="panelHead"><b>MARKET HEALTH</b><span id="healthText">—</span></div><div class="metrics"><div><div class="metricTop"><b>LIQUIDITY</b><span id="liqScore">—</span></div><div class="bar"><div class="fill" id="liqBar"></div></div></div><div><div class="metricTop"><b>ACTIVITY</b><span id="actScore">—</span></div><div class="bar"><div class="fill" id="actBar"></div></div></div><div><div class="metricTop"><b>MOMENTUM</b><span id="momScore">—</span></div><div class="bar"><div class="fill" id="momBar"></div></div></div></div></section><section class="panel"><div class="panelHead"><b>DATA CHECK</b><span>DEXSCREENER</span></div><div class="checks" id="checks">Loading…</div></section></footer></div><script>const $=id=>document.getElementById(id),P=new URLSearchParams(location.search),q=P.get('q')||'5qzX8fkFtVu7XbopVuHrCYFC2w1YsVAryN3WJeq1pump';const clamp=n=>Math.max(0,Math.min(100,Math.round(n)));const money=n=>{n=+n||0;if(n>=1e9)return'$'+(n/1e9).toFixed(2)+'B';if(n>=1e6)return'$'+(n/1e6).toFixed(2)+'M';if(n>=1e3)return'$'+(n/1e3).toFixed(1)+'K';return'$'+n.toLocaleString(undefined,{maximumFractionDigits:n<1?8:2})};const pct=n=>(n>=0?'+':'')+(+n||0).toFixed(2)+'%';function age(ms){if(!ms)return'UNKNOWN';let d=(Date.now()-ms)/864e5;if(d<1)return Math.max(1,Math.floor(d*24))+'H';if(d<365)return Math.floor(d)+'D';return(d/365).toFixed(1)+'Y'}function setMetric(k,v){$(k+'Score').textContent=v+'/100';$(k+'Bar').style.width=v+'%'}function extractUrl(x){try{let u=new URL(x);if(!/dexscreener\.com$/i.test(u.hostname)&&!/\.dexscreener\.com$/i.test(u.hostname))return null;let a=u.pathname.split('/').filter(Boolean);if(a.length>=2)return{chain:a[0],pair:a[1]}}catch(e){}return null}async function resolve(){let u=extractUrl(q);if(u){let r=await fetch(`https://api.dexscreener.com/latest/dex/pairs/${encodeURIComponent(u.chain)}/${encodeURIComponent(u.pair)}`),j=await r.json();return(j.pairs||[])[0]}let r=await fetch('https://api.dexscreener.com/latest/dex/search?q='+encodeURIComponent(q)),pairs=(await r.json()).pairs||[];if(!pairs.length)return null;let clean=q.replace(/^\$/,'').toLowerCase();pairs.sort((a,b)=>{let ae=(a.baseToken?.symbol||'').toLowerCase()===clean||(a.baseToken?.address||'').toLowerCase()===clean?1:0,be=(b.baseToken?.symbol||'').toLowerCase()===clean||(b.baseToken?.address||'').toLowerCase()===clean?1:0;if(be!==ae)return be-ae;return(b.liquidity?.usd||0)-(a.liquidity?.usd||0)});return pairs[0]}function analyze(p){let L=+(p.liquidity?.usd||0),V=+(p.volume?.h24||0),MC=+(p.marketCap||p.fdv||0),B=+(p.txns?.h24?.buys||0),S=+(p.txns?.h24?.sells||0),T=B+S,C24=+(p.priceChange?.h24||0),C6=+(p.priceChange?.h6||0),C1=+(p.priceChange?.h1||0),C5=+(p.priceChange?.m5||0),ratio=MC?L/MC:0,vr=L?V/L:0,buyShare=T?B/T:.5,pairDays=p.pairCreatedAt?(Date.now()-p.pairCreatedAt)/864e5:null,socials=(p.info?.socials||[]).length,web=(p.info?.websites||[]).length,boost=+(p.boosts?.active||0);let liq=clamp(L<5e3?10:L<15e3?25:L<50e3?48:L<150e3?68:L<500e3?82:95);if(MC)liq=clamp(liq*.7+Math.min(100,ratio*1000)*.3);let act=clamp(T<20?10:T<100?30:T<500?55:T<2000?75:T<10000?88:96);let trend=[C5,C1,C6,C24],pos=trend.filter(x=>x>0).length,neg=trend.filter(x=>x<0).length,mom=clamp(50+C24*.8+C6*1.2+C1*1.6+(pos-neg)*6);let structure=50;if(vr>=.08&&vr<=4)structure+=18;else if(vr>8)structure-=18;else if(vr<.02)structure-=12;if(buyShare>.55)structure+=10;if(buyShare<.4)structure-=12;if(pairDays!=null&&pairDays<1)structure-=12;else if(pairDays>7)structure+=7;if(ratio>0&&ratio<.03)structure-=15;else if(ratio>=.08)structure+=10;if(socials+web)structure+=6;structure=clamp(structure);let total=clamp(liq*.30+act*.20+mom*.20+structure*.30);let flags=[];const add=(type,text)=>flags.push({type,text});if(L<10000)add('r',`Thin liquidity: ${money(L)}`);else if(L<50000)add('y',`Liquidity is still light: ${money(L)}`);else add('g',`Visible liquidity: ${money(L)}`);if(MC&&ratio<.03)add('r',`Liquidity is only ${(ratio*100).toFixed(1)}% of market cap`);else if(MC&&ratio<.08)add('y',`Liquidity / market cap is ${(ratio*100).toFixed(1)}%`);else if(MC)add('g',`Liquidity / market cap is ${(ratio*100).toFixed(1)}%`);if(vr>8)add('r',`Volume is ${vr.toFixed(1)}× liquidity — investigate quality`);else if(vr>4)add('y',`High turnover: ${vr.toFixed(1)}× liquidity`);else if(vr>=.08)add('g',`Volume/liquidity activity looks usable at ${vr.toFixed(2)}×`);else add('y','Very low volume relative to liquidity');if(T<50)add('r',`Only ${T} transactions in 24H`);else if(T<250)add('y',`${T} transactions in 24H`);else add('g',`${T.toLocaleString()} transactions in 24H`);if(buyShare>=.6)add('g',`Buy pressure: ${(buyShare*100).toFixed(0)}% of 24H trades are buys`);else if(buyShare<=.4)add('r',`Sell pressure: ${((1-buyShare)*100).toFixed(0)}% of 24H trades are sells`);else add('y','Buy/sell flow is balanced');if(pos>=3)add('g','Momentum positive across most timeframes');else if(neg>=3)add('r','Momentum negative across most timeframes');else add('y','Momentum is mixed across timeframes');if(pairDays!=null&&pairDays<1)add('r','Pair is less than 24 hours old');else if(pairDays!=null&&pairDays<7)add('y',`Pair is only ${Math.floor(pairDays)} days old`);if(!(socials+web))add('y','No website/social links visible in DexScreener metadata');if(boost)add('y',`DexScreener boost active (${boost}) — visibility is paid/promoted`);return{L,V,MC,B,S,T,C24,C6,C1,C5,ratio,vr,buyShare,pairDays,socials,web,boost,liq,act,mom,structure,total,flags,pos,neg}}function grade(s){if(s.total>=80&&s.flags.filter(x=>x.type==='r').length===0)return['STRONG','good'];if(s.total>=65&&s.flags.filter(x=>x.type==='r').length<=1)return['CONSTRUCTIVE','good'];if(s.total>=50)return['WATCH','warn'];if(s.total>=35)return['HIGH RISK','warn'];return['AVOID / VERIFY','bad']}function thesis(s){let red=s.flags.filter(x=>x.type==='r').length,yellow=s.flags.filter(x=>x.type==='y').length;if(s.total>=80&&red===0)return`<strong>Strong market structure.</strong> Liquidity, activity and momentum are aligned. Still verify holders, contract permissions and wallet concentration before sizing a position.`;if(s.total>=65&&red<=1)return`<strong>Constructive, but not clean.</strong> Market activity is healthy enough to investigate further. Resolve the flagged risk before treating this as an investment setup.`;if(s.total>=50)return`<strong>Watchlist, not conviction.</strong> There is enough activity to keep monitoring, but structure is mixed. Wait for liquidity, flow or momentum to improve.`;if(s.total>=35)return`<strong>High-risk setup.</strong> Multiple market-structure weaknesses are present. This needs additional due diligence before considering capital.`;return`<strong>Avoid until verified.</strong> Current market data shows poor investability or insufficient evidence. Do not confuse activity with quality.`}async function run(){try{let p=await resolve();if(!p)throw Error('No matching DexScreener market found');let s=analyze(p),[g,cls]=grade(s);$('title').textContent='$'+(p.baseToken?.symbol||'TOKEN').replace(/^\$/,'');$('meta').textContent=`${(p.chainId||'CHAIN').toUpperCase()} · ${(p.dexId||'DEX').toUpperCase()} · ${(p.quoteToken?.symbol||'QUOTE').toUpperCase()}`;$('score').textContent=s.total;$('grade').textContent=g;$('grade').className=cls;$('signalGrade').textContent=g;$('signalGrade').className='grade '+cls;$('price').textContent='$'+Number(p.priceUsd||0).toLocaleString(undefined,{maximumFractionDigits:10});$('change').textContent=pct(s.C24);$('change').className=s.C24>=0?'good':'bad';$('liq').textContent=money(s.L);$('vol').textContent=money(s.V);$('mc').textContent=money(s.MC);$('liqmc').textContent=s.MC?(s.ratio*100).toFixed(1)+'%':'—';$('flow').textContent=`${s.B.toLocaleString()} / ${s.S.toLocaleString()}`;$('age').textContent=age(p.pairCreatedAt);$('flags').innerHTML=s.flags.slice(0,7).map(f=>`<div class="flag"><span class="dot ${f.type}"></span><span>${f.text}</span></div>`).join('');$('signal').innerHTML=thesis(s);setMetric('liq',s.liq);setMetric('act',s.act);setMetric('mom',s.mom);$('healthText').textContent=`STRUCTURE ${s.structure}/100`;$('checks').innerHTML=`<b>Momentum:</b> 5m ${pct(s.C5)} · 1h ${pct(s.C1)} · 6h ${pct(s.C6)} · 24h ${pct(s.C24)}<br><b>Visible links:</b> ${s.web} website · ${s.socials} social<br><b>Boost:</b> ${s.boost?'ACTIVE':'none visible'}<br><span class="warn">Not included:</span> holder concentration, dev wallets, contract/security checks.`;if(p.pairAddress&&p.chainId){$('chart').src=`https://dexscreener.com/${encodeURIComponent(p.chainId)}/${encodeURIComponent(p.pairAddress)}?embed=1&theme=dark&trades=0&info=0`;$('chart').style.display='block';$('msg').style.display='none'}}catch(e){$('msg').textContent=e.message;$('signal').innerHTML='<strong>NO SIGNAL.</strong> '+e.message;$('signalGrade').textContent='NO DATA';$('signalGrade').className='grade bad'}}run();</script></body></html>
