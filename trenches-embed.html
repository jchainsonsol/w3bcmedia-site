<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>W3BC Trenches Embed</title><style>:root{--bg:#05080a;--p:#0a0f12;--l:#28343b;--c:#22d3e5;--g:#42d9a0;--r:#ff6c76;--y:#ffd166;--v:#a98cff;--m:#78858c}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{height:100%;display:grid;grid-template-rows:76px 1fr 138px}.top{display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--l);background:linear-gradient(90deg,rgba(169,140,255,.08),transparent)}.tag{color:var(--v);font-size:12px;font-weight:950;letter-spacing:.12em}.title{font-size:32px;font-weight:950;letter-spacing:-.03em;margin-top:4px}.score{display:flex;align-items:center;gap:10px}.score strong{font-size:40px;line-height:1}.score span{display:block;font-size:10px;color:#9aa5ab;letter-spacing:.09em;margin-top:4px}.main{display:grid;grid-template-columns:minmax(0,1fr) 270px;min-height:0}.chart{position:relative;border-right:1px solid var(--l);background:#06090b}.chart iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.chartMsg{position:absolute;inset:0;display:grid;place-items:center;color:#7c898f;font-size:14px}.stats{display:grid;grid-template-columns:1fr 1fr;background:var(--p)}.stat{padding:14px;border-right:1px solid #222d33;border-bottom:1px solid #222d33;display:flex;flex-direction:column;justify-content:center}.stat:nth-child(2n){border-right:0}.stat label{display:block;color:#89969c;font-size:10px;font-weight:800;letter-spacing:.08em;order:2;margin-top:5px}.stat strong{display:block;font-size:22px;line-height:1.05;order:1}.bottom{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr;border-top:1px solid var(--l);background:#080c0e}.metric{padding:13px 14px;border-right:1px solid var(--l)}.metric:last-child{border-right:0}.metricTop{display:flex;justify-content:space-between;font-size:11px;margin-bottom:9px}.metricTop b{letter-spacing:.05em}.metricTop span{color:#a2adb2}.bar{height:8px;background:#151d22}.fill{height:100%;background:linear-gradient(90deg,var(--v),var(--c));width:0}.signal{font-size:12px;line-height:1.4;color:#d1d8db;margin-top:9px}.signal b{color:var(--v);font-size:12px}.good{color:var(--g)}.bad{color:var(--r)}.warn{color:var(--y)}</style></head><body><div class="wrap"><header class="top"><div><div class="tag">THE TRENCHES · BLACK BOX</div><div class="title" id="title">$JCHAINS</div></div><div class="score"><div><strong id="score">—</strong><span>BLACK BOX SCORE</span></div></div></header><main class="main"><section class="chart"><div class="chartMsg" id="msg">Loading Solana market…</div><iframe id="chart" style="display:none"></iframe></section><aside class="stats"><div class="stat"><label>PRICE</label><strong id="price">—</strong></div><div class="stat"><label>24H CHANGE</label><strong id="change">—</strong></div><div class="stat"><label>LIQUIDITY</label><strong id="liq">—</strong></div><div class="stat"><label>24H VOLUME</label><strong id="vol">—</strong></div><div class="stat"><label>MARKET CAP</label><strong id="mc">—</strong></div><div class="stat"><label>TXNS 24H</label><strong id="txns">—</strong></div><div class="stat"><label>BUYS</label><strong id="buys">—</strong></div><div class="stat"><label>SELLS</label><strong id="sells">—</strong></div></aside></main><footer class="bottom"><div class="metric"><div class="metricTop"><b>LIQUIDITY</b><span id="liqScore">—</span></div><div class="bar"><div class="fill" id="liqBar"></div></div><div class="signal" id="signal"><b>W3BC SIGNAL</b><br>Loading…</div></div><div class="metric"><div class="metricTop"><b>ACTIVITY</b><span id="actScore">—</span></div><div class="bar"><div class="fill" id="actBar"></div></div></div><div class="metric"><div class="metricTop"><b>VOLUME QUALITY</b><span id="volScore">—</span></div><div class="bar"><div class="fill" id="volBar"></div></div></div><div class="metric"><div class="metricTop"><b>MOMENTUM</b><span id="momScore">—</span></div><div class="bar"><div class="fill" id="momBar"></div></div></div></footer></div><script>const $=id=>document.getElementById(id);const q=new URLSearchParams(location.search).get('q')||'5qzX8fkFtVu7XbopVuHrCYFC2w1YsVAryN3WJeq1pump';const money=n=>{n=+n||0;if(n>=1e9)return'$'+(n/1e9).toFixed(2)+'B';if(n>=1e6)return'$'+(n/1e6).toFixed(2)+'M';if(n>=1e3)return'$'+(n/1e3).toFixed(1)+'K';return'$'+n.toLocaleString(undefined,{maximumFractionDigits:n<1?8:2})};const clamp=n=>Math.max(0,Math.min(100,Math.round(n)));function setMetric(k,v){$(k+'Score').textContent=v+'/100';$(k+'Bar').style.width=v+'%'}function scorePair(p){let L=+(p.liquidity?.usd||0),V=+(p.volume?.h24||0),B=+(p.txns?.h24?.buys||0),S=+(p.txns?.h24?.sells||0),C=+(p.priceChange?.h24||0),MC=+(p.marketCap||p.fdv||0);let liq=clamp(Math.log10(Math.max(L,1))/6*100);if(MC>0)liq=clamp(liq*.55+Math.min(100,L/MC*1000)*.45);let act=clamp(Math.log10(Math.max(B+S,1))/4*100);let ratio=L>0?V/L:0;let volq=clamp(ratio<=0?0:ratio<.05?20:ratio<.2?45:ratio<1?75:ratio<4?95:75);let mom=clamp(50+C*2.2);let total=clamp(liq*.32+act*.25+volq*.25+mom*.18);return{liq,act,volq,mom,total,L,V,B,S,C,MC}}function grade(n){return n>=80?'HOT':n>=65?'ACTIVE':n>=50?'WATCH':n>=35?'EARLY':'HIGH RISK'}async function run(){try{let r=await fetch('https://api.dexscreener.com/latest/dex/search?q='+encodeURIComponent(q));let pairs=(await r.json()).pairs||[];let p=pairs.filter(x=>x.chainId==='solana').sort((a,b)=>(b.liquidity?.usd||0)-(a.liquidity?.usd||0))[0];if(!p)throw Error('No matching Solana pair found');let s=scorePair(p),g=grade(s.total);$('title').textContent='$'+(p.baseToken?.symbol||'TOKEN').replace(/^\$/,'');$('score').textContent=s.total;$('price').textContent='$'+Number(p.priceUsd||0).toLocaleString(undefined,{maximumFractionDigits:10});$('change').textContent=(s.C>=0?'+':'')+s.C.toFixed(2)+'%';$('change').className=s.C>=0?'good':'bad';$('liq').textContent=money(s.L);$('vol').textContent=money(s.V);$('mc').textContent=money(p.marketCap||p.fdv||0);$('txns').textContent=(s.B+s.S).toLocaleString();$('buys').textContent=s.B.toLocaleString();$('sells').textContent=s.S.toLocaleString();setMetric('liq',s.liq);setMetric('act',s.act);setMetric('vol',s.volq);setMetric('mom',s.mom);$('signal').innerHTML=`<b>W3BC SIGNAL · ${g}</b><br>${money(s.L)} liquidity · ${money(s.V)} volume · ${s.C>=0?'positive':'negative'} ${Math.abs(s.C).toFixed(1)}% momentum.`;if(p.pairAddress){$('chart').src='https://dexscreener.com/solana/'+encodeURIComponent(p.pairAddress)+'?embed=1&theme=dark&trades=0&info=0';$('chart').style.display='block';$('msg').style.display='none'}}catch(e){$('msg').textContent=e.message;$('signal').innerHTML='<b>W3BC SIGNAL</b><br>'+e.message}}run();</script></body></html>
