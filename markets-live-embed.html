<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>W3BC Markets Live</title><style>:root{--c:#22d3e5;--g:#42d9a0;--r:#ff6c76;--p:#a98cff;--y:#ffd166;--bg:#06090b;--l:#243037}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{height:100%;display:grid;grid-template-rows:58px 38px 1fr}.top{display:flex;align-items:center;gap:16px;padding:0 20px;border-bottom:1px solid var(--l);background:#070b0d}.symbol{font-size:21px;font-weight:950}.price{font-size:19px;font-weight:900}.change{font-size:10px;font-weight:900}.up{color:var(--g)}.down{color:var(--r)}.meta{margin-left:auto;text-align:right;color:#77858c;font-size:8px}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--g);margin-right:5px}.bar{display:flex;align-items:center;gap:5px;padding:4px 12px;border-bottom:1px solid #202b31;background:#080c0e}.b{height:28px;border:1px solid #344149;background:#090d10;color:#fff;padding:0 9px;font-size:8px;font-weight:900;cursor:pointer}.b.active{border-color:var(--c);color:var(--c)}.spacer{flex:1}.color{width:30px;height:28px}.chart{position:relative;min-height:0}.base,.draw{position:absolute;inset:0;width:100%;height:100%}.draw{z-index:6;touch-action:none}.feed{position:absolute;left:12px;top:9px;z-index:8;color:#718087;font-size:8px}.tag{position:absolute;right:12px;top:9px;z-index:8;color:var(--y);font-size:7px}.legend{position:absolute;right:12px;bottom:8px;z-index:8;display:flex;gap:12px;color:#8c989e;font-size:7px}.badge{border:1px solid #28624a;color:#7eeab2;padding:3px 5px;font-size:7px;font-weight:900}</style></head><body><div class="app"><div class="top"><div id="symbol" class="symbol">BTC/USDT</div><div id="price" class="price">—</div><div id="change" class="change">LIVE</div><div class="meta"><span class="dot"></span>LIVE MARKET DATA<br><span id="tfLabel">15m · W3BC TA CHART</span></div></div><div class="bar"><button class="b active" data-tool="trend">╱ LINE</button><button class="b" data-tool="marker">✎ MARKER</button><button class="b" data-tool="eraser">⌫ ERASE</button><input id="drawColor" class="color" type="color" value="#22d3e5"><button id="undo" class="b">UNDO</button><button id="clear" class="b">CLEAR</button><button id="vrvp" class="b active">VRVP</button><button id="smma" class="b active">21 SMMA</button><button id="ema" class="b active">200 EMA</button><span class="spacer"></span><span class="badge">LIVE DATA</span></div><div id="chart" class="chart"><canvas id="base" class="base"></canvas><canvas id="draw" class="draw"></canvas><div id="crosshair" style="position:absolute;inset:0;pointer-events:none;z-index:7;display:none"></div><div id="crossPrice" style="position:absolute;right:74px;z-index:9;display:none;background:#10171b;border:1px solid #3a4a52;color:#fff;padding:3px 6px;font:800 9px Inter,sans-serif"></div><div id="crossTime" style="position:absolute;bottom:2px;z-index:9;display:none;background:#10171b;border:1px solid #3a4a52;color:#cbd5da;padding:3px 6px;font:800 8px Inter,sans-serif"></div><div id="feed" class="feed">Loading market data…</div><div id="tag" class="tag"></div><div class="legend">21 SMMA · 200 EMA · VRVP POC</div></div></div><script>const KEY='w3bcShowStateV1',API='https://api.binance.com/api/v3/klines',FORWARD_BARS=30;let candles=[],tool='trend',drawing=false,current=null,strokes=[],showVRVP=true,showSMMA=true,showEMA=true;const $=id=>document.getElementById(id),base=$('base'),draw=$('draw'),chart=$('chart'),g=base.getContext('2d'),dg=draw.getContext('2d');function market(){try{return JSON.parse(localStorage.getItem(KEY)||'{}').market||{}}catch(e){return{}}}function sym(){let x=String(market().symbol||market().display||'BTCUSDT').toUpperCase().replace(/[-/]/g,'');return x.endsWith('USDT')?x:x+'USDT'}function tf(){let x=market().timeframe||'15m';return x==='1D'?'1d':x}function fmt(v){v=+v;return isFinite(v)?v.toLocaleString(undefined,{maximumFractionDigits:v<1?6:2}):'—'}function k(){return'w3bcLiveDraw:'+sym()+':'+tf()}function save(){localStorage.setItem(k(),JSON.stringify(strokes))}function loadDraw(){try{strokes=JSON.parse(localStorage.getItem(k())||'[]')}catch(e){strokes=[]}paintDraw()}function smma(a,n){let o=Array(a.length).fill(null);if(a.length<n)return o;let v=a.slice(0,n).reduce((x,y)=>x+y,0)/n;o[n-1]=v;for(let i=n;i<a.length;i++){v=(v*(n-1)+a[i])/n;o[i]=v}return o}function ema(a,n){let o=Array(a.length).fill(null);if(a.length<n)return o;let v=a.slice(0,n).reduce((x,y)=>x+y,0)/n,q=2/(n+1);o[n-1]=v;for(let i=n;i<a.length;i++){v=(a[i]-v)*q+v;o[i]=v}return o}async function load(){let s=sym(),t=tf();$('symbol').textContent=s.replace('USDT','/USDT');$('tfLabel').textContent=t+' · W3BC TA CHART';$('feed').textContent='Loading market data…';try{let u=new URL(API);u.searchParams.set('symbol',s);u.searchParams.set('interval',t);u.searchParams.set('limit','500');let r=await fetch(u,{cache:'no-store'}),a=await r.json();if(!r.ok||!Array.isArray(a))throw Error(a.msg||'feed unavailable');candles=a.map(x=>({time:+x[0],open:+x[1],high:+x[2],low:+x[3],close:+x[4],volume:+x[7]}));let z=candles.at(-1),f=candles[Math.max(0,candles.length-120)],chg=(z.close-f.open)/f.open*100;$('price').textContent='$'+fmt(z.close);$('change').textContent=(chg>=0?'+':'')+chg.toFixed(2)+'%';$('change').className='change '+(chg>=0?'up':'down');$('feed').textContent=`Live candles · ${candles.length} bars · O ${fmt(z.open)} H ${fmt(z.high)} L ${fmt(z.low)} C ${fmt(z.close)}`;render()}catch(e){$('feed').textContent='Market data unavailable for '+s;candles=[];render()}loadDraw()}function profile(d,n=30){let lo=Math.min(...d.map(x=>x.low)),hi=Math.max(...d.map(x=>x.high)),step=(hi-lo)/n||1,v=Array(n).fill(0);d.forEach(c=>{let a=Math.max(0,Math.floor((c.low-lo)/step)),b=Math.min(n-1,Math.floor((c.high-lo)/step)),q=c.volume/Math.max(1,b-a+1);for(let i=a;i<=b;i++)v[i]+=q});let p=v.indexOf(Math.max(...v));return{lo,step,v,p,max:Math.max(...v,1),price:lo+(p+.5)*step}}function resize(){let r=chart.getBoundingClientRect(),d=devicePixelRatio||1;[base,draw].forEach(c=>{c.width=r.width*d;c.height=r.height*d});g.setTransform(d,0,0,d,0,0);dg.setTransform(d,0,0,d,0,0);render();paintDraw()}function render(){let r=chart.getBoundingClientRect(),W=r.width,H=r.height;g.clearRect(0,0,W,H);if(!candles.length)return;let d=candles.slice(-180),start=candles.length-d.length,c=candles.map(x=>x.close),S=smma(c,21).slice(start),E=ema(c,200).slice(start),lo=Math.min(...d.map(x=>x.low)),hi=Math.max(...d.map(x=>x.high)),pad=(hi-lo||1)*.08;lo-=pad;hi+=pad;let L=12,R=74,T=16,B=28,pw=W-L-R,ph=H-T-B,totalSlots=d.length+FORWARD_BARS,slot=pw/totalSlots,candleEnd=L+d.length*slot,x=i=>L+(i+.5)*slot,y=v=>T+(hi-v)/(hi-lo)*ph;chartGeom={L,R,T,B,pw,ph,slot,candleEnd,lo,hi,d};g.strokeStyle='rgba(90,110,120,.16)';g.fillStyle='#758188';g.font='9px sans-serif';for(let i=0;i<=5;i++){let yy=T+i*ph/5;g.beginPath();g.moveTo(L,yy);g.lineTo(L+pw,yy);g.stroke();g.fillText(fmt(hi-i*(hi-lo)/5),L+pw+7,yy+3)}let bw=Math.max(2,Math.min(8,slot*.62));d.forEach((c,i)=>{let xx=x(i),yo=y(c.open),yc=y(c.close),col=c.close>=c.open?'#42d9a0':'#ff6c76';g.strokeStyle=g.fillStyle=col;g.beginPath();g.moveTo(xx,y(c.high));g.lineTo(xx,y(c.low));g.stroke();g.fillRect(xx-bw/2,Math.min(yo,yc),bw,Math.max(1,Math.abs(yc-yo)))});function curve(a,col){g.strokeStyle=col;g.lineWidth=2;g.beginPath();let on=false;a.forEach((v,i)=>{if(!isFinite(v))return;if(!on){g.moveTo(x(i),y(v));on=true}else g.lineTo(x(i),y(v))});if(on)g.stroke()}if(showSMMA)curve(S,'#22d3e5');if(showEMA)curve(E,'#a98cff');let P=profile(d);$('tag').textContent=showVRVP?'VRVP POC '+fmt(P.price):'';if(showVRVP){let profileZone=Math.max(70,(L+pw)-candleEnd-8),mw=Math.min(150,profileZone),bh=ph/P.v.length,bx=L+pw;P.v.forEach((v,i)=>{let w=v/P.max*mw,yy=y(P.lo+(i+.5)*P.step)-bh/2;g.fillStyle=i===P.p?'rgba(255,209,102,.55)':'rgba(34,211,229,.18)';g.fillRect(bx-w,yy,w,Math.max(2,bh-1))});g.strokeStyle='#ffd166';g.setLineDash([5,5]);g.beginPath();g.moveTo(L,y(P.price));g.lineTo(L+pw,y(P.price));g.stroke();g.setLineDash([])}}function pt(e){let r=draw.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height}}let chartGeom=null;function paintDraw(){let r=chart.getBoundingClientRect(),W=r.width,H=r.height;dg.clearRect(0,0,W,H);dg.lineCap='round';for(const s of strokes){if(!s.points?.length)continue;dg.globalCompositeOperation=s.tool==='eraser'?'destination-out':'source-over';dg.strokeStyle=s.color;dg.lineWidth=s.tool==='eraser'?24:3;dg.beginPath();if(s.tool==='trend'){let a=s.points[0],b=s.points.at(-1);dg.moveTo(a.x*W,a.y*H);dg.lineTo(b.x*W,b.y*H)}else s.points.forEach((p,i)=>i?dg.lineTo(p.x*W,p.y*H):dg.moveTo(p.x*W,p.y*H));dg.stroke()}dg.globalCompositeOperation='source-over'}function hideCross(){const a=$('crosshair'),b=$('crossPrice'),t=$('crossTime');if(a)a.style.display='none';if(b)b.style.display='none';if(t)t.style.display='none'}function showCross(e){if(drawing||!chartGeom)return;let r=draw.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top,{L,T,pw,ph,lo,hi,slot,d}=chartGeom;if(mx<L||mx>L+pw||my<T||my>T+ph){hideCross();return}let price=hi-((my-T)/ph)*(hi-lo),idx=Math.max(0,Math.min(d.length-1,Math.floor((mx-L)/slot))),candle=d[idx],cx=L+(idx+.5)*slot,cy=my,box=$('crosshair');box.style.display='block';box.innerHTML='<div style="position:absolute;left:'+cx+'px;top:'+T+'px;width:1px;height:'+ph+'px;background:rgba(255,255,255,.28)"></div><div style="position:absolute;left:'+L+'px;top:'+cy+'px;width:'+pw+'px;height:1px;background:rgba(255,255,255,.28)"></div>';let p=$('crossPrice');p.style.display='block';p.style.top=Math.max(T,Math.min(T+ph-20,cy-10))+'px';p.textContent='$'+fmt(price);let tm=$('crossTime');tm.style.display='block';tm.style.left=Math.max(L,Math.min(L+pw-92,cx-45))+'px';tm.textContent=candle?new Date(candle.time).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):''}draw.addEventListener('pointermove',showCross);draw.addEventListener('pointerleave',hideCross);draw.onpointerdown=e=>{hideCross();drawing=true;let p=pt(e);current={tool,color:$('drawColor').value,points:[p,p]};strokes.push(current)};draw.onpointermove=e=>{if(!drawing)return;let p=pt(e);tool==='trend'?current.points[current.points.length-1]=p:current.points.push(p);paintDraw()};draw.onpointerup=()=>{drawing=false;current=null;save()};document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('active',x===b))});$('undo').onclick=()=>{strokes.pop();save();paintDraw()};$('clear').onclick=()=>{strokes=[];save();paintDraw()};$('vrvp').onclick=()=>{showVRVP=!showVRVP;$('vrvp').classList.toggle('active',showVRVP);render()};$('smma').onclick=()=>{showSMMA=!showSMMA;$('smma').classList.toggle('active',showSMMA);render()};$('ema').onclick=()=>{showEMA=!showEMA;$('ema').classList.toggle('active',showEMA);render()};let sig='';function check(){let n=sym()+'|'+tf();if(n!==sig){sig=n;load()}}addEventListener('storage',e=>{if(e.key===KEY)check()});new BroadcastChannel('w3bc-show').onmessage=check;addEventListener('resize',resize);requestAnimationFrame(resize);check();setInterval(()=>candles.length&&load(),30000);</script></body></html>
