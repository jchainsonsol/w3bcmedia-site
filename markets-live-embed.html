<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>W3BC Markets Live</title><style>:root{--c:#22d3e5;--g:#42d9a0;--r:#ff6c76;--p:#a98cff;--y:#ffd166;--bg:#06090b;--l:#243037}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{height:100%;display:grid;grid-template-rows:58px 38px 1fr}.top{display:flex;align-items:center;gap:16px;padding:0 20px;border-bottom:1px solid var(--l);background:#070b0d}.symbol{font-size:21px;font-weight:950}.price{font-size:19px;font-weight:900}.change{font-size:10px;font-weight:900}.up{color:var(--g)}.down{color:var(--r)}.meta{margin-left:auto;text-align:right;color:#77858c;font-size:8px;line-height:1.35}.statusDot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#56646b;margin-right:5px}.statusDot.on{background:var(--g);box-shadow:0 0 8px var(--g)}.bar{display:flex;align-items:center;gap:5px;padding:4px 12px;border-bottom:1px solid #202b31;background:#080c0e;white-space:nowrap}.b{height:28px;border:1px solid #344149;background:#090d10;color:#fff;padding:0 9px;font-size:8px;font-weight:900;cursor:pointer}.b.active,.b:hover{border-color:var(--c);color:var(--c);background:rgba(34,211,229,.08)}.sep{width:1px;height:22px;background:#28333a;margin:0 2px}.spacer{flex:1}.color{width:30px;height:28px;padding:1px;border:1px solid #344149;background:#090d10}.chart{position:relative;min-height:0;background:#06090b}.base,.draw{position:absolute;inset:0;width:100%;height:100%}.draw{z-index:6;touch-action:none}.legend{position:absolute;right:12px;bottom:8px;z-index:8;display:flex;gap:12px;color:#8c989e;font-size:7px;pointer-events:none}.legend i{display:inline-block;width:13px;height:2px;margin-right:5px;vertical-align:middle}.legend .s i{background:var(--c)}.legend .e i{background:var(--p)}.legend .v i{background:var(--y)}.feed{position:absolute;left:12px;top:9px;z-index:8;color:#718087;font-size:8px;pointer-events:none}.err{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:9;border:1px solid #70323b;background:#180a0d;color:#ff9da6;padding:10px 14px;font-size:9px;display:none}.badge{border:1px solid #334049;padding:3px 5px;color:#8e9ba1;font-size:7px;font-weight:900}.badge.live{border-color:#28624a;color:#7eeab2}.profileTag{position:absolute;right:12px;top:10px;z-index:8;color:var(--y);font-size:7px;font-weight:900;pointer-events:none}</style></head><body><div class="app"><div class="top"><div id="symbol" class="symbol">BTC/USDT</div><div id="price" class="price">—</div><div id="change" class="change">LIVE</div><div class="meta"><span id="dot" class="statusDot"></span><span id="source">BITUNIX</span><br><span id="tfLabel">15m · W3BC TA CHART</span></div></div><div class="bar"><button class="b active" data-tool="trend">╱ LINE</button><button class="b" data-tool="marker">✎ MARKER</button><button class="b" data-tool="eraser">⌫ ERASE</button><input id="drawColor" class="color" type="color" value="#22d3e5"><button id="undo" class="b">UNDO</button><button id="clear" class="b">CLEAR</button><span class="sep"></span><button id="vrvp" class="b active">VRVP</button><button id="smma" class="b active">21 SMMA</button><button id="ema" class="b active">200 EMA</button><span class="spacer"></span><span id="stockBadge" class="badge" style="display:none"></span><span id="feedBadge" class="badge live">BITUNIX</span></div><div id="chart" class="chart"><canvas id="base" class="base"></canvas><canvas id="draw" class="draw"></canvas><div id="feed" class="feed">Loading Bitunix candles…</div><div id="profileTag" class="profileTag"></div><div id="err" class="err"></div><div class="legend"><span class="s"><i></i>21 SMMA</span><span class="e"><i></i>200 EMA</span><span class="v"><i></i>VRVP POC</span></div></div></div><script>const KEY='w3bcShowStateV1',FAPI='https://fapi.bitunix.com/api/v1/futures/market/kline';let state={},candles=[],tool='trend',drawing=false,current=null,strokes=[],showVRVP=true,showSMMA=true,showEMA=true,sourceName='BITUNIX';const $=id=>document.getElementById(id),base=$('base'),draw=$('draw'),chart=$('chart'),g=base.getContext('2d'),dg=draw.getContext('2d');function read(){try{state=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){state={}}return state}function market(){return read().market||{}}function normalized(){let m=market(),raw=String(m.symbol||m.display||'BTCUSDT').toUpperCase().replace(/[-/]/g,'');if(!raw.endsWith('USDT'))raw+='USDT';return raw}function tf(){return market().timeframe||'15m'}function fmt(v){v=+v;if(!isFinite(v))return'—';return v.toLocaleString(undefined,{maximumFractionDigits:v<1?6:2})}function key(){return'w3bcLiveDraw:'+normalized()+':'+tf()}function saveDraw(){localStorage.setItem(key(),JSON.stringify(strokes))}function loadDraw(){try{strokes=JSON.parse(localStorage.getItem(key())||'[]')}catch(e){strokes=[]}paintDraw()}function smmaSeries(values,n){let o=Array(values.length).fill(null);if(values.length<n)return o;let v=values.slice(0,n).reduce((a,b)=>a+b,0)/n;o[n-1]=v;for(let i=n;i<values.length;i++){v=(v*(n-1)+values[i])/n;o[i]=v}return o}function emaSeries(values,n){let o=Array(values.length).fill(null);if(values.length<n)return o;let v=values.slice(0,n).reduce((a,b)=>a+b,0)/n,k=2/(n+1);o[n-1]=v;for(let i=n;i<values.length;i++){v=(values[i]-v)*k+v;o[i]=v}return o}async function page(symbol,interval,endTime){let u=new URL(FAPI);u.searchParams.set('symbol',symbol);u.searchParams.set('interval',interval);u.searchParams.set('limit','200');u.searchParams.set('type','LAST_PRICE');if(endTime)u.searchParams.set('endTime',String(endTime));let r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let j=await r.json();if(j.code!==0||!Array.isArray(j.data))throw Error(j.msg||'No Bitunix data');return j.data}async function load(){let sym=normalized(),interval=tf();$('feed').textContent='Loading Bitunix candles…';$('err').style.display='none';$('dot').classList.remove('on');try{let a=await page(sym,interval),earliest=Math.min(...a.map(x=>+x.time).filter(isFinite)),b=[];if(isFinite(earliest))try{b=await page(sym,interval,earliest-1)}catch(e){}let map=new Map([...b,...a].map(x=>[+x.time,x]));candles=[...map.entries()].sort((x,y)=>x[0]-y[0]).map(([time,x])=>({time,open:+x.open,high:+x.high,low:+x.low,close:+x.close,volume:+(x.quoteVol||x.baseVol||0)})).filter(x=>[x.open,x.high,x.low,x.close].every(isFinite));if(candles.length<20)throw Error('Not enough candles');sourceName='BITUNIX';$('dot').classList.add('on');$('source').textContent='POWERED BY BITUNIX';$('feedBadge').textContent='BITUNIX';$('feedBadge').classList.add('live');let last=candles.at(-1),first=candles[Math.max(0,candles.length-120)],chg=(last.close-first.open)/first.open*100;$('price').textContent='$'+fmt(last.close);$('change').textContent=(chg>=0?'+':'')+chg.toFixed(2)+'%';$('change').className='change '+(chg>=0?'up':'down');$('feed').textContent=`Live candles · ${candles.length} bars · O ${fmt(last.open)} H ${fmt(last.high)} L ${fmt(last.low)} C ${fmt(last.close)}`;let m=market(),isStock=/^(AAPL|NVDA|TSLA|COIN|HOOD|QQQ)/.test(sym);$('stockBadge').style.display=isStock?'inline-block':'none';$('stockBadge').textContent=isStock?'STOCK PERP · xSTOCK REFERENCE':'';render()}catch(e){$('err').textContent='BITUNIX FEED ERROR · '+e.message;$('err').style.display='block';$('feed').textContent='Bitunix market feed unavailable';$('feedBadge').classList.remove('live');candles=[];render()}updateLabels();loadDraw()}function updateLabels(){let sym=normalized();$('symbol').textContent=sym.replace('USDT','/USDT');$('tfLabel').textContent=tf()+' · W3BC TA CHART'}function profile(data,bins=30){let lo=Math.min(...data.map(x=>x.low)),hi=Math.max(...data.map(x=>x.high)),step=(hi-lo)/bins||1,vol=Array(bins).fill(0);data.forEach(c=>{let a=Math.max(0,Math.floor((c.low-lo)/step)),b=Math.min(bins-1,Math.floor((c.high-lo)/step)),share=(c.volume||0)/Math.max(1,b-a+1);for(let i=a;i<=b;i++)vol[i]+=share});let poc=0;for(let i=1;i<bins;i++)if(vol[i]>vol[poc])poc=i;return{lo,hi,step,vol,poc,max:Math.max(...vol,1),pocPrice:lo+(poc+.5)*step}}function resize(){let r=chart.getBoundingClientRect(),d=devicePixelRatio||1;for(const c of [base,draw]){c.width=Math.max(1,Math.round(r.width*d));c.height=Math.max(1,Math.round(r.height*d));c.style.width=r.width+'px';c.style.height=r.height+'px'}g.setTransform(d,0,0,d,0,0);dg.setTransform(d,0,0,d,0,0);render();paintDraw()}function render(){let r=chart.getBoundingClientRect(),W=r.width,H=r.height;g.clearRect(0,0,W,H);if(!candles.length)return;let data=candles.slice(-180),start=candles.length-data.length,cl=candles.map(x=>x.close),S=smmaSeries(cl,21),E=emaSeries(cl,200),sv=S.slice(start),ev=E.slice(start),lo=Math.min(...data.map(x=>x.low)),hi=Math.max(...data.map(x=>x.high));if(showSMMA){let q=sv.filter(isFinite);if(q.length){lo=Math.min(lo,...q);hi=Math.max(hi,...q)}}if(showEMA){let q=ev.filter(isFinite);if(q.length){lo=Math.min(lo,...q);hi=Math.max(hi,...q)}}let pad=(hi-lo||1)*.08;lo-=pad;hi+=pad;let L=12,R=74,T=16,B=28,pw=W-L-R,ph=H-T-B,x=i=>L+(i+.5)*pw/data.length,y=v=>T+(hi-v)/(hi-lo)*ph;g.strokeStyle='rgba(90,110,120,.16)';g.fillStyle='#758188';g.font='9px sans-serif';for(let i=0;i<=5;i++){let yy=T+i*ph/5;g.beginPath();g.moveTo(L,yy);g.lineTo(L+pw,yy);g.stroke();g.fillText(fmt(hi-i*(hi-lo)/5),L+pw+7,yy+3)}let bw=Math.max(2,Math.min(8,pw/data.length*.62));data.forEach((c,i)=>{let xx=x(i),yo=y(c.open),yc=y(c.close),yh=y(c.high),yl=y(c.low),col=c.close>=c.open?'#42d9a0':'#ff6c76';g.strokeStyle=g.fillStyle=col;g.beginPath();g.moveTo(xx,yh);g.lineTo(xx,yl);g.stroke();g.fillRect(xx-bw/2,Math.min(yo,yc),bw,Math.max(1,Math.abs(yc-yo)))});function curve(vals,col){g.strokeStyle=col;g.lineWidth=2;g.beginPath();let on=false;vals.forEach((v,i)=>{if(!isFinite(v))return;let xx=x(i),yy=y(v);if(!on){g.moveTo(xx,yy);on=true}else g.lineTo(xx,yy)});if(on)g.stroke()}if(showSMMA)curve(sv,'#22d3e5');if(showEMA)curve(ev,'#a98cff');let P=profile(data);$('profileTag').textContent=showVRVP?'VRVP POC '+fmt(P.pocPrice):'';if(showVRVP){let maxW=Math.min(150,W*.18),bh=ph/P.vol.length,baseX=L+pw;P.vol.forEach((v,i)=>{let w=v/P.max*maxW,price=P.lo+(i+.5)*P.step,yy=y(price)-bh/2;g.fillStyle=i===P.poc?'rgba(255,209,102,.55)':'rgba(34,211,229,.18)';g.fillRect(baseX-w,yy,w,Math.max(2,bh-1))});g.strokeStyle='#ffd166';g.setLineDash([5,5]);g.beginPath();g.moveTo(L,y(P.pocPrice));g.lineTo(L+pw,y(P.pocPrice));g.stroke();g.setLineDash([])}}function pt(e){let r=draw.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height}}function paintDraw(){let r=chart.getBoundingClientRect(),W=r.width,H=r.height;dg.clearRect(0,0,W,H);dg.lineCap='round';dg.lineJoin='round';for(const s of strokes){if(!s.points?.length)continue;dg.globalCompositeOperation=s.tool==='eraser'?'destination-out':'source-over';dg.strokeStyle=s.color||'#22d3e5';dg.lineWidth=s.tool==='eraser'?24:3;dg.beginPath();if(s.tool==='trend'&&s.points.length>=2){let a=s.points[0],b=s.points.at(-1);dg.moveTo(a.x*W,a.y*H);dg.lineTo(b.x*W,b.y*H)}else{s.points.forEach((p,i)=>i?dg.lineTo(p.x*W,p.y*H):dg.moveTo(p.x*W,p.y*H))}dg.stroke()}dg.globalCompositeOperation='source-over'}draw.onpointerdown=e=>{drawing=true;draw.setPointerCapture(e.pointerId);let p=pt(e);current={tool,color:$('drawColor').value,points:[p,p]};strokes.push(current);paintDraw()};draw.onpointermove=e=>{if(!drawing||!current)return;let p=pt(e);if(tool==='trend')current.points[current.points.length-1]=p;else current.points.push(p);paintDraw()};draw.onpointerup=e=>{if(!drawing)return;drawing=false;current=null;saveDraw()};document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('active',x===b));draw.style.cursor=tool==='eraser'?'cell':'crosshair'});$('undo').onclick=()=>{strokes.pop();saveDraw();paintDraw()};$('clear').onclick=()=>{strokes=[];saveDraw();paintDraw()};$('vrvp').onclick=()=>{showVRVP=!showVRVP;$('vrvp').classList.toggle('active',showVRVP);render()};$('smma').onclick=()=>{showSMMA=!showSMMA;$('smma').classList.toggle('active',showSMMA);render()};$('ema').onclick=()=>{showEMA=!showEMA;$('ema').classList.toggle('active',showEMA);render()};let sig='';function check(){let n=normalized()+'|'+tf();if(n!==sig){sig=n;load()}}window.addEventListener('storage',e=>{if(e.key===KEY)check()});new BroadcastChannel('w3bc-show').onmessage=()=>check();window.addEventListener('resize',resize);read();updateLabels();requestAnimationFrame(resize);check();setInterval(()=>{if(candles.length)load()},30000);</script></body></html>
