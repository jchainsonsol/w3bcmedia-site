<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>W3BC Broadcast Output</title><style>
:root{--cyan:#22d3e5;--cyan2:#8cedf5;--line:#2b363d;--muted:#93a0a7;--green:#56e3a2}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff}.frame{position:absolute;inset:0;background:linear-gradient(135deg,rgba(4,7,9,.98),rgba(5,9,12,.95));border:2px solid #1b252b;display:grid;grid-template-columns:minmax(0,1fr) 390px;grid-template-rows:78px minmax(0,1fr) 96px}.header{grid-column:1/3;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:rgba(5,8,10,.95)}.brand{display:flex;align-items:center;gap:15px}.brand img{width:76px;height:56px;object-fit:contain}.brand b{font-size:20px;letter-spacing:.12em}.brand span{display:block;color:#75828a;font-size:9px;letter-spacing:.2em;text-transform:uppercase;margin-top:4px}.live{display:flex;align-items:center;gap:16px;font-size:11px;color:#b9c1c6;letter-spacing:.08em}.live b{border:1px solid #7a292d;color:#ff7479;padding:7px 10px}.main{grid-column:1;grid-row:2;min-width:0;position:relative;overflow:hidden;background:radial-gradient(circle at 68% 42%,rgba(34,211,229,.12),transparent 36%),#05080a}.story{height:100%;display:grid;grid-template-columns:1.03fr .97fr}.copy{padding:5.5vh 3.3vw 3vh;display:flex;flex-direction:column;justify-content:center;position:relative;z-index:2}.kicker{font-size:11px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan)}h1{font-size:clamp(44px,4.6vw,78px);line-height:.92;letter-spacing:-.055em;margin:17px 0 20px;max-width:780px}.summary{font-size:clamp(14px,1.25vw,20px);line-height:1.5;color:#b7c0c5;max-width:760px}.key{border-left:3px solid var(--cyan);padding-left:15px;margin-top:25px;max-width:700px}.key b{display:block;color:var(--cyan2);font-size:10px;letter-spacing:.13em;text-transform:uppercase;margin-bottom:6px}.key span{font-size:clamp(17px,1.55vw,25px);line-height:1.25;font-weight:750}.art{display:flex;align-items:center;justify-content:center;padding:2.5vw;min-width:0}.art svg{width:95%;height:95%}.right{grid-column:2;grid-row:2;border-left:1px solid var(--line);display:grid;grid-template-rows:minmax(0,1fr) 250px;background:rgba(8,12,14,.97)}.rundown{overflow:hidden}.rhead{height:48px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);font-size:11px;font-weight:900;letter-spacing:.13em;color:var(--cyan)}.rrow{min-height:60px;padding:8px 13px;display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;border-bottom:1px solid #242d32}.rrow .n{width:30px;height:30px;border:1px solid #3b474e;display:grid;place-items:center;font-size:12px;font-weight:900}.rrow strong{display:block;font-size:11px;line-height:1.1}.rrow span{display:block;color:#7f8b92;font-size:9px;margin-top:4px}.rrow.active{background:linear-gradient(90deg,var(--cyan),#1db4c3);color:#041013}.rrow.active .n{border-color:#061013}.rrow.active span{color:#143b40}.rrow.done{opacity:.45}.camera{border-top:1px solid var(--line);position:relative;background:transparent}.camera:before{content:"CAMERA";position:absolute;inset:8px 8px 38px;border:1px solid var(--cyan);display:grid;place-items:center;color:rgba(34,211,229,.28);font-size:14px;font-weight:900;letter-spacing:.18em;z-index:1}.camlabel{position:absolute;left:8px;right:8px;bottom:5px;height:32px;border:1px solid #2c373e;background:rgba(7,11,13,.95);display:flex;align-items:center;justify-content:space-between;padding:0 12px;z-index:2}.camlabel b{font-size:14px;letter-spacing:.08em}.camlabel span{font-size:10px;color:var(--cyan)}.footer{grid-column:1/3;grid-row:3;border-top:1px solid var(--line);display:grid;grid-template-columns:250px repeat(4,1fr);background:#080b0d}.signal{padding:14px 20px;border-right:1px solid var(--line);display:flex;align-items:center;gap:12px}.signal .bull{font-size:30px}.signal b{font-size:13px;color:var(--cyan);letter-spacing:.08em}.signal span{display:block;font-size:9px;color:var(--green);font-weight:900;margin-top:4px}.metric{border-right:1px solid var(--line);padding:13px 18px}.metric label{display:block;color:#89959c;font-size:8px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.metric strong{display:block;color:var(--cyan);font-size:22px;margin-top:4px}.metric span{font-size:9px;color:#c1c8cc}.layout-full-story .story{grid-template-columns:.82fr 1.18fr}.layout-full-story .copy{padding-left:3vw}.layout-host-full .art{opacity:.18}.layout-host-full .copy{grid-column:1/3;max-width:80%}.layout-data h1{font-size:clamp(40px,4vw,68px)}.layout-data .art{transform:scale(1.05)}.preview .camera:before{content:"TRANSPARENT CAMERA AREA"}
@media(max-width:1200px){.frame{grid-template-columns:minmax(0,1fr) 320px}.right{grid-template-rows:minmax(0,1fr) 210px}.rrow{min-height:52px}.footer{grid-template-columns:210px repeat(4,1fr)}}
</style></head><body><div class="frame" id="frame"><header class="header"><div class="brand"><img src="assets/w3bc-logo-white.png" alt="W3BC"><div><b>W3BC NEWS DESK</b><span>Independent intelligence for what matters</span></div></div><div class="live"><b>● LIVE</b><span id="clock"></span></div></header><main class="main"><div class="story"><div class="copy"><div class="kicker" id="kicker"></div><h1 id="title"></h1><div class="summary" id="summary"></div><div class="key"><b>Why it matters</b><span id="key"></span></div></div><div class="art" id="art"></div></div></main><aside class="right"><div class="rundown"><div class="rhead"><span>RUNDOWN</span><span id="count"></span></div><div id="rows"></div></div><div class="camera"><div class="camlabel"><b>J CHAINS</b><span>@JCHAINS</span></div></div></aside><footer class="footer"><div class="signal"><div class="bull">◈</div><div><b>W3BC SIGNAL</b><span>DESK LIVE</span></div></div><div class="metric"><label>RWA Utilization</label><strong>11.5%</strong><span>Onchain usage</span></div><div class="metric"><label>RWA in DeFi</label><strong>$3.98B</strong><span>Reported deposits</span></div><div class="metric"><label>Tokenized Equities</label><strong>~$2.8B</strong><span>Reported market cap</span></div><div class="metric"><label>News Desk</label><strong id="footSegment">01 / 07</strong><span>Current segment</span></div></footer></div><script>
const KEY='w3bcBroadcastStateV1';const channel=new BroadcastChannel('w3bc-newsdesk');const preview=new URLSearchParams(location.search).has('preview');if(preview)document.body.classList.add('preview');let state;function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}function art(type){const c=`stroke="#22d3e5" fill="none" stroke-width="2"`;if(type==='network')return `<svg viewBox="0 0 520 420"><circle cx="270" cy="210" r="155" fill="#22d3e5" opacity=".035"/><g ${c} opacity=".85"><circle cx="260" cy="210" r="120"/><circle cx="260" cy="210" r="70"/><path d="M70 90L190 170 330 100 440 205 345 310 190 295 70 90Z"/><path d="M190 170L190 295M330 100L345 310M440 205L260 210M70 90L260 210"/></g><g fill="#8cedf5"><circle cx="70" cy="90" r="7"/><circle cx="190" cy="170" r="7"/><circle cx="330" cy="100" r="7"/><circle cx="440" cy="205" r="7"/><circle cx="345" cy="310" r="7"/><circle cx="190" cy="295" r="7"/><circle cx="260" cy="210" r="10"/></g></svg>`;if(type==='rwa')return `<svg viewBox="0 0 520 420"><text x="65" y="70" fill="#8cedf5" font-size="42" font-weight="900">$3.98B</text><text x="67" y="96" fill="#75828a" font-size="13">ACTIVE RWA IN DEFI</text><g ${c}><path d="M65 335H465"/><rect x="105" y="260" width="52" height="75"/><rect x="205" y="205" width="52" height="130"/><rect x="305" y="140" width="52" height="195"/><rect x="405" y="80" width="52" height="255"/><path d="M85 270C170 240 235 195 310 145S410 90 465 62"/></g></svg>`;if(type==='japan')return `<svg viewBox="0 0 520 420"><circle cx="365" cy="105" r="70" fill="#22d3e5" opacity=".12"/><g ${c}><rect x="70" y="150" width="300" height="155" rx="8"/><path d="M105 190H330M105 225H275M105 260H305"/><path d="M385 285c28-52 48-95 65-170"/></g><text x="80" y="120" fill="#8cedf5" font-size="34" font-weight="900">JGB</text></svg>`;if(type==='institution')return `<svg viewBox="0 0 520 420"><g ${c}><path d="M105 310H415M140 310V185M215 310V185M290 310V185M365 310V185M115 185H395L255 90Z"/><path d="M90 335H430"/></g><text x="170" y="375" fill="#8cedf5" font-size="36" font-weight="900">$52M</text></svg>`;if(type==='equity')return `<svg viewBox="0 0 520 420"><text x="70" y="90" fill="#8cedf5" font-size="48" font-weight="900">15%</text><g ${c}><path d="M70 330H455M90 290L160 250 220 265 290 175 350 205 440 105"/><path d="M440 105v70M370 105h70"/></g></svg>`;if(type==='bitcoin')return `<svg viewBox="0 0 520 420"><circle cx="255" cy="195" r="120" fill="none" stroke="#22d3e5" stroke-width="2"/><text x="195" y="235" fill="#8cedf5" font-size="120" font-weight="900">₿</text><path d="M80 340L150 300 220 315 290 245 360 270 450 185" ${c}/></svg>`;if(type==='sports')return `<svg viewBox="0 0 520 420"><g ${c}><circle cx="260" cy="205" r="120"/><path d="M140 205H380M260 85V325M175 120c55 45 115 45 170 0M175 290c55-45 115-45 170 0"/></g><text x="160" y="375" fill="#8cedf5" font-size="28" font-weight="900">SPORTS DESK</text></svg>`;if(type==='betting')return `<svg viewBox="0 0 520 420"><g ${c}><rect x="75" y="105" width="370" height="210" rx="12"/><path d="M105 160H415M105 215H415M105 270H415"/></g><text x="105" y="145" fill="#8cedf5" font-size="22" font-weight="900">LINES + MOVEMENT</text><text x="115" y="205" fill="#fff" font-size="26">-110</text><text x="275" y="205" fill="#8cedf5" font-size="26">+3.5</text><text x="115" y="260" fill="#fff" font-size="26">O/U</text><text x="275" y="260" fill="#8cedf5" font-size="26">47.5</text></svg>`;if(type==='world')return `<svg viewBox="0 0 520 420"><g ${c}><circle cx="260" cy="205" r="135"/><ellipse cx="260" cy="205" rx="65" ry="135"/><path d="M125 205H395M145 145H375M145 265H375"/></g><circle cx="330" cy="145" r="9" fill="#8cedf5"/><circle cx="205" cy="250" r="7" fill="#8cedf5"/></svg>`;if(type==='ai')return `<svg viewBox="0 0 520 420"><g ${c}><rect x="150" y="95" width="220" height="220" rx="22"/><path d="M205 95V55M260 95V55M315 95V55M205 355V315M260 355V315M315 355V315M150 150H110M150 205H110M150 260H110M410 150H370M410 205H370M410 260H370"/><circle cx="260" cy="205" r="70"/><path d="M215 205H305M260 160V250"/></g></svg>`;return `<svg viewBox="0 0 520 420"><g ${c}><circle cx="180" cy="210" r="95"/><circle cx="340" cy="210" r="95"/></g><text x="145" y="245" fill="#8cedf5" font-size="100" font-weight="900">$</text><text x="305" y="245" fill="#8cedf5" font-size="100" font-weight="900">$</text></svg>`}
function paint(){if(!state||!state.stories)return;const s=state.stories[state.current];frame.className='frame layout-'+s.layout;kicker.textContent=s.kicker;title.textContent=s.title;summary.textContent=s.summary;key.textContent=s.key;artEl.innerHTML=art(s.type);count.textContent=`${state.current+1} OF ${state.stories.length}`;footSegment.textContent=`${String(state.current+1).padStart(2,'0')} / ${String(state.stories.length).padStart(2,'0')}`;rows.innerHTML=state.stories.map((x,i)=>`<div class="rrow ${i===state.current?'active':''} ${i<state.current?'done':''}"><div class="n">${i+1}</div><div><strong>${x.kicker.replace(/Lead Story · /,'')}</strong><span>${i===state.current?'NOW':i<state.current?'COMPLETE':'UP NEXT'}</span></div></div>`).join('')}
const artEl=document.getElementById('art');state=load();paint();channel.onmessage=e=>{if(e.data?.type==='state'){state=e.data.state;paint()}};channel.postMessage({type:'hello'});window.addEventListener('storage',e=>{if(e.key===KEY){state=load();paint()}});function tick(){const d=new Date();clock.textContent=d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}).toUpperCase()+'  |  '+d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}tick();setInterval(tick,15000);
</script></body></html>
