<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Load Latest W3BC Show</title><style>html,body{margin:0;background:#05080a;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;height:100%}.wrap{height:100%;display:grid;place-items:center}.card{width:min(560px,92vw);border:1px solid #2a3940;background:#0b1114;padding:28px}.ey{color:#22d3e5;font-size:11px;font-weight:900;letter-spacing:.12em}.title{font-size:28px;font-weight:950;margin:8px 0 6px}.sub{color:#8b989e;font-size:12px;line-height:1.4}.ok{color:#42d9a0}.bad{color:#ff6c76}.bar{height:6px;background:#182126;margin-top:18px;overflow:hidden}.fill{height:100%;width:20%;background:#22d3e5;animation:p 1s linear infinite}@keyframes p{from{transform:translateX(-120%)}to{transform:translateX(600%)}}</style></head><body><div class="wrap"><div class="card"><div class="ey">W3BC SHOW LOADER</div><div class="title" id="title">Loading latest show…</div><div class="sub" id="sub">Fetching current package and replacing stale browser state.</div><div class="bar"><div class="fill"></div></div></div></div><script>(async()=>{const KEY='w3bcShowStateV1',ts=Date.now(),title=document.getElementById('title'),sub=document.getElementById('sub');try{const mr=await fetch('data/latest-show.json?v='+ts,{cache:'no-store'});if(!mr.ok)throw Error('latest-show manifest '+mr.status);const m=await mr.json();const pr=await fetch(m.file+'?v='+ts,{cache:'no-store'});if(!pr.ok)throw Error('show package '+pr.status);const p=await pr.json();let s={};try{s=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}const now=Date.now(),speed=s.liveFeed?.speed||'slow';const priorMarket=s.market||{};const priorTrenches=s.trenches||{};s={...s,segments:Array.isArray(p.segments)&&p.segments.length?p.segments:s.segments,current:0,market:priorMarket,trenches:priorTrenches,trenchesPresets:p.trenchesPresets||[],openNotes:p.openNotes||[],newsStories:p.newsStories||[],aiStories:p.aiStories||[],sportsStories:p.sportsStories||[],child:0,aiChild:0,sportsChild:0,ticker:p.ticker||[],showMeta:{title:p.title||'',description:p.description||'',startTime:p.startTime||'',label:p.label||m.label||''},liveFeed:{autoNews:true,segmentBias:true,paused:false,speed,items:(p.liveFeed||[]).map((x,i)=>({id:now+i,text:x.text,category:x.category||'general',priority:x.priority||'normal',enabled:true,pinned:false,breaking:false,createdAt:now,expiresAt:now+14*3600000}))},morningPackage:{date:p.date,source:p.source,loadedAt:now,version:m.version}};s.ai={headline:s.aiStories[0]?.headline||'',detail:(s.aiStories[0]?.points||[]).join(' ')};s.sports={headline:s.sportsStories[0]?.headline||'',detail:(s.sportsStories[0]?.points||[]).join(' ')};if(s.trenchesPresets.length){const first=s.trenchesPresets[0];s.trenches={query:first.query,address:first.address,symbol:first.symbol,name:first.name,chain:first.chain}}localStorage.setItem(KEY,JSON.stringify(s));title.textContent='Today’s full production show is loaded';title.className='title ok';sub.textContent=`${m.label} · ${s.newsStories.length} News · ${s.aiStories.length} AI · ${s.sportsStories.length} Sports · ${s.segments.filter(x=>x.enabled!==false).length} segments · opening Production Control`;setTimeout(()=>location.replace('show-control-live.html?v='+Date.now()),900)}catch(e){title.textContent='Show loader failed';title.className='title bad';sub.textContent=e.message}})();</script></body></html>
