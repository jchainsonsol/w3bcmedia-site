<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>W3BC SHOW PROGRAM</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05080a}#core{position:absolute;inset:0;width:100%;height:100%;border:0}.module{position:absolute;left:0;top:72px;right:310px;bottom:112px;background:#05080a;z-index:20;display:none;overflow:hidden}.module.on{display:block}.module iframe{width:100%;height:100%;border:0;display:block;background:#05080a}</style></head><body><iframe id="core" src="broadcast-show.html"></iframe><div class="module" id="blackbox"><iframe id="bb" src="trenches-embed.html"></iframe></div><div class="module" id="betting"><iframe src="betting-desk-live.html"></iframe></div><div class="module" id="desk"><iframe id="deskFrame"></iframe></div><script>const KEY='w3bcShowStateV1',core=document.getElementById('core'),box=document.getElementById('blackbox'),betting=document.getElementById('betting'),desk=document.getElementById('desk'),bb=document.getElementById('bb'),deskFrame=document.getElementById('deskFrame');let lastQ='',lastDesk='',lastFeed='';function state(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return{}}}function broadcastXL(){try{const d=core.contentDocument;if(!d||d.getElementById('broadcast-xl'))return;const s=d.createElement('style');s.id='broadcast-xl';s.textContent=`.brand b{font-size:18px!important}.brand small{font-size:10px!important}.power{display:none!important}.live{font-size:12px!important}.rhead{height:46px!important;font-size:13px!important;padding:0 14px!important}.rrow{padding:9px 13px!important;font-size:14px!important}.rrow.complete{padding:5px 13px!important;font-size:11px!important;opacity:.55!important}.rrow.complete small{display:none!important}.rrow small{font-size:9px!important}.crawlLabel,.priceLabel{font-size:11px!important}.crawlTrack{font-size:13px!important}.priceTrack{font-size:12px!important}`;d.head.appendChild(s)}catch(e){}}function indicatorHooks(){try{const w=core.contentWindow,d=core.contentDocument;if(!w||!d)return;if(!w.__w3bcIndicatorHook&&typeof w.drawCurve==='function'){const original=w.drawCurve;w.drawCurve=function(g,M,series,color,label){const ind=state().market?.indicators||{};if(label==='21D SMMA'&&!ind.smma21)return;if(label==='200D EMA'&&!ind.ema200)return original.call(this,g,M,series,color,label)};w.__w3bcIndicatorHook=true;if(typeof w.renderChart==='function')w.renderChart()}const ind=state().market?.indicators||{},sm=d.querySelector('.indLegend .smma'),em=d.querySelector('.indLegend .ema');if(sm)sm.style.display=ind.smma21?'inline':'none';if(em)em.style.display=ind.ema200?'inline':'none'}catch(e){}}function feedItems(st){let f=st.liveFeed||{},now=Date.now(),seg=(st.segments?.[st.current]?.kind||'general').toLowerCase(),items=(f.items||[]).filter(x=>x.enabled!==false&&(!x.expiresAt||x.expiresAt>now));if(f.autoNews!==false)for(const group of [[st.newsStories,'news'],[st.aiStories,'ai'],[st.sportsStories,'sports']])for(const n of group[0]||[]){let text=n.headline;if(text&&!items.some(x=>x.text?.toLowerCase()===text.toLowerCase()))items.push({text,category:group[1],priority:'normal'})}items.sort((a,b)=>Number(!!b.breaking)-Number(!!a.breaking)||Number(!!b.pinned)-Number(!!a.pinned)||(f.segmentBias!==false?Number(b.category===seg)-Number(a.category===seg):0)||Number(b.priority==='high')-Number(a.priority==='high'));return items.slice(0,40)}function crawlDuration(track,speed){const px=Math.max(track.scrollWidth,900),pps={"very-slow":32,slow:45,normal:62,fast:85}[speed]||45;return Math.max(28,Math.round(px/pps))}function updateFeed(){try{let st=state(),f=st.liveFeed||{},d=core.contentDocument,track=d?.getElementById('crawl');if(!track)return;track.style.animationPlayState=f.paused?'paused':'running';let items=feedItems(st),key=JSON.stringify([items.map(x=>x.text),f.speed||'slow']);if(key!==lastFeed){lastFeed=key;if(items.length)track.innerHTML=items.map(x=>`<span>${x.breaking?'<i>BREAKING</i>':'<i>◆</i>'}${String(x.text).replace(/</g,'&lt;')}</span>`).join('');requestAnimationFrame(()=>{track.style.animationDuration=crawlDuration(track,f.speed||'slow')+'s'})}else{const wanted=crawlDuration(track,f.speed||'slow')+'s';if(track.style.animationDuration!==wanted)track.style.animationDuration=wanted}}catch(e){}}
function drawingHooks(){try{const d=core.contentDocument,w=core.contentWindow,st=state(),kind=st.segments?.[st.current]?.kind||'';if(!d)return;const area=d.querySelector('.chartarea');if(kind!=='markets'){const tb=d.getElementById('w3bcDrawToolbar'),cv=d.getElementById('w3bcDrawCanvas');if(tb)tb.style.display='none';if(cv)cv.style.display='none';return}if(!area)return;let tb=d.getElementById('w3bcDrawToolbar'),cv=d.getElementById('w3bcDrawCanvas');if(!tb){const style=d.createElement('style');style.id='w3bcDrawStyle';style.textContent=`#w3bcDrawToolbar{position:absolute;left:18px;top:70px;z-index:40;display:flex;gap:5px;align-items:center;background:rgba(6,10,12,.94);border:1px solid #344149;padding:5px}#w3bcDrawToolbar button{height:28px;border:1px solid #344149;background:#090d10;color:#fff;padding:0 9px;font-size:8px;font-weight:900;cursor:pointer}#w3bcDrawToolbar button.on{border-color:#22d3e5;color:#22d3e5;background:rgba(34,211,229,.09)}#w3bcDrawToolbar input{width:30px;height:28px;padding:1px;border:1px solid #344149;background:#090d10}#w3bcDrawCanvas{position:absolute;left:0;right:0;top:58px;bottom:0;width:100%;height:calc(100% - 58px);z-index:35;touch-action:none;cursor:crosshair}`;d.head.appendChild(style);tb=d.createElement('div');tb.id='w3bcDrawToolbar';tb.innerHTML='<button data-draw="marker" class="on">✎ MARKER</button><button data-draw="eraser">⌫ ERASE</button><input id="w3bcDrawColor" type="color" value="#22d3e5"><button data-draw="undo">UNDO</button><button data-draw="clear">CLEAR</button>';area.appendChild(tb);cv=d.createElement('canvas');cv.id='w3bcDrawCanvas';area.appendChild(cv);let ctx=cv.getContext('2d'),tool='marker',drawing=false,current=null,strokes=[];function k(){let m=state().market||{};return'w3bcProgramDraw:'+String(m.symbol||m.display||'BTC')+':'+String(m.timeframe||'15m')}function load(){try{strokes=JSON.parse(localStorage.getItem(k())||'[]')}catch(e){strokes=[]}draw()}function save(){localStorage.setItem(k(),JSON.stringify(strokes))}function size(){const r=cv.getBoundingClientRect(),dpi=w.devicePixelRatio||1;cv.width=Math.max(1,Math.round(r.width*dpi));cv.height=Math.max(1,Math.round(r.height*dpi));ctx.setTransform(dpi,0,0,dpi,0,0);draw()}function draw(){const r=cv.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);ctx.lineCap='round';ctx.lineJoin='round';for(const s of strokes){if(!s.points?.length)continue;ctx.globalCompositeOperation=s.tool==='eraser'?'destination-out':'source-over';ctx.strokeStyle=s.color||'#22d3e5';ctx.lineWidth=s.tool==='eraser'?24:4;ctx.beginPath();s.points.forEach((p,i)=>{const x=p.x*r.width,y=p.y*r.height;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()}ctx.globalCompositeOperation='source-over'}function pt(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height}}cv.onpointerdown=e=>{drawing=true;cv.setPointerCapture(e.pointerId);current={tool,color:d.getElementById('w3bcDrawColor').value,points:[pt(e)]};strokes.push(current);draw()};cv.onpointermove=e=>{if(!drawing||!current)return;current.points.push(pt(e));draw()};cv.onpointerup=e=>{drawing=false;current=null;save()};tb.querySelectorAll('[data-draw]').forEach(b=>b.onclick=e=>{e.stopPropagation();const a=b.dataset.draw;if(a==='undo'){strokes.pop();save();draw();return}if(a==='clear'){strokes=[];save();draw();return}tool=a;tb.querySelectorAll('[data-draw="marker"],[data-draw="eraser"]').forEach(x=>x.classList.toggle('on',x.dataset.draw===tool));cv.style.cursor=tool==='eraser'?'cell':'crosshair'});w.addEventListener('resize',size);cv.__load=load;cv.__size=size;requestAnimationFrame(()=>{load();size()})}tb.style.display='flex';cv.style.display='block';let m=st.market||{},sig=String(m.symbol||m.display||'BTC')+'|'+String(m.timeframe||'15m');if(cv.dataset.sig!==sig){cv.dataset.sig=sig;if(cv.__load)cv.__load()}if(cv.__size)cv.__size()}catch(e){}}
function inspect(){try{broadcastXL();indicatorHooks();updateFeed();drawingHooks();let d=core.contentDocument,st=state(),kind=st.segments?.[st.current]?.kind||'',active=(d?.querySelector('.rrow.active')?.textContent||'').toLowerCase(),isT=kind==='trenches'||active.includes('trenches'),isB=kind==='betting'||active.includes('betting desk'),isDesk=kind==='ai'||kind==='sports';box.classList.toggle('on',isT);betting.classList.toggle('on',isB);desk.classList.toggle('on',isDesk);if(isDesk&&lastDesk!==kind){deskFrame.src='desk-stories-embed.html?desk='+kind+'&v='+Date.now();lastDesk=kind}if(!isDesk)lastDesk='';if(isT){let q=st.trenches?.query||st.trenches?.address||'';if(q&&q!==lastQ){bb.src='trenches-embed.html?q='+encodeURIComponent(q)+'&v='+Date.now();lastQ=q}}}catch(e){}}core.addEventListener('load',()=>{setInterval(inspect,250);inspect()});window.addEventListener('storage',e=>{if(e.key===KEY)setTimeout(inspect,20)});</script></body></html>
