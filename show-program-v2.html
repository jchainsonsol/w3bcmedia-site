<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>W3BC SHOW PROGRAM</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05080a}#core{position:absolute;inset:0;width:100%;height:100%;border:0}.blackbox{position:absolute;left:0;top:72px;right:310px;bottom:112px;background:#05080a;z-index:20;display:none;overflow:hidden}.blackbox.on{display:block}.blackbox iframe{width:100%;height:100%;border:0;display:block;background:#05080a}.badge{position:absolute;top:8px;right:10px;z-index:22;background:rgba(5,8,10,.88);border:1px solid #a98cff;color:#c4b5fd;font:800 8px/1 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.1em;padding:6px 8px;display:none}.blackbox.on+.badge{display:block}</style></head><body><iframe id="core" src="broadcast-show.html"></iframe><div class="blackbox" id="blackbox"><iframe id="bb" src="trenches-embed.html"></iframe></div><div class="badge">BLACK BOX · LIVE MARKET INTELLIGENCE</div><script>const core=document.getElementById('core'),box=document.getElementById('blackbox'),bb=document.getElementById('bb');let last=false,lastQ='';function inspect(){try{const d=core.contentDocument;if(!d)return;const stage=d.getElementById('stage');if(!stage)return;const isTrenches=!!stage.querySelector('.trenches,.trenchesMain');if(isTrenches!==last){box.classList.toggle('on',isTrenches);last=isTrenches}if(isTrenches){let q='';try{const state=JSON.parse(localStorage.getItem('w3bcShowState')||'{}');q=state.trenches?.contract||state.trenches?.query||state.trenchToken||''}catch(e){}if(q&&q!==lastQ){bb.src='trenches-embed.html?q='+encodeURIComponent(q);lastQ=q}}}catch(e){box.classList.remove('on')}}core.addEventListener('load',()=>{setInterval(inspect,250);inspect()});window.addEventListener('storage',()=>setTimeout(inspect,30));</script></body></html>
