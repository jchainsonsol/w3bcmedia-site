<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>W3BC SHOW PROGRAM</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05080a}#core{position:absolute;inset:0;width:100%;height:100%;border:0}.module{position:absolute;left:0;top:72px;right:310px;bottom:112px;background:#05080a;z-index:20;display:none;overflow:hidden}.module.on{display:block}.module iframe{width:100%;height:100%;border:0;display:block;background:#05080a}</style></head><body><iframe id="core" src="broadcast-show.html"></iframe><div class="module" id="markets"><iframe id="marketsFrame" src="markets-live-embed.html"></iframe></div><div class="module" id="blackbox"><iframe id="bb" src="trenches-embed.html"></iframe></div><div class="module" id="betting"><iframe src="betting-desk-live.html"></iframe></div><div class="module" id="desk"><iframe id="deskFrame"></iframe></div><script>const KEY='w3bcShowStateV1',core=document.getElementById('core'),markets=document.getElementById('markets'),box=document.getElementById('blackbox'),betting=document.getElementById('betting'),desk=document.getElementById('desk'),bb=document.getElementById('bb'),deskFrame=document.getElementById('deskFrame');let lastQ='',lastDesk='',lastFeed='';function state(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return{}}}function broadcastXL(){try{const d=core.contentDocument;if(!d||d.getElementById('broadcast-xl'))return;const s=d.createElement('style');s.id='broadcast-xl';s.textContent=`.brand b{font-size:18px!important}.brand small{font-size:10px!important}.power{display:none!important}.live{font-size:12px!important}.rhead{height:46px!important;font-size:13px!important;padding:0 14px!important}.rrow{padding:9px 13px!important;font-size:14px!important}.rrow.complete{padding:5px 13px!important;font-size:11px!important;opacity:.55!important}.rrow.complete small{display:none!important}.rrow small{font-size:9px!important}.crawlLabel,.priceLabel{font-size:11px!important}.crawlTrack{font-size:13px!important}.priceTrack{font-size:12px!important}`;d.head.appendChild(s)}catch(e){}}function feedItems(st){let f=st.liveFeed||{},now=Date.now(),seg=(st.segments?.[st.current]?.kind||'general').toLowerCase(),items=(f.items||[]).filter(x=>x.enabled!==false&&(!x.expiresAt||x.expiresAt>now));if(f.autoNews!==false)for(const group of [[st.newsStories,'news'],[st.aiStories,'ai'],[st.sportsStories,'sports']])for(const n of group[0]||[]){let text=n.headline;if(text&&!items.some(x=>x.text?.toLowerCase()===text.toLowerCase()))items.push({text,category:group[1],priority:'normal'})}items.sort((a,b)=>Number(!!b.breaking)-Number(!!a.breaking)||Number(!!b.pinned)-Number(!!a.pinned)||(f.segmentBias!==false?Number(b.category===seg)-Number(a.category===seg):0)||Number(b.priority==='high')-Number(a.priority==='high'));return items.slice(0,40)}function crawlDuration(track,speed){const px=Math.max(track.scrollWidth,900),pps={"very-slow":32,slow:45,normal:62,fast:85}[speed]||45;return Math.max(28,Math.round(px/pps))}function updateFeed(){try{let st=state(),f=st.liveFeed||{},d=core.contentDocument,track=d?.getElementById('crawl');if(!track)return;track.style.animationPlayState=f.paused?'paused':'running';let items=feedItems(st),key=JSON.stringify([items.map(x=>x.text),f.speed||'slow']);if(key!==lastFeed){lastFeed=key;if(items.length)track.innerHTML=items.map(x=>`<span>${x.breaking?'<i>BREAKING</i>':'<i>◆</i>'}${String(x.text).replace(/</g,'&lt;')}</span>`).join('');requestAnimationFrame(()=>{track.style.animationDuration=crawlDuration(track,f.speed||'slow')+'s'})}else{const wanted=crawlDuration(track,f.speed||'slow')+'s';if(track.style.animationDuration!==wanted)track.style.animationDuration=wanted}}catch(e){}}function inspect(){try{broadcastXL();updateFeed();let d=core.contentDocument,st=state(),kind=st.segments?.[st.current]?.kind||'',active=(d?.querySelector('.rrow.active')?.textContent||'').toLowerCase(),isM=kind==='markets'||active.includes('markets now'),isT=kind==='trenches'||active.includes('trenches'),isB=kind==='betting'||active.includes('betting desk'),isDesk=kind==='ai'||kind==='sports';markets.classList.toggle('on',isM);box.classList.toggle('on',isT);betting.classList.toggle('on',isB);desk.classList.toggle('on',isDesk);if(isDesk&&lastDesk!==kind){deskFrame.src='desk-stories-embed.html?desk='+kind+'&v='+Date.now();lastDesk=kind}if(!isDesk)lastDesk='';if(isT){let q=st.trenches?.query||st.trenches?.address||'';if(q&&q!==lastQ){bb.src='trenches-embed.html?q='+encodeURIComponent(q)+'&v='+Date.now();lastQ=q}}}catch(e){}}core.addEventListener('load',()=>{setInterval(inspect,250);inspect()});window.addEventListener('storage',e=>{if(e.key===KEY)setTimeout(inspect,20)});</script></body></html>
