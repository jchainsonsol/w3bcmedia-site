<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GVM 800D-RGB Probe v8</title><style>body{background:#050709;color:#fff;font:16px system-ui;padding:30px}button{margin:6px;padding:12px 18px;background:#111923;color:#fff;border:1px solid #22d3e5;cursor:pointer}button:disabled{opacity:.35}#s{margin:15px 0;color:#42d9a0;font-weight:800}pre{white-space:pre-wrap;background:#0b1015;border:1px solid #263740;padding:14px;max-width:1050px;min-height:260px}</style></head><body><h2>GVM 800D-RGB · Recovery Probe v8</h2><div id="s">DISCONNECTED</div><button id="c">CONNECT + PROBE</button><button id="test" disabled>TEST DISCOVERED WRITE PATH</button><pre id="log">v8: connects first, then probes known GVM service variants one at a time with a fresh GATT connection after any drop. It does not assume the Side Light uses the same service path as the other fixtures.</pre><script>(()=>{const SERVICES=['00010203-0405-0607-0809-0a0b0c0d1910','0000fff0-0000-1000-8000-00805f9b34fb','0000ffe0-0000-1000-8000-00805f9b34fb','0000ffd0-0000-1000-8000-00805f9b34fb'];let device=null,ch=null,serviceUsed='';const $=x=>document.getElementById(x),sleep=ms=>new Promise(r=>setTimeout(r,ms));function log(s){$('log').textContent+='\n'+s}function hex(a){return [...a].map(x=>x.toString(16).padStart(2,'0')).join(' ').toUpperCase()}function crc16(a){let crc=0;for(const b of a){crc^=b<<8;for(let i=0;i<8;i++)crc=(crc&0x8000)?((crc<<1)^0x1021)&65535:(crc<<1)&65535}return crc}function pkt(type,id,v,ff=false){const a=[0x4c,0x54,0x09,0x00,type,0x57,0x00,0x02,id,v],c=crc16(a),z=[...a,(c>>8)&255,c&255];if(ff)z.push(255);return new Uint8Array(z)}async function freshConnect(){if(!device)throw Error('No device selected');if(device.gatt.connected)device.gatt.disconnect();await sleep(450);const server=await device.gatt.connect();await sleep(350);if(!server.connected)throw Error('GATT did not stay connected');return server}async function probeService(uuid){for(let attempt=1;attempt<=2;attempt++){try{log('PROBE '+uuid+' attempt '+attempt);const server=await freshConnect();const svc=await server.getPrimaryService(uuid);const chars=await svc.getCharacteristics();log('FOUND SERVICE '+uuid);for(const x of chars)log('CHAR '+x.uuid+' write='+x.properties.write+' noResp='+x.properties.writeWithoutResponse+' read='+x.properties.read+' notify='+x.properties.notify);const writable=chars.find(x=>x.properties.writeWithoutResponse||x.properties.write);if(writable){ch=writable;serviceUsed=uuid;return true}log('No writable characteristic in service');}catch(e){log('MISS/DROP '+uuid+': '+e.message);ch=null;await sleep(600)}}return false}async function discover(){for(const uuid of SERVICES)if(await probeService(uuid))return true;return false}async function getWrite(){if(ch&&device?.gatt?.connected)return ch;if(!serviceUsed){if(!await discover())throw Error('No supported writable GVM service found')}else{const server=await freshConnect(),svc=await server.getPrimaryService(serviceUsed),chars=await svc.getCharacteristics();ch=chars.find(x=>x.properties.writeWithoutResponse||x.properties.write)}if(!ch)throw Error('Writable characteristic unavailable');return ch}async function write(bytes){const x=await getWrite();log('TX '+hex(bytes));if(x.properties.writeWithoutResponse)await x.writeValueWithoutResponse(bytes);else await x.writeValue(bytes)}$('c').onclick=async()=>{try{$('log').textContent='Selecting BT_LED…';$('s').textContent='SELECT LIGHT…';device=await navigator.bluetooth.requestDevice({filters:[{name:'BT_LED'}],optionalServices:SERVICES});log('DEVICE '+device.name+' · '+device.id);device.addEventListener('gattserverdisconnected',()=>{ch=null;log('EVENT gattserverdisconnected')});$('s').textContent='PROBING SERVICES…';if(!await discover())throw Error('No writable service found across known GVM profiles');$('s').textContent='READY · '+serviceUsed;$('test').disabled=false}catch(e){$('s').textContent='FAILED · '+e.message;log('FINAL ERROR '+e.message)}};$('test').onclick=async()=>{try{$('test').disabled=true;$('s').textContent='TESTING SAFE BRIGHTNESS PROFILES…';for(const type of [0x30,0x31])for(const id of [0,1,2,3])for(const ff of [false,true]){log('PROFILE type='+type.toString(16)+' ch='+id+' ff='+ff);await write(pkt(type,id,15,ff));await sleep(350);await write(pkt(type,id,75,ff));await sleep(350)}$('s').textContent='PROFILE TEST COMPLETE';$('test').disabled=false}catch(e){$('s').textContent='TEST FAILED · '+e.message;log('ERROR '+e.message);$('test').disabled=false}}})();</script></body></html>
