<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>W3BC Side Light Test</title><style>body{background:#050709;color:#fff;font:16px system-ui;padding:30px}button{margin:6px;padding:12px 18px;background:#111923;color:#fff;border:1px solid #22d3e5}#s{margin:15px 0;color:#42d9a0}input{width:420px}</style></head><body><h2>GVM 800D-RGB · Side Light</h2><div id="s">DISCONNECTED</div><button id="c">CONNECT SIDE LIGHT</button><button id="on" disabled>ON</button><button id="off" disabled>OFF</button><button id="blue" disabled>BLUE</button><button id="pink" disabled>PINK</button><p>Brightness <input id="b" type="range" min="1" max="100" value="50" disabled></p><script>(()=>{const SERVICE='00010203-0405-0607-0809-0a0b0c0d1910',WRITE='00010203-0405-0607-0809-0a0b0c0d2b11';let ch=null;const $=x=>document.getElementById(x);function crc16(a){let crc=0;for(const b of a){crc^=b<<8;for(let i=0;i<8;i++)crc=(crc&0x8000)?((crc<<1)^0x1021)&65535:(crc<<1)&65535}return crc}function packet(cmd,param){const p=Math.max(0,Math.min(255,Math.round(param))),a=[0x4c,0x54,0x09,0x00,0x30,0x57,0x00,cmd,0x01,p],crc=crc16(a);return new Uint8Array([...a,(crc>>8)&255,crc&255])}async function send(cmd,p){if(!ch)return;const data=packet(cmd,p);if(ch.properties.writeWithoutResponse)await ch.writeValueWithoutResponse(data);else await ch.writeValue(data)}async function hsi(b,h,s){await send(0x02,b);await new Promise(r=>setTimeout(r,70));await send(0x04,Math.round(h/5));await new Promise(r=>setTimeout(r,70));await send(0x05,s)}$('c').onclick=async()=>{try{$('s').textContent='CONNECTING…';const d=await navigator.bluetooth.requestDevice({filters:[{name:'BT_LED'}],optionalServices:[SERVICE]});const server=await d.gatt.connect(),svc=await server.getPrimaryService(SERVICE);ch=await svc.getCharacteristic(WRITE);$('s').textContent='CONNECTED · WRITE 2B11 · '+d.id.slice(-6).toUpperCase();['on','off','blue','pink','b'].forEach(x=>$(x).disabled=false)}catch(e){$('s').textContent='FAILED · '+e.message}};$('on').onclick=()=>send(0x00,1);$('off').onclick=()=>send(0x00,0);$('blue').onclick=()=>hsi(50,220,100);$('pink').onclick=()=>hsi(50,330,100);let t;$('b').oninput=e=>{clearTimeout(t);t=setTimeout(()=>send(0x02,+e.target.value),80)}})();</script></body></html>
