<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>W3BC GVM 800D Auto Discovery</title><style>body{background:#050709;color:#fff;font:16px system-ui;padding:30px}button{margin:6px;padding:12px 18px;background:#111923;color:#fff;border:1px solid #22d3e5;cursor:pointer}button:disabled{opacity:.35}#s{margin:15px 0;color:#42d9a0;font-weight:800}pre{white-space:pre-wrap;background:#0b1015;border:1px solid #263740;padding:14px;max-width:1000px;min-height:240px}</style></head><body><h2>GVM 800D-RGB · Auto Discovery v5</h2><div id="s">DISCONNECTED</div><button id="c">CONNECT + AUTO DISCOVER</button><button id="test" disabled>TEST DISCOVERED PROFILE</button><pre id="log">Waiting for Side Light…</pre><script>(()=>{const SERVICE='00010203-0405-0607-0809-0a0b0c0d1910';let ch=null,found=null,rx=[];const $=x=>document.getElementById(x),sleep=ms=>new Promise(r=>setTimeout(r,ms));function hex(a){a=a instanceof DataView?new Uint8Array(a.buffer,a.byteOffset,a.byteLength):a;return [...a].map(x=>x.toString(16).padStart(2,'0')).join(' ').toUpperCase()}function log(s){$('log').textContent+='\n'+s}function crc16(a){let crc=0;for(const b of a){crc^=b<<8;for(let i=0;i<8;i++)crc=(crc&0x8000)?((crc<<1)^0x1021)&65535:(crc<<1)&65535}return crc}function frame(bytes,ff=false){const c=crc16(bytes),out=[...bytes,(c>>8)&255,c&255];if(ff)out.push(255);return new Uint8Array(out)}async function tx(bytes,label){log('TX '+label+': '+hex(bytes));await ch.writeValueWithoutResponse(bytes);await sleep(140)}function responseHandler(e){const a=new Uint8Array(e.target.value.buffer,e.target.value.byteOffset,e.target.value.byteLength);rx.push(a);log('RX: '+hex(a));if(a.length>2&&!found){found={raw:a};$('s').textContent='PROFILE RESPONSE FOUND';$('test').disabled=false}}async function discover(){rx=[];found=null;$('test').disabled=true;$('s').textContent='DISCOVERING PROFILE…';log('--- AUTO DISCOVERY START ---');const global=new Uint8Array([0x4c,0x54,0x09,0x00,0x00,0x53,0x00,0x00,0x01,0x00,0x94,0x74,0xff]);await tx(global,'GLOBAL STATE');for(const type of [0x30,0x20,0x10]){for(let id=0;id<12&&!found;id++){const base=[0x4c,0x54,0x08,id,type,0x52,0x00,0x00,0x05];await tx(frame(base,false),'STATE id='+id+' type='+type.toString(16));await tx(frame(base,true),'STATE+FF id='+id+' type='+type.toString(16))}}if(found){$('s').textContent='RESPONSE FOUND · READY TO TEST';log('STOPPED: fixture returned a non-trivial notification.')}else{$('s').textContent='NO PROFILE RESPONSE YET';log('No addressed state query produced a multi-byte response.')}}async function control(devId,devType,cmd,param,ff){const b=[0x4c,0x54,0x09,devId,devType,0x57,0x00,cmd,0x01,param];await tx(frame(b,ff),'CONTROL')}async function testProfiles(){if(!ch)return;$('s').textContent='TESTING SAFE CONTROL PROFILES…';log('--- CONTROL PROFILE TEST ---');const ids=[0,2,3];for(const id of ids){for(const ff of [false,true]){log('Trying devId '+id+' devType 30 ff='+ff);await control(id,0x30,0x02,0x14,ff);await sleep(350);await control(id,0x30,0x02,0x50,ff);await sleep(350)}}$('s').textContent='TEST COMPLETE';log('Brightness should have visibly changed if one profile matched.')}$('c').onclick=async()=>{try{$('log').textContent='';$('s').textContent='CONNECTING…';const d=await navigator.bluetooth.requestDevice({filters:[{name:'BT_LED'}],optionalServices:[SERVICE]});const server=await d.gatt.connect(),svc=await server.getPrimaryService(SERVICE),chars=await svc.getCharacteristics();ch=chars.find(x=>x.properties.writeWithoutResponse||x.properties.write);if(!ch)throw Error('No writable characteristic');log('DEVICE: '+d.name+' · '+d.id);log('CHAR: '+ch.uuid+' writeNoResponse='+ch.properties.writeWithoutResponse+' read='+ch.properties.read+' notify='+ch.properties.notify);if(ch.properties.notify){ch.addEventListener('characteristicvaluechanged',responseHandler);await ch.startNotifications();log('NOTIFICATIONS: SUBSCRIBED')}$('s').textContent='CONNECTED';await discover();if(!found){$('test').disabled=false;log('You can now run the safe brightness profile test.')}}catch(e){$('s').textContent='FAILED · '+e.message;log('ERROR: '+e.stack)}};$('test').onclick=testProfiles})();</script></body></html>
