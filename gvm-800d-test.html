<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>W3BC GVM BLE Probe</title><style>body{background:#050709;color:#fff;font:16px system-ui;padding:30px}button{margin:6px;padding:12px 18px;background:#111923;color:#fff;border:1px solid #22d3e5}#s{margin:15px 0;color:#42d9a0}pre{white-space:pre-wrap;background:#0b1015;border:1px solid #263740;padding:14px;max-width:900px}input{width:420px}</style></head><body><h2>GVM 800D-RGB · BLE Probe</h2><div id="s">DISCONNECTED</div><button id="c">CONNECT + PROBE</button><button id="on" disabled>ON</button><button id="off" disabled>OFF</button><button id="blue" disabled>BLUE</button><button id="pink" disabled>PINK</button><p>Brightness <input id="b" type="range" min="1" max="100" value="50" disabled></p><pre id="log">Waiting for light…</pre><script>(()=>{const SERVICE='00010203-0405-0607-0809-0a0b0c0d1910';let ch=null;const $=x=>document.getElementById(x),sleep=ms=>new Promise(r=>setTimeout(r,ms));function crc16(a){let crc=0;for(const b of a){crc^=b<<8;for(let i=0;i<8;i++)crc=(crc&0x8000)?((crc<<1)^0x1021)&65535:(crc<<1)&65535}return crc}function packet(cmd,param){const p=Math.max(0,Math.min(255,Math.round(param))),a=[0x4c,0x54,0x09,0x00,0x30,0x57,0x00,cmd,0x01,p],crc=crc16(a);return new Uint8Array([...a,(crc>>8)&255,crc&255])}async function send(cmd,p){if(!ch)throw Error('No writable characteristic selected');const data=packet(cmd,p);if(ch.properties.writeWithoutResponse)await ch.writeValueWithoutResponse(data);else await ch.writeValue(data)}async function hsi(b,h,s){await send(2,b);await sleep(70);await send(4,Math.round(h/5));await sleep(70);await send(5,s)}$('c').onclick=async()=>{try{$('s').textContent='CONNECTING + READING GATT…';$('log').textContent='';const d=await navigator.bluetooth.requestDevice({filters:[{name:'BT_LED'}],optionalServices:[SERVICE]});const server=await d.gatt.connect(),svc=await server.getPrimaryService(SERVICE),chars=await svc.getCharacteristics();let lines=['DEVICE: '+d.name+' · '+d.id,'SERVICE: '+svc.uuid,'CHARACTERISTICS:'];for(const x of chars){const p=x.properties;lines.push(x.uuid+'  write='+p.write+'  writeNoResponse='+p.writeWithoutResponse+'  read='+p.read+'  notify='+p.notify);if(!ch&&(p.write||p.writeWithoutResponse))ch=x}$('log').textContent=lines.join('\n');if(!ch)throw Error('Service found, but it exposes no writable characteristic.');$('s').textContent='CONNECTED · USING '+ch.uuid;['on','off','blue','pink','b'].forEach(x=>$(x).disabled=false)}catch(e){$('s').textContent='FAILED · '+e.message;$('log').textContent+='\nERROR: '+e.stack}};$('on').onclick=()=>send(0,1).catch(e=>$('s').textContent='WRITE FAILED · '+e.message);$('off').onclick=()=>send(0,0).catch(e=>$('s').textContent='WRITE FAILED · '+e.message);$('blue').onclick=()=>hsi(50,220,100).catch(e=>$('s').textContent='WRITE FAILED · '+e.message);$('pink').onclick=()=>hsi(50,330,100).catch(e=>$('s').textContent='WRITE FAILED · '+e.message);let t;$('b').oninput=e=>{clearTimeout(t);t=setTimeout(()=>send(2,+e.target.value).catch(err=>$('s').textContent='WRITE FAILED · '+err.message),80)}})();</script></body></html>
