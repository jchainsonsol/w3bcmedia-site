<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GVM 800D-RGB GATT Test v7</title><style>body{background:#050709;color:#fff;font:16px system-ui;padding:30px}button{margin:6px;padding:12px 18px;background:#111923;color:#fff;border:1px solid #22d3e5;cursor:pointer}button:disabled{opacity:.35}#s{margin:15px 0;color:#42d9a0;font-weight:800}pre{white-space:pre-wrap;background:#0b1015;border:1px solid #263740;padding:14px;max-width:1000px;min-height:240px}</style></head><body><h2>GVM 800D-RGB · GATT Connection Test v7</h2><div id="s">DISCONNECTED</div><button id="c">CONNECT GVM LIGHT</button><button id="test" disabled>TEST 5% ↔ 100% BRIGHTNESS</button><pre id="log">Ready. v7 explicitly waits for GATT connection, verifies it, then retrieves the service. If GATT drops, writes reconnect and retry.</pre><script>(()=>{const SERVICE='00010203-0405-0607-0809-0a0b0c0d1910';let device=null,ch=null;const $=x=>document.getElementById(x),sleep=ms=>new Promise(r=>setTimeout(r,ms));function hex(a){return [...a].map(x=>x.toString(16).padStart(2,'0')).join(' ').toUpperCase()}function log(s){$('log').textContent+='\n'+s}function crc16(a){let crc=0;for(const b of a){crc^=b<<8;for(let i=0;i<8;i++)crc=(crc&0x8000)?((crc<<1)^0x1021)&65535:(crc<<1)&65535}return crc}function frame(bytes,ff=false){const c=crc16(bytes),out=[...bytes,(c>>8)&255,c&255];if(ff)out.push(255);return new Uint8Array(out)}async function openGatt(){if(!device)throw Error('No Bluetooth device selected.');ch=null;let server=device.gatt;if(!server)throw Error('Selected device has no GATT server.');if(!server.connected){log('GATT: connecting…');server=await server.connect();}log('GATT connected='+server.connected);if(!server.connected)throw Error('GATT connect returned but server is still disconnected.');await sleep(250);if(!server.connected){log('GATT dropped during settle; reconnecting…');server=await device.gatt.connect();await sleep(250);}if(!server.connected)throw Error('GATT disconnected before service lookup.');log('SERVICE: retrieving '+SERVICE);const svc=await server.getPrimaryService(SERVICE);log('SERVICE: found');const chars=await svc.getCharacteristics();ch=chars.find(x=>x.properties.writeWithoutResponse||x.properties.write);if(!ch)throw Error('No writable characteristic');log('WRITE CHAR: '+ch.uuid+' noResponse='+ch.properties.writeWithoutResponse);return ch}async function getChannel(){if(ch&&device?.gatt?.connected)return ch;return openGatt()}async function tx(bytes,label){log('TX '+label+': '+hex(bytes));let c;try{c=await getChannel();if(c.properties.writeWithoutResponse)await c.writeValueWithoutResponse(bytes);else await c.writeValue(bytes)}catch(e){log('WRITE/CONNECTION FAILED: '+e.message);ch=null;await sleep(350);log('RETRY: reconnecting GATT…');c=await openGatt();if(c.properties.writeWithoutResponse)await c.writeValueWithoutResponse(bytes);else await c.writeValue(bytes)}await sleep(250)}async function brightness(value,ff=false){const base=[0x4c,0x54,0x09,0x00,0x31,0x57,0x00,0x02,0x03,value];await tx(frame(base,ff),'BRIGHTNESS '+value+' ff='+ff)}$('c').onclick=async()=>{try{$('log').textContent='Selecting BT_LED…';$('s').textContent='SELECT A GVM LIGHT…';device=await navigator.bluetooth.requestDevice({filters:[{name:'BT_LED'}],optionalServices:[SERVICE]});log('DEVICE: '+device.name+' · '+device.id);device.addEventListener('gattserverdisconnected',()=>{ch=null;$('s').textContent='GATT DROPPED · READY TO RECONNECT';log('EVENT: gattserverdisconnected')});$('s').textContent='CONNECTING GATT…';await openGatt();$('s').textContent='CONNECTED · GATT + SERVICE READY';$('test').disabled=false}catch(e){$('s').textContent='FAILED · '+e.message;log('ERROR: '+e.message)}};$('test').onclick=async()=>{try{$('test').disabled=true;$('s').textContent='TESTING TYPE 31 / CHANNEL 3…';log('--- TYPE 31 / CHANNEL 3 TEST ---');for(const ff of [false,true]){await brightness(5,ff);await sleep(700);await brightness(100,ff);await sleep(700)}$('s').textContent='TEST COMPLETE';log('Did the selected light visibly dim and brighten?');$('test').disabled=false}catch(e){$('s').textContent='TEST FAILED · '+e.message;log('ERROR: '+e.message);$('test').disabled=false}}})();</script></body></html>
