<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>W3BC GVM BLE Readout</title><style>body{background:#050709;color:#fff;font:16px system-ui;padding:30px}button{margin:6px;padding:12px 18px;background:#111923;color:#fff;border:1px solid #22d3e5}#s{margin:15px 0;color:#42d9a0}pre{white-space:pre-wrap;background:#0b1015;border:1px solid #263740;padding:14px;max-width:1000px;min-height:180px}</style></head><body><h2>GVM 800D-RGB · Read Diagnostic v4</h2><div id="s">DISCONNECTED</div><button id="c">CONNECT + LISTEN</button><button id="r" disabled>READ CURRENT VALUE</button><pre id="log">Waiting for light…</pre><script>(()=>{const SERVICE='00010203-0405-0607-0809-0a0b0c0d1910';let ch=null;const $=x=>document.getElementById(x);function hex(v){const a=v instanceof DataView?new Uint8Array(v.buffer,v.byteOffset,v.byteLength):new Uint8Array(v.buffer||v);return [...a].map(x=>x.toString(16).padStart(2,'0')).join(' ').toUpperCase()}function log(s){$('log').textContent+='\n'+s}async function readNow(){try{const v=await ch.readValue();log('READ: '+hex(v));$('s').textContent='READ OK'}catch(e){log('READ FAILED: '+e.message);$('s').textContent='READ FAILED'}}$('c').onclick=async()=>{try{$('log').textContent='';$('s').textContent='CONNECTING…';const d=await navigator.bluetooth.requestDevice({filters:[{name:'BT_LED'}],optionalServices:[SERVICE]});const server=await d.gatt.connect(),svc=await server.getPrimaryService(SERVICE),chars=await svc.getCharacteristics();log('DEVICE: '+d.name+' · '+d.id);log('SERVICE: '+svc.uuid);for(const x of chars){const p=x.properties;log('CHAR: '+x.uuid+' write='+p.write+' writeNoResponse='+p.writeWithoutResponse+' read='+p.read+' notify='+p.notify);if(!ch&&(p.read||p.notify))ch=x}if(!ch)throw Error('No readable/notifiable characteristic');if(ch.properties.notify){ch.addEventListener('characteristicvaluechanged',e=>log('NOTIFY: '+hex(e.target.value)));await ch.startNotifications();log('NOTIFICATIONS: SUBSCRIBED')}if(ch.properties.read)await readNow();$('r').disabled=!ch.properties.read;$('s').textContent='CONNECTED · LISTENING'}catch(e){$('s').textContent='FAILED · '+e.message;log('ERROR: '+e.stack)}};$('r').onclick=readNow})();</script></body></html>
