<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GVM 800D-RGB v6 Test</title><style>body{background:#050709;color:#fff;font:16px system-ui;padding:30px}button{margin:6px;padding:12px 18px;background:#111923;color:#fff;border:1px solid #22d3e5;cursor:pointer}button:disabled{opacity:.35}#s{margin:15px 0;color:#42d9a0;font-weight:800}pre{white-space:pre-wrap;background:#0b1015;border:1px solid #263740;padding:14px;max-width:1000px;min-height:240px}</style></head><body><h2>GVM 800D-RGB · Device Type 31 Test v6</h2><div id="s">DISCONNECTED</div><button id="c">CONNECT SIDE LIGHT</button><button id="test" disabled>TEST 5% ↔ 100% BRIGHTNESS</button><pre id="log">Ready. This test targets devId 00 · devType 31 · channel 03.</pre><script>(()=>{const SERVICE='00010203-0405-0607-0809-0a0b0c0d1910';let ch=null;const $=x=>document.getElementById(x),sleep=ms=>new Promise(r=>setTimeout(r,ms));function hex(a){return [...a].map(x=>x.toString(16).padStart(2,'0')).join(' ').toUpperCase()}function log(s){$('log').textContent+='\n'+s}function crc16(a){let crc=0;for(const b of a){crc^=b<<8;for(let i=0;i<8;i++)crc=(crc&0x8000)?((crc<<1)^0x1021)&65535:(crc<<1)&65535}return crc}function frame(bytes,ff=false){const c=crc16(bytes),out=[...bytes,(c>>8)&255,c&255];if(ff)out.push(255);return new Uint8Array(out)}async function tx(bytes,label){log('TX '+label+': '+hex(bytes));if(ch.properties.writeWithoutResponse)await ch.writeValueWithoutResponse(bytes);else await ch.writeValue(bytes);await sleep(250)}async function brightness(value,ff=false){const base=[0x4c,0x54,0x09,0x00,0x31,0x57,0x00,0x02,0x03,value];await tx(frame(base,ff),'BRIGHTNESS '+value+' ff='+ff)}$('c').onclick=async()=>{try{$('log').textContent='Connecting…';$('s').textContent='CONNECTING…';const d=await navigator.bluetooth.requestDevice({filters:[{name:'BT_LED'}],optionalServices:[SERVICE]});const server=await d.gatt.connect(),svc=await server.getPrimaryService(SERVICE),chars=await svc.getCharacteristics();ch=chars.find(x=>x.properties.writeWithoutResponse||x.properties.write);if(!ch)throw Error('No writable characteristic');$('s').textContent='CONNECTED · READY';$('test').disabled=false;log('DEVICE: '+d.name);log('WRITE CHAR: '+ch.uuid);log('Profile: devId=00 devType=31 channel=03 command=02')}catch(e){$('s').textContent='FAILED · '+e.message;log('ERROR: '+e.message)}};$('test').onclick=async()=>{try{$('test').disabled=true;$('s').textContent='TESTING…';log('--- TYPE 31 / CHANNEL 3 TEST ---');for(const ff of [false,true]){await brightness(5,ff);await sleep(700);await brightness(100,ff);await sleep(700)}$('s').textContent='TEST COMPLETE';log('Did the Side Light visibly dim and brighten?');$('test').disabled=false}catch(e){$('s').textContent='TEST FAILED · '+e.message;log('ERROR: '+e.message);$('test').disabled=false}}})();</script></body></html>
