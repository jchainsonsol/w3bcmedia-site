<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>W3BC Production Control</title>
<style>
:root{--c:#22d3e5;--bg:#050709;--p:#0b1014;--p2:#0e151b;--l:#223039;--m:#748188;--g:#42d9a0;--r:#ff6875;--v:#a98cff;--pink:#ff2db9;--amber:#ffd166}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}.app{height:100vh;display:grid;grid-template-rows:48px 1fr;background:radial-gradient(800px 500px at 82% -10%,rgba(34,211,229,.06),transparent 60%),var(--bg)}
.top{display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-top:2px solid var(--c);border-bottom:1px solid #1d272d;background:#070a0d}.brand{display:flex;align-items:center;gap:10px}.brand img{height:27px;width:48px;object-fit:contain}.brand b{font-size:11px;letter-spacing:.13em}.brand small{display:block;color:#607078;font-size:7px;letter-spacing:.14em;margin-top:2px}.topRight{display:flex;align-items:center;gap:7px}.chip{height:26px;display:flex;align-items:center;gap:6px;border:1px solid #25333c;background:#090e12;padding:0 9px;font-size:8px;font-weight:900;letter-spacing:.07em;color:#8d9ba3}.chip.live{border-color:#5a2131;color:#ff91ad;background:#160a0f}.dot{width:7px;height:7px;border-radius:50%;background:var(--r)}.dot.on{background:var(--g);box-shadow:0 0 10px var(--g)}
.workspace{min-height:0;display:grid;grid-template-columns:minmax(0,1.32fr) minmax(480px,.88fr);gap:7px;padding:7px}.pane{min-height:0;border:1px solid #1f2b32;background:#070a0d;overflow:hidden;box-shadow:0 10px 35px rgba(0,0,0,.18)}.paneHead{height:33px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;border-bottom:1px solid #1e2930;background:#090d10}.paneHead b{font-size:9px;letter-spacing:.11em}.paneHead span{font-size:7px;color:#607078;letter-spacing:.08em}.left{display:grid;grid-template-rows:33px 1fr}.frameViewport{position:relative;min-height:0;overflow:hidden;background:#07090b}.control{position:absolute;inset:0;border:0;background:#07090b;width:128.205%;height:128.205%;transform:scale(.78);transform-origin:0 0}
.right{min-height:0;display:grid;grid-template-rows:282px 1fr;gap:7px}.lights{border:1px solid #1f2b32;background:linear-gradient(180deg,#0d1318,#090d11);overflow:hidden}.lightsHead{height:39px;padding:0 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #202b32}.lightsTitle{display:flex;align-items:center;gap:8px}.bulb{width:23px;height:23px;display:grid;place-items:center;border:1px solid #4b462a;background:#17150c;border-radius:7px;font-size:13px}.lightsTitle b{font-size:9px;letter-spacing:.1em}.lightsTitle small{display:block;color:#61717a;font-size:6px;letter-spacing:.09em;margin-top:2px}.lightStatus{display:flex;align-items:center;gap:6px;font-size:7px;color:#687780;font-weight:900;letter-spacing:.07em}.lightsBody{padding:9px}.fixtureRow{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center;margin-bottom:9px}.row{display:flex;gap:5px;align-items:center;flex-wrap:wrap}.lbtn{height:28px;border:1px solid #30404a;background:#090e12;color:#fff;padding:0 9px;font-size:7px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}.lbtn.primary{background:var(--c);border-color:var(--c);color:#041013}.lbtn.good{border-color:#28624a;color:#8df0bd}.lbtn.danger{border-color:#65313a;color:#ffafb9}.lbtn.preset.active{border-color:var(--c);color:var(--c);background:rgba(34,211,229,.08)}.lbtn:disabled{opacity:.35;cursor:not-allowed}.sliders{display:grid;grid-template-columns:1fr 1fr;gap:8px}.group{border:1px solid #202d35;background:#080c0f;padding:7px}.group label{display:flex;justify-content:space-between;font-size:7px;font-weight:900;color:#718089;letter-spacing:.08em;margin-bottom:3px}.group label strong{font-size:9px;color:#fff;letter-spacing:0}.rangeRow{display:grid;grid-template-columns:1fr;gap:2px}.rangeRow input{width:100%;height:18px;accent-color:var(--c)}.presetBar{display:flex;gap:5px;margin-top:8px}.presetBar .lbtn{flex:1;padding:0 5px}.advanced{display:none;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:8px}.advanced.open{display:grid}.advanced .group{padding:6px}.advanced .lbtn{height:26px}.audioPane{display:grid;grid-template-rows:33px 1fr}.audioViewport{position:relative;min-height:0;overflow:hidden}.audio{position:absolute;inset:0;border:0;background:#07090b;width:121.95%;height:121.95%;transform:scale(.82);transform-origin:0 0}
@media(max-width:1180px){html,body{overflow:auto}.app{height:auto;min-height:100vh}.workspace{grid-template-columns:1fr}.right{grid-template-rows:auto 620px}.lights{min-height:282px}.frameViewport{height:760px}.audioViewport{height:620px}.control,.audio{width:100%;height:100%;transform:none;position:static}.pane{overflow:visible}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><img src="assets/w3bc-logo-white.png" alt="W3BC"><div><b>W3BC PRODUCTION CONTROL</b><small>LIVE COMMAND CENTER</small></div></div>
    <div class="topRight"><div class="chip live"><span class="dot on"></span>LIVE READY</div><div class="chip">SHOW + AUDIO + LIGHTS</div><div class="chip" id="clock">--:--:--</div></div>
  </header>

  <main class="workspace">
    <section class="pane left">
      <div class="paneHead"><b>SHOW CONTROL</b><span>RUNDOWN · MARKETS · NEWS · SEGMENTS</span></div>
      <div class="frameViewport"><iframe id="control" class="control" src="show-control.html?v=prod0820single"></iframe></div>
    </section>

    <section class="right">
      <section class="lights">
        <div class="lightsHead"><div class="lightsTitle"><div class="bulb">💡</div><div><b>STUDIO LIGHTS</b><small>GVM-880RS · BLUETOOTH</small></div></div><div class="lightStatus"><span id="lightDot" class="dot"></span><span id="lightStatus">DISCONNECTED</span></div></div>
        <div class="lightsBody">
          <div class="fixtureRow"><div class="row"><button id="connectLight" class="lbtn primary">CONNECT</button><button id="lightOn" class="lbtn good" disabled>ON</button><button id="lightOff" class="lbtn danger" disabled>OFF</button></div><div class="row" style="justify-content:flex-end"><span style="font-size:7px;color:#5f7079;letter-spacing:.07em">BT_LED</span></div></div>
          <div class="sliders">
            <div class="group"><label>BRIGHTNESS <strong id="brightnessVal">55%</strong></label><div class="rangeRow"><input id="brightness" type="range" min="0" max="100" value="55" disabled></div></div>
            <div class="group"><label>COLOR TEMP <strong id="temperatureVal">4500K</strong></label><div class="rangeRow"><input id="temperature" type="range" min="3200" max="5600" step="100" value="4500" disabled></div></div>
          </div>
          <div class="presetBar"><button class="lbtn preset" data-preset="live" disabled>LIVE</button><button class="lbtn preset" data-preset="interview" disabled>INTERVIEW</button><button class="lbtn preset" data-preset="warm" disabled>WARM</button><button class="lbtn preset" data-preset="cool" disabled>COOL</button><button id="colorToggle" class="lbtn" disabled>COLOR</button></div>
          <div id="advanced" class="advanced"><div class="group"><label>HUE <strong id="hueVal">185°</strong></label><input id="hue" type="range" min="0" max="360" value="185" disabled></div><div class="group"><label>SATURATION <strong id="saturationVal">100%</strong></label><input id="saturation" type="range" min="0" max="100" value="100" disabled></div><div class="row"><button class="lbtn preset" data-preset="cyan" disabled>CYAN</button><button class="lbtn preset" data-preset="pink" disabled>PINK</button></div></div>
        </div>
      </section>

      <section class="pane audioPane">
        <div class="paneHead"><b>AUDIO MIXER</b><span>MUSIC · TALK BED · HOT BUTTONS</span></div>
        <div class="audioViewport"><iframe class="audio" src="audio-control.html?v=prod0820single"></iframe></div>
      </section>
    </section>
  </main>
</div>
<script>
(()=>{
const KEY='w3bcShowStateV1',VER='w3bc-rundown-v2-20260820';let s={};try{s=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){s={}}if(localStorage.getItem('w3bcRundownVersion')!==VER){const old=Array.isArray(s.segments)?s.segments:[];const take=(kind,name,fallback={})=>{let x=old.find(z=>z.kind===kind&&(!name||String(z.name||'').toLowerCase().includes(name.toLowerCase())));return x?{...x,enabled:x.enabled!==false}:{...fallback,kind,name,enabled:true}};const open=take('camera','open',{name:'Open'});const markets=take('markets',null,{name:'Markets Now',sponsor:'Bitunix'});const news=take('news',null,{name:'News Desk'});const trenches=take('trenches',null,{name:'The Trenches'});const ai=take('ai',null,{name:'AI + Technology'});const interview=take('interview',null,{name:'Interview'});const panel=take('panel','open panel',{name:'Open Panel'});const sports=take('sports',null,{name:'Sports'});const betting=take('betting',null,{name:'Betting Desk',sponsor:'BC.GAME'});const casino={name:'BC Game Casino',kind:'panel',enabled:true,sponsor:'BC.GAME',desc:'Casino play / entertainment close'};let close=old.find(z=>z.kind==='camera'&&String(z.name||'').toLowerCase().includes('close'))||{name:'Close',kind:'camera',enabled:true};s.segments=[open,markets,news,trenches,ai,interview,panel,sports,betting,casino,close];s.current=0;localStorage.setItem(KEY,JSON.stringify(s));localStorage.setItem('w3bcRundownVersion',VER);try{new BroadcastChannel('w3bc-show').postMessage({type:'state',state:s})}catch(e){}}
const SERVICE='00010203-0405-0607-0809-0a0b0c0d1910',CHAR='00010203-0405-0607-0809-0a0b0c0d2b10',$=id=>document.getElementById(id);let device=null,ch=null,timer=null;
function crc16(a){let crc=0;for(const b of a){crc^=b<<8;for(let i=0;i<8;i++)crc=(crc&0x8000)?((crc<<1)^0x1021)&65535:(crc<<1)&65535}return crc}
function packet(cmd,param){const p=Math.max(0,Math.min(255,Math.round(param))),a=[0x4c,0x54,0x09,0x00,0x30,0x57,0x00,cmd,0x01,p],crc=crc16(a);return new Uint8Array([...a,(crc>>8)&255,crc&255])}
async function send(cmd,param){if(!ch)return;await ch.writeValueWithoutResponse(packet(cmd,param))}
function enabled(on){['lightOn','lightOff','brightness','temperature','colorToggle','hue','saturation'].forEach(id=>$(id).disabled=!on);document.querySelectorAll('[data-preset]').forEach(b=>b.disabled=!on);$('connectLight').disabled=on;$('lightDot').classList.toggle('on',on);$('lightStatus').textContent=on?'CONNECTED · BT_LED':'DISCONNECTED'}
async function connectLight(){try{if(!navigator.bluetooth)throw Error('Open Production Control in Chrome on the Mac.');device=await navigator.bluetooth.requestDevice({filters:[{name:'BT_LED'}],optionalServices:[SERVICE]});device.addEventListener('gattserverdisconnected',()=>{ch=null;enabled(false)});const server=await device.gatt.connect(),service=await server.getPrimaryService(SERVICE);ch=await service.getCharacteristic(CHAR);enabled(true)}catch(e){$('lightStatus').textContent='CONNECT FAILED';alert(e.message)}}
function later(fn){clearTimeout(timer);timer=setTimeout(fn,85)}function values(b,k){$('brightness').value=b;$('brightnessVal').textContent=b+'%';$('temperature').value=k;$('temperatureVal').textContent=k+'K'}
async function cct(b,k){values(b,k);await send(0x02,b);await new Promise(r=>setTimeout(r,80));await send(0x03,Math.round(k/100))}
async function hsi(b,h,sat){$('brightness').value=b;$('brightnessVal').textContent=b+'%';$('hue').value=h;$('hueVal').textContent=h+'°';$('saturation').value=sat;$('saturationVal').textContent=sat+'%';await send(0x02,b);await new Promise(r=>setTimeout(r,70));await send(0x04,Math.round(h/5));await new Promise(r=>setTimeout(r,70));await send(0x05,sat)}
const presets={live:()=>cct(55,4500),interview:()=>cct(45,4300),warm:()=>cct(40,3600),cool:()=>cct(50,5400),cyan:()=>hsi(45,185,100),pink:()=>hsi(40,330,100)};
$('connectLight').onclick=connectLight;$('lightOn').onclick=()=>send(0x00,1);$('lightOff').onclick=()=>send(0x00,0);$('brightness').oninput=e=>{$('brightnessVal').textContent=e.target.value+'%';later(()=>send(0x02,+e.target.value))};$('temperature').oninput=e=>{$('temperatureVal').textContent=e.target.value+'K';later(()=>send(0x03,Math.round(+e.target.value/100)))};$('hue').oninput=e=>{$('hueVal').textContent=e.target.value+'°';later(()=>send(0x04,Math.round(+e.target.value/5)))};$('saturation').oninput=e=>{$('saturationVal').textContent=e.target.value+'%';later(()=>send(0x05,+e.target.value))};$('colorToggle').onclick=()=>$('advanced').classList.toggle('open');document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=async()=>{document.querySelectorAll('[data-preset]').forEach(x=>x.classList.remove('active'));b.classList.add('active');try{await presets[b.dataset.preset]()}catch(e){$('lightStatus').textContent='COMMAND ERROR'}});enabled(false);
function tick(){const d=new Date();$('clock').textContent=d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});}tick();setInterval(tick,1000);
})();
</script>
</body>
</html>
