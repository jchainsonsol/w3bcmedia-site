<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>W3BC Production Control</title><style>:root{--c:#22d3e5;--bg:#050709;--g:#42d9a0;--r:#ff6875}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{height:100vh;display:grid;grid-template-rows:48px 1fr}.top{display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-top:2px solid var(--c);border-bottom:1px solid #1d272d;background:#070a0d}.brand{display:flex;align-items:center;gap:10px}.brand img{height:27px;width:48px;object-fit:contain}.brand b{font-size:11px;letter-spacing:.13em}.brand small{display:block;color:#607078;font-size:7px;margin-top:2px}.chips{display:flex;gap:7px}.chip{height:26px;display:flex;align-items:center;border:1px solid #25333c;background:#090e12;padding:0 9px;font-size:8px;font-weight:900;color:#8d9ba3}.workspace{min-height:0;display:grid;grid-template-columns:minmax(0,1.32fr) minmax(560px,.88fr);gap:7px;padding:7px}.pane{min-height:0;border:1px solid #1f2b32;background:#070a0d;overflow:hidden}.paneHead{height:33px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;border-bottom:1px solid #1e2930;background:#090d10}.paneHead b{font-size:9px;letter-spacing:.11em}.paneHead span{font-size:7px;color:#607078}.left{display:grid;grid-template-rows:33px 1fr}.frameViewport,.audioViewport{position:relative;min-height:0;overflow:hidden}.control{position:absolute;inset:0;border:0;width:128.205%;height:128.205%;transform:scale(.78);transform-origin:0 0}.right{min-height:0;display:grid;grid-template-rows:455px 1fr;gap:7px}.lights{border:1px solid #1f2b32;background:linear-gradient(180deg,#0d1318,#090d11);overflow:auto}.lightsHead{min-height:42px;padding:5px 9px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #202b32}.lightsTitle b{font-size:9px;letter-spacing:.1em}.lightsTitle small{display:block;color:#61717a;font-size:6px;margin-top:2px}.master{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}.fixtureGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:7px}.fixture{border:1px solid #263740;background:#080d11;min-width:0}.fixture.blue{border-top:2px solid #147cff}.fixture.pink{border-top:2px solid #ff2db9}.fixture.third{border-top:2px solid #f0b83d}.fixture.face{border-top:2px solid #fff}.fh{display:flex;justify-content:space-between;align-items:flex-start;padding:6px;border-bottom:1px solid #202d35;gap:4px}.fname{font-size:8px;font-weight:950}.fsub,.status,.hint{font-size:6px;color:#718089}.status.on{color:var(--g)}.body{padding:6px}.row{display:flex;gap:3px;flex-wrap:wrap}.lbtn{height:23px;border:1px solid #30404a;background:#090e12;color:#fff;padding:0 6px;font-size:6px;font-weight:900;cursor:pointer}.lbtn.primary{background:var(--c);color:#041013}.lbtn.good{color:#8df0bd}.lbtn.danger{color:#ffafb9}.lbtn.hot{background:#fff;color:#050709}.lbtn:disabled{opacity:.35}.group{margin-top:5px;border:1px solid #202d35;padding:4px}.group label{display:flex;justify-content:space-between;font-size:6px;color:#718089}.group strong{color:#fff}.group input{width:100%;accent-color:var(--c)}.colors{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;margin-top:5px}.color{height:20px;border:1px solid #30404a;color:#fff;font-size:5px;font-weight:950;background:var(--sw)}.manage{margin-top:5px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:3px}.audioPane{display:grid;grid-template-rows:33px 1fr}.audio{position:absolute;inset:0;border:0;width:121.95%;height:121.95%;transform:scale(.82);transform-origin:0 0}.studioPreset{padding:0 7px 7px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}@media(max-width:1400px){.fixtureGrid{grid-template-columns:1fr 1fr}.right{grid-template-rows:560px 1fr}}</style></head><body><div class="app"><header class="top"><div class="brand"><img src="assets/w3bc-logo-white.png"><div><b>W3BC PRODUCTION CONTROL</b><small>LIVE COMMAND CENTER</small></div></div><div class="chips"><div class="chip">SHOW + AUDIO + 4 LIGHTS</div><div class="chip" id="clock">--:--:--</div></div></header><main class="workspace"><section class="pane left"><div class="paneHead"><b>SHOW CONTROL</b><span>RUNDOWN · MARKETS · NEWS · SEGMENTS</span></div><div class="frameViewport"><iframe id="control" class="control"></iframe></div></section><section class="right"><section class="lights"><div class="lightsHead"><div class="lightsTitle"><b>💡 STUDIO LIGHTS</b><small>3 GVM RGB SET LIGHTS + ELGATO FACE LIGHT</small></div><div class="master"><button class="lbtn hot" id="goLive">● GO LIVE</button><button class="lbtn danger" id="showOff">SHOW OFF</button><button class="lbtn good" id="allOn">GVM ON</button><button class="lbtn danger" id="allOff">GVM OFF</button></div></div><div class="fixtureGrid" id="fixtures"></div><div class="studioPreset"><button class="lbtn" id="w3bcPreset">W3BC SET</button><button class="lbtn" id="allBlue">GVM ALL BLUE</button><button class="lbtn" id="allPink">GVM ALL PINK</button><button class="lbtn" id="faceLive">FACE LIVE</button></div></section><section class="pane audioPane"><div class="paneHead"><b>AUDIO MIXER</b><span>MUSIC · TALK BED · HOT BUTTONS</span></div><div class="audioViewport"><iframe id="audioFrame" class="audio"></iframe></div></section></section></main></div><script>(()=>{const SERVICE='00010203-0405-0607-0809-0a0b0c0d1910',CHAR='00010203-0405-0607-0809-0a0b0c0d2b10',BRIDGE='http://127.0.0.1:8765';const defaults=['Right Wall','Guitar Wall','Side Light'];const lights=defaults.map((d,i)=>({id:i+1,label:localStorage.getItem('w3bc.gvm.name.'+(i+1))||d,device:null,ch:null,timer:null,b:[42,48,35][i],h:[220,330,185][i],s:[100,100,85][i],devType:i===2?0x31:0x30,channel:i===2?0x03:0x01,savedId:localStorage.getItem('w3bc.gvm.device.'+(i+1))||''}));const face={host:localStorage.getItem('w3bc.elgato.host')||'',name:localStorage.getItem('w3bc.elgato.name')||'Elgato Key Light',b:45,k:200,connected:false};const $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms));$('control').src='show-control.html?v='+Date.now();$('audioFrame').src='audio-control.html?v='+Date.now();function crc16(a){let crc=0;for(const b of a){crc^=b<<8;for(let i=0;i<8;i++)crc=(crc&0x8000)?((crc<<1)^0x1021)&65535:(crc<<1)&65535}return crc}function packet(L,cmd,param){const p=Math.max(0,Math.min(255,Math.round(param))),a=[0x4c,0x54,0x09,0x00,L.devType,0x57,0x00,cmd,L.channel,p],crc=crc16(a);return new Uint8Array([...a,(crc>>8)&255,crc&255])}function shortId(id){return id?id.slice(-6).toUpperCase():'—'}function enable(L,on){['on','off','b','h','s','identify','forget'].forEach(x=>{const e=$(x+L.id);if(e)e.disabled=!on});document.querySelectorAll('[data-light="'+L.id+'"] .color').forEach(x=>x.disabled=!on);$('connect'+L.id).disabled=on;$('status'+L.id).textContent=on?'CONNECTED · '+shortId(L.device?.id):L.savedId?'SAVED · RECONNECT':'DISCONNECTED';$('status'+L.id).classList.toggle('on',on)}async function getChannel(L){if(!L.device)throw Error('Reconnect '+L.label+' once so Chrome can remember it.');if(L.ch&&L.device.gatt?.connected)return L.ch;$('status'+L.id).textContent='RECONNECTING…';let server=L.device.gatt;if(!server)throw Error('Bluetooth GATT unavailable.');if(!server.connected)server=await server.connect();const svc=await server.getPrimaryService(SERVICE);L.ch=await svc.getCharacteristic(CHAR);enable(L,true);return L.ch}async function send(L,cmd,param){try{let ch=await getChannel(L);await ch.writeValueWithoutResponse(packet(L,cmd,param))}catch(e){L.ch=null;try{await sleep(180);let ch=await getChannel(L);await ch.writeValueWithoutResponse(packet(L,cmd,param))}catch(e2){enable(L,false);$('status'+L.id).textContent='RECONNECT NEEDED';throw e2}}}async function power(L,on){try{await send(L,0x00,on?1:0)}catch(e){console.warn(L.label,e)}}async function hsi(L,b,h,s){L.b=b;L.h=h;L.s=s;sync(L);try{await send(L,0x02,b);await sleep(65);await send(L,0x04,Math.round(h/5));await sleep(65);await send(L,0x05,s)}catch(e){console.warn(L.label,e)}}function sync(L){if(!$('b'+L.id))return;$('b'+L.id).value=L.b;$('bv'+L.id).textContent=L.b+'%';$('h'+L.id).value=L.h;$('hv'+L.id).textContent=L.h+'°';$('s'+L.id).value=L.s;$('sv'+L.id).textContent=L.s+'%'}async function connect(L){try{if(!navigator.bluetooth)throw Error('Use Chrome on the Mac for Bluetooth control.');const d=await navigator.bluetooth.requestDevice({filters:[{name:'BT_LED'}],optionalServices:[SERVICE]});if(lights.some(x=>x!==L&&x.device&&x.device.id===d.id))throw Error('That BT_LED is already assigned to '+lights.find(x=>x!==L&&x.device&&x.device.id===d.id).label+'.');L.device=d;L.savedId=d.id;localStorage.setItem('w3bc.gvm.device.'+L.id,d.id);d.addEventListener('gattserverdisconnected',()=>{L.ch=null;$('status'+L.id).textContent='DROPPED · AUTO RECONNECT';$('status'+L.id).classList.remove('on')});await getChannel(L);enable(L,true)}catch(e){$('status'+L.id).textContent='CONNECT FAILED';alert(e.message)}}async function identify(L){const old={b:L.b,h:L.h,s:L.s};for(let i=0;i<3;i++){await send(L,0x02,100);await sleep(180);await send(L,0x02,5);await sleep(180)}await hsi(L,old.b,old.h,old.s)}function rename(L){const name=prompt('Name this studio light:',L.label);if(name&&name.trim()){L.label=name.trim();localStorage.setItem('w3bc.gvm.name.'+L.id,L.label);$('name'+L.id).textContent=L.label}}function forget(L){if(L.device?.gatt?.connected)L.device.gatt.disconnect();L.device=null;L.ch=null;L.savedId='';localStorage.removeItem('w3bc.gvm.device.'+L.id);enable(L,false)}function later(L,fn){clearTimeout(L.timer);L.timer=setTimeout(fn,90)}async function faceReq(state){if(!face.host)throw Error('Key Light has not been discovered yet.');const opt=state?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({host:face.host,state})}:{};const r=await fetch(BRIDGE+'/elgato?host='+encodeURIComponent(face.host),opt),j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'Elgato request failed');return j.data}async function faceConnect(){try{let data;if(face.host){try{data=await faceReq()}catch{face.host=''}}if(!face.host){const r=await fetch(BRIDGE+'/elgato/discover?ts='+Date.now()),j=await r.json();if(!r.ok||!j.ok)throw Error(j.error);face.host=j.host;face.name=j.name||face.name;data=j.data;localStorage.setItem('w3bc.elgato.host',face.host)}face.connected=true;$('faceStatus').textContent='CONNECTED';$('faceStatus').classList.add('on');faceSync()}catch(e){alert('Elgato: '+e.message)}}function faceSync(){['faceOn','faceOff','faceB','faceK'].forEach(id=>$(id).disabled=!face.connected)}async function faceSet(state){try{await faceReq(state)}catch(e){$('faceStatus').textContent='OFFLINE'}}function render(){const colors=[['RED',0],['GREEN',120],['BLUE',220],['PINK',330],['CYAN',185],['PURPLE',270],['AMBER',35],['WHITE',0]];$('fixtures').innerHTML=lights.map(L=>'<div class="fixture '+(L.id===1?'blue':L.id===2?'pink':'third')+'" data-light="'+L.id+'"><div class="fh"><div><div class="fname" id="name'+L.id+'">'+L.label+'</div><div class="fsub">GVM RGB · '+(L.id===3?'TYPE 31 · CH 3':'TYPE 30')+'</div></div><div class="status" id="status'+L.id+'">DISCONNECTED</div></div><div class="body"><div class="row"><button class="lbtn primary" id="connect'+L.id+'">CONNECT</button><button class="lbtn good" id="on'+L.id+'" disabled>ON</button><button class="lbtn danger" id="off'+L.id+'" disabled>OFF</button></div><div class="manage"><button class="lbtn" id="identify'+L.id+'" disabled>IDENTIFY</button><button class="lbtn" id="rename'+L.id+'">RENAME</button><button class="lbtn danger" id="forget'+L.id+'" disabled>FORGET</button></div><div class="group"><label>BRIGHTNESS <strong id="bv'+L.id+'">'+L.b+'%</strong></label><input id="b'+L.id+'" type="range" min="0" max="100" value="'+L.b+'" disabled></div><div class="group"><label>HUE <strong id="hv'+L.id+'">'+L.h+'°</strong></label><input id="h'+L.id+'" type="range" min="0" max="360" value="'+L.h+'" disabled><label>SATURATION <strong id="sv'+L.id+'">'+L.s+'%</strong></label><input id="s'+L.id+'" type="range" min="0" max="100" value="'+L.s+'" disabled></div><div class="colors">'+colors.map(c=>'<button class="color" style="--sw:hsl('+c[1]+' 100% 35%)" data-h="'+c[1]+'" '+(c[0]==='WHITE'?'data-white="1"':'')+' disabled>'+c[0]+'</button>').join('')+'</div></div></div>').join('')+'<div class="fixture face"><div class="fh"><div><div class="fname">'+face.name+'</div><div class="fsub">ELGATO · LOCAL WI-FI</div></div><div class="status" id="faceStatus">READY</div></div><div class="body"><div class="row"><button class="lbtn primary" id="faceConnect">FIND KEY LIGHT</button><button class="lbtn good" id="faceOn" disabled>ON</button><button class="lbtn danger" id="faceOff" disabled>OFF</button></div><div class="group"><label>BRIGHTNESS</label><input id="faceB" type="range" min="3" max="100" value="45" disabled></div><div class="group"><label>COLOR TEMP</label><input id="faceK" type="range" min="143" max="344" value="200" disabled></div></div></div>';lights.forEach(L=>{$('connect'+L.id).onclick=()=>connect(L);$('identify'+L.id).onclick=()=>identify(L);$('rename'+L.id).onclick=()=>rename(L);$('forget'+L.id).onclick=()=>forget(L);$('on'+L.id).onclick=()=>power(L,true);$('off'+L.id).onclick=()=>power(L,false);$('b'+L.id).oninput=e=>{L.b=+e.target.value;$('bv'+L.id).textContent=L.b+'%';later(L,()=>send(L,0x02,L.b).catch(()=>{}))};$('h'+L.id).oninput=e=>{L.h=+e.target.value;$('hv'+L.id).textContent=L.h+'°';later(L,()=>send(L,0x04,Math.round(L.h/5)).catch(()=>{}))};$('s'+L.id).oninput=e=>{L.s=+e.target.value;$('sv'+L.id).textContent=L.s+'%';later(L,()=>send(L,0x05,L.s).catch(()=>{}))};document.querySelectorAll('[data-light="'+L.id+'"] .color').forEach(b=>b.onclick=()=>hsi(L,L.b,+b.dataset.h,b.dataset.white?0:100))});$('faceConnect').onclick=faceConnect;$('faceOn').onclick=()=>faceSet({on:1});$('faceOff').onclick=()=>faceSet({on:0});$('faceB').oninput=e=>faceSet({brightness:+e.target.value});$('faceK').oninput=e=>faceSet({temperature:+e.target.value})}render();$('allOn').onclick=()=>lights.forEach(L=>power(L,true));$('allOff').onclick=()=>lights.forEach(L=>power(L,false));$('w3bcPreset').onclick=()=>{hsi(lights[0],42,220,100);hsi(lights[1],48,330,100);hsi(lights[2],35,185,85)};$('allBlue').onclick=()=>lights.forEach(L=>hsi(L,45,220,100));$('allPink').onclick=()=>lights.forEach(L=>hsi(L,45,330,100));$('faceLive').onclick=()=>face.connected&&faceSet({on:1,brightness:45,temperature:200});$('goLive').onclick=()=>{lights.forEach(L=>power(L,true));hsi(lights[0],42,220,100);hsi(lights[1],48,330,100);hsi(lights[2],35,185,85);if(face.connected)faceSet({on:1,brightness:45,temperature:200})};$('showOff').onclick=()=>{lights.forEach(L=>power(L,false));if(face.connected)faceSet({on:0})};setInterval(()=>{$('clock').textContent=new Date().toLocaleTimeString()},1000)})();</script></body></html>
