<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>W3BC Production Control</title><style>:root{--c:#22d3e5;--bg:#050709;--l:#223039;--m:#748188;--g:#42d9a0;--r:#ff6875}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{height:100vh;display:grid;grid-template-rows:48px 1fr}.top{display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-top:2px solid var(--c);border-bottom:1px solid #1d272d;background:#070a0d}.brand{display:flex;align-items:center;gap:10px}.brand img{height:27px;width:48px;object-fit:contain}.brand b{font-size:11px;letter-spacing:.13em}.brand small{display:block;color:#607078;font-size:7px;margin-top:2px}.chips{display:flex;gap:7px}.chip{height:26px;display:flex;align-items:center;border:1px solid #25333c;background:#090e12;padding:0 9px;font-size:8px;font-weight:900;color:#8d9ba3}.workspace{min-height:0;display:grid;grid-template-columns:minmax(0,1.32fr) minmax(500px,.88fr);gap:7px;padding:7px}.pane{min-height:0;border:1px solid #1f2b32;background:#070a0d;overflow:hidden}.paneHead{height:33px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;border-bottom:1px solid #1e2930;background:#090d10}.paneHead b{font-size:9px;letter-spacing:.11em}.paneHead span{font-size:7px;color:#607078}.left{display:grid;grid-template-rows:33px 1fr}.frameViewport,.audioViewport{position:relative;min-height:0;overflow:hidden}.control{position:absolute;inset:0;border:0;width:128.205%;height:128.205%;transform:scale(.78);transform-origin:0 0}.right{min-height:0;display:grid;grid-template-rows:390px 1fr;gap:7px}.lights{border:1px solid #1f2b32;background:linear-gradient(180deg,#0d1318,#090d11);overflow:auto}.lightsHead{height:39px;padding:0 10px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #202b32}.lightsTitle b{font-size:9px;letter-spacing:.1em}.lightsTitle small{display:block;color:#61717a;font-size:6px;margin-top:2px}.master{display:flex;gap:5px}.fixtureGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:8px}.fixture{border:1px solid #263740;background:#080d11}.fixture.blue{border-top:2px solid #147cff}.fixture.pink{border-top:2px solid #ff2db9}.fixture.third{border-top:2px solid #f0b83d}.fh{display:flex;justify-content:space-between;align-items:center;padding:7px;border-bottom:1px solid #202d35}.fname{font-size:9px;font-weight:950}.fsub{font-size:6px;color:#718089;margin-top:2px}.status{font-size:6px;color:#718089}.status.on{color:var(--g)}.body{padding:7px}.row{display:flex;gap:4px;align-items:center;flex-wrap:wrap}.lbtn{height:25px;border:1px solid #30404a;background:#090e12;color:#fff;padding:0 7px;font-size:6px;font-weight:900;cursor:pointer}.lbtn.primary{background:var(--c);border-color:var(--c);color:#041013}.lbtn.good{border-color:#28624a;color:#8df0bd}.lbtn.danger{border-color:#65313a;color:#ffafb9}.lbtn:disabled{opacity:.35;cursor:not-allowed}.group{margin-top:6px;border:1px solid #202d35;background:#080c0f;padding:5px}.group label{display:flex;justify-content:space-between;font-size:6px;font-weight:900;color:#718089;margin-bottom:1px}.group strong{color:#fff}.group input{width:100%;height:17px;accent-color:var(--c)}.colors{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin-top:6px}.color{height:22px;border:1px solid #30404a;color:#fff;font-size:5px;font-weight:950;cursor:pointer;background:var(--sw);text-shadow:0 1px 3px #000}.color:disabled{opacity:.3}.audioPane{display:grid;grid-template-rows:33px 1fr}.audio{position:absolute;inset:0;border:0;width:121.95%;height:121.95%;transform:scale(.82);transform-origin:0 0}.studioPreset{padding:0 8px 8px;display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.studioPreset button{height:28px}@media(max-width:1280px){.fixtureGrid{grid-template-columns:1fr 1fr}}@media(max-width:1180px){html,body{overflow:auto}.app{height:auto}.workspace{grid-template-columns:1fr}.right{grid-template-rows:auto 620px}.fixtureGrid{grid-template-columns:1fr}.frameViewport{height:760px}.audioViewport{height:620px}.control,.audio{width:100%;height:100%;transform:none;position:static}}</style></head><body><div class="app"><header class="top"><div class="brand"><img src="assets/w3bc-logo-white.png"><div><b>W3BC PRODUCTION CONTROL</b><small>LIVE COMMAND CENTER</small></div></div><div class="chips"><div class="chip">SHOW + AUDIO + 3 LIGHTS</div><div class="chip" id="clock">--:--:--</div></div></header><main class="workspace"><section class="pane left"><div class="paneHead"><b>SHOW CONTROL</b><span>RUNDOWN · MARKETS · NEWS · SEGMENTS</span></div><div class="frameViewport"><iframe id="control" class="control"></iframe></div></section><section class="right"><section class="lights"><div class="lightsHead"><div class="lightsTitle"><b>💡 STUDIO LIGHTS</b><small>GVM · THREE INDEPENDENT APP MODE FIXTURES</small></div><div class="master"><button class="lbtn good" id="allOn">ALL ON</button><button class="lbtn danger" id="allOff">ALL OFF</button></div></div><div class="fixtureGrid" id="fixtures"></div><div class="studioPreset"><button class="lbtn" id="w3bcPreset">W3BC 3-LIGHT</button><button class="lbtn" id="allBlue">ALL BLUE</button><button class="lbtn" id="allPink">ALL PINK</button></div></section><section class="pane audioPane"><div class="paneHead"><b>AUDIO MIXER</b><span>MUSIC · TALK BED · HOT BUTTONS</span></div><div class="audioViewport"><iframe id="audioFrame" class="audio"></iframe></div></section></section></main></div><script>(()=>{const SERVICE='00010203-0405-0607-0809-0a0b0c0d1910',CHAR='00010203-0405-0607-0809-0a0b0c0d2b10';const lights=[{id:1,label:'CH 1 · RIGHT WALL',role:'BLUE',device:null,ch:null,timer:null,b:45,h:220,s:100},{id:2,label:'CH 2 · GUITAR WALL',role:'PINK',device:null,ch:null,timer:null,b:45,h:330,s:100},{id:3,label:'CH 3 · THIRD LIGHT',role:'CH 3',device:null,ch:null,timer:null,b:45,h:35,s:100}];const $=id=>document.getElementById(id);$('control').src='show-control.html?v='+Date.now();$('audioFrame').src='audio-control.html?v='+Date.now();function crc16(a){let crc=0;for(const b of a){crc^=b<<8;for(let i=0;i<8;i++)crc=(crc&0x8000)?((crc<<1)^0x1021)&65535:(crc<<1)&65535}return crc}function packet(cmd,param){const p=Math.max(0,Math.min(255,Math.round(param))),a=[0x4c,0x54,0x09,0x00,0x30,0x57,0x00,cmd,0x01,p],crc=crc16(a);return new Uint8Array([...a,(crc>>8)&255,crc&255])}async function send(L,cmd,param){if(!L.ch)return;await L.ch.writeValueWithoutResponse(packet(cmd,param))}async function power(L,on){await send(L,0x00,on?1:0)}async function hsi(L,b,h,s){L.b=b;L.h=h;L.s=s;sync(L);await send(L,0x02,b);await new Promise(r=>setTimeout(r,65));await send(L,0x04,Math.round(h/5));await new Promise(r=>setTimeout(r,65));await send(L,0x05,s)}function sync(L){$('b'+L.id).value=L.b;$('bv'+L.id).textContent=L.b+'%';$('h'+L.id).value=L.h;$('hv'+L.id).textContent=L.h+'°';$('s'+L.id).value=L.s;$('sv'+L.id).textContent=L.s+'%'}function enable(L,on){['on','off','b','h','s'].forEach(x=>$(x+L.id).disabled=!on);document.querySelectorAll('[data-light="'+L.id+'"] .color').forEach(x=>x.disabled=!on);$('connect'+L.id).disabled=on;$('status'+L.id).textContent=on?'CONNECTED':'DISCONNECTED';$('status'+L.id).classList.toggle('on',on)}async function connect(L){try{if(!navigator.bluetooth)throw Error('Use Chrome on the Mac for Bluetooth control.');const d=await navigator.bluetooth.requestDevice({filters:[{name:'BT_LED'}],optionalServices:[SERVICE]});if(lights.some(x=>x!==L&&x.device&&x.device.id===d.id))throw Error('That fixture is already assigned. Choose another BT_LED.');L.device=d;d.addEventListener('gattserverdisconnected',()=>{L.ch=null;enable(L,false)});const server=await d.gatt.connect(),svc=await server.getPrimaryService(SERVICE);L.ch=await svc.getCharacteristic(CHAR);enable(L,true)}catch(e){$('status'+L.id).textContent='CONNECT FAILED';alert(e.message)}}function later(L,fn){clearTimeout(L.timer);L.timer=setTimeout(fn,90)}function render(){const colors=[['RED',0],['GREEN',120],['BLUE',220],['PINK',330],['CYAN',185],['PURPLE',270],['AMBER',35],['WHITE',0]];$('fixtures').innerHTML=lights.map(L=>'<div class="fixture '+(L.id===1?'blue':L.id===2?'pink':'third')+'" data-light="'+L.id+'"><div class="fh"><div><div class="fname">'+L.label+'</div><div class="fsub">'+L.role+' · BT_LED</div></div><div class="status" id="status'+L.id+'">DISCONNECTED</div></div><div class="body"><div class="row"><button class="lbtn primary" id="connect'+L.id+'">CONNECT '+L.role+'</button><button class="lbtn good" id="on'+L.id+'" disabled>ON</button><button class="lbtn danger" id="off'+L.id+'" disabled>OFF</button></div><div class="group"><label>BRIGHTNESS <strong id="bv'+L.id+'">'+L.b+'%</strong></label><input id="b'+L.id+'" type="range" min="0" max="100" value="'+L.b+'" disabled></div><div class="group"><label>HUE <strong id="hv'+L.id+'">'+L.h+'°</strong></label><input id="h'+L.id+'" type="range" min="0" max="360" value="'+L.h+'" disabled><label>SATURATION <strong id="sv'+L.id+'">'+L.s+'%</strong></label><input id="s'+L.id+'" type="range" min="0" max="100" value="'+L.s+'" disabled></div><div class="colors">'+colors.map(c=>'<button class="color" style="--sw:hsl('+c[1]+' 100% 35%)" data-h="'+c[1]+'" '+(c[0]==='WHITE'?'data-white="1"':'')+' disabled>'+c[0]+'</button>').join('')+'</div></div></div>').join('');lights.forEach(L=>{$('connect'+L.id).onclick=()=>connect(L);$('on'+L.id).onclick=()=>power(L,true);$('off'+L.id).onclick=()=>power(L,false);$('b'+L.id).oninput=e=>{L.b=+e.target.value;$('bv'+L.id).textContent=L.b+'%';later(L,()=>send(L,0x02,L.b))};$('h'+L.id).oninput=e=>{L.h=+e.target.value;$('hv'+L.id).textContent=L.h+'°';later(L,()=>send(L,0x04,Math.round(L.h/5)))};$('s'+L.id).oninput=e=>{L.s=+e.target.value;$('sv'+L.id).textContent=L.s+'%';later(L,()=>send(L,0x05,L.s))};document.querySelectorAll('[data-light="'+L.id+'"] .color').forEach(b=>b.onclick=()=>hsi(L,L.b,+b.dataset.h,b.dataset.white?0:100))})}render();$('allOn').onclick=()=>lights.forEach(L=>power(L,true));$('allOff').onclick=()=>lights.forEach(L=>power(L,false));$('w3bcPreset').onclick=()=>{hsi(lights[0],42,220,100);hsi(lights[1],48,330,100);hsi(lights[2],35,185,85)};$('allBlue').onclick=()=>lights.forEach(L=>hsi(L,45,220,100));$('allPink').onclick=()=>lights.forEach(L=>hsi(L,45,330,100));setInterval(()=>{$('clock').textContent=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'})},1000)})();</script></body></html>
