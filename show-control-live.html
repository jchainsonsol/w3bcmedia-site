<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>W3BC Production Control</title><style>:root{--c:#22d3e5;--bg:#050709;--g:#42d9a0;--r:#ff6875}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{height:100vh;display:grid;grid-template-rows:48px 1fr}.top{display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-top:2px solid var(--c);border-bottom:1px solid #1d272d;background:#070a0d}.brand{display:flex;align-items:center;gap:10px}.brand img{height:27px;width:48px;object-fit:contain}.brand b{font-size:11px;letter-spacing:.13em}.brand small{display:block;color:#607078;font-size:7px;margin-top:2px}.chips{display:flex;gap:7px}.chip{height:26px;display:flex;align-items:center;border:1px solid #25333c;background:#090e12;padding:0 9px;font-size:8px;font-weight:900;color:#8d9ba3}.workspace{min-height:0;display:grid;grid-template-columns:minmax(0,1.32fr) minmax(560px,.88fr);gap:7px;padding:7px}.pane{min-height:0;border:1px solid #1f2b32;background:#070a0d;overflow:hidden}.paneHead{height:33px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;border-bottom:1px solid #1e2930;background:#090d10}.paneHead b{font-size:9px;letter-spacing:.11em}.paneHead span{font-size:7px;color:#607078}.left{display:grid;grid-template-rows:33px 1fr}.frameViewport,.audioViewport{position:relative;min-height:0;overflow:hidden}.control{position:absolute;inset:0;border:0;width:128.205%;height:128.205%;transform:scale(.78);transform-origin:0 0}.right{min-height:0;display:grid;grid-template-rows:455px 1fr;gap:7px}.lights{border:1px solid #1f2b32;background:linear-gradient(180deg,#0d1318,#090d11);overflow:auto}.lightsHead{min-height:42px;padding:5px 9px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #202b32}.lightsTitle b{font-size:9px;letter-spacing:.1em}.lightsTitle small{display:block;color:#61717a;font-size:6px;margin-top:2px}.master{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}.fixtureGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:7px}.fixture{border:1px solid #263740;background:#080d11;min-width:0}.fixture.blue{border-top:2px solid #147cff}.fixture.pink{border-top:2px solid #ff2db9}.fixture.third{border-top:2px solid #f0b83d}.fixture.face{border-top:2px solid #fff}.fh{display:flex;justify-content:space-between;align-items:flex-start;padding:6px;border-bottom:1px solid #202d35;gap:4px}.fname{font-size:8px;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}.fsub{font-size:5px;color:#718089;margin-top:2px}.status{font-size:5px;color:#718089;text-align:right}.status.on{color:var(--g)}.body{padding:6px}.row{display:flex;gap:3px;align-items:center;flex-wrap:wrap}.lbtn{height:23px;border:1px solid #30404a;background:#090e12;color:#fff;padding:0 6px;font-size:5px;font-weight:900;cursor:pointer}.lbtn.primary{background:var(--c);border-color:var(--c);color:#041013}.lbtn.good{border-color:#28624a;color:#8df0bd}.lbtn.danger{border-color:#65313a;color:#ffafb9}.lbtn.hot{background:#fff;color:#050709;border-color:#fff}.lbtn:disabled{opacity:.35;cursor:not-allowed}.group{margin-top:5px;border:1px solid #202d35;background:#080c0f;padding:4px}.group label{display:flex;justify-content:space-between;font-size:5px;font-weight:900;color:#718089;margin-bottom:1px}.group strong{color:#fff}.group input[type=range]{width:100%;height:15px;accent-color:var(--c)}.hostInput{width:100%;height:23px;background:#05090c;color:#fff;border:1px solid #30404a;padding:0 5px;font-size:6px;font-weight:800}.colors{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;margin-top:5px}.color{height:20px;border:1px solid #30404a;color:#fff;font-size:5px;font-weight:950;cursor:pointer;background:var(--sw);text-shadow:0 1px 3px #000}.color:disabled{opacity:.3}.manage{margin-top:5px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:3px}.audioPane{display:grid;grid-template-rows:33px 1fr}.audio{position:absolute;inset:0;border:0;width:121.95%;height:121.95%;transform:scale(.82);transform-origin:0 0}.studioPreset{padding:0 7px 7px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.studioPreset button{height:27px}.hint{font-size:5px;color:#607078;margin-top:4px;line-height:1.35}@media(max-width:1400px){.fixtureGrid{grid-template-columns:1fr 1fr}.right{grid-template-rows:560px 1fr}}@media(max-width:1180px){html,body{overflow:auto}.app{height:auto}.workspace{grid-template-columns:1fr}.right{grid-template-rows:auto 620px}.fixtureGrid{grid-template-columns:1fr}.frameViewport{height:760px}.audioViewport{height:620px}.control,.audio{width:100%;height:100%;transform:none;position:static}}</style></head><body><div class="app"><header class="top"><div class="brand"><img src="assets/w3bc-logo-white.png"><div><b>W3BC PRODUCTION CONTROL</b><small>LIVE COMMAND CENTER</small></div></div><div class="chips"><div class="chip">SHOW + AUDIO + 4 LIGHTS</div><div class="chip" id="clock">--:--:--</div></div></header><main class="workspace"><section class="pane left"><div class="paneHead"><b>SHOW CONTROL</b><span>RUNDOWN · MARKETS · NEWS · SEGMENTS</span></div><div class="frameViewport"><iframe id="control" class="control"></iframe></div></section><section class="right"><section class="lights"><div class="lightsHead"><div class="lightsTitle"><b>💡 STUDIO LIGHTS</b><small>3 GVM RGB SET LIGHTS + ELGATO FACE LIGHT</small></div><div class="master"><button class="lbtn hot" id="goLive">● GO LIVE</button><button class="lbtn danger" id="showOff">SHOW OFF</button><button class="lbtn good" id="allOn">GVM ON</button><button class="lbtn danger" id="allOff">GVM OFF</button></div></div><div class="fixtureGrid" id="fixtures"></div><div class="studioPreset"><button class="lbtn" id="w3bcPreset">W3BC SET</button><button class="lbtn" id="allBlue">GVM ALL BLUE</button><button class="lbtn" id="allPink">GVM ALL PINK</button><button class="lbtn" id="faceLive">FACE LIVE</button></div></section><section class="pane audioPane"><div class="paneHead"><b>AUDIO MIXER</b><span>MUSIC · TALK BED · HOT BUTTONS</span></div><div class="audioViewport"><iframe id="audioFrame" class="audio"></iframe></div></section></section></main></div><script>(()=>{const SERVICE='00010203-0405-0607-0809-0a0b0c0d1910',CHAR='00010203-0405-0607-0809-0a0b0c0d2b10',BRIDGE='http://127.0.0.1:8765';const defaults=['Right Wall','Guitar Wall','Set Light'];const lights=defaults.map((d,i)=>({id:i+1,label:localStorage.getItem('w3bc.gvm.name.'+(i+1))||d,device:null,ch:null,timer:null,b:[42,48,35][i],h:[220,330,185][i],s:[100,100,85][i],savedId:localStorage.getItem('w3bc.gvm.device.'+(i+1))||''}));const face={host:localStorage.getItem('w3bc.elgato.host')||'',name:localStorage.getItem('w3bc.elgato.name')||'Elgato Key Light',b:+(localStorage.getItem('w3bc.elgato.b')||45),k:+(localStorage.getItem('w3bc.elgato.k')||200),connected:false};const $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms));$('control').src='show-control.html?v='+Date.now();$('audioFrame').src='audio-control.html?v='+Date.now();function crc16(a){let crc=0;for(const b of a){crc^=b<<8;for(let i=0;i<8;i++)crc=(crc&0x8000)?((crc<<1)^0x1021)&65535:(crc<<1)&65535}return crc}function packet(cmd,param){const p=Math.max(0,Math.min(255,Math.round(param))),a=[0x4c,0x54,0x09,0x00,0x30,0x57,0x00,cmd,0x01,p],crc=crc16(a);return new Uint8Array([...a,(crc>>8)&255,crc&255])}async function send(L,cmd,param){if(!L.ch)return;await L.ch.writeValueWithoutResponse(packet(cmd,param))}async function power(L,on){await send(L,0x00,on?1:0)}async function hsi(L,b,h,s){L.b=b;L.h=h;L.s=s;sync(L);await send(L,0x02,b);await sleep(65);await send(L,0x04,Math.round(h/5));await sleep(65);await send(L,0x05,s)}function sync(L){if(!$('b'+L.id))return;$('b'+L.id).value=L.b;$('bv'+L.id).textContent=L.b+'%';$('h'+L.id).value=L.h;$('hv'+L.id).textContent=L.h+'°';$('s'+L.id).value=L.s;$('sv'+L.id).textContent=L.s+'%'}function enable(L,on){['on','off','b','h','s','identify','forget'].forEach(x=>{const e=$(x+L.id);if(e)e.disabled=!on});document.querySelectorAll('[data-light="'+L.id+'"] .color').forEach(x=>x.disabled=!on);$('connect'+L.id).disabled=on;$('status'+L.id).textContent=on?'CONNECTED · '+shortId(L.device?.id):L.savedId?'SAVED · RECONNECT':'DISCONNECTED';$('status'+L.id).classList.toggle('on',on)}function shortId(id){return id?id.slice(-6).toUpperCase():'—'}async function connect(L){try{if(!navigator.bluetooth)throw Error('Use Chrome on the Mac for Bluetooth control.');const d=await navigator.bluetooth.requestDevice({filters:[{name:'BT_LED'}],optionalServices:[SERVICE]});if(lights.some(x=>x!==L&&x.device&&x.device.id===d.id))throw Error('That BT_LED is already assigned to '+lights.find(x=>x!==L&&x.device&&x.device.id===d.id).label+'.');L.device=d;L.savedId=d.id;localStorage.setItem('w3bc.gvm.device.'+L.id,d.id);d.addEventListener('gattserverdisconnected',()=>{L.ch=null;enable(L,false)});const server=await d.gatt.connect(),svc=await server.getPrimaryService(SERVICE);L.ch=await svc.getCharacteristic(CHAR);enable(L,true)}catch(e){$('status'+L.id).textContent='CONNECT FAILED';alert(e.message)}}async function identify(L){if(!L.ch)return;const old={b:L.b,h:L.h,s:L.s};for(let i=0;i<3;i++){await send(L,0x02,100);await sleep(180);await send(L,0x02,5);await sleep(180)}await hsi(L,old.b,old.h,old.s)}function rename(L){const name=prompt('Name this studio light:',L.label);if(!name||!name.trim())return;L.label=name.trim().slice(0,30);localStorage.setItem('w3bc.gvm.name.'+L.id,L.label);$('name'+L.id).textContent=L.label}function forget(L){if(L.device?.gatt?.connected)L.device.gatt.disconnect();L.device=null;L.ch=null;L.savedId='';localStorage.removeItem('w3bc.gvm.device.'+L.id);enable(L,false)}function later(L,fn){clearTimeout(L.timer);L.timer=setTimeout(fn,90)}async function faceReq(state){if(!face.host)throw Error('Key Light has not been discovered yet.');const opt=state?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({host:face.host,state})}:{};const r=await fetch(BRIDGE+'/elgato?host='+encodeURIComponent(face.host),opt),j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'Elgato request failed');return j.data}async function faceConnect(){const btn=$('faceConnect');try{btn.disabled=true;btn.textContent='FINDING…';$('faceStatus').textContent='SEARCHING NETWORK';let data;if(face.host){try{data=await faceReq()}catch{face.host=''}}if(!face.host){const r=await fetch(BRIDGE+'/elgato/discover?ts='+Date.now(),{cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'No Key Light found');face.host=j.host;face.name=j.name||'Elgato Key Light';data=j.data;localStorage.setItem('w3bc.elgato.host',face.host);localStorage.setItem('w3bc.elgato.name',face.name)}const l=data?.lights?.[0];if(l){face.b=l.brightness??face.b;face.k=l.temperature??face.k}face.connected=true;faceSync();$('faceName').textContent=face.name;$('faceFound').textContent=face.host;$('faceStatus').textContent='CONNECTED';$('faceStatus').classList.add('on');btn.textContent='CONNECTED'}catch(e){face.connected=false;$('faceStatus').textContent='NOT FOUND';$('faceStatus').classList.remove('on');btn.disabled=false;btn.textContent='FIND KEY LIGHT';alert('Elgato: '+e.message+'\n\nMake sure the Key Light is powered on, connected to the same Wi-Fi as this Mac, and the W3BC bridge Terminal window is still running.')}}function faceSync(){$('faceB').value=face.b;$('faceBV').textContent=face.b+'%';$('faceK').value=face.k;$('faceKV').textContent=Math.round(1000000/face.k)+'K';['faceOn','faceOff','faceB','faceK'].forEach(id=>$(id).disabled=!face.connected)}async function faceSet(state){try{await faceReq(state)}catch(e){$('faceStatus').textContent='OFFLINE';$('faceStatus').classList.remove('on')}}function render(){const colors=[['RED',0],['GREEN',120],['BLUE',220],['PINK',330],['CYAN',185],['PURPLE',270],['AMBER',35],['WHITE',0]];$('fixtures').innerHTML=lights.map(L=>'<div class="fixture '+(L.id===1?'blue':L.id===2?'pink':'third')+'" data-light="'+L.id+'"><div class="fh"><div><div class="fname" id="name'+L.id+'">'+L.label+'</div><div class="fsub">GVM RGB · BT_LED · SLOT '+L.id+'</div></div><div class="status" id="status'+L.id+'">'+(L.savedId?'SAVED · RECONNECT':'DISCONNECTED')+'</div></div><div class="body"><div class="row"><button class="lbtn primary" id="connect'+L.id+'">CONNECT</button><button class="lbtn good" id="on'+L.id+'" disabled>ON</button><button class="lbtn danger" id="off'+L.id+'" disabled>OFF</button></div><div class="manage"><button class="lbtn" id="identify'+L.id+'" disabled>IDENTIFY</button><button class="lbtn" id="rename'+L.id+'">RENAME</button><button class="lbtn danger" id="forget'+L.id+'" disabled>FORGET</button></div><div class="group"><label>BRIGHTNESS <strong id="bv'+L.id+'">'+L.b+'%</strong></label><input id="b'+L.id+'" type="range" min="0" max="100" value="'+L.b+'" disabled></div><div class="group"><label>HUE <strong id="hv'+L.id+'">'+L.h+'°</strong></label><input id="h'+L.id+'" type="range" min="0" max="360" value="'+L.h+'" disabled><label>SATURATION <strong id="sv'+L.id+'">'+L.s+'%</strong></label><input id="s'+L.id+'" type="range" min="0" max="100" value="'+L.s+'" disabled></div><div class="colors">'+colors.map(c=>'<button class="color" style="--sw:hsl('+c[1]+' 100% 35%)" data-h="'+c[1]+'" '+(c[0]==='WHITE'?'data-white="1"':'')+' disabled>'+c[0]+'</button>').join('')+'</div><div class="hint">Connect any BT_LED, hit IDENTIFY, then RENAME it. The browser remembers its device ID.</div></div></div>').join('')+'<div class="fixture face"><div class="fh"><div><div class="fname" id="faceName">'+face.name+'</div><div class="fsub">ELGATO · LOCAL WI-FI</div></div><div class="status" id="faceStatus">'+(face.host?'SAVED · READY':'NOT CONNECTED')+'</div></div><div class="body"><div class="row"><button class="lbtn primary" id="faceConnect">'+(face.host?'CONNECT':'FIND KEY LIGHT')+'</button><button class="lbtn good" id="faceOn" disabled>ON</button><button class="lbtn danger" id="faceOff" disabled>OFF</button></div><div class="hint" id="faceFound">'+(face.host?face.host:'Automatic network discovery — no IP entry required.')+'</div><div class="group"><label>BRIGHTNESS <strong id="faceBV">'+face.b+'%</strong></label><input id="faceB" type="range" min="3" max="100" value="'+face.b+'" disabled></div><div class="group"><label>COLOR TEMP <strong id="faceKV">'+Math.round(1000000/face.k)+'K</strong></label><input id="faceK" type="range" min="143" max="344" value="'+face.k+'" disabled></div><div class="hint">W3BC discovers the Key Light through the local bridge and remembers it for future sessions.</div></div></div>';lights.forEach(L=>{$('connect'+L.id).onclick=()=>connect(L);$('identify'+L.id).onclick=()=>identify(L);$('rename'+L.id).onclick=()=>rename(L);$('forget'+L.id).onclick=()=>forget(L);$('on'+L.id).onclick=()=>power(L,true);$('off'+L.id).onclick=()=>power(L,false);$('b'+L.id).oninput=e=>{L.b=+e.target.value;$('bv'+L.id).textContent=L.b+'%';later(L,()=>send(L,0x02,L.b))};$('h'+L.id).oninput=e=>{L.h=+e.target.value;$('hv'+L.id).textContent=L.h+'°';later(L,()=>send(L,0x04,Math.round(L.h/5)))};$('s'+L.id).oninput=e=>{L.s=+e.target.value;$('sv'+L.id).textContent=L.s+'%';later(L,()=>send(L,0x05,L.s))};document.querySelectorAll('[data-light="'+L.id+'"] .color').forEach(b=>b.onclick=()=>hsi(L,L.b,+b.dataset.h,b.dataset.white?0:100))});$('faceConnect').onclick=faceConnect;$('faceOn').onclick=()=>faceSet({on:1});$('faceOff').onclick=()=>faceSet({on:0});$('faceB').oninput=e=>{face.b=+e.target.value;$('faceBV').textContent=face.b+'%';localStorage.setItem('w3bc.elgato.b',face.b);clearTimeout(face.bt);face.bt=setTimeout(()=>faceSet({brightness:face.b}),100)};$('faceK').oninput=e=>{face.k=+e.target.value;$('faceKV').textContent=Math.round(1000000/face.k)+'K';localStorage.setItem('w3bc.elgato.k',face.k);clearTimeout(face.kt);face.kt=setTimeout(()=>faceSet({temperature:face.k}),100)}}render();$('allOn').onclick=()=>lights.forEach(L=>power(L,true));$('allOff').onclick=()=>lights.forEach(L=>power(L,false));$('w3bcPreset').onclick=()=>{hsi(lights[0],42,220,100);hsi(lights[1],48,330,100);hsi(lights[2],35,185,85)};$('allBlue').onclick=()=>lights.forEach(L=>hsi(L,45,220,100));$('allPink').onclick=()=>lights.forEach(L=>hsi(L,45,330,100));$('faceLive').onclick=()=>{if(face.connected){face.b=45;face.k=200;faceSync();faceSet({on:1,brightness:45,temperature:200})}};$('goLive').onclick=()=>{lights.forEach(L=>power(L,true));hsi(lights[0],42,220,100);hsi(lights[1],48,330,100);hsi(lights[2],35,185,85);if(face.connected){face.b=45;face.k=200;faceSync();faceSet({on:1,brightness:45,temperature:200})}};$('showOff').onclick=()=>{lights.forEach(L=>power(L,false));if(face.connected)faceSet({on:0})};setInterval(()=>{$('clock').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'})},1000)})();</script></body></html>
