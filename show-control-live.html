<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>W3BC Production Control</title><style>*{box-sizing:border-box}html,body{margin:0;background:#07090b;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh}.shell{display:grid;grid-template-rows:minmax(600px,1fr) auto;min-height:100vh}.control{width:100%;height:100%;min-height:650px;border:0;display:block;background:#07090b}.audioWrap{border-top:2px solid #22d3e5;background:#07090b;padding:8px}.audio{width:100%;height:390px;border:0;display:block;background:#07090b}@media(max-width:800px){.control{min-height:760px}.audio{height:640px}}</style></head><body><div class="shell"><iframe id="control" class="control" src="show-control.html?v=prod0820"></iframe><div class="audioWrap"><iframe class="audio" src="audio-control.html?v=prod0820"></iframe></div></div><script>(()=>{const KEY='w3bcShowStateV1',VER='w3bc-rundown-v2-20260820';let s={};try{s=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){s={}}if(localStorage.getItem('w3bcRundownVersion')!==VER){const old=Array.isArray(s.segments)?s.segments:[];const take=(kind,name,fallback={})=>{let x=old.find(z=>z.kind===kind&&(!name||String(z.name||'').toLowerCase().includes(name.toLowerCase())));return x?{...x,enabled:x.enabled!==false}:{...fallback,kind,name,enabled:true}};const open=take('camera','open',{name:'Open'});const markets=take('markets',null,{name:'Markets Now',sponsor:'Bitunix'});const news=take('news',null,{name:'News Desk'});const trenches=take('trenches',null,{name:'The Trenches'});const ai=take('ai',null,{name:'AI + Technology'});const interview=take('interview',null,{name:'Interview'});const panel=take('panel','open panel',{name:'Open Panel'});const sports=take('sports',null,{name:'Sports'});const betting=take('betting',null,{name:'Betting Desk',sponsor:'BC.GAME'});const casino={name:'BC Game Casino',kind:'panel',enabled:true,sponsor:'BC.GAME',desc:'Casino play / entertainment close'};let close=old.find(z=>z.kind==='camera'&&String(z.name||'').toLowerCase().includes('close'))||{name:'Close',kind:'camera',enabled:true};s.segments=[open,markets,news,trenches,ai,interview,panel,sports,betting,casino,close];s.current=0;localStorage.setItem(KEY,JSON.stringify(s));localStorage.setItem('w3bcRundownVersion',VER);try{new BroadcastChannel('w3bc-show').postMessage({type:'state',state:s})}catch(e){}}})();</script></body></html>
