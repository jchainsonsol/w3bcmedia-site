name: Refresh Sportsbook Odds

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/odds-refresh.yml'
  schedule:
    - cron: '7 * * * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch sportsbook odds
        env:
          ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: |
          node <<'NODE'
          const fs = require('fs');

          (async () => {
            const apiKey = process.env.ODDS_API_KEY;
            if (!apiKey) throw new Error('Missing repository secret THE_ODDS_API_KEY');

            const wanted = [
              ['americanfootball_nfl_preseason','NFL Preseason'],
              ['americanfootball_nfl','NFL'],
              ['americanfootball_ncaaf','NCAAF'],
              ['baseball_mlb','MLB'],
              ['basketball_nba','NBA'],
              ['basketball_wnba','WNBA']
            ];
            const propMarkets = [
              'player_pass_yds',
              'player_rush_yds',
              'player_receptions',
              'player_reception_yds',
              'player_anytime_td'
            ];
            const base = 'https://api.the-odds-api.com/v4/sports';
            const now = Date.now();
            const liveLookback = now - (12 * 60 * 60 * 1000);
            const horizon = now + (168 * 60 * 60 * 1000);
            let previous = {};
            try { previous = JSON.parse(fs.readFileSync('data/odds.json','utf8')); } catch (_) {}
            const out = {
              updatedAt: new Date().toISOString(),
              source: 'The Odds API',
              execution: 'BC.GAME',
              window: 'live-plus-next-7-days',
              sports: [],
              props: previous.props || [],
              propsUpdatedAt: previous.propsUpdatedAt || null,
              quota: {}
            };

            async function getSport(sportKey,label){
              const url = `${base}/${sportKey}/odds/?apiKey=${encodeURIComponent(apiKey)}&regions=us&markets=h2h,spreads,totals&oddsFormat=american&dateFormat=iso`;
              const r = await fetch(url);
              if (!r.ok) {
                const body = await r.text();
                if (r.status === 422 || r.status === 404) { console.log(`Skipping ${label}: ${r.status} ${body}`); return; }
                throw new Error(`${sportKey}: ${r.status} ${body}`);
              }
              const rawEvents = await r.json();
              const events = rawEvents.filter(ev => {
                const t = Date.parse(ev.commence_time);
                return Number.isFinite(t) && t >= liveLookback && t <= horizon;
              }).map(ev => ({...ev, w3bc_status: Date.parse(ev.commence_time) <= now ? 'LIVE_OR_STARTED' : 'PREGAME'}))
                .sort((a,b)=>Date.parse(a.commence_time)-Date.parse(b.commence_time));
              out.quota.remaining = r.headers.get('x-requests-remaining') || out.quota.remaining;
              out.quota.used = r.headers.get('x-requests-used') || out.quota.used;
              out.quota.last = r.headers.get('x-requests-last') || out.quota.last;
              console.log(`${label}: ${rawEvents.length} returned, ${events.length} retained`);
              if (events.length) out.sports.push({ key: sportKey, label, events });
            }

            for (const [sportKey,label] of wanted) await getSport(sportKey,label);

            const shouldRefreshProps = process.env.GITHUB_EVENT_NAME === 'workflow_dispatch' || process.env.GITHUB_EVENT_NAME === 'push' || new Date().getUTCHours() % 6 === 0;
            if (shouldRefreshProps) {
              const nfl = out.sports.find(s => s.key === 'americanfootball_nfl');
              const games = (nfl?.events || []).filter(e => Date.parse(e.commence_time) > now).slice(0,8);
              const props = [];
              for (const ev of games) {
                const url = `${base}/americanfootball_nfl/events/${ev.id}/odds?apiKey=${encodeURIComponent(apiKey)}&regions=us&markets=${propMarkets.join(',')}&oddsFormat=american&dateFormat=iso`;
                const r = await fetch(url);
                if (!r.ok) { console.log(`Props skip ${ev.id}: ${r.status}`); continue; }
                const j = await r.json();
                props.push({eventId:ev.id,commence_time:ev.commence_time,away_team:ev.away_team,home_team:ev.home_team,bookmakers:j.bookmakers||[]});
                out.quota.remaining = r.headers.get('x-requests-remaining') || out.quota.remaining;
                out.quota.used = r.headers.get('x-requests-used') || out.quota.used;
              }
              out.props = props;
              out.propsUpdatedAt = new Date().toISOString();
              console.log(`Saved props for ${props.length} regular-season NFL games`);
            }

            const eventCount = out.sports.reduce((n,s)=>n+s.events.length,0);
            if (!eventCount) throw new Error('No active sportsbook events returned; refusing to overwrite feed with empty data');

            fs.mkdirSync('data',{recursive:true});
            fs.writeFileSync('data/odds.json', JSON.stringify(out,null,2));
            console.log(`Saved ${eventCount} events across ${out.sports.length} sport feeds`);
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Commit updated odds feed
        run: |
          git config user.name "w3bc-odds-bot"
          git config user.email "actions@github.com"
          git add data/odds.json
          git diff --cached --quiet && exit 0
          git commit -m "Update sportsbook odds feed"
          git push
