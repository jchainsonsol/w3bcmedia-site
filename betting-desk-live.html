<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>W3BC Betting Desk</title><style>:root{--bg:#05080a;--panel:#0a1013;--line:#26343b;--cyan:#28cee0;--green:#4cdda5;--muted:#829097}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{padding:24px}.top{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid var(--line);padding-bottom:16px}.ey{font-size:12px;font-weight:900;letter-spacing:.12em;color:var(--cyan)}h1{font-size:38px;line-height:1;margin:6px 0 0}.powered{text-align:right;font-size:11px;color:var(--muted);line-height:1.5}.tabs{display:flex;gap:8px;padding:16px 0}.tab{border:1px solid var(--line);background:#091014;color:#cbd4d8;padding:9px 14px;font-size:12px;font-weight:900;cursor:pointer}.tab.on{background:var(--cyan);color:#001014;border-color:var(--cyan)}.games{display:grid;gap:10px}.game{display:grid;grid-template-columns:minmax(260px,1.5fr) repeat(3,minmax(130px,.6fr));border:1px solid var(--line);background:var(--panel)}.teams,.market{padding:14px 16px;border-right:1px solid var(--line)}.market:last-child{border-right:0}.time{font-size:10px;color:var(--muted);font-weight:800}.match{font-size:20px;font-weight:950;margin-top:7px}.market label{display:block;color:var(--muted);font-size:9px;font-weight:900;letter-spacing:.09em}.market strong{display:block;font-size:18px;margin-top:7px}.sub{font-size:10px;color:#a8b3b8;margin-top:4px}.status{padding:40px;text-align:center;color:var(--muted);font-size:15px}.foot{display:flex;justify-content:space-between;margin-top:14px;color:var(--muted);font-size:10px}.live{color:var(--green);font-weight:900}</style></head><body><div class="wrap"><div class="top"><div><div class="ey">BETTING DESK · LIVE ODDS</div><h1>Sportsbook Board</h1></div><div class="powered">POWERED BY BC.GAME<br><span id="updated">ODDS FEED WAITING</span></div></div><div class="tabs" id="tabs"></div><div class="games" id="games"><div class="status">Waiting for the first odds refresh…</div></div><div class="foot"><span>Moneyline · Spread · Total</span><span id="quota"></span></div></div><script>let DATA,current;const $=id=>document.getElementById(id);const fmt=o=>o==null?'—':(+o>0?'+':'')+o;const dt=s=>new Date(s).toLocaleString([],{weekday:'short',hour:'numeric',minute:'2-digit'});function market(book,key){return book?.markets?.find(m=>m.key===key)}function consensus(ev,key){const vals=[];for(const b of ev.bookmakers||[]){const m=market(b,key);if(m) vals.push(...m.outcomes.map(x=>({name:x.name,price:x.price,point:x.point,book:b.title})))}return vals}function renderSport(key){current=key;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.key===key));const s=DATA.sports.find(x=>x.key===key);if(!s){$('games').innerHTML='<div class="status">No games currently posted.</div>';return}$('games').innerHTML=s.events.slice(0,10).map(ev=>{const ml=consensus(ev,'h2h'),sp=consensus(ev,'spreads'),tot=consensus(ev,'totals');const homeML=ml.find(x=>x.name===ev.home_team),awayML=ml.find(x=>x.name===ev.away_team);const homeSP=sp.find(x=>x.name===ev.home_team);const over=tot.find(x=>/over/i.test(x.name));return `<div class="game"><div class="teams"><div class="time">${dt(ev.commence_time)}</div><div class="match">${ev.away_team}<br>@ ${ev.home_team}</div></div><div class="market"><label>MONEYLINE</label><strong>${fmt(awayML?.price)} / ${fmt(homeML?.price)}</strong><div class="sub">Away / Home</div></div><div class="market"><label>SPREAD</label><strong>${homeSP?.point!=null?ev.home_team.split(' ').pop()+' '+(homeSP.point>0?'+':'')+homeSP.point:'—'}</strong><div class="sub">${homeSP?fmt(homeSP.price):'Consensus feed'}</div></div><div class="market"><label>TOTAL</label><strong>${over?.point!=null?'O/U '+over.point:'—'}</strong><div class="sub">${over?fmt(over.price):'Consensus feed'}</div></div></div>`}).join('')}async function load(){try{const r=await fetch('data/odds.json?ts='+Date.now());if(!r.ok)throw Error();DATA=await r.json();$('updated').innerHTML='<span class="live">LIVE FEED</span> · '+new Date(DATA.updatedAt).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});$('quota').textContent=DATA.quota?.remaining?'API credits remaining: '+DATA.quota.remaining:'';$('tabs').innerHTML=DATA.sports.map((s,i)=>`<button class="tab ${i===0?'on':''}" data-key="${s.key}" onclick="renderSport('${s.key}')">${s.label}</button>`).join('');if(DATA.sports[0])renderSport(DATA.sports[0].key)}catch(e){$('games').innerHTML='<div class="status">Odds feed is configured. Add the GitHub secret and run the refresh workflow once.</div>'}}load();setInterval(load,300000)</script></body></html>
