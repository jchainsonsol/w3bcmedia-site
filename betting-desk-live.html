<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>W3BC Betting Desk</title><style>:root{--bg:#05080a;--panel:#0a1013;--line:#26343b;--cyan:#28cee0;--green:#4cdda5;--yellow:#ffd166;--red:#ff6c76;--muted:#829097}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{padding:24px}.top{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid var(--line);padding-bottom:16px}.ey{font-size:12px;font-weight:900;letter-spacing:.12em;color:var(--cyan)}h1{font-size:38px;line-height:1;margin:6px 0 0}.powered{text-align:right;font-size:11px;color:var(--muted);line-height:1.5}.signalCount{display:inline-flex;align-items:center;gap:7px;margin-top:7px;padding:6px 9px;border:1px solid #4a4325;background:#171507;color:var(--yellow);font-size:10px;font-weight:950;letter-spacing:.07em}.tabs{display:flex;gap:8px;padding:16px 0}.tab{border:1px solid var(--line);background:#091014;color:#cbd4d8;padding:9px 14px;font-size:12px;font-weight:900;cursor:pointer}.tab.on{background:var(--cyan);color:#001014;border-color:var(--cyan)}.games{display:grid;gap:10px}.game{display:grid;grid-template-columns:minmax(260px,1.45fr) repeat(3,minmax(145px,.62fr));border:1px solid var(--line);background:var(--panel);position:relative}.game.hot{border-color:#5c5125;box-shadow:inset 4px 0 0 var(--yellow)}.teams,.market{padding:14px 16px;border-right:1px solid var(--line)}.market:last-child{border-right:0}.time{font-size:10px;color:var(--muted);font-weight:800}.match{font-size:20px;font-weight:950;margin-top:7px}.gameSignal{display:inline-block;margin-top:10px;padding:5px 7px;background:#211d08;border:1px solid #675b22;color:var(--yellow);font-size:9px;font-weight:950;letter-spacing:.08em}.market label{display:block;color:var(--muted);font-size:9px;font-weight:900;letter-spacing:.09em}.market strong{display:block;font-size:18px;margin-top:7px}.sub{font-size:10px;color:#a8b3b8;margin-top:4px}.best{color:var(--green)!important}.bestBook{color:var(--green);font-weight:900}.edge{display:inline-block;margin-top:6px;padding:3px 5px;border:1px solid #365746;color:var(--green);background:#07140f;font-size:8px;font-weight:950;letter-spacing:.05em}.watch{color:var(--yellow)}.status{padding:40px;text-align:center;color:var(--muted);font-size:15px}.foot{display:flex;justify-content:space-between;margin-top:14px;color:var(--muted);font-size:10px}.live{color:var(--green);font-weight:900}</style></head><body><div class="wrap"><div class="top"><div><div class="ey">BETTING DESK · LIVE ODDS</div><h1>Sportsbook Board</h1></div><div class="powered">POWERED BY BC.GAME<br><span id="updated">ODDS FEED WAITING</span><br><span class="signalCount" id="signalCount">W3BC SIGNALS · 0 LIVE</span></div></div><div class="tabs" id="tabs"></div><div class="games" id="games"><div class="status">Waiting for the first odds refresh…</div></div><div class="foot"><span>Best price compares available US books · Not a prediction model</span><span id="quota"></span></div></div><script>let DATA,current;const $=id=>document.getElementById(id);const fmt=o=>o==null?'—':(+o>0?'+':'')+o;const dt=s=>new Date(s).toLocaleString([],{weekday:'short',hour:'numeric',minute:'2-digit'});function market(book,key){return book?.markets?.find(m=>m.key===key)}function allOutcomes(ev,key){const vals=[];for(const b of ev.bookmakers||[]){const m=market(b,key);if(m)for(const x of m.outcomes||[])vals.push({name:x.name,price:+x.price,point:x.point==null?null:+x.point,book:b.title,key:b.key})}return vals}function median(a){if(!a.length)return null;const s=[...a].sort((x,y)=>x-y),m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2}function americanToProb(o){o=+o;if(!o)return null;return o>0?100/(o+100):(-o)/((-o)+100)}function probToAmerican(p){if(!p||p<=0||p>=1)return null;return p>=.5?Math.round(-100*p/(1-p)):Math.round(100*(1-p)/p)}function bestML(rows,team){const a=rows.filter(x=>x.name===team&&Number.isFinite(x.price));if(!a.length)return null;const best=[...a].sort((x,y)=>y.price-x.price)[0];const avgProb=a.map(x=>americanToProb(x.price)).filter(Boolean).reduce((x,y)=>x+y,0)/a.length;const consensus=probToAmerican(avgProb);return {...best,consensus,gap:best.price-consensus,count:a.length}}function bestSpread(rows,team){const a=rows.filter(x=>x.name===team&&x.point!=null);if(!a.length)return null;const bestPoint=Math.max(...a.map(x=>x.point));const same=a.filter(x=>x.point===bestPoint).sort((x,y)=>y.price-x.price);const best=same[0];const commonPoint=median(a.map(x=>x.point));const sameMarket=a.filter(x=>x.point===commonPoint);const consensus=sameMarket.length?median(sameMarket.map(x=>x.price)):median(a.map(x=>x.price));return {...best,consensus,gap:best.price-(consensus||best.price),marketPoint:commonPoint,count:a.length}}function bestTotal(rows,type){const a=rows.filter(x=>x.name?.toLowerCase()===type&&x.point!=null);if(!a.length)return null;const chosenPoint=type==='over'?Math.min(...a.map(x=>x.point)):Math.max(...a.map(x=>x.point));const same=a.filter(x=>x.point===chosenPoint).sort((x,y)=>y.price-x.price);const best=same[0];const marketPoint=median(a.map(x=>x.point));const comparison=a.filter(x=>x.point===marketPoint);const consensus=comparison.length?median(comparison.map(x=>x.price)):median(a.map(x=>x.price));return {...best,consensus,gap:best.price-(consensus||best.price),marketPoint,count:a.length}}function notable(x,type){if(!x||x.count<2)return false;if(type==='spread'||type==='total')return Math.abs((x.point??0)-(x.marketPoint??x.point))>=.5||x.gap>=10;return x.gap>=10}function edgeLabel(x,type){if(!x||x.count<2)return'';let parts=[];if((type==='spread'||type==='total')&&x.marketPoint!=null&&x.point!==x.marketPoint)parts.push(`market ${x.marketPoint}`);if(x.gap>=5)parts.push(`${x.gap>=0?'+':''}${Math.round(x.gap)}¢ vs avg`);return parts.join(' · ')}function renderSport(key){current=key;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.key===key));const s=DATA.sports.find(x=>x.key===key);if(!s){$('games').innerHTML='<div class="status">No games currently posted.</div>';return}let signals=0;$('games').innerHTML=s.events.slice(0,10).map(ev=>{const ml=allOutcomes(ev,'h2h'),sp=allOutcomes(ev,'spreads'),tot=allOutcomes(ev,'totals');const away=bestML(ml,ev.away_team),home=bestML(ml,ev.home_team),homeSP=bestSpread(sp,ev.home_team),over=bestTotal(tot,'over');const flags=[notable(away,'ml'),notable(home,'ml'),notable(homeSP,'spread'),notable(over,'total')];const hot=flags.some(Boolean);if(hot)signals++;const mlEdge=Math.max(away?.gap||0,home?.gap||0);const mlBest=mlEdge>=(home?.gap||0)?away:home;const mlSignal=notable(away,'ml')||notable(home,'ml');const spSignal=notable(homeSP,'spread');const totalSignal=notable(over,'total');return `<div class="game ${hot?'hot':''}"><div class="teams"><div class="time">${dt(ev.commence_time)}</div><div class="match">${ev.away_team}<br>@ ${ev.home_team}</div>${hot?'<div class="gameSignal">⚡ W3BC SIGNAL</div>':''}</div><div class="market"><label>MONEYLINE · BEST AVAILABLE</label><strong class="${mlSignal?'best':''}">${fmt(away?.price)} / ${fmt(home?.price)}</strong><div class="sub">${away?.book||'—'} / ${home?.book||'—'}</div>${mlSignal&&mlBest?`<div class="edge">BEST PRICE · ${mlBest.name.split(' ').pop()} ${fmt(mlBest.price)} · ${edgeLabel(mlBest,'ml')}</div>`:''}</div><div class="market"><label>HOME SPREAD · BEST AVAILABLE</label><strong class="${spSignal?'best':''}">${homeSP?.point!=null?ev.home_team.split(' ').pop()+' '+(homeSP.point>0?'+':'')+homeSP.point:'—'}</strong><div class="sub ${spSignal?'bestBook':''}">${homeSP?fmt(homeSP.price)+' · '+homeSP.book:'—'}</div>${spSignal?`<div class="edge">VALUE GAP · ${edgeLabel(homeSP,'spread')}</div>`:''}</div><div class="market"><label>TOTAL · BEST OVER LINE</label><strong class="${totalSignal?'best':''}">${over?.point!=null?'O '+over.point:'—'}</strong><div class="sub ${totalSignal?'bestBook':''}">${over?fmt(over.price)+' · '+over.book:'—'}</div>${totalSignal?`<div class="edge">VALUE GAP · ${edgeLabel(over,'total')}</div>`:''}</div></div>`}).join('');$('signalCount').textContent=`W3BC SIGNALS · ${signals} LIVE`}async function load(){try{const r=await fetch('data/odds.json?ts='+Date.now());if(!r.ok)throw Error();DATA=await r.json();$('updated').innerHTML='<span class="live">LIVE FEED</span> · '+new Date(DATA.updatedAt).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});$('quota').textContent=DATA.quota?.remaining?'API credits remaining: '+DATA.quota.remaining:'';$('tabs').innerHTML=DATA.sports.map((s,i)=>`<button class="tab ${i===0?'on':''}" data-key="${s.key}" onclick="renderSport('${s.key}')">${s.label}</button>`).join('');if(DATA.sports[0])renderSport(current&&DATA.sports.some(x=>x.key===current)?current:DATA.sports[0].key)}catch(e){$('games').innerHTML='<div class="status">Odds feed unavailable.</div>'}}load();setInterval(load,300000)</script></body></html>
