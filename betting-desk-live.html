<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>W3BC Betting Desk</title>
<style>
:root{--bg:#05080a;--p:#081014;--l:#20323a;--c:#26d7e8;--g:#68ef8d;--r:#ff5f68;--y:#ffd166;--m:#829097;--t:#f5f8f9}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--t);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
.wrap{height:100vh;padding:12px 14px;background:radial-gradient(circle at 12% 0,#0a1f26 0,#05080a 38%)}
.top{height:58px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--l);padding:0 4px 9px}.ey{font-size:8px;letter-spacing:.15em;color:var(--c);font-weight:950}.title{font-size:28px;font-weight:950;line-height:1}.sub{font-size:8px;color:var(--m);margin-top:4px}.stamp{text-align:right;font-size:8px;color:var(--m);line-height:1.45}.stamp b{color:var(--g)}
.main{height:calc(100% - 66px);display:grid;grid-template-columns:1fr 1fr .8fr;grid-template-rows:1fr 210px;gap:10px}
.panel{border:1px solid var(--l);background:linear-gradient(180deg,#091116,#060b0e);min-height:0;overflow:hidden}.ph{height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;border-bottom:1px solid var(--l);background:#0a1418}.ph b{font-size:13px;letter-spacing:.05em}.ph span{font-size:7px;color:var(--m);letter-spacing:.08em}
.table{height:calc(100% - 38px);overflow-y:auto;scrollbar-width:thin;scrollbar-color:#2b5962 #071014}.thead,.game{display:grid;grid-template-columns:1fr 92px 92px;align-items:center}.thead{height:28px;padding:0 10px;background:#071014;border-bottom:1px solid var(--l);font-size:7px;color:#58dbe7;font-weight:900;letter-spacing:.08em}.game{min-height:54px;padding:7px 10px;border-bottom:1px solid #18262d}.match{font-size:10px;font-weight:850}.time{display:block;font-size:7px;color:var(--m);margin-top:4px}.odd{text-align:center;font-size:12px;font-weight:950}
.watch{padding:10px;height:calc(100% - 38px);overflow-y:auto;display:grid;gap:8px}.card{border:1px solid #2f6650;background:#07100c;padding:10px}.card small{color:var(--y);font-size:7px;font-weight:900}.card b{display:block;font-size:15px;margin-top:6px}.price{font-size:22px;color:var(--g);font-weight:950;margin-top:3px}
.bottom{grid-column:1/4;display:grid;grid-template-columns:1fr 1fr;gap:10px}.box{border:1px solid var(--l);background:#071014;padding:12px}.sect{font-size:12px;font-weight:950;color:#5de3ea;letter-spacing:.07em;margin-bottom:9px}.builder{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.build{border:1px solid #27545b;background:#081116;padding:10px}.build strong{font-size:9px}.build div{font-size:8px;color:#ccd6da;line-height:1.45;margin-top:5px}.source{font-size:9px;color:#cbd4d8;line-height:1.6}.source b{color:var(--c)}
@media(max-width:1100px){html,body{overflow:auto}.wrap{height:auto}.main{height:auto;grid-template-columns:1fr}.bottom{grid-column:auto;grid-template-columns:1fr}.panel{min-height:360px}}
</style></head>
<body><div class="wrap">
<div class="top"><div><div class="ey">W3BC SPORTSBOOK INTELLIGENCE</div><div class="title">Betting Desk</div><div class="sub" id="sub">LOADING CURRENT BOARD…</div></div><div class="stamp" id="stamp">SPORTSBOOK REVIEW<br><b>LIVE BOARD SNAPSHOT</b></div></div>
<div class="main" id="main"><section class="panel"><div class="ph"><b>LOADING</b></div></section></div>
</div>
<script>
async function load(){
 try{
  const r=await fetch('data/betting-desk-latest.json?ts='+Date.now(),{cache:'no-store'});
  const d=await r.json();
  document.getElementById('sub').textContent=d.date+' · UPDATED '+d.updated+' · '+d.source.toUpperCase();
  const cols=(d.columns||[]).map(c=>'<section class="panel"><div class="ph"><b>'+c.title+'</b><span>'+c.market+'</span></div><div class="table"><div class="thead"><div>MATCHUP</div><div>AWAY</div><div>HOME</div></div>'+c.games.map(g=>'<div class="game"><div class="match">'+g.matchup+'<span class="time">'+g.time+' ET</span></div><div class="odd">'+g.away+'</div><div class="odd">'+g.home+'</div></div>').join('')+'</div></section>');
  const watch='<section class="panel"><div class="ph"><b>PARLAY WATCH</b><span>DISPLAY ONLY</span></div><div class="watch">'+(d.parlayWatch||[]).map(x=>'<div class="card"><small>'+x.label+'</small><b>'+x.pick+'</b><div class="price">'+x.price+'</div></div>').join('')+'</div></section>';
  const bottom='<section class="bottom"><div class="box"><div class="sect">PARLAY BUILDER · QUICK VIEW</div><div class="builder">'+(d.parlayWatch||[]).map((x,i)=>'<div class="build"><strong>LEG '+(i+1)+'</strong><div>'+x.pick+'<br>'+x.price+'</div></div>').join('')+'</div></div><div class="box"><div class="sect">SOURCE + STATUS</div><div class="source"><b>'+d.source+'</b><br>'+d.note+'<br>No stale UFC or preseason cards are loaded.</div></div></section>';
  document.getElementById('main').innerHTML=cols.join('')+watch+bottom;
 }catch(e){
  document.getElementById('main').innerHTML='<section class="panel" style="grid-column:1/4;padding:30px"><b>BETTING DATA UNAVAILABLE</b><br><span style="color:#829097">Could not load today\'s local odds snapshot.</span></section>';
 }
}
load();
</script></body></html>
