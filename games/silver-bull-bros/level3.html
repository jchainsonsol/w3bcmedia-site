(()=>{const c=document.getElementById('g'),x=c.getContext('2d');let W,H,S,T,G,LW,Y,portrait;function fit(){portrait=innerHeight>innerWidth*1.12;W=c.width=portrait?720:1280;H=c.height=portrait?1280:720;S=portrait?1:1;T=64;G=2200;LW=82*T;Y=portrait?410:0}fit();addEventListener('resize',fit);
const atlas=new Image();atlas.src='assets/a_wide_pixel_art_game_asset_sheet_on_a_black_trans.png';let ready=0;atlas.onload=()=>ready=1;let touch={l:0,r:0,j:0},keys={},last=0,jl=0,time=0,state='play',checkpoint=110;

function pad(){let p=navigator.getGamepads?.()[0];return p?{l:(p.axes?.[0]??0)<-.25||p.buttons?.[14]?.pressed,r:(p.axes?.[0]??0)>.25||p.buttons?.[15]?.pressed,j:p.buttons?.[0]?.pressed||p.buttons?.[1]?.pressed}:{}}function I(){let p=pad();return{l:touch.l||keys.ArrowLeft||keys.KeyA||p.l,r:touch.r||keys.ArrowRight||keys.KeyD||p.r,j:touch.j||keys.Space||p.j}}
let plats=[[0,9,9,3],[11,9,5,3],[18,9,7,3],[28,9,4,3],[35,9,6,3],[44,9,5,3],[52,9,7,3],[62,9,5,3],[70,9,12,3],[4,7,3,1],[12,6,2,1],[20,7,3,1],[29,5,2,1],[37,7,2,1],[45,6,3,1],[54,5,2,1],[63,7,3,1],[72,6,3,1]].map(a=>({x:a[0]*T,y:a[1]*T,w:a[2]*T,h:a[3]*T})),coins=[5,13,21,30,38,46,55,64,73,78].map((a,i)=>({x:a*T+30,y:(i%2?6:5)*T,on:1,t:i})),spikes=[9,16,25,33,42,50,60,68].map(a=>({x:a*T,y:8*T+28,w:64,h:36})),rugs=[17,34,51,69].map(a=>({x:a*T,y:8*T,w:2*T,h:T,t:0}));let P={x:110,y:280,w:54,h:74,vx:0,vy:0,g:0,face:1,lives:3,coins:0,inv:0};
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function solids(){return plats.concat(rugs.filter(r=>r.t<.48))}function move(o,d){o.x+=o.vx*d;for(let s of solids())if(hit(o,s)){o.x=o.vx>0?s.x-o.w:s.x+s.w;o.vx=0}o.y+=o.vy*d;o.g=0;for(let s of solids())if(hit(o,s)){if(o.vy>=0){o.y=s.y-o.h;o.vy=0;o.g=1;if(o===P&&rugs.includes(s)&&!s.t)s.t=.01}else{o.y=s.y+s.h;o.vy=0}}}function hurt(){if(P.inv)return;P.lives--;P.inv=1.1;P.vy=-580;if(P.lives<=0)state='dead'}function reset(){Object.assign(P,{x:checkpoint,y:240,vx:0,vy:0,lives:3,inv:0});state='play'}
