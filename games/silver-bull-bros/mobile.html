<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#03050a"><title>Silver Bull Bros. Mobile</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020409;touch-action:none;overscroll-behavior:none;font-family:Inter,system-ui,sans-serif}*{box-sizing:border-box}#wrap{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 10%,#13365e,#050911 55%,#020306)}canvas{display:block;width:100vw;height:100dvh;max-width:56.25dvh;max-height:177.78vw;object-fit:contain}.controls{position:fixed;inset:0;pointer-events:none}.btn{position:absolute;pointer-events:auto;display:grid;place-items:center;width:92px;height:92px;border-radius:50%;border:2px solid rgba(255,255,255,.34);background:rgba(8,16,28,.72);backdrop-filter:blur(8px);color:#fff;font:900 30px/1 system-ui;box-shadow:inset 0 0 0 5px rgba(255,255,255,.035),0 8px 25px rgba(0,0,0,.35);user-select:none;-webkit-user-select:none}.btn.on{transform:scale(.94);background:rgba(44,113,172,.88)}#left{left:max(22px,env(safe-area-inset-left));bottom:max(38px,env(safe-area-inset-bottom));}#right{left:max(126px,calc(env(safe-area-inset-left) + 104px));bottom:max(38px,env(safe-area-inset-bottom));}#jump{right:max(26px,env(safe-area-inset-right));bottom:max(48px,env(safe-area-inset-bottom));width:108px;height:108px;border-color:rgba(56,240,154,.7);background:rgba(16,75,56,.72);font-size:20px;letter-spacing:.04em}.tag{position:absolute;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);font:800 9px/1 monospace;letter-spacing:.14em;color:#9db0c7;opacity:.7;pointer-events:none}
</style><style>#nextLevelBtn{display:none;position:fixed;z-index:30;left:50%;top:52%;transform:translate(-50%,-50%);width:min(420px,78vw);min-height:72px;border:2px solid #7dffc0;border-radius:14px;background:#35ef95;color:#07110c;font:900 18px system-ui;letter-spacing:.04em;box-shadow:0 12px 30px #0009}#nextLevelBtn.show{display:block}</style></head><body><div id="wrap"><canvas id="game" width="720" height="1280"></canvas></div><div class="controls"><div class="btn" id="left">◀</div><div class="btn" id="right">▶</div><div class="btn" id="jump">JUMP</div><div class="tag">SILVER BULL BROS. · MOBILE</div></div><button id="nextLevelBtn" type="button">NEXT: BEAR MARKET ▶</button>
<script>(()=>{'use strict';
const cv=document.getElementById('game'),ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=true;const nextBtn=document.getElementById('nextLevelBtn');nextBtn.onclick=()=>location.replace('level2.html?v=7');const W=720,H=1280,T=64,G=2150,LEVEL_W=68*T,YOFF=390;const atlas=new Image();atlas.src='assets/a_wide_pixel_art_game_asset_sheet_on_a_black_trans.png';let ready=false;atlas.onload=()=>ready=true;
const touch={l:false,r:false,j:false};function bind(id,key){const el=document.getElementById(id);const on=e=>{e.preventDefault();touch[key]=true;el.classList.add('on');if(key==='j')navigator.vibrate?.(18)};const off=e=>{e.preventDefault();touch[key]=false;el.classList.remove('on')};['pointerdown','touchstart'].forEach(n=>el.addEventListener(n,on,{passive:false}));['pointerup','pointercancel','pointerleave','touchend','touchcancel'].forEach(n=>el.addEventListener(n,off,{passive:false}))}bind('left','l');bind('right','r');bind('jump','j');
let last=0,acc=0,jLatch=false,shake=0,flash=0,time=0,state='play';const platforms=[[0,9,13,3],[15,9,8,3],[25,9,9,3],[36,9,8,3],[46,9,11,3],[59,9,9,3],[5,7,3,1],[10,6,3,1],[18,7,3,1],[27,6,3,1],[32,7,2,1],[39,6,3,1],[48,7,3,1],[54,6,2,1],[62,7,3,1]].map(([a,b,w,h])=>({x:a*T,y:b*T,w:w*T,h:h*T}));const coinPts=[[4,5],[7,6],[11,5],[18,6],[21,7],[27,5],[31,6],[38,5],[42,6],[49,6],[55,5],[61,6],[65,7]],enemyPts=[[9,8],[20,8],[29,8],[41,8],[52,8],[63,8]],candlePts=[[14,8,'red'],[24,8,'green'],[35,8,'red'],[45,8,'red'],[58,8,'green']];let coins=[],enemies=[],candles=[],fx=[];const P={x:110,y:340,w:54,h:74,vx:0,vy:0,g:false,face:1,coins:0,lives:3,inv:0,anim:0};
function reset(){nextBtn.classList.remove('show');Object.assign(P,{x:110,y:340,vx:0,vy:0,g:false,face:1,coins:0,lives:3,inv:0,anim:0});coins=coinPts.map(([a,b],i)=>({x:a*T+32,y:b*T+20,t:i*.4,on:1}));enemies=enemyPts.map(([a,b],i)=>({x:a*T+8,y:b*T+4,w:52,h:58,vx:i%2?82:-82,vy:0,g:false,dead:0,type:i===4?'bear':'paper'}));candles=candlePts.map(([a,b,k])=>({x:a*T+18,y:b*T-14,w:34,h:78,k,dead:0}));fx=[];time=0;state='play'}reset();
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function move(o,dt){o.x+=o.vx*dt;for(const s of platforms)if(hit(o,s)){if(o.vx>0)o.x=s.x-o.w;else if(o.vx<0)o.x=s.x+s.w;o.vx=0}o.y+=o.vy*dt;o.g=false;for(const s of platforms)if(hit(o,s)){if(o.vy>=0){o.y=s.y-o.h;o.vy=0;o.g=true}else{o.y=s.y+s.h;o.vy=0}}}function burst(x,y,n=12,c='#fff'){for(let i=0;i<n;i++)fx.push({x,y,vx:(Math.random()-.5)*320,vy:-Math.random()*330,l:.35+Math.random()*.45,s:3+Math.random()*7,c})}function hurt(){if(P.inv>0)return;P.lives--;P.inv=1.25;P.vy=-600;P.vx=-P.face*280;shake=14;flash=.15;burst(P.x+28,P.y+32,16,'#ff4d67');navigator.vibrate?.([40,20,40]);if(P.lives<=0)state='dead'}
function update(dt){if(state!=='play')return;time+=dt;shake*=.87;flash=Math.max(0,flash-dt);let dir=(touch.r?1:0)-(touch.l?1:0);P.vx+=(dir*360-P.vx)*Math.min(1,dt*12);if(!dir)P.vx*=Math.pow(.004,dt);if(dir)P.face=dir;if(touch.j&&!jLatch&&P.g){P.vy=-825;P.g=false;burst(P.x+28,P.y+72,8,'#9fb3c9')}jLatch=touch.j;P.vy+=G*dt;move(P,dt);P.x=Math.max(0,Math.min(LEVEL_W-P.w,P.x));P.inv=Math.max(0,P.inv-dt);P.anim+=dt*(Math.abs(P.vx)>30?11:3);if(P.y>980){hurt();P.x=Math.max(90,P.x-420);P.y=180;P.vy=0}for(const q of coins){q.t+=dt*6;if(q.on&&Math.hypot(P.x+27-q.x,P.y+35-q.y)<42){q.on=0;P.coins++;burst(q.x,q.y,10,'#ffd13d')}}for(const e of enemies){if(e.dead){e.dead-=dt;continue}e.vy+=G*dt;move(e,dt);if(e.g&&Math.abs(e.vx)<35)e.vx=(Math.random()<.5?-1:1)*82;if(hit(P,e)){if(P.vy>130&&P.y+P.h-10<e.y+22){e.dead=.5;P.vy=-560;P.coins+=e.type==='bear'?5:2;shake=7;burst(e.x+26,e.y+25,14,'#ffd86a')}else hurt()}}for(const k of candles){if(k.dead)continue;if(hit(P,k)){if(k.k==='red'&&P.vy>120){k.dead=1;P.vy=-540;P.coins+=3;shake=6;burst(k.x+17,k.y+30,18,'#ff394f')}else if(k.k==='green'){P.vy=-760;P.coins++;burst(k.x+17,k.y,12,'#45f391')}else hurt()}}if(P.x>66*T&&state==='play'){state='win';localStorage.setItem('sbb_level1','1');localStorage.setItem('sbb_unlocked','2');nextBtn.classList.add('show');navigator.vibrate?.([60,50,100])}for(const f of fx){f.l-=dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=700*dt}fx=fx.filter(f=>f.l>0)}
function crop(sx,sy,sw,sh,dx,dy,dw,dh,flip=0,a=1){if(!ready)return;ctx.save();ctx.globalAlpha=a;if(flip){ctx.translate(dx+dw,dy);ctx.scale(-1,1);ctx.drawImage(atlas,sx,sy,sw,sh,0,0,dw,dh)}else ctx.drawImage(atlas,sx,sy,sw,sh,dx,dy,dw,dh);ctx.restore()}function txt(t,x,y,z=24,align='left',col='#fff'){ctx.font=`900 ${z}px system-ui,sans-serif`;ctx.textAlign=align;ctx.lineJoin='round';ctx.strokeStyle='#05070c';ctx.lineWidth=Math.max(3,z*.12);ctx.strokeText(t,x,y);ctx.fillStyle=col;ctx.fillText(t,x,y)}
function bg(cam){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#061529');g.addColorStop(.5,'#12365f');g.addColorStop(1,'#05070c');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);crop(742,565,330,245,-120-(cam*.09%390),330,760,565,0,.8);crop(742,565,330,245,600-(cam*.09%390),330,760,565,0,.8);ctx.fillStyle='rgba(3,7,14,.3)';ctx.fillRect(0,0,W,H);for(let i=0;i<50;i++){ctx.fillStyle='rgba(190,225,255,.22)';ctx.fillRect((i*173-cam*.03)%850,(i*79)%500,2,2)}}function tile(s,cam){let px=s.x-cam,py=s.y+YOFF;ctx.fillStyle='#182638';ctx.fillRect(px,py,s.w,s.h);for(let xx=0;xx<s.w;xx+=T){let i=((xx/T)|0)%3;crop(14+i*77,552,70,70,px+xx,py,T,T);for(let yy=T;yy<s.h;yy+=T)crop(170+i*72,623,68,68,px+xx,py+yy,T,T)}}function hero(cam){let px=P.x-cam,py=P.y+YOFF,flip=P.face<0;if(P.inv>0&&Math.floor(P.inv*14)%2)return;if(!P.g){if(P.vy<0)crop(1055,35,90,145,px-22,py-42,100,126,flip);else crop(1315,38,95,145,px-22,py-42,100,126,flip)}else if(Math.abs(P.vx)>35){let f=Math.floor(P.anim)%4;crop(270+f*108,38,100,140,px-22,py-42,100,126,flip)}else{let f=Math.floor(P.anim*.35)%3;crop(710+f*93,45,86,132,px-17,py-37,91,120,flip)}}function coin(q,cam){if(!q.on)return;let bob=Math.sin(q.t)*6;crop(1160,205,55,64,q.x-cam-28,q.y+YOFF+bob-30,56,64)}function enemy(e,cam){if(e.dead<=0)return;let a=Math.min(1,e.dead/.25);if(e.type==='bear')crop(300,355,125,165,e.x-cam-28,e.y+YOFF-52,112,130,e.vx<0,a);else crop(e.vx<0?145:18,355,125,165,e.x-cam-24,e.y+YOFF-58,110,136,e.vx<0,a)}function candle(k,cam){if(k.dead)return;crop(k.k==='red'?462:568,354,k.k==='red'?95:96,174,k.x-cam-28,k.y+YOFF-54,90,140)}function flag(cam){let px=66*T-cam;ctx.fillStyle='#dfe8f2';ctx.fillRect(px,320+YOFF,8,256);ctx.fillStyle='#080b10';ctx.fillRect(px+8,336+YOFF,150,74);txt('1% BETTER',px+83,383+YOFF,22,'center','#fff');ctx.strokeStyle='#38f09a';ctx.lineWidth=5;ctx.strokeRect(px+8,336+YOFF,150,74)}function particles(cam){for(const f of fx){ctx.globalAlpha=Math.max(0,f.l*2);ctx.fillStyle=f.c;ctx.fillRect(f.x-cam,f.y+YOFF,f.s,f.s)}ctx.globalAlpha=1}
function hud(){ctx.fillStyle='rgba(3,7,13,.83)';ctx.fillRect(16,calcSafe(16),688,106);ctx.strokeStyle='#2d90ff';ctx.lineWidth=2;ctx.strokeRect(16,calcSafe(16),688,106);crop(26,824,72,72,30,calcSafe(28),58,58);txt(`× ${P.lives}`,96,calcSafe(68),22,'left','#fff');crop(138,826,52,62,192,calcSafe(30),46,52);txt(`× ${P.coins}`,244,calcSafe(68),22,'left','#ffd84a');txt('WORLD 1-1',390,calcSafe(52),16,'left','#fff');txt('BULLPEN CITY',390,calcSafe(76),14,'left','#9ec7ef');txt(`${Math.floor(time)}s`,660,calcSafe(65),18,'right','#fff');ctx.fillStyle='#132538';ctx.fillRect(30,calcSafe(96),660,7);ctx.fillStyle='#38ef98';ctx.fillRect(30,calcSafe(96),660*Math.min(1,P.x/(66*T)),7)}function calcSafe(v){return v+20}
function overlay(){if(state==='dead'||state==='win'){ctx.fillStyle=state==='win'?'rgba(0,12,7,.82)':'rgba(14,0,4,.82)';ctx.fillRect(0,0,W,H);txt(state==='win'?'BULL RUN COMPLETE':'LIQUIDATED',W/2,410,42,'center',state==='win'?'#41f19a':'#ff4d67');txt(state==='win'?`${P.coins} SILVER · ${Math.floor(time)}s`:'PAPER HANDS GOT YOU',W/2,470,20,'center','#fff');if(state==='dead'){ctx.fillStyle='#35ef95';ctx.fillRect(150,535,420,72);txt('TAP TO RELOAD',W/2,580,18,'center','#07110c')}}}cv.addEventListener('pointerdown',()=>{if(state==='dead')reset()});
function render(){let cam=Math.max(0,Math.min(LEVEL_W-W,P.x-W*.38)),sx=shake?(Math.random()-.5)*shake:0,sy=shake?(Math.random()-.5)*shake:0;ctx.save();ctx.translate(sx,sy);bg(cam);for(const s of platforms)tile(s,cam);flag(cam);for(const q of coins)coin(q,cam);for(const k of candles)candle(k,cam);for(const e of enemies)enemy(e,cam);hero(cam);particles(cam);ctx.restore();hud();overlay();if(flash){ctx.fillStyle=`rgba(255,50,80,${flash*2.5})`;ctx.fillRect(0,0,W,H)}if(!ready){ctx.fillStyle='#03060a';ctx.fillRect(0,0,W,H);txt('LOADING BULL RUN...',W/2,H/2,25,'center','#fff')}}function loop(t){let dt=Math.min(.032,(t-last)/1000||0);last=t;acc+=dt;while(acc>=1/120){update(1/120);acc-=1/120}render();requestAnimationFrame(loop)}requestAnimationFrame(loop);
})();</script></body></html>
