<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<meta name="theme-color" content="#050811" />
<title>Silver Bull Bros. — Bullpen City</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03050a;color:#fff;font-family:Inter,system-ui,sans-serif;touch-action:none}*{box-sizing:border-box}
#wrap{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 20%,#10264a 0,#070b13 45%,#020306 100%)}
canvas{display:block;width:min(100vw,177.78vh);height:min(56.25vw,100vh);image-rendering:auto;background:#081221;box-shadow:0 30px 90px #000}
#status{position:fixed;left:50%;bottom:9px;transform:translateX(-50%);font:700 10px/1 monospace;letter-spacing:.12em;color:#a8b8cc;opacity:.8;pointer-events:none;white-space:nowrap}
@media(max-width:700px){#status{display:none}}
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="1280" height="720"></canvas></div>
<div id="status">D-PAD / LEFT STICK MOVE · A / SOUTH JUMP · START PAUSE</div>
<script>
(()=>{'use strict';
const cv=document.getElementById('game'),ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=true;
const W=1280,H=720,T=64,G=2150,LEVEL_W=68*T;
const atlas=new Image();atlas.src='assets/a_wide_pixel_art_game_asset_sheet_on_a_black_trans.png';
let atlasReady=false;atlas.onload=()=>atlasReady=true;
const keys={};let state='play',pause=false,last=0,acc=0,jLatch=false,padPrev=false,shake=0,flash=0,time=0;
addEventListener('keydown',e=>{keys[e.code]=true;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code))e.preventDefault();if(e.code==='Enter')startPause()});addEventListener('keyup',e=>keys[e.code]=false);
function pad(){let p=navigator.getGamepads?.()[0];if(!p)return{l:0,r:0,j:0,s:0};return{l:(p.axes?.[0]??0)<-.25||p.buttons?.[14]?.pressed,r:(p.axes?.[0]??0)>.25||p.buttons?.[15]?.pressed,j:p.buttons?.[0]?.pressed||p.buttons?.[1]?.pressed,s:p.buttons?.[9]?.pressed}}
function controls(){let p=pad();if(p.s&&!padPrev)startPause();padPrev=p.s;return{l:keys.ArrowLeft||keys.KeyA||p.l,r:keys.ArrowRight||keys.KeyD||p.r,j:keys.Space||keys.KeyZ||keys.KeyK||p.j}}
function startPause(){if(state==='title'||state==='win'||state==='dead'){reset();state='play';pause=false}else pause=!pause}
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
const platforms=[[0,9,13,3],[15,9,8,3],[25,9,9,3],[36,9,8,3],[46,9,11,3],[59,9,9,3],[5,7,3,1],[10,6,3,1],[18,7,3,1],[27,6,3,1],[32,7,2,1],[39,6,3,1],[48,7,3,1],[54,6,2,1],[62,7,3,1]].map(([a,b,w,h])=>({x:a*T,y:b*T,w:w*T,h:h*T}));
const coinPts=[[4,5],[7,6],[11,5],[18,6],[21,7],[27,5],[31,6],[38,5],[42,6],[49,6],[55,5],[61,6],[65,7]];
const enemyPts=[[9,8],[20,8],[29,8],[41,8],[52,8],[63,8]];
const candlePts=[[14,8,'red'],[24,8,'green'],[35,8,'red'],[45,8,'red'],[58,8,'green']];
let coins=[],enemies=[],candles=[],fx=[];
const P={x:110,y:340,w:54,h:74,vx:0,vy:0,g:false,face:1,coins:0,lives:3,inv:0,anim:0};
function reset(){Object.assign(P,{x:110,y:340,vx:0,vy:0,g:false,face:1,coins:0,lives:3,inv:0,anim:0});coins=coinPts.map(([a,b],i)=>({x:a*T+32,y:b*T+20,t:i*.4,on:1}));enemies=enemyPts.map(([a,b],i)=>({x:a*T+8,y:b*T+4,w:52,h:58,vx:i%2?82:-82,vy:0,g:false,dead:0,type:i===4?'bear':'paper'}));candles=candlePts.map(([a,b,k])=>({x:a*T+18,y:b*T-14,w:34,h:78,k,dead:0}));fx=[];time=0;shake=0;flash=0}
function move(o,dt){o.x+=o.vx*dt;for(const s of platforms)if(hit(o,s)){if(o.vx>0)o.x=s.x-o.w;else if(o.vx<0)o.x=s.x+s.w;o.vx=0}o.y+=o.vy*dt;o.g=false;for(const s of platforms)if(hit(o,s)){if(o.vy>=0){o.y=s.y-o.h;o.vy=0;o.g=true}else{o.y=s.y+s.h;o.vy=0}}}
function burst(x,y,n=12,c='#fff'){for(let i=0;i<n;i++)fx.push({x,y,vx:(Math.random()-.5)*320,vy:-Math.random()*330,l:.35+Math.random()*.45,s:3+Math.random()*7,c})}
function hurt(){if(P.inv>0)return;P.lives--;P.inv=1.25;P.vy=-600;P.vx=-P.face*300;shake=14;flash=.15;burst(P.x+28,P.y+32,16,'#ff4d67');if(P.lives<=0)state='dead'}
function update(dt){if(state!=='play'||pause)return;time+=dt;shake*=.87;flash=Math.max(0,flash-dt);let I=controls(),dir=(I.r?1:0)-(I.l?1:0);P.vx+=(dir*390-P.vx)*Math.min(1,dt*12);if(!dir)P.vx*=Math.pow(.004,dt);if(dir)P.face=dir;if(I.j&&!jLatch&&P.g){P.vy=-825;P.g=false;burst(P.x+28,P.y+72,8,'#9fb3c9')}jLatch=!!I.j;P.vy+=G*dt;move(P,dt);P.x=Math.max(0,Math.min(LEVEL_W-P.w,P.x));P.inv=Math.max(0,P.inv-dt);P.anim+=dt*(Math.abs(P.vx)>30?11:3);
if(P.y>H+250){hurt();P.x=Math.max(90,P.x-420);P.y=180;P.vy=0}
for(const q of coins){q.t+=dt*6;if(q.on&&Math.hypot(P.x+27-q.x,P.y+35-q.y)<42){q.on=0;P.coins++;burst(q.x,q.y,10,'#ffd13d')}}
for(const e of enemies){if(e.dead){e.dead-=dt;continue}e.vy+=G*dt;move(e,dt);if(e.g&&Math.abs(e.vx)<35)e.vx=(Math.random()<.5?-1:1)*82;if(hit(P,e)){if(P.vy>130&&P.y+P.h-10<e.y+22){e.dead=.5;P.vy=-560;P.coins+=e.type==='bear'?5:2;shake=7;burst(e.x+26,e.y+25,14,'#ffd86a')}else hurt()}}
for(const k of candles){if(k.dead)continue;if(hit(P,k)){if(k.k==='red'&&P.vy>120){k.dead=1;P.vy=-540;P.coins+=3;shake=6;burst(k.x+17,k.y+30,18,'#ff394f')}else if(k.k==='green'){P.vy=-760;P.coins++;burst(k.x+17,k.y,12,'#45f391')}else hurt()}}
if(P.x>66*T)state='win';for(const f of fx){f.l-=dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=700*dt}fx=fx.filter(f=>f.l>0)}
function crop(sx,sy,sw,sh,dx,dy,dw,dh,flip=0,a=1){if(!atlasReady)return;ctx.save();ctx.globalAlpha=a;if(flip){ctx.translate(dx+dw,dy);ctx.scale(-1,1);ctx.drawImage(atlas,sx,sy,sw,sh,0,0,dw,dh)}else ctx.drawImage(atlas,sx,sy,sw,sh,dx,dy,dw,dh);ctx.restore()}
function txt(t,x,y,z=24,align='left',col='#fff'){ctx.font=`900 ${z}px system-ui,sans-serif`;ctx.textAlign=align;ctx.lineJoin='round';ctx.strokeStyle='#05070c';ctx.lineWidth=Math.max(3,z*.12);ctx.strokeText(t,x,y);ctx.fillStyle=col;ctx.fillText(t,x,y)}
function background(cam){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#07182e');g.addColorStop(.58,'#102a4b');g.addColorStop(1,'#080b12');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
// Bullpen City crop from the generated atlas, used as parallax skyline
crop(742,565,330,245,-80-(cam*.10%420),145,760,565,0,.72);crop(742,565,330,245,680-(cam*.10%420),145,760,565,0,.72);
ctx.fillStyle='rgba(3,7,14,.28)';ctx.fillRect(0,0,W,H);for(let i=0;i<45;i++){ctx.fillStyle='rgba(180,220,255,.22)';ctx.fillRect((i*173-cam*.03)%1400,(i*67)%300,2,2)}}
function tile(s,cam){let px=s.x-cam,py=s.y;ctx.fillStyle='#182638';ctx.fillRect(px,py,s.w,s.h);for(let xx=0;xx<s.w;xx+=T){let i=((xx/T)|0)%3;crop(14+i*77,552,70,70,px+xx,py,T,T);for(let yy=T;yy<s.h;yy+=T){crop(170+i*72,623,68,68,px+xx,py+yy,T,T)}}ctx.fillStyle='rgba(0,0,0,.14)';ctx.fillRect(px,py+s.h-8,s.w,8)}
function hero(cam){let px=P.x-cam,py=P.y,flip=P.face<0;if(P.inv>0&&Math.floor(P.inv*14)%2)return;if(!P.g){if(P.vy<0)crop(1055,35,90,145,px-22,py-42,100,126,flip);else crop(1315,38,95,145,px-22,py-42,100,126,flip)}else if(Math.abs(P.vx)>35){let f=Math.floor(P.anim)%4;crop(270+f*108,38,100,140,px-22,py-42,100,126,flip)}else{let f=Math.floor(P.anim*.35)%3;crop(710+f*93,45,86,132,px-17,py-37,91,120,flip)}}
function coin(q,cam){if(!q.on)return;let bob=Math.sin(q.t)*6,scale=.78+.22*Math.abs(Math.sin(q.t));ctx.save();ctx.translate(q.x-cam,q.y+bob);ctx.scale(scale,1);crop(1160,205,55,64,-28,-30,56,64);ctx.restore()}
function enemy(e,cam){if(e.dead<=0)return;let a=Math.min(1,e.dead/.25);if(e.type==='bear')crop(300,355,125,165,e.x-cam-28,e.y-52,112,130,e.vx<0,a);else crop(e.vx<0?145:18,355,125,165,e.x-cam-24,e.y-58,110,136,e.vx<0,a)}
function candle(k,cam){if(k.dead)return;if(k.k==='red')crop(462,354,95,174,k.x-cam-28,k.y-54,90,140);else crop(568,354,96,174,k.x-cam-28,k.y-54,90,140)}
function flag(cam){let px=66*T-cam;ctx.fillStyle='#dfe8f2';ctx.fillRect(px,320,8,256);ctx.fillStyle='#080b10';ctx.fillRect(px+8,336,150,74);txt('1% BETTER',px+83,383,22,'center','#fff');ctx.strokeStyle='#38f09a';ctx.lineWidth=5;ctx.strokeRect(px+8,336,150,74)}
function particles(cam){for(const f of fx){ctx.globalAlpha=Math.max(0,f.l*2);ctx.fillStyle=f.c;ctx.fillRect(f.x-cam,f.y,f.s,f.s)}ctx.globalAlpha=1}
function hud(){ctx.fillStyle='rgba(3,7,13,.82)';ctx.fillRect(18,18,590,70);ctx.strokeStyle='#2d90ff';ctx.lineWidth=2;ctx.strokeRect(18,18,590,70);crop(26,824,72,72,30,24,58,58);txt(`× ${P.lives}`,94,60,23,'left','#f1f5f9');crop(138,826,52,62,183,25,48,54);txt(`× ${P.coins}`,239,60,23,'left','#ffd84a');txt('WORLD 1-1',350,46,17,'left','#fff');txt('BULLPEN CITY',350,68,14,'left','#a6c8ee');txt(`TIME ${Math.floor(time)}`,488,59,18,'left','#fff');ctx.fillStyle='rgba(3,7,13,.72)';ctx.fillRect(W-235,22,205,58);txt('BULL RUN',W-220,48,13,'left','#9db4cd');ctx.fillStyle='#15283c';ctx.fillRect(W-220,58,170,8);ctx.fillStyle='#36ef96';ctx.fillRect(W-220,58,170*Math.min(1,P.x/(66*T)),8)}
function title(){background(0);ctx.fillStyle='rgba(0,0,0,.28)';ctx.fillRect(0,0,W,H);crop(22,15,230,245,75,72,300,320);crop(270,38,100,140,830,230,180,250);txt('WORLD 1',720,145,28,'left','#55d9ff');txt('BULLPEN CITY',720,185,46,'left','#fff');txt('RUN THE MARKET.',720,450,22,'left','#c6d6e8');txt('STOMP THE PAPER HANDS.',720,482,22,'left','#c6d6e8');ctx.fillStyle='#35ef95';ctx.fillRect(720,530,355,66);txt('PRESS START / ENTER',898,573,20,'center','#07110c');txt('D-PAD / LEFT STICK  •  A TO JUMP',898,628,14,'center','#a8b8c9')}
function overlay(){if(pause){ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,0,W,H);txt('PAUSED',W/2,310,58,'center','#fff');txt('PRESS START',W/2,365,18,'center','#a9b9ca')}if(state==='dead'){ctx.fillStyle='rgba(12,0,3,.78)';ctx.fillRect(0,0,W,H);crop(1200,838,160,90,W/2-150,175,300,168);txt('PAPER HANDS GOT YOU',W/2,410,26,'center','#fff');txt('PRESS START TO RELOAD',W/2,475,18,'center','#b8c4d1')}if(state==='win'){ctx.fillStyle='rgba(0,10,7,.76)';ctx.fillRect(0,0,W,H);crop(1352,840,175,95,W/2-175,130,350,190);txt('BULL RUN COMPLETE',W/2,385,42,'center','#41f19a');txt(`${P.coins} SILVER  •  ${Math.floor(time)} SECONDS`,W/2,438,20,'center','#fff');txt('1% BETTER.',W/2,505,34,'center','#fff');txt('PRESS START TO RUN IT BACK',W/2,565,16,'center','#a8b8c9')}}
function render(){if(state==='title'){title();return}let cam=Math.max(0,Math.min(LEVEL_W-W,P.x-W*.32)),sx=shake?(Math.random()-.5)*shake:0,sy=shake?(Math.random()-.5)*shake:0;ctx.save();ctx.translate(sx,sy);background(cam);for(const s of platforms)tile(s,cam);flag(cam);for(const q of coins)coin(q,cam);for(const k of candles)candle(k,cam);for(const e of enemies)enemy(e,cam);hero(cam);particles(cam);ctx.restore();hud();overlay();if(flash){ctx.fillStyle=`rgba(255,50,80,${flash*2.5})`;ctx.fillRect(0,0,W,H)}if(!atlasReady){ctx.fillStyle='#03060a';ctx.fillRect(0,0,W,H);txt('LOADING SILVER BULL BROS...',W/2,H/2,28,'center','#fff')}}
function loop(t){let dt=Math.min(.032,(t-last)/1000||0);last=t;if(!pause){acc+=dt;while(acc>=1/120){update(1/120);acc-=1/120}}else controls();render();requestAnimationFrame(loop)}reset();state='play';requestAnimationFrame(loop);
})();
</script></body></html>
