<script>(()=>{const c=document.getElementById('g'),x=c.getContext('2d'),W=720,H=1280,T=64,G=2200,LW=76*T,Y=390;let keys={},touch={l:0,r:0,j:0},last=0,jl=0,time=0,state='play',checkpoint=120;const atlas=new Image();atlas.src='assets/a_wide_pixel_art_game_asset_sheet_on_a_black_trans.png';let ready=0;atlas.onload=()=>ready=1;

function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function solids(){return plats.concat(crumbles.filter(q=>q.t<.7))}
function move(o,dt){o.x+=o.vx*dt;for(let s of solids())if(hit(o,s)){o.x=o.vx>0?s.x-o.w:s.x+s.w;o.vx=0}o.y+=o.vy*dt;o.g=0;for(let s of solids())if(hit(o,s)){if(o.vy>=0){o.y=s.y-o.h;o.vy=0;o.g=1;if(o===P&&crumbles.includes(s)&&!s.t)s.t=.01}else{o.y=s.y+s.h;o.vy=0}}}
function hurt(){if(P.inv)return;P.lives--;P.inv=1.2;P.vy=-600;navigator.vibrate?.([35,20,35]);if(P.lives<=0)state='dead'}function reset(){Object.assign(P,{x:checkpoint,y:250,vx:0,vy:0,lives:3,inv:0});state='play'}

function crop(sx,sy,sw,sh,dx,dy,dw,dh,flip=0,a=1){if(!ready)return;x.save();x.globalAlpha=a;if(flip){x.translate(dx+dw,dy);x.scale(-1,1);x.drawImage(atlas,sx,sy,sw,sh,0,0,dw,dh)}else x.drawImage(atlas,sx,sy,sw,sh,dx,dy,dw,dh);x.restore()}

function draw(){let cam=Math.max(0,Math.min(LW-W,P.x-W*.38)),g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1a060b');g.addColorStop(.48,'#45111e');g.addColorStop(1,'#090408');x.fillStyle=g;x.fillRect(0,0,W,H);for(let i=0;i<28;i++){x.fillStyle='#ff40551b';x.fillRect((i*137-cam*.08)%850,240+(i%7)*58,90,5)}for(let s of plats){x.fillStyle='#25151a';x.fillRect(s.x-cam,s.y+Y,s.w,s.h);x.fillStyle='#7d2f3d';x.fillRect(s.x-cam,s.y+Y,s.w,7)}for(let q of crumbles)if(q.t<.7){x.globalAlpha=1-q.t;x.fillStyle='#8d3c4b';x.fillRect(q.x-cam,q.y+Y,q.w,q.h);x.globalAlpha=1}for(let q of coins)if(q.on)crop(1160,205,55,64,q.x-cam-28,q.y+Y+Math.sin(q.t)*5-30,56,64);for(let k of candles)crop(k.red?462:568,354,k.red?95:96,174,k.x-cam-28,k.y+Y-54,90,140);for(let e of bears)if(!e.dead)crop(300,355,125,165,e.x-cam-28,e.y+Y-52,112,130,e.vx<0);if(!(P.inv&&Math.floor(P.inv*12)%2))crop(P.g?710:1055,P.g?45:35,P.g?86:90,P.g?132:145,P.x-cam-18,P.y+Y-40,94,122,P.face<0);
x.fillStyle='#e5e9ef';x.fillRect(74*T-cam,320+Y,7,256);x.fillStyle='#ff425d';x.fillRect(74*T-cam+7,335+Y,145,70);txt('BEAR EXIT',74*T-cam+80,378+Y,20,'center');
x.fillStyle='#080307dd';x.fillRect(16,36,688,112);txt('WORLD 1-2 · BEAR MARKET',34,76,22);txt('LIVES '+P.lives+'   SILVER '+P.coins+'   '+Math.floor(time)+'s',34,112,17,'left','#ffb3bd');x.fillStyle='#33101a';x.fillRect(34,126,652,7);x.fillStyle='#ff526c';x.fillRect(34,126,652*Math.min(1,P.x/(74*T)),7);
if(P.x>37*T&&P.x<40*T)txt('CHECKPOINT',W/2,205,22,'center','#ffd66b');if(state!=='play'){x.fillStyle='#080207dd';x.fillRect(0,0,W,H);txt(state==='win'?'BEAR MARKET SURVIVED':'LIQUIDATED',W/2,430,43,'center',state==='win'?'#45f391':'#ff4d67');txt(state==='win'?'ROUND 2 COMPLETE':'TAP TO RELOAD',W/2,490,20,'center');txt(state==='win'?'TAP FOR MAIN MENU':'TAP SCREEN',W/2,550,17,'center','#ddd')}}
c.onclick=()=>{if(state==='win'){location.replace('../../bull/?v=11')}else if(state==='dead')reset()};function fit(){const vv=window.visualViewport;const h=vv?vv.height:innerHeight;const w=vv?vv.width:innerWidth;document.documentElement.style.width=w+'px';document.documentElement.style.height=h+'px';document.body.style.width=w+'px';document.body.style.height=h+'px';}fit();visualViewport?.addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,120));function loop(t){let dt=Math.min(.032,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop)})();</script></body></html>
