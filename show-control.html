<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>W3BC Show Control</title><style>:root{--c:#22d3e5;--bg:#07090b;--p:#0d1114;--l:#263139;--m:#7e8a92;--g:#58dfa2;--r:#ff7075}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4f6f7;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{height:3px;background:linear-gradient(90deg,var(--c),#8b5cf6)}header{height:78px;border-bottom:1px solid var(--l);display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:#090c0e}.brand{display:flex;align-items:center;gap:14px}.brand img{width:68px;height:50px;object-fit:contain}.brand b{letter-spacing:.13em}.brand small{display:block;color:#69767e;letter-spacing:.18em;font-size:7px;margin-top:4px}.btn,.mini{border:1px solid #34414a;background:#0a0e11;color:#fff;padding:10px 12px;font-size:9px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}.btn.primary,.mini.take{border-color:var(--c);color:#041013;background:var(--c)}main{max-width:1180px;margin:auto;padding:18px}.panel{background:var(--p);border:1px solid var(--l)}.ph{padding:15px 18px;border-bottom:1px solid var(--l);display:flex;justify-content:space-between;align-items:center}.ph h2{font-size:17px;margin:0}.ph span{font-size:9px;color:#718088;letter-spacing:.1em;text-transform:uppercase}.showbar{display:grid;grid-template-columns:1fr 190px;gap:12px;margin-bottom:14px}.now{border:1px solid rgba(34,211,229,.45);background:linear-gradient(90deg,rgba(34,211,229,.10),#0d1114);padding:17px}.ey{font-size:9px;color:var(--c);font-weight:900;letter-spacing:.13em}.now b{display:block;font-size:24px;margin-top:5px}.now span{font-size:10px;color:#8b989f}.row{border-bottom:1px solid #20282d}.row.disabled{opacity:.3}.rowmain{display:grid;grid-template-columns:52px 1fr 42px 110px;gap:12px;align-items:center;padding:15px 17px}.row.live>.rowmain{background:linear-gradient(90deg,rgba(34,211,229,.18),rgba(34,211,229,.025));box-shadow:inset 5px 0 0 var(--c)}.num{width:42px;height:42px;border:1px solid #354149;display:grid;place-items:center;font-weight:950;font-size:15px}.live .num{background:var(--c);color:#041013}.name b{font-size:16px}.name small{display:block;color:#75828a;font-size:10px;margin-top:4px}.switch{width:36px;height:20px;border-radius:18px;background:#273139;position:relative;cursor:pointer}.switch:after{content:'';position:absolute;width:12px;height:12px;border-radius:50%;background:#7f8b92;left:4px;top:4px}.switch.on{background:rgba(34,211,229,.25)}.switch.on:after{left:20px;background:var(--c)}.children{display:none;background:#090d0f;border-top:1px solid #20282d;padding:8px 16px 10px 80px}.row.open .children{display:block}.child{display:grid;grid-template-columns:30px 1fr 84px;gap:10px;align-items:center;padding:11px;border-bottom:1px solid #1d2429}.child.active{background:rgba(34,211,229,.08)}.child span{width:24px;height:24px;border:1px solid #354149;display:grid;place-items:center;font-size:9px}.child b{font-size:11px}.tools{display:flex;gap:8px;margin-top:14px}.hint{margin-top:14px;color:#6f7c83;font-size:10px;text-align:center}@media(max-width:700px){main{padding:8px}.showbar{grid-template-columns:1fr}.rowmain{grid-template-columns:45px 1fr 36px 76px;padding:12px 9px}.name b{font-size:13px}.name small{display:none}.children{padding-left:48px}}</style></head><body><div class="top"></div><header><div class="brand"><img src="assets/w3bc-logo-white.png"><div><b>W3BC SHOW CONTROL</b><small>SOLO HOST · ONE-CLICK PRODUCTION</small></div></div><button class="btn primary" onclick="launch()">Launch Program Output</button></header><main><div class="showbar"><div class="now"><div class="ey">NOW ON AIR</div><b id="nowName"></b><span id="nowDetail"></span></div><button class="btn" onclick="next()">NEXT SEGMENT →</button></div><section class="panel"><div class="ph"><h2>Show Rundown</h2><span>Turn sections off before show · TAKE while live</span></div><div id="rundown"></div></section><div class="tools"><button class="btn" onclick="window.open('markets-terminal.html?v='+Date.now(),'w3bcMarkets_'+Date.now(),'width=1500,height=900')">Open Markets Terminal</button><button class="btn" onclick="location.reload()">Refresh Control</button></div><div class="hint">Pre-show editing belongs in the daily content build. During the show this screen is intentionally just rundown + TAKE controls.</div></main><script>const KEY='w3bcShowStateV1',ch=new BroadcastChannel('w3bc-show');const defs=[{name:'Open',kind:'camera',desc:'Full-screen host camera and lower third.',modes:['host-full'],sponsor:''},{name:'Markets Now',kind:'markets',desc:'Chart-first market analysis.',modes:['chart-host'],sponsor:'Bitunix'},{name:'News Desk',kind:'news',desc:'Daily intelligence, story by story.',modes:['news-host'],sponsor:'',children:['Lead Story · Tokenization + Onchain Finance','Japan · Government Bonds','RWA · DeFi Utilization','Compound · Institutional DeFi','Tokenized Equities','Bitcoin · ETF Flows','Stablecoins · Policy']},{name:'AI + Technology',kind:'ai',desc:'AI, agents and infrastructure.',modes:['ai-host'],sponsor:''},{name:'Sports',kind:'sports',desc:'Games, matchups and major storylines.',modes:['sports-host'],sponsor:''},{name:'Betting Desk',kind:'betting',desc:'Lines, movement and betting context.',modes:['betting-host'],sponsor:'BC.GAME'},{name:'Interview',kind:'interview',desc:'Guest conversation.',modes:['interview-split'],sponsor:''},{name:'Open Panel',kind:'panel',desc:'Multi-guest discussion.',modes:['panel-grid'],sponsor:''},{name:'Close',kind:'camera',desc:'Final takeaways and tomorrow watch list.',modes:['host-full'],sponsor:''}];const longStories=[{headline:'The financial system is moving onchain — piece by piece.',summary:'Tokenization is moving from a multi-year crypto narrative into actual financial infrastructure. Governments, banks, asset managers and DeFi protocols are testing how bonds, funds, equities and other traditional assets can be issued, settled and used onchain. The important shift is that these projects are no longer isolated demonstrations. They are beginning to connect issuance, payments, collateral, liquidity and settlement into a broader financial stack. That does not mean traditional markets move onchain overnight, but the direction of travel is becoming much easier to see.',stats:[['THE SHIFT','RWA'],['FOCUS','SETTLEMENT'],['TREND','ONCHAIN']],quote:'The bigger story is the architecture forming underneath the market, not any single tokenized product.'},{headline:'Japan tests blockchain around government bond activity.',summary:'Japan is exploring blockchain infrastructure around government bond activity, putting one of the world’s largest and most established debt markets into the broader tokenization conversation. Government bonds are especially important because they sit at the center of collateral, liquidity and institutional finance. Even limited testing can help answer practical questions around issuance, record keeping, settlement and interoperability. The takeaway is not that Japan is replacing its bond market tomorrow; it is that sovereign debt infrastructure is now part of the same experimentation happening across private financial markets.',stats:[['ASSET','BONDS'],['MARKET','JAPAN'],['WATCH','SETTLEMENT']],quote:'Government debt is one of the clearest tests of whether tokenized finance can operate at institutional scale.'},{headline:'Real-world assets are becoming productive inside DeFi.',summary:'Real-world assets are increasingly moving beyond simple onchain representation and becoming usable financial building blocks. Tokenized treasuries, credit and other assets can potentially serve as collateral, generate yield and interact with decentralized lending and liquidity markets. That creates a bridge between traditional cash-flowing assets and programmable finance. The opportunity is significant, but the hard work is in liquidity, legal structure, custody, pricing and risk management. The next phase of RWA growth will be measured less by how many assets are tokenized and more by what those assets can actually do once they are onchain.',stats:[['SECTOR','RWA'],['USE CASE','DEFI'],['FOCUS','UTILITY']],quote:'The next phase is utility: assets that can move, settle, collateralize and earn onchain.'},{headline:'Compound pushes deeper into institutional DeFi.',summary:'Institutional DeFi is increasingly becoming an infrastructure and product-design challenge rather than a simple hunt for yield. Professional capital needs custody, compliance, predictable liquidity, reporting and operational controls alongside the advantages of onchain markets. Protocols such as Compound sit in an important part of that transition because lending and collateral are core pieces of any financial system. The question is whether decentralized infrastructure can be packaged in a way that institutions can actually use while preserving the efficiency and transparency that made DeFi interesting in the first place.',stats:[['FOCUS','INSTITUTIONS'],['SECTOR','DEFI'],['WATCH','CAPITAL']],quote:'The winners will make onchain finance usable for professional capital, not merely technically possible.'},{headline:'Tokenized equities expand the investable onchain universe.',summary:'Equities are becoming another major frontier for tokenization after much of the early institutional focus centered on treasuries, money-market products and private credit. Bringing stock exposure onchain could eventually enable broader access, faster settlement and new forms of collateral and composability. But creating a token that references a stock is only the beginning. Market structure, shareholder rights, regulation, liquidity and reliable pricing all determine whether these products become durable financial instruments rather than novelty wrappers.',stats:[['ASSET','EQUITIES'],['TREND','GROWTH'],['WATCH','LIQUIDITY']],quote:'Issuance gets attention, but distribution and liquidity determine whether tokenized equities become a real market.'},{headline:'Bitcoin ETF flows show institutions are not one trade.',summary:'Bitcoin ETF flow headlines often get reduced to a single bullish or bearish number, but institutional participation is more complicated underneath the aggregate data. Different funds, advisers, hedge funds and asset managers can be buying, selling, hedging or reallocating for completely different reasons. That makes flows useful as a sentiment and demand signal, but not a complete explanation of institutional behavior. The broader story is that Bitcoin now sits inside traditional portfolio infrastructure where thousands of professional allocators can express different views through familiar investment vehicles.',stats:[['ASSET','BITCOIN'],['VEHICLE','ETF'],['WATCH','FLOWS']],quote:'Institutional adoption is thousands of allocators making different decisions — not one giant buy or sell button.'},{headline:'Stablecoin policy is becoming settlement policy.',summary:'Stablecoins are increasingly being discussed less as speculative crypto instruments and more as payments and settlement infrastructure. Banks, fintech companies, payment networks and policymakers are paying attention because dollar-denominated tokens can move value around the clock and potentially connect traditional accounts with blockchain rails. Regulation will determine who can issue them, how reserves are managed and how users are protected. If those rules become clearer, stablecoins could become one of the most important practical bridges between traditional finance and onchain markets.',stats:[['ASSET','STABLECOINS'],['FOCUS','PAYMENTS'],['WATCH','RULES']],quote:'Stablecoins may become one of the primary bridges between traditional finance and onchain markets.'}];let old=JSON.parse(localStorage.getItem(KEY)||'null')||{};let s={...old,segments:old.segments||defs,newsStories:old.newsStories||longStories,current:old.current??0,child:old.child??0,mode:old.mode||'host-full',ticker:old.ticker||['W3BC LIVE · Markets · Technology · Sports · Betting · Culture'],sponsors:old.sponsors||[{name:'W3BC MEDIA',msg:'Turn Your Moment Into Momentum'}],market:old.market||{symbol:'BTCUSD',timeframe:'15m',note:'Watching support, resistance and momentum.'},ai:old.ai||{headline:'AI developments worth watching today',detail:'Agents, models, chips and infrastructure.'},sports:old.sports||{headline:'Top sports stories today',detail:'Major games, injuries and storylines.'},betting:old.betting||{event:'Featured betting market',line:'-110',movement:'Pending',note:'Context before picks.'}};s.segments.forEach((x,i)=>{x.enabled=x.enabled!==false;x.sponsor=x.sponsor??defs[i]?.sponsor??''});/* upgrade the placeholder summaries without overwriting future daily content */s.newsStories=s.newsStories.map((x,i)=>{if(longStories[i]&&(!x.summary||x.summary.length<330))return {...x,summary:longStories[i].summary};return x});function save(){localStorage.setItem(KEY,JSON.stringify(s));ch.postMessage({type:'state',state:s});render()}function launch(){window.open('broadcast-show.html?v='+Date.now(),'w3bcProgram_'+Date.now(),'width=1600,height=900,resizable=yes');setTimeout(()=>ch.postMessage({type:'state',state:s}),650)}function take(i){if(!s.segments[i].enabled)return;s.current=i;s.child=0;s.mode=s.segments[i].modes[0];save()}function takeChild(i,j){s.current=i;s.child=j;s.mode='news-host';save()}function enable(i){s.segments[i].enabled=!s.segments[i].enabled;if(!s.segments[s.current].enabled){let n=s.segments.findIndex(x=>x.enabled);s.current=n<0?0:n}save()}function next(){let enabled=s.segments.map((x,i)=>x.enabled?i:-1).filter(i=>i>=0),p=enabled.indexOf(s.current);take(enabled[Math.min(p+1,enabled.length-1)])}function render(){let active=s.segments.filter(x=>x.enabled),x=s.segments[s.current];nowName.textContent=x.name+(x.kind==='news'?` · Story ${s.child+1}`:'');nowDetail.textContent=x.sponsor?`Powered by ${x.sponsor}`:x.desc;rundown.innerHTML=s.segments.map((z,i)=>`<div class="row ${i===s.current?'live':''} ${z.children?'open':''} ${!z.enabled?'disabled':''}"><div class="rowmain"><div class="num">${String(i+1).padStart(2,'0')}</div><div class="name"><b>${z.name}</b><small>${z.desc}${z.sponsor?' · Powered by '+z.sponsor:''}</small></div><div class="switch ${z.enabled?'on':''}" onclick="enable(${i})"></div><button class="mini take" onclick="take(${i})">TAKE</button></div>${z.children?`<div class="children">${z.children.map((c,j)=>`<div class="child ${i===s.current&&j===s.child?'active':''}"><span>${j+1}</span><b>${c}</b><button class="mini take" onclick="takeChild(${i},${j})">TAKE</button></div>`).join('')}</div>`:''}</div>`).join('')}ch.onmessage=e=>{if(e.data?.type==='hello')ch.postMessage({type:'state',state:s})};save();</script></body></html>
