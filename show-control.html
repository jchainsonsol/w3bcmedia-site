<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>W3BC Show Control</title><style>:root{--c:#22d3e5;--bg:#07090b;--p:#0d1114;--l:#263139;--r:#ff7075}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4f6f7;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{height:3px;background:linear-gradient(90deg,var(--c),#8b5cf6)}header{height:78px;border-bottom:1px solid var(--l);display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:#090c0e}.brand{display:flex;align-items:center;gap:14px}.brand img{width:68px;height:50px;object-fit:contain}.brand b{letter-spacing:.13em}.brand small{display:block;color:#69767e;letter-spacing:.18em;font-size:7px;margin-top:4px}.btn,.mini{border:1px solid #34414a;background:#0a0e11;color:#fff;padding:10px 12px;font-size:9px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}.btn.primary,.mini.take{border-color:var(--c);color:#041013;background:var(--c)}main{max-width:1180px;margin:auto;padding:18px}.panel{background:var(--p);border:1px solid var(--l)}.ph{padding:15px 18px;border-bottom:1px solid var(--l);display:flex;justify-content:space-between;align-items:center}.ph h2{font-size:17px;margin:0}.ph span{font-size:9px;color:#718088;letter-spacing:.1em;text-transform:uppercase}.showbar{display:grid;grid-template-columns:1fr 190px;gap:12px;margin-bottom:14px}.now{border:1px solid rgba(34,211,229,.45);background:linear-gradient(90deg,rgba(34,211,229,.10),#0d1114);padding:17px}.ey{font-size:9px;color:var(--c);font-weight:900;letter-spacing:.13em}.now b{display:block;font-size:24px;margin-top:5px}.now span{font-size:10px;color:#8b989f}.row{border-bottom:1px solid #20282d}.row.disabled{opacity:.3}.rowmain{display:grid;grid-template-columns:52px 1fr 42px 110px;gap:12px;align-items:center;padding:15px 17px}.row.live>.rowmain{background:linear-gradient(90deg,rgba(34,211,229,.18),rgba(34,211,229,.025));box-shadow:inset 5px 0 0 var(--c)}.num{width:42px;height:42px;border:1px solid #354149;display:grid;place-items:center;font-weight:950;font-size:15px}.live .num{background:var(--c);color:#041013}.name b{font-size:16px}.name small{display:block;color:#75828a;font-size:10px;margin-top:4px}.switch{width:36px;height:20px;border-radius:18px;background:#273139;position:relative;cursor:pointer}.switch:after{content:'';position:absolute;width:12px;height:12px;border-radius:50%;background:#7f8b92;left:4px;top:4px}.switch.on{background:rgba(34,211,229,.25)}.switch.on:after{left:20px;background:var(--c)}.children{display:none;background:#090d0f;border-top:1px solid #20282d;padding:8px 16px 10px 80px}.row.open .children{display:block}.child{display:grid;grid-template-columns:30px 1fr 84px;gap:10px;align-items:center;padding:11px;border-bottom:1px solid #1d2429}.child.active{background:rgba(34,211,229,.08)}.child span{width:24px;height:24px;border:1px solid #354149;display:grid;place-items:center;font-size:9px}.child b{font-size:11px}.liveTools{display:none;background:#081013;border-top:1px solid #223039;padding:12px 16px 14px 80px}.row.live .liveTools{display:block}.toolLabel{font-size:8px;color:#748188;font-weight:900;letter-spacing:.12em;text-transform:uppercase;margin:9px 0 7px}.quick,.timeframes,.drawTools{display:flex;gap:6px;flex-wrap:wrap}.asset,.tf,.drawBtn{border:1px solid #334049;background:#090d10;color:#fff;padding:8px 11px;font-size:9px;font-weight:900;cursor:pointer}.asset.active,.tf.active,.drawBtn.active{border-color:var(--c);background:rgba(34,211,229,.12);color:var(--c)}.searchRow,.levelRow{display:grid;grid-template-columns:1fr 94px;gap:7px;margin-top:8px}.levelRow{grid-template-columns:120px 1fr 95px}.searchRow input,.levelRow input,.levelRow select{background:#090d10;border:1px solid #334049;color:#fff;padding:9px 10px;font-size:11px;outline:none}.levels{margin-top:8px;display:grid;gap:5px}.level{display:grid;grid-template-columns:95px 1fr 50px;gap:7px;align-items:center;border:1px solid #263139;background:#090d10;padding:7px}.level b{font-size:9px}.level span{font-size:11px;color:#dce3e6}.level button{border:0;background:none;color:var(--r);font-weight:900;cursor:pointer}.hint2{font-size:8px;color:#69767e;margin-top:7px;line-height:1.45}.tools{display:flex;gap:8px;margin-top:14px}.hint{margin-top:14px;color:#6f7c83;font-size:10px;text-align:center}@media(max-width:700px){main{padding:8px}.showbar{grid-template-columns:1fr}.rowmain{grid-template-columns:45px 1fr 36px 76px;padding:12px 9px}.name b{font-size:13px}.name small{display:none}.children,.liveTools{padding-left:48px}.searchRow,.levelRow{grid-template-columns:1fr}}</style></head><body><div class="top"></div><header><div class="brand"><img src="assets/w3bc-logo-white.png"><div><b>W3BC SHOW CONTROL</b><small>SOLO HOST · ONE-CLICK PRODUCTION</small></div></div><button class="btn primary" onclick="launch()">Launch Program Output</button></header><main><div class="showbar"><div class="now"><div class="ey">NOW ON AIR</div><b id="nowName"></b><span id="nowDetail"></span></div><button class="btn" onclick="next()">NEXT SEGMENT →</button></div><section class="panel"><div class="ph"><h2>Show Rundown</h2><span>TAKE segment · controls appear inline</span></div><div id="rundown"></div></section><div class="tools"><button class="btn" onclick="location.reload()">Refresh Control</button></div><div class="hint">Markets controls update the SAME Program Output instantly.</div></main><script>
const KEY='w3bcShowStateV1',ch=new BroadcastChannel('w3bc-show'),JCHAINS='5qzX8fkFtVu7XbopVuHrCYFC2w1YsVAryN3WJeq1pump';
const defs=[{name:'Open',kind:'camera',desc:'Full-screen host camera and lower third.',modes:['host-full'],sponsor:''},{name:'Markets Now',kind:'markets',desc:'Live majors charting + TA inside Program Output.',modes:['chart-host'],sponsor:'Bitunix'},{name:'News Desk',kind:'news',desc:'Daily intelligence, story by story.',modes:['news-host'],sponsor:'',children:['Lead Story · Tokenization + Onchain Finance','Japan · Government Bonds','RWA · DeFi Utilization','Compound · Institutional DeFi','Tokenized Equities','Bitcoin · ETF Flows','Stablecoins · Policy']},{name:'AI + Technology',kind:'ai',desc:'AI, agents and infrastructure.',modes:['ai-host'],sponsor:''},{name:'Sports',kind:'sports',desc:'Games, matchups and major storylines.',modes:['sports-host'],sponsor:''},{name:'Betting Desk',kind:'betting',desc:'Lines, movement and betting context.',modes:['betting-host'],sponsor:'BC.GAME'},{name:'The Trenches',kind:'trenches',desc:'Silver Bull meme desk · Solana projects and partners.',modes:['trenches-host'],sponsor:''},{name:'Interview',kind:'interview',desc:'Guest conversation.',modes:['interview-split'],sponsor:''},{name:'Open Panel',kind:'panel',desc:'Multi-guest discussion.',modes:['panel-grid'],sponsor:''},{name:'Close',kind:'camera',desc:'Final takeaways and tomorrow watch list.',modes:['host-full'],sponsor:''}];
let old=JSON.parse(localStorage.getItem(KEY)||'null')||{},oldByKind={};(old.segments||[]).forEach(x=>oldByKind[x.kind]=x);let segments=defs.map(d=>{let o=oldByKind[d.kind];return o?{...d,...o,name:d.name,desc:d.desc,sponsor:d.sponsor,children:d.children||o.children}:{...d,enabled:true}});let currentKind=old.segments?.[old.current]?.kind||'camera',current=Math.max(0,segments.findIndex(x=>x.kind===currentKind));
let s={...old,segments,current,child:old.child??0,mode:old.mode||'host-full',market:{symbol:old.market?.symbol||'BTCUSDT',display:old.market?.display||'BTC',timeframe:old.market?.timeframe||'15m',note:old.market?.note||'Watching support, resistance and momentum.',levels:old.market?.levels||[],trendlines:old.market?.trendlines||[],drawMode:old.market?.drawMode||'none'},trenches:old.trenches||{query:JCHAINS,address:JCHAINS,symbol:'$JCHAINS',name:'JCHAINS',focus:'Silver Bull Focus'},ticker:old.ticker||['W3BC LIVE · Markets · Technology · Sports · Betting · Culture'],sponsors:old.sponsors||[{name:'W3BC MEDIA',msg:'Turn Your Moment Into Momentum'}],ai:old.ai||{headline:'AI developments worth watching today',detail:'Agents, models, chips and infrastructure.'},sports:old.sports||{headline:'Top sports stories today',detail:'Major games, injuries and storylines.'},betting:old.betting||{event:'Featured betting market',line:'-110',movement:'Pending',note:'Context before picks.'}};s.segments.forEach(x=>x.enabled=x.enabled!==false);
function save(){localStorage.setItem(KEY,JSON.stringify(s));ch.postMessage({type:'state',state:s});render()}function launch(){window.open('broadcast-show.html?v='+Date.now(),'w3bcProgram_'+Date.now(),'width=1600,height=900,resizable=yes');setTimeout(()=>ch.postMessage({type:'state',state:s}),650)}function take(i){if(!s.segments[i].enabled)return;s.current=i;s.child=0;s.mode=s.segments[i].modes[0];save()}function takeChild(i,j){s.current=i;s.child=j;save()}function enable(i){s.segments[i].enabled=!s.segments[i].enabled;if(!s.segments[s.current].enabled){let n=s.segments.findIndex(x=>x.enabled);s.current=n<0?0:n}save()}function next(){let a=s.segments.map((x,i)=>x.enabled?i:-1).filter(i=>i>=0),p=a.indexOf(s.current);take(a[Math.min(p+1,a.length-1)])}
function marketAsset(sym,display){s.market.symbol=sym;s.market.display=display;s.market.trendlines=[];save()}function marketSearch(){let q=document.getElementById('marketSearch').value.trim().toUpperCase().replace(/[-/]/g,'');if(!q)return;if(!q.endsWith('USDT'))q+='USDT';s.market.symbol=q;s.market.display=q.replace('USDT','');s.market.trendlines=[];save()}function setTf(tf){s.market.timeframe=tf;s.market.trendlines=[];save()}function setDraw(m){s.market.drawMode=m;save()}function addLevel(){let p=parseFloat(document.getElementById('levelPrice').value),type=document.getElementById('levelType').value;if(!isFinite(p))return;s.market.levels.push({id:Date.now(),type,price:p,label:type.toUpperCase()});document.getElementById('levelPrice').value='';save()}function delLevel(id){s.market.levels=s.market.levels.filter(x=>x.id!==id);save()}function clearTA(){s.market.levels=[];s.market.trendlines=[];s.market.drawMode='none';save()}
function trenchesLoad(q){q=(q||document.getElementById('trenchesSearch').value).trim();if(!q)return;s.trenches.query=q;if(q===JCHAINS){s.trenches.address=JCHAINS;s.trenches.symbol='$JCHAINS';s.trenches.name='JCHAINS';s.trenches.focus='Silver Bull Focus'}save()}
function marketTools(){let majors=[['BTCUSDT','BTC'],['ETHUSDT','ETH'],['LINKUSDT','LINK'],['SOLUSDT','SOL'],['XRPUSDT','XRP'],['DOGEUSDT','DOGE'],['ADAUSDT','ADA'],['AVAXUSDT','AVAX']];return `<div class="liveTools"><div class="toolLabel">MARKETS NOW · POWERED BY BITUNIX</div><div class="quick">${majors.map(a=>`<button class="asset ${s.market.symbol===a[0]?'active':''}" onclick="marketAsset('${a[0]}','${a[1]}')">${a[1]}</button>`).join('')}</div><div class="searchRow"><input id="marketSearch" placeholder="Search symbol: LTC, SUI, AAVE…" onkeydown="if(event.key==='Enter')marketSearch()"><button class="mini take" onclick="marketSearch()">LOAD</button></div><div class="timeframes">${['1m','5m','15m','1h','4h','1d'].map(tf=>`<button class="tf ${s.market.timeframe===tf?'active':''}" onclick="setTf('${tf}')">${tf}</button>`).join('')}</div><div class="toolLabel">TA LEVELS</div><div class="levelRow"><select id="levelType"><option value="support">Support</option><option value="resistance">Resistance</option><option value="target">Target</option></select><input id="levelPrice" inputmode="decimal" placeholder="Price level" onkeydown="if(event.key==='Enter')addLevel()"><button class="mini take" onclick="addLevel()">ADD</button></div><div class="levels">${s.market.levels.map(l=>`<div class="level"><b>${l.label}</b><span>${l.price}</span><button onclick="delLevel(${l.id})">×</button></div>`).join('')||'<div class="hint2">No saved levels yet.</div>'}</div><div class="toolLabel">DRAW ON PROGRAM CHART</div><div class="drawTools"><button class="drawBtn ${s.market.drawMode==='trend'?'active':''}" onclick="setDraw('trend')">↗ TRENDLINE</button><button class="drawBtn ${s.market.drawMode==='support'?'active':''}" onclick="setDraw('support')">— SUPPORT</button><button class="drawBtn ${s.market.drawMode==='resistance'?'active':''}" onclick="setDraw('resistance')">— RESISTANCE</button><button class="drawBtn" onclick="clearTA()">CLEAR TA</button></div><div class="hint2">Arm a drawing tool here, then click the Program Output chart. Trendline = two clicks. Horizontal level = one click. Price/time labels and crosshair are always visible on hover.</div></div>`}
function trenchesTools(){return `<div class="liveTools"><div class="toolLabel">THE TRENCHES · SILVER BULL FOCUS</div><div class="quick"><button class="asset ${s.trenches.address===JCHAINS?'active':''}" onclick="trenchesLoad('${JCHAINS}')">$JCHAINS</button></div><div class="searchRow"><input id="trenchesSearch" value="${s.trenches.query||''}" placeholder="Ticker, contract or pair"><button class="mini take" onclick="trenchesLoad()">LOAD</button></div></div>`}
function render(){let x=s.segments[s.current];nowName.textContent=x.name+(x.kind==='news'?` · Story ${s.child+1}`:x.kind==='markets'?` · ${s.market.display}`:x.kind==='trenches'?` · ${s.trenches.symbol}`:'');nowDetail.textContent=x.sponsor?`Powered by ${x.sponsor}`:x.desc;rundown.innerHTML=s.segments.map((z,i)=>`<div class="row ${i===s.current?'live':''} ${z.children?'open':''} ${!z.enabled?'disabled':''}"><div class="rowmain"><div class="num">${String(i+1).padStart(2,'0')}</div><div class="name"><b>${z.name}</b><small>${z.desc}${z.sponsor?' · Powered by '+z.sponsor:''}</small></div><div class="switch ${z.enabled?'on':''}" onclick="enable(${i})"></div><button class="mini take" onclick="take(${i})">TAKE</button></div>${z.children?`<div class="children">${z.children.map((c,j)=>`<div class="child ${i===s.current&&j===s.child?'active':''}"><span>${j+1}</span><b>${c}</b><button class="mini take" onclick="takeChild(${i},${j})">TAKE</button></div>`).join('')}</div>`:''}${z.kind==='markets'?marketTools():z.kind==='trenches'?trenchesTools():''}</div>`).join('')}
ch.onmessage=e=>{if(e.data?.type==='hello')ch.postMessage({type:'state',state:s})};save();
</script></body></html>
