<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>W3BC Live Control</title><style>:root{--c:#22d3e5;--bg:#07090b;--p:#0d1114;--l:#273239;--m:#748188;--g:#42d9a0;--v:#a98cff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4f6f7;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{text-decoration:none;color:inherit}header{height:74px;border-top:3px solid var(--c);border-bottom:1px solid var(--l);display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:#090c0e}.brand{display:flex;align-items:center;gap:12px}.brand img{width:62px;height:46px;object-fit:contain}.brand b{letter-spacing:.13em}.brand small{display:block;color:#69767e;font-size:7px;letter-spacing:.16em;margin-top:4px}.headerActions{display:flex;gap:8px}.btn,.mini{border:1px solid #34414a;background:#0a0e11;color:#fff;padding:10px 12px;font-size:9px;font-weight:900;letter-spacing:.07em;text-transform:uppercase;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}.btn.primary,.mini.take{background:var(--c);border-color:var(--c);color:#041013}main{max-width:1100px;margin:auto;padding:16px}.topbar{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin-bottom:12px}.now{border:1px solid rgba(34,211,229,.5);background:linear-gradient(90deg,rgba(34,211,229,.12),#0d1114);padding:14px;min-height:66px}.ey{font-size:8px;color:var(--c);font-weight:900;letter-spacing:.12em}.now b{display:block;font-size:22px;margin-top:4px}.now span{color:#849198;font-size:9px}.panel{border:1px solid var(--l);background:var(--p)}.ph{padding:12px 15px;border-bottom:1px solid var(--l);display:flex;justify-content:space-between}.ph b{font-size:14px}.ph span{font-size:8px;color:var(--m);letter-spacing:.1em}.row{border-bottom:1px solid #20282d}.row.done{opacity:.4}.row.off{opacity:.25}.mainrow{display:grid;grid-template-columns:42px 1fr 84px;gap:10px;align-items:center;padding:12px 14px}.row.live>.mainrow{background:linear-gradient(90deg,rgba(34,211,229,.18),rgba(34,211,229,.02));box-shadow:inset 4px 0 var(--c)}.num{font-size:14px;font-weight:950;color:#78858c}.live .num{color:var(--c)}.name b{font-size:15px}.name small{display:block;color:#748188;font-size:9px;margin-top:3px}.quick{display:none;padding:10px 14px 13px 66px;border-top:1px solid #223039;background:#081013}.row.live .quick{display:block}.tools{display:flex;gap:6px;flex-wrap:wrap}.asset,.tf,.indicator{border:1px solid #334049;background:#090d10;color:#fff;padding:8px 10px;font-size:9px;font-weight:900;cursor:pointer}.asset.active,.tf.active{color:var(--c);border-color:var(--c);background:rgba(34,211,229,.1)}.indicator.active{color:#d8ccff;border-color:var(--v);background:rgba(169,140,255,.1)}.toolLabel{font-size:8px;color:#6f7c83;font-weight:900;letter-spacing:.08em;margin:9px 0 5px}.search{display:grid;grid-template-columns:1fr 80px;gap:6px;margin-top:7px}.search input{background:#090d10;border:1px solid #334049;color:#fff;padding:9px}.story{display:grid;grid-template-columns:30px 1fr 70px;gap:8px;align-items:center;padding:8px;border-bottom:1px solid #1d252a;font-size:10px}.story.active{background:rgba(34,211,229,.1);color:var(--c)}.hint{font-size:8px;color:#6f7c83;margin-top:7px}.status{color:var(--g)}.error{padding:14px;color:#ff7d84;font-size:11px;border:1px solid #4a292c;background:#160d0e;margin-top:10px}@media(max-width:650px){main{padding:7px}.topbar{grid-template-columns:1fr}.mainrow{grid-template-columns:34px 1fr 70px}.quick{padding-left:45px}.headerActions{gap:5px}.btn{padding:8px 9px}}</style></head><body><header><div class="brand"><img src="assets/w3bc-logo-white.png"><div><b>W3BC LIVE CONTROL</b><small>SOLO HOST · FAST SWITCHING</small></div></div><div class="headerActions"><a class="btn" href="ticker-manager.html">LIVE FEED</a><a class="btn" href="show-editor.html">EDIT SHOW</a><button class="btn primary" id="launchBtn">LAUNCH PROGRAM</button></div></header><main><div class="topbar"><div class="now"><div class="ey">NOW ON AIR · AUG 20 PACKAGE</div><b id="nowName">Loading today’s show…</b><span id="nowDetail"></span></div><a class="btn" href="ticker-manager.html">TICKER</a><button class="btn primary" id="nextBtn">NEXT →</button></div><section class="panel"><div class="ph"><b>Show Rundown</b><span><i class="status">●</i> LIVE STATE</span></div><div id="rundown"></div></section><div id="errorBox"></div></main><script>(()=>{const KEY='w3bcShowStateV1',J='5qzX8fkFtVu7XbopVuHrCYFC2w1YsVAryN3WJeq1pump',TODAY='2026-08-20',TODAY_FILE='data/morning-show-2026-08-20.json',ch=new BroadcastChannel('w3bc-show'),$=id=>document.getElementById(id);const defaults=[{name:'Open',kind:'camera',enabled:true},{name:'Markets Now',kind:'markets',enabled:true,sponsor:'Bitunix'},{name:'News Desk',kind:'news',enabled:true},{name:'AI + Technology',kind:'ai',enabled:true},{name:'Sports',kind:'sports',enabled:true},{name:'Betting Desk',kind:'betting',enabled:true,sponsor:'BC.GAME'},{name:'The Trenches',kind:'trenches',enabled:true},{name:'Interview',kind:'interview',enabled:true},{name:'Open Panel',kind:'panel',enabled:true},{name:'Close',kind:'camera',enabled:true}];let s;function load(){try{s=JSON.parse(localStorage.getItem(KEY)||'null')||{}}catch(e){s={}}if(!Array.isArray(s.segments)||!s.segments.length)s.segments=defaults.map(x=>({...x}));s.current=Number.isInteger(s.current)?Math.max(0,Math.min(s.current,s.segments.length-1)):0;s.child=Number.isInteger(s.child)?s.child:0;s.aiChild=Number.isInteger(s.aiChild)?s.aiChild:0;s.sportsChild=Number.isInteger(s.sportsChild)?s.sportsChild:0;s.aiStories=Array.isArray(s.aiStories)?s.aiStories:[];s.sportsStories=Array.isArray(s.sportsStories)?s.sportsStories:[];s.market=s.market||{};s.market.symbol=s.market.symbol||'BTCUSDT';s.market.display=s.market.display||'BTC';s.market.timeframe=s.market.timeframe||'15m';s.market.indicators=s.market.indicators||{smma21:false,ema200:false};s.trenches=s.trenches||{query:J,address:J,symbol:'$JCHAINS',name:'JCHAINS'};s.newsStories=Array.isArray(s.newsStories)?s.newsStories:[]}function persist(){localStorage.setItem(KEY,JSON.stringify(s));ch.postMessage({type:'state',state:s})}async function ensureToday(){if(s.morningPackage?.date===TODAY&&s.newsStories?.length>=10&&s.aiStories?.length>=5&&s.sportsStories?.length>=5)return false;try{const r=await fetch(TODAY_FILE+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const p=await r.json(),now=Date.now(),speed=s.liveFeed?.speed||'slow';s.newsStories=p.newsStories||[];s.aiStories=p.aiStories||[];s.sportsStories=p.sportsStories||[];s.child=0;s.aiChild=0;s.sportsChild=0;s.current=0;s.ai={headline:s.aiStories[0]?.headline||'',detail:(s.aiStories[0]?.points||[]).join(' ')};s.sports={headline:s.sportsStories[0]?.headline||'',detail:(s.sportsStories[0]?.points||[]).join(' ')};s.ticker=p.ticker||[];s.liveFeed={autoNews:true,segmentBias:true,paused:false,speed,items:(p.liveFeed||[]).map((x,i)=>({id:now+i,text:x.text,category:x.category||'general',priority:x.priority||'normal',enabled:true,pinned:false,breaking:false,createdAt:now,expiresAt:now+14*3600000}))};s.morningPackage={date:p.date,source:p.source,loadedAt:now};persist();return true}catch(e){$('errorBox').innerHTML=`<div class="error">Could not auto-load today’s Aug. 20 package: ${e.message}. Open LIVE FEED and use LOAD TODAY'S SHOW.</div>`;return false}}function save(){persist();render()}function take(i){if(!s.segments[i]||s.segments[i].enabled===false)return;s.current=i;if(s.segments[i].kind==='news')s.child=0;if(s.segments[i].kind==='ai')s.aiChild=0;if(s.segments[i].kind==='sports')s.sportsChild=0;save()}function next(){const enabled=s.segments.map((x,i)=>x.enabled!==false?i:-1).filter(i=>i>=0),p=enabled.indexOf(s.current);if(p>=0&&p<enabled.length-1)take(enabled[p+1])}function takeDesk(kind,j){if(kind==='news')s.child=j;if(kind==='ai')s.aiChild=j;if(kind==='sports')s.sportsChild=j;save()}function asset(sym,d){s.market.symbol=sym;s.market.display=d;s.market.trendlines=[];save()}function tf(v){s.market.timeframe=v;s.market.trendlines=[];save()}function toggleIndicator(k){s.market.indicators[k]=!s.market.indicators[k];save()}function searchMarket(){let el=$('marketSearch'),q=el?.value.trim().toUpperCase().replace(/[-/]/g,'');if(!q)return;if(!q.endsWith('USDT'))q+='USDT';asset(q,q.replace('USDT',''))}function trench(){let q=$('trenchSearch')?.value.trim();if(!q)return;s.trenches.query=q;s.trenches.address=q===J?J:'';save()}function deskQueue(kind){let arr=kind==='news'?s.newsStories:kind==='ai'?s.aiStories:s.sportsStories,idx=kind==='news'?s.child:kind==='ai'?s.aiChild:s.sportsChild;if(!arr.length)return`<div class="quick"><div class="hint">No ${kind} stories loaded.</div></div>`;return`<div class="quick"><div class="toolLabel">${arr.length} STORIES LOADED · AUG 20</div>${arr.map((z,j)=>`<div class="story ${j===idx?'active':''}"><b>${String(j+1).padStart(2,'0')}</b><span>${z.headline||'Story'}</span><button class="mini ${j===idx?'take':''}" data-desk="${kind}" data-story="${j}">${j===idx?'LIVE':'TAKE'}</button></div>`).join('')}</div>`}function quick(x){if(x.kind==='markets')return`<div class="quick"><div class="toolLabel">ASSET</div><div class="tools">${[['BTCUSDT','BTC'],['ETHUSDT','ETH'],['LINKUSDT','LINK'],['SOLUSDT','SOL'],['XRPUSDT','XRP']].map(a=>`<button class="asset ${s.market.symbol===a[0]?'active':''}" data-asset="${a[0]}" data-display="${a[1]}">${a[1]}</button>`).join('')}</div><div class="toolLabel">TIMEFRAME</div><div class="tools">${['5m','15m','1h','4h','1d','1w'].map(v=>`<button class="tf ${s.market.timeframe===v?'active':''}" data-tf="${v}">${v}</button>`).join('')}</div><div class="toolLabel">INDICATORS</div><div class="tools"><button class="indicator ${s.market.indicators.smma21?'active':''}" data-indicator="smma21">21D SMMA ${s.market.indicators.smma21?'ON':'OFF'}</button><button class="indicator ${s.market.indicators.ema200?'active':''}" data-indicator="ema200">200D EMA ${s.market.indicators.ema200?'ON':'OFF'}</button></div><div class="search"><input id="marketSearch" placeholder="Search LTC, SUI, AAVE…"><button class="mini take" id="marketLoad">LOAD</button></div></div>`;if(['news','ai','sports'].includes(x.kind))return deskQueue(x.kind);if(x.kind==='trenches')return`<div class="quick"><div class="tools"><button class="asset" id="jchainsBtn">$JCHAINS</button></div><div class="search"><input id="trenchSearch" value="${s.trenches.query||''}" placeholder="Ticker / contract / DexScreener URL"><button class="mini take" id="trenchLoad">LOAD</button></div></div>`;if(['camera','interview','panel','xspace'].includes(x.kind))return`<div class="quick"><div class="hint">OBS/overlay cue only.</div></div>`;return''}function bind(){document.querySelectorAll('[data-take]').forEach(b=>b.onclick=()=>take(+b.dataset.take));document.querySelectorAll('[data-desk]').forEach(b=>b.onclick=()=>takeDesk(b.dataset.desk,+b.dataset.story));document.querySelectorAll('[data-asset]').forEach(b=>b.onclick=()=>asset(b.dataset.asset,b.dataset.display));document.querySelectorAll('[data-tf]').forEach(b=>b.onclick=()=>tf(b.dataset.tf));document.querySelectorAll('[data-indicator]').forEach(b=>b.onclick=()=>toggleIndicator(b.dataset.indicator));if($('marketLoad'))$('marketLoad').onclick=searchMarket;if($('marketSearch'))$('marketSearch').onkeydown=e=>{if(e.key==='Enter')searchMarket()};if($('jchainsBtn'))$('jchainsBtn').onclick=()=>{$('trenchSearch').value=J;trench()};if($('trenchLoad'))$('trenchLoad').onclick=trench}function render(){try{let x=s.segments[s.current]||s.segments[0],idx=x.kind==='news'?s.child:x.kind==='ai'?s.aiChild:x.kind==='sports'?s.sportsChild:null;$('nowName').textContent=x.name+(idx!==null?` · Story ${idx+1}`:x.kind==='markets'?` · ${s.market.display} ${s.market.timeframe}`:'');$('nowDetail').textContent=(x.sponsor?`Powered by ${x.sponsor} · `:'')+`Aug 20 package · ${s.newsStories.length} News · ${s.aiStories.length} AI · ${s.sportsStories.length} Sports`;$('rundown').innerHTML=s.segments.map((z,i)=>`<div class="row ${i===s.current?'live':''} ${i<s.current?'done':''} ${z.enabled===false?'off':''}"><div class="mainrow"><div class="num">${String(i+1).padStart(2,'0')}</div><div class="name"><b>${z.name}</b><small>${i===s.current?'NOW':i<s.current?'COMPLETE':'UP NEXT'}</small></div><button class="mini ${i===s.current?'take':''}" data-take="${i}">${i===s.current?'LIVE':'TAKE'}</button></div>${i===s.current?quick(z):''}</div>`).join('');bind()}catch(e){$('errorBox').innerHTML=`<div class="error">${e.message}</div>`}}function launch(){window.open('show-program-v2.html?v='+Date.now(),'w3bcProgram','width=1600,height=900,resizable=yes')}async function boot(){load();await ensureToday();render();$('launchBtn').onclick=launch;$('nextBtn').onclick=next;ch.onmessage=e=>{if(e.data?.state){s=e.data.state;render()}};window.addEventListener('storage',e=>{if(e.key===KEY){load();render()}})}boot()})();</script></body></html>
