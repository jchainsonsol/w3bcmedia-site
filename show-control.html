<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>W3BC Live Control</title><style>:root{--c:#22d3e5;--bg:#07090b;--p:#0d1114;--l:#273239;--m:#748188;--g:#42d9a0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4f6f7;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{height:74px;border-top:3px solid var(--c);border-bottom:1px solid var(--l);display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:#090c0e}.brand{display:flex;align-items:center;gap:12px}.brand img{width:62px;height:46px;object-fit:contain}.brand b{letter-spacing:.13em}.brand small{display:block;color:#69767e;font-size:7px;letter-spacing:.16em;margin-top:4px}.btn,.mini{border:1px solid #34414a;background:#0a0e11;color:#fff;padding:10px 12px;font-size:9px;font-weight:900;letter-spacing:.07em;text-transform:uppercase;cursor:pointer}.btn.primary,.mini.take{background:var(--c);border-color:var(--c);color:#041013}main{max-width:1100px;margin:auto;padding:16px}.topbar{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin-bottom:12px}.now{border:1px solid rgba(34,211,229,.5);background:linear-gradient(90deg,rgba(34,211,229,.12),#0d1114);padding:14px}.ey{font-size:8px;color:var(--c);font-weight:900;letter-spacing:.12em}.now b{display:block;font-size:22px;margin-top:4px}.now span{color:#849198;font-size:9px}.panel{border:1px solid var(--l);background:var(--p)}.ph{padding:12px 15px;border-bottom:1px solid var(--l);display:flex;justify-content:space-between}.ph b{font-size:14px}.ph span{font-size:8px;color:var(--m);letter-spacing:.1em}.row{border-bottom:1px solid #20282d}.row.done{opacity:.38}.row.off{opacity:.22}.mainrow{display:grid;grid-template-columns:42px 1fr 84px;gap:10px;align-items:center;padding:12px 14px}.row.live>.mainrow{background:linear-gradient(90deg,rgba(34,211,229,.18),rgba(34,211,229,.02));box-shadow:inset 4px 0 var(--c)}.num{font-size:14px;font-weight:950;color:#78858c}.live .num{color:var(--c)}.name b{font-size:15px}.name small{display:block;color:#748188;font-size:9px;margin-top:3px}.quick{display:none;padding:10px 14px 13px 66px;border-top:1px solid #223039;background:#081013}.row.live .quick{display:block}.tools{display:flex;gap:6px;flex-wrap:wrap}.asset,.tf{border:1px solid #334049;background:#090d10;color:#fff;padding:8px 10px;font-size:9px;font-weight:900;cursor:pointer}.asset.active,.tf.active{color:var(--c);border-color:var(--c);background:rgba(34,211,229,.1)}.search{display:grid;grid-template-columns:1fr 80px;gap:6px;margin-top:7px}.search input{background:#090d10;border:1px solid #334049;color:#fff;padding:9px}.story{display:grid;grid-template-columns:30px 1fr 70px;gap:8px;align-items:center;padding:8px;border-bottom:1px solid #1d252a;font-size:10px}.story.active{background:rgba(34,211,229,.1);color:var(--c)}.editlink{display:inline-block;margin-top:9px;color:var(--c);font-size:9px;font-weight:900;text-decoration:none}.hint{font-size:8px;color:#6f7c83;margin-top:7px}.status{color:var(--g)}@media(max-width:650px){main{padding:7px}.topbar{grid-template-columns:1fr}.mainrow{grid-template-columns:34px 1fr 70px}.quick{padding-left:45px}}</style></head><body><header><div class="brand"><img src="assets/w3bc-logo-white.png"><div><b>W3BC LIVE CONTROL</b><small>SOLO HOST · FAST SWITCHING</small></div></div><button class="btn primary" onclick="launch()">LAUNCH PROGRAM</button></header><main><div class="topbar"><div class="now"><div class="ey">NOW ON AIR</div><b id="now"></b><span id="detail"></span></div><button class="btn" onclick="location.href='show-editor.html'">EDIT SHOW</button><button class="btn primary" onclick="next()">NEXT →</button></div><section class="panel"><div class="ph"><b>Show Rundown</b><span><i class="status">●</i> LIVE STATE</span></div><div id="rundown"></div></section></main><script>const KEY='w3bcShowStateV1',ch=new BroadcastChannel('w3bc-show'),J='5qzX8fkFtVu7XbopVuHrCYFC2w1YsVAryN3WJeq1pump';let s=JSON.parse(localStorage.getItem(KEY)||'null')||{};if(!s.segments?.length)s.segments=[{name:'Open',kind:'camera',enabled:true},{name:'Markets Now',kind:'markets',enabled:true,sponsor:'Bitunix'},{name:'News Desk',kind:'news',enabled:true},{name:'AI + Technology',kind:'ai',enabled:true},{name:'Sports',kind:'sports',enabled:true},{name:'Betting Desk',kind:'betting',enabled:true,sponsor:'BC.GAME'},{name:'The Trenches',kind:'trenches',enabled:true},{name:'Interview',kind:'interview',enabled:true},{name:'Open Panel',kind:'panel',enabled:true},{name:'Close',kind:'camera',enabled:true}];s.current=Math.min(s.current||0,s.segments.length-1);s.child=s.child||0;s.market=s.market||{symbol:'BTCUSDT',display:'BTC',timeframe:'15m',levels:[],trendlines:[],drawMode:'none'};s.trenches=s.trenches||{query:J,address:J,symbol:'$JCHAINS',name:'JCHAINS'};function save(){localStorage.setItem(KEY,JSON.stringify(s));ch.postMessage({type:'state',state:s});render()}function launch(){window.open('broadcast-show.html?v='+Date.now(),'w3bcProgram','width=1600,height=900,resizable=yes');setTimeout(()=>ch.postMessage({type:'state',state:s}),500)}function take(i){if(s.segments[i].enabled===false)return;s.current=i;s.child=0;save()}function next(){let a=s.segments.map((x,i)=>x.enabled!==false?i:-1).filter(i=>i>=0),p=a.indexOf(s.current);if(p<a.length-1)take(a[p+1])}function takeStory(j){s.child=j;save()}function asset(sym,d){s.market.symbol=sym;s.market.display=d;s.market.trendlines=[];save()}function tf(v){s.market.timeframe=v;s.market.trendlines=[];save()}function searchMarket(){let q=marketSearch.value.trim().toUpperCase().replace(/[-/]/g,'');if(!q)return;if(!q.endsWith('USDT'))q+='USDT';asset(q,q.replace('USDT',''))}function trench(){let q=trenchSearch.value.trim();if(!q)return;s.trenches.query=q;if(q===J){s.trenches.address=J;s.trenches.symbol='$JCHAINS';s.trenches.name='JCHAINS'}save()}function quick(x,i){if(x.kind==='markets')return `<div class="quick"><div class="tools">${[['BTCUSDT','BTC'],['ETHUSDT','ETH'],['LINKUSDT','LINK'],['SOLUSDT','SOL'],['XRPUSDT','XRP']].map(a=>`<button class="asset ${s.market.symbol===a[0]?'active':''}" onclick="asset('${a[0]}','${a[1]}')">${a[1]}</button>`).join('')}</div><div class="tools" style="margin-top:7px">${['5m','15m','1h','4h','1w'].map(v=>`<button class="tf ${s.market.timeframe===v?'active':''}" onclick="tf('${v}')">${v}</button>`).join('')}</div><div class="search"><input id="marketSearch" placeholder="Search LTC, SUI, AAVE…" onkeydown="if(event.key==='Enter')searchMarket()"><button class="mini take" onclick="searchMarket()">LOAD</button></div><div class="hint">21 SMMA + 200 EMA remain on the Program chart. TA drawing stays on Program Output.</div></div>`;if(x.kind==='news'){let a=s.newsStories?.length?s.newsStories:(x.children||[]).map((h)=>({headline:h}));return `<div class="quick">${a.map((z,j)=>`<div class="story ${j===s.child?'active':''}"><b>${String(j+1).padStart(2,'0')}</b><span>${z.headline||z.title||'Story'}</span><button class="mini ${j===s.child?'take':''}" onclick="takeStory(${j})">TAKE</button></div>`).join('')}<a class="editlink" href="show-editor.html">EDIT NEWS DESK →</a></div>`}if(x.kind==='trenches')return `<div class="quick"><div class="tools"><button class="asset ${s.trenches.address===J?'active':''}" onclick="document.getElementById('trenchSearch').value='${J}';trench()">$JCHAINS</button></div><div class="search"><input id="trenchSearch" value="${s.trenches.query||''}" placeholder="Ticker / contract / pair"><button class="mini take" onclick="trench()">LOAD</button></div><div class="hint">Black Box scoring + chart expansion is the next Trenches module.</div></div>`}if(['camera','interview','panel','xspace'].includes(x.kind))return `<div class="quick"><div class="hint">This rundown item is an OBS/overlay cue — not a fake camera source. TAKE changes the Program graphics state while your camera/X Space/guest source stays controlled in OBS.</div></div>`;return ''}function render(){let x=s.segments[s.current]||s.segments[0];now.textContent=x.name+(x.kind==='news'?` · Story ${s.child+1}`:x.kind==='markets'?` · ${s.market.display} ${s.market.timeframe}`:'');detail.textContent=x.sponsor?`Powered by ${x.sponsor}`:'Program graphics ready';let enabled=s.segments.filter(z=>z.enabled!==false),pos=enabled.indexOf(x)+1;rundown.innerHTML=s.segments.map((z,i)=>`<div class="row ${i===s.current?'live':''} ${i<s.current?'done':''} ${z.enabled===false?'off':''}"><div class="mainrow"><div class="num">${String(i+1).padStart(2,'0')}</div><div class="name"><b>${z.name}</b><small>${i===s.current?'NOW':i<s.current?'COMPLETE':'UP NEXT'}${z.sponsor?' · '+z.sponsor:''}</small></div><button class="mini ${i===s.current?'take':''}" onclick="take(${i})">${i===s.current?'LIVE':'TAKE'}</button></div>${quick(z,i)}</div>`).join('')}ch.onmessage=e=>{if(e.data?.type==='state'){s=e.data.state;render()}};window.addEventListener('storage',e=>{if(e.key===KEY){s=JSON.parse(e.newValue);render()}});render();</script></body></html>
