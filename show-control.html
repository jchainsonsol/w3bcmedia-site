<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>W3BC Show Control</title><style>:root{--c:#22d3e5;--bg:#07090b;--p:#0d1114;--l:#263139;--m:#7e8a92;--g:#58dfa2;--r:#ff7075}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4f6f7;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{height:3px;background:linear-gradient(90deg,var(--c),#8b5cf6)}header{height:78px;border-bottom:1px solid var(--l);display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:#090c0e}.brand{display:flex;align-items:center;gap:14px}.brand img{width:68px;height:50px;object-fit:contain}.brand b{letter-spacing:.13em}.brand small{display:block;color:#69767e;letter-spacing:.18em;font-size:7px;margin-top:4px}.btn,.mini{border:1px solid #34414a;background:#0a0e11;color:#fff;padding:10px 12px;font-size:9px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}.btn.primary,.mini.take{border-color:var(--c);color:#041013;background:var(--c)}main{max-width:1180px;margin:auto;padding:18px}.panel{background:var(--p);border:1px solid var(--l)}.ph{padding:15px 18px;border-bottom:1px solid var(--l);display:flex;justify-content:space-between;align-items:center}.ph h2{font-size:17px;margin:0}.ph span{font-size:9px;color:#718088;letter-spacing:.1em;text-transform:uppercase}.showbar{display:grid;grid-template-columns:1fr 190px;gap:12px;margin-bottom:14px}.now{border:1px solid rgba(34,211,229,.45);background:linear-gradient(90deg,rgba(34,211,229,.10),#0d1114);padding:17px}.ey{font-size:9px;color:var(--c);font-weight:900;letter-spacing:.13em}.now b{display:block;font-size:24px;margin-top:5px}.now span{font-size:10px;color:#8b989f}.row{border-bottom:1px solid #20282d}.row.disabled{opacity:.3}.rowmain{display:grid;grid-template-columns:52px 1fr 42px 110px;gap:12px;align-items:center;padding:15px 17px}.row.live>.rowmain{background:linear-gradient(90deg,rgba(34,211,229,.18),rgba(34,211,229,.025));box-shadow:inset 5px 0 0 var(--c)}.num{width:42px;height:42px;border:1px solid #354149;display:grid;place-items:center;font-weight:950;font-size:15px}.live .num{background:var(--c);color:#041013}.name b{font-size:16px}.name small{display:block;color:#75828a;font-size:10px;margin-top:4px}.switch{width:36px;height:20px;border-radius:18px;background:#273139;position:relative;cursor:pointer}.switch:after{content:'';position:absolute;width:12px;height:12px;border-radius:50%;background:#7f8b92;left:4px;top:4px}.switch.on{background:rgba(34,211,229,.25)}.switch.on:after{left:20px;background:var(--c)}.children{display:none;background:#090d0f;border-top:1px solid #20282d;padding:8px 16px 10px 80px}.row.open .children{display:block}.child{display:grid;grid-template-columns:30px 1fr 84px;gap:10px;align-items:center;padding:11px;border-bottom:1px solid #1d2429}.child.active{background:rgba(34,211,229,.08)}.child span{width:24px;height:24px;border:1px solid #354149;display:grid;place-items:center;font-size:9px}.child b{font-size:11px}.liveTools{display:none;background:#081013;border-top:1px solid #223039;padding:12px 16px 14px 80px}.row.live .liveTools{display:block}.toolLabel{font-size:8px;color:#748188;font-weight:900;letter-spacing:.12em;text-transform:uppercase;margin-bottom:7px}.quick{display:flex;gap:6px;flex-wrap:wrap}.asset{border:1px solid #334049;background:#090d10;color:#fff;padding:8px 11px;font-size:10px;font-weight:900;cursor:pointer}.asset.active{border-color:var(--c);background:rgba(34,211,229,.12);color:var(--c)}.searchRow{display:grid;grid-template-columns:1fr 94px;gap:7px;margin-top:8px}.searchRow input{background:#090d10;border:1px solid #334049;color:#fff;padding:9px 10px;font-size:11px;outline:none}.timeframes{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}.tf{border:1px solid #334049;background:#090d10;color:#9aa5ab;padding:6px 9px;font-size:8px;font-weight:900;cursor:pointer}.tf.active{color:#041013;background:var(--c);border-color:var(--c)}.trenchesNote{margin-top:8px;color:#76838a;font-size:9px}.tools{display:flex;gap:8px;margin-top:14px}.hint{margin-top:14px;color:#6f7c83;font-size:10px;text-align:center}@media(max-width:700px){main{padding:8px}.showbar{grid-template-columns:1fr}.rowmain{grid-template-columns:45px 1fr 36px 76px;padding:12px 9px}.name b{font-size:13px}.name small{display:none}.children,.liveTools{padding-left:48px}.searchRow{grid-template-columns:1fr}}</style></head><body><div class="top"></div><header><div class="brand"><img src="assets/w3bc-logo-white.png"><div><b>W3BC SHOW CONTROL</b><small>SOLO HOST · ONE-CLICK PRODUCTION</small></div></div><button class="btn primary" onclick="launch()">Launch Program Output</button></header><main><div class="showbar"><div class="now"><div class="ey">NOW ON AIR</div><b id="nowName"></b><span id="nowDetail"></span></div><button class="btn" onclick="next()">NEXT SEGMENT →</button></div><section class="panel"><div class="ph"><h2>Show Rundown</h2><span>TAKE a segment · segment controls open automatically</span></div><div id="rundown"></div></section><div class="tools"><button class="btn" onclick="location.reload()">Refresh Control</button></div><div class="hint">Markets and Trenches controls change the SAME Program Output. No separate broadcast window.</div></main><script>
const KEY='w3bcShowStateV1',ch=new BroadcastChannel('w3bc-show');
const JCHAINS='5qzX8fkFtVu7XbopVuHrCYFC2w1YsVAryN3WJeq1pump';
const defs=[{name:'Open',kind:'camera',desc:'Full-screen host camera and lower third.',modes:['host-full'],sponsor:''},{name:'Markets Now',kind:'markets',desc:'Live majors charting inside Program Output.',modes:['chart-host'],sponsor:'Bitunix'},{name:'News Desk',kind:'news',desc:'Daily intelligence, story by story.',modes:['news-host'],sponsor:'',children:['Lead Story · Tokenization + Onchain Finance','Japan · Government Bonds','RWA · DeFi Utilization','Compound · Institutional DeFi','Tokenized Equities','Bitcoin · ETF Flows','Stablecoins · Policy']},{name:'AI + Technology',kind:'ai',desc:'AI, agents and infrastructure.',modes:['ai-host'],sponsor:''},{name:'Sports',kind:'sports',desc:'Games, matchups and major storylines.',modes:['sports-host'],sponsor:''},{name:'Betting Desk',kind:'betting',desc:'Lines, movement and betting context.',modes:['betting-host'],sponsor:'BC.GAME'},{name:'The Trenches',kind:'trenches',desc:'Silver Bull meme desk · Solana projects and partners.',modes:['trenches-host'],sponsor:''},{name:'Interview',kind:'interview',desc:'Guest conversation.',modes:['interview-split'],sponsor:''},{name:'Open Panel',kind:'panel',desc:'Multi-guest discussion.',modes:['panel-grid'],sponsor:''},{name:'Close',kind:'camera',desc:'Final takeaways and tomorrow watch list.',modes:['host-full'],sponsor:''}];
const longStories=[{headline:'The financial system is moving onchain — piece by piece.',summary:'Tokenization is moving from a multi-year crypto narrative into actual financial infrastructure. Governments, banks, asset managers and DeFi protocols are testing how bonds, funds, equities and other traditional assets can be issued, settled and used onchain. The important shift is that these projects are no longer isolated demonstrations. They are beginning to connect issuance, payments, collateral, liquidity and settlement into a broader financial stack. That does not mean traditional markets move onchain overnight, but the direction of travel is becoming much easier to see.',stats:[['THE SHIFT','RWA'],['FOCUS','SETTLEMENT'],['TREND','ONCHAIN']],quote:'The bigger story is the architecture forming underneath the market, not any single tokenized product.'}];
let old=JSON.parse(localStorage.getItem(KEY)||'null')||{};
let oldByKind={};(old.segments||[]).forEach(x=>oldByKind[x.kind]=x);
let segments=defs.map(d=>{let o=oldByKind[d.kind];return o?{...d,...o,name:d.name,desc:d.desc,sponsor:d.sponsor,children:d.children||o.children}:{...d,enabled:true}});
let currentKind=old.segments?.[old.current]?.kind||'camera';let current=Math.max(0,segments.findIndex(x=>x.kind===currentKind));
let s={...old,segments,current,child:old.child??0,mode:old.mode||'host-full',newsStories:old.newsStories||longStories,ticker:old.ticker||['W3BC LIVE · Markets · Technology · Sports · Betting · Culture'],sponsors:old.sponsors||[{name:'W3BC MEDIA',msg:'Turn Your Moment Into Momentum'}],market:{symbol:old.market?.symbol||'BTC-USD',display:old.market?.display||'BTC',timeframe:old.market?.timeframe||'15m',note:old.market?.note||'Watching support, resistance and momentum.'},trenches:{query:old.trenches?.query||JCHAINS,address:old.trenches?.address||JCHAINS,symbol:old.trenches?.symbol||'$JCHAINS',name:old.trenches?.name||'JCHAINS',focus:old.trenches?.focus||'Silver Bull Focus'},ai:old.ai||{headline:'AI developments worth watching today',detail:'Agents, models, chips and infrastructure.'},sports:old.sports||{headline:'Top sports stories today',detail:'Major games, injuries and storylines.'},betting:old.betting||{event:'Featured betting market',line:'-110',movement:'Pending',note:'Context before picks.'}};
s.segments.forEach(x=>x.enabled=x.enabled!==false);
function save(){localStorage.setItem(KEY,JSON.stringify(s));ch.postMessage({type:'state',state:s});render()}
function launch(){window.open('broadcast-show.html?v='+Date.now(),'w3bcProgram_'+Date.now(),'width=1600,height=900,resizable=yes');setTimeout(()=>ch.postMessage({type:'state',state:s}),650)}
function take(i){if(!s.segments[i].enabled)return;s.current=i;s.child=0;s.mode=s.segments[i].modes[0];save()}
function takeChild(i,j){s.current=i;s.child=j;s.mode='news-host';save()}
function enable(i){s.segments[i].enabled=!s.segments[i].enabled;if(!s.segments[s.current].enabled){let n=s.segments.findIndex(x=>x.enabled);s.current=n<0?0:n}save()}
function next(){let enabled=s.segments.map((x,i)=>x.enabled?i:-1).filter(i=>i>=0),p=enabled.indexOf(s.current);take(enabled[Math.min(p+1,enabled.length-1)])}
function marketAsset(product,display){s.market.symbol=product;s.market.display=display;save()}
function marketSearch(){let q=document.getElementById('marketSearch').value.trim().toUpperCase().replace('/','-');if(!q)return;if(!q.includes('-'))q+='-USD';s.market.symbol=q;s.market.display=q.split('-')[0];save()}
function setTf(tf){s.market.timeframe=tf;save()}
function trenchesLoad(q){q=(q||document.getElementById('trenchesSearch').value).trim();if(!q)return;s.trenches.query=q;if(q===JCHAINS){s.trenches.address=JCHAINS;s.trenches.symbol='$JCHAINS';s.trenches.name='JCHAINS';s.trenches.focus='Silver Bull Focus'}save()}
function marketTools(){let majors=[['BTC-USD','BTC'],['ETH-USD','ETH'],['LINK-USD','LINK'],['SOL-USD','SOL'],['XRP-USD','XRP'],['DOGE-USD','DOGE'],['ADA-USD','ADA'],['AVAX-USD','AVAX']];return `<div class="liveTools"><div class="toolLabel">MARKETS NOW · POWERED BY BITUNIX</div><div class="quick">${majors.map(a=>`<button class="asset ${s.market.symbol===a[0]?'active':''}" onclick="marketAsset('${a[0]}','${a[1]}')">${a[1]}</button>`).join('')}</div><div class="searchRow"><input id="marketSearch" placeholder="Search symbol: LTC, SUI, AAVE…" onkeydown="if(event.key==='Enter')marketSearch()"><button class="mini take" onclick="marketSearch()">LOAD</button></div><div class="timeframes">${['1m','5m','15m','1h','4h','1D'].map(tf=>`<button class="tf ${s.market.timeframe===tf?'active':''}" onclick="setTf('${tf}')">${tf}</button>`).join('')}</div></div>`}
function trenchesTools(){return `<div class="liveTools"><div class="toolLabel">THE TRENCHES · SILVER BULL FOCUS</div><div class="quick"><button class="asset ${s.trenches.address===JCHAINS?'active':''}" onclick="trenchesLoad('${JCHAINS}')">$JCHAINS</button></div><div class="searchRow"><input id="trenchesSearch" value="${s.trenches.query||''}" placeholder="Token name, ticker, contract or pair" onkeydown="if(event.key==='Enter')trenchesLoad()"><button class="mini take" onclick="trenchesLoad()">LOAD</button></div><div class="trenchesNote">Search accepts token names, tickers, Solana contract addresses or pair addresses.</div></div>`}
function render(){let x=s.segments[s.current];nowName.textContent=x.name+(x.kind==='news'?` · Story ${s.child+1}`:x.kind==='markets'?` · ${s.market.display}`:x.kind==='trenches'?` · ${s.trenches.symbol}`:'');nowDetail.textContent=x.sponsor?`Powered by ${x.sponsor}`:x.desc;rundown.innerHTML=s.segments.map((z,i)=>`<div class="row ${i===s.current?'live':''} ${z.children?'open':''} ${!z.enabled?'disabled':''}"><div class="rowmain"><div class="num">${String(i+1).padStart(2,'0')}</div><div class="name"><b>${z.name}</b><small>${z.desc}${z.sponsor?' · Powered by '+z.sponsor:''}</small></div><div class="switch ${z.enabled?'on':''}" onclick="enable(${i})"></div><button class="mini take" onclick="take(${i})">TAKE</button></div>${z.children?`<div class="children">${z.children.map((c,j)=>`<div class="child ${i===s.current&&j===s.child?'active':''}"><span>${j+1}</span><b>${c}</b><button class="mini take" onclick="takeChild(${i},${j})">TAKE</button></div>`).join('')}</div>`:''}${z.kind==='markets'?marketTools():z.kind==='trenches'?trenchesTools():''}</div>`).join('')}
ch.onmessage=e=>{if(e.data?.type==='hello')ch.postMessage({type:'state',state:s})};save();
</script></body></html>
