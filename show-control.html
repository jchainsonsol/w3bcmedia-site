<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>W3BC Show Control</title><style>:root{--c:#22d3e5;--bg:#07090b;--p:#0d1114;--l:#273139;--m:#7f8b92;--g:#58dfa2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4f6f7;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{height:3px;background:linear-gradient(90deg,var(--c),#8b5cf6)}header{height:76px;border-bottom:1px solid var(--l);display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:#090c0e}.brand{display:flex;align-items:center;gap:14px}.brand img{width:68px;height:50px;object-fit:contain}.brand b{letter-spacing:.13em}.brand small{display:block;color:#69767e;letter-spacing:.18em;font-size:7px;margin-top:4px}.btn{border:1px solid #34414a;background:#0a0e11;color:#fff;padding:10px 12px;font-size:9px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;cursor:pointer}.btn.primary{background:var(--c);color:#041013;border-color:var(--c)}main{display:grid;grid-template-columns:minmax(590px,1.15fr) minmax(400px,.85fr);gap:14px;padding:16px;max-width:1500px;margin:auto}.panel{background:var(--p);border:1px solid var(--l);box-shadow:0 18px 50px rgba(0,0,0,.18)}.ph{padding:15px 17px;border-bottom:1px solid var(--l);display:flex;justify-content:space-between;align-items:center}.ph h2{font-size:16px;margin:0}.ph span{font-size:8px;color:#718088;letter-spacing:.11em;text-transform:uppercase}.showrow{border-bottom:1px solid #20282d}.showrow.disabled{opacity:.32}.rowmain{display:grid;grid-template-columns:40px 1fr 82px 42px 175px;gap:10px;align-items:center;padding:12px}.showrow.live>.rowmain{background:linear-gradient(90deg,rgba(34,211,229,.12),rgba(34,211,229,.025));outline:1px solid rgba(34,211,229,.45)}.n{width:34px;height:34px;border:1px solid #354149;display:grid;place-items:center;font-weight:900}.live .n{background:var(--c);color:#041013;border-color:var(--c)}.name b{font-size:13px}.name small{display:block;color:#75828a;font-size:9px;margin-top:3px}.badge{font-size:8px;color:#8f9aa1;border:1px solid #303b42;padding:6px;text-align:center;text-transform:uppercase}.ctrl{display:flex;gap:5px;justify-content:flex-end}.mini{border:1px solid #344149;background:#090d0f;color:#fff;padding:7px 8px;font-size:8px;font-weight:900;cursor:pointer}.mini.take{border-color:var(--c);color:var(--c)}.switch{width:34px;height:18px;border-radius:20px;background:#273139;position:relative;cursor:pointer}.switch:after{content:'';position:absolute;width:12px;height:12px;border-radius:50%;background:#7f8b92;left:3px;top:3px}.switch.on{background:rgba(34,211,229,.25)}.switch.on:after{left:19px;background:var(--c)}.children{display:none;background:#090d0f;border-top:1px solid #20282d;padding:7px 12px 10px 62px}.showrow.open .children{display:block}.child{display:grid;grid-template-columns:28px 1fr 80px;gap:9px;align-items:center;padding:8px;border-bottom:1px solid #1d2429}.child.active{background:rgba(34,211,229,.07)}.child .dot{width:20px;height:20px;border:1px solid #354149;display:grid;place-items:center;font-size:8px}.child b{font-size:10px}.side{display:grid;gap:14px;align-content:start}.livebox,.tools{padding:18px}.ey{font-size:8px;color:var(--c);font-weight:900;letter-spacing:.14em;text-transform:uppercase}.livebox h1{font-size:28px;line-height:1.03;margin:9px 0}.livebox p{font-size:11px;color:#96a1a7;line-height:1.55}.layouts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:15px}.mode{border:1px solid #344149;background:#090d0f;padding:12px;cursor:pointer}.mode b{font-size:10px}.mode span{display:block;color:#75828a;font-size:8px;margin-top:5px}.mode.active{border-color:var(--c);background:rgba(34,211,229,.07)}.preview{aspect-ratio:16/9;background:#030506}.preview iframe{width:100%;height:100%;border:0}.symbols{display:flex;gap:6px;flex-wrap:wrap}.symbol{border:1px solid #344149;background:#090d0f;color:#fff;padding:8px 10px;font-size:9px;font-weight:800;cursor:pointer}.symbol.active{border-color:var(--c);color:var(--c)}.field{margin-top:11px}.field label{display:block;color:#77858d;font-size:8px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px}.field input,.field textarea{width:100%;background:#090d0f;border:1px solid #303b43;color:#fff;padding:9px;font-size:10px}.field textarea{min-height:64px}.tickerList{margin-top:10px}.tickerItem{display:grid;grid-template-columns:1fr 28px;gap:6px;margin-top:5px}.tickerItem div{border:1px solid #29343b;padding:7px;font-size:9px;color:#aab4b9}.danger{color:#ff7b80}.sponsorCard{border:1px solid #303b43;padding:12px;background:linear-gradient(135deg,#0b1013,#10171b);margin-top:8px}.sponsorCard b{font-size:11px}.sponsorCard span{display:block;color:#7f8b92;font-size:9px;margin-top:4px}.status{color:var(--g)!important}@media(max-width:1000px){main{grid-template-columns:1fr}.rowmain{grid-template-columns:38px 1fr 42px}.badge{display:none}.ctrl{grid-column:2/4;justify-content:flex-start}}</style></head><body><div class="top"></div><header><div class="brand"><img src="assets/w3bc-logo-white.png"><div><b>W3BC SHOW CONTROL</b><small>MASTER RUNDOWN · PROGRAM · TICKER · SPONSORS</small></div></div><button class="btn primary" onclick="launch()">Launch Program Output</button></header><main><section class="panel"><div class="ph"><h2>Today's Show Rundown</h2><span>Toggle anything you are not using today</span></div><div id="rundown"></div></section><aside class="side"><section class="panel"><div class="ph"><h2>On Air</h2><span id="count"></span></div><div class="livebox"><div class="ey" id="ey"></div><h1 id="ttl"></h1><p id="desc"></p><div class="layouts" id="layouts"></div></div></section><section class="panel"><div class="ph"><h2>Live Ticker</h2><span class="status">● ON PROGRAM</span></div><div class="tools"><div class="field"><label>Add headline / update</label><input id="tickerInput" placeholder="Paste a breaking headline, market move or show update"><button class="btn primary" style="width:100%;margin-top:6px" onclick="addTicker()">Add To Ticker</button></div><div class="tickerList" id="tickerList"></div></div></section><section class="panel"><div class="ph"><h2>Sponsor Rotation</h2><span>Built into program output</span></div><div class="tools"><div class="field"><label>Sponsor name</label><input id="spName" placeholder="BC.GAME"></div><div class="field"><label>Message</label><input id="spMsg" placeholder="Official partner of W3BC"></div><button class="btn" style="width:100%" onclick="addSponsor()">Add Sponsor</button><div id="sponsors"></div></div></section><section class="panel"><div class="ph"><h2>Markets</h2><span>Quick select</span></div><div class="tools"><div class="symbols" id="symbols"></div><button class="btn" style="width:100%;margin-top:10px" onclick="window.open('markets-terminal.html','w3bcMarkets','width=1500,height=900')">Open Markets Terminal</button></div></section><section class="panel"><div class="ph"><h2>Program Preview</h2><span>16:9</span></div><div class="preview"><iframe src="broadcast-show.html?preview=1"></iframe></div></section></aside></main><script>
const KEY='w3bcShowStateV1',ch=new BroadcastChannel('w3bc-show');const defaults=[{name:'Open',kind:'camera',desc:'Full-screen host camera. Clean W3BC lower third.',modes:['host-full']},{name:'Markets Now',kind:'markets',desc:'Chart-first market analysis and technical levels.',modes:['chart-host','chart-full']},{name:'News Desk',kind:'news',desc:'Daily intelligence with granular story rundown.',modes:['news-host','news-full'],children:['Lead Story · Tokenization + Onchain Finance','Japan · Government Bonds','RWA · DeFi Utilization','Compound · Institutional DeFi','Tokenized Equities','Bitcoin · ETF Flows','Stablecoins · Policy']},{name:'AI + Technology',kind:'desk',desc:'AI, agents, chips, products and infrastructure.',modes:['desk-host','desk-full']},{name:'Sports',kind:'sports',desc:'Major sports stories, matchups and developments.',modes:['sports-host','sports-full']},{name:'Betting Desk',kind:'betting',desc:'Lines, movement, sportsbooks and BC Game.',modes:['betting-host','betting-full']},{name:'Interview',kind:'interview',desc:'Two-person guest conversation.',modes:['interview-split']},{name:'Open Panel',kind:'panel',desc:'Multi-guest discussion layout.',modes:['panel-grid']},{name:'Close',kind:'camera',desc:'Camera-forward close, watch list and tomorrow.',modes:['host-full']}];let old=JSON.parse(localStorage.getItem(KEY)||'null')||{};let s={current:old.current||0,child:old.child||0,mode:old.mode||'host-full',symbol:old.symbol||'BTCUSD',timeframe:old.timeframe||'15m',segments:old.segments||defaults,ticker:old.ticker||['W3BC News Desk · Independent intelligence for what matters','Markets · Crypto · AI · Sports · Betting · Culture'],sponsors:old.sponsors||[{name:'W3BC MEDIA',msg:'Turn Your Moment Into Momentum'}],sponsorIndex:old.sponsorIndex||0};s.segments.forEach(x=>{if(x.enabled===undefined)x.enabled=true});function save(){localStorage.setItem(KEY,JSON.stringify(s));ch.postMessage({type:'state',state:s});render()}function launch(){window.open('broadcast-show.html','w3bcProgram','width=1600,height=900,resizable=yes');setTimeout(()=>ch.postMessage({type:'state',state:s}),500)}function take(i){if(!s.segments[i].enabled)return;s.current=i;s.child=0;s.mode=s.segments[i].modes[0];save()}function toggle(i){document.querySelector(`[data-i="${i}"]`).classList.toggle('open')}function enable(i){s.segments[i].enabled=!s.segments[i].enabled;if(!s.segments[s.current].enabled){let n=s.segments.findIndex(x=>x.enabled);s.current=n<0?0:n}s.mode=s.segments[s.current].modes[0];save()}function takeChild(i,j){s.current=i;s.child=j;s.mode='news-host';save()}function setMode(m){s.mode=m;save()}function setSymbol(x){s.symbol=x;save()}function addTicker(){let v=tickerInput.value.trim();if(!v)return;s.ticker.push(v);tickerInput.value='';save()}function delTicker(i){s.ticker.splice(i,1);save()}function addSponsor(){let n=spName.value.trim(),m=spMsg.value.trim();if(!n)return;s.sponsors.push({name:n,msg:m||'W3BC Partner'});spName.value='';spMsg.value='';save()}function delSponsor(i){s.sponsors.splice(i,1);save()}function render(){let enabled=s.segments.filter(x=>x.enabled);rundown.innerHTML=s.segments.map((x,i)=>`<div class="showrow ${i===s.current?'live':''} ${x.children?'open':''} ${!x.enabled?'disabled':''}" data-i="${i}"><div class="rowmain"><div class="n">${String(i+1).padStart(2,'0')}</div><div class="name"><b>${x.name}</b><small>${x.desc}</small></div><div class="badge">${x.kind}</div><div class="switch ${x.enabled?'on':''}" onclick="enable(${i})" title="Include in show"></div><div class="ctrl">${x.children?`<button class="mini" onclick="toggle(${i})">▾ STORIES</button>`:''}<button class="mini take" onclick="take(${i})">TAKE</button></div></div>${x.children?`<div class="children">${x.children.map((c,j)=>`<div class="child ${i===s.current&&j===s.child?'active':''}"><div class="dot">${j+1}</div><b>${c}</b><button class="mini take" onclick="takeChild(${i},${j})">TAKE</button></div>`).join('')}</div>`:''}</div>`).join('');const x=s.segments[s.current];ey.textContent='LIVE · '+x.kind;ttl.textContent=x.name;desc.textContent=x.desc;count.textContent=`${enabled.indexOf(x)+1} / ${enabled.length} ACTIVE`;layouts.innerHTML=x.modes.map(m=>`<div class="mode ${m===s.mode?'active':''}" onclick="setMode('${m}')"><b>${m.replaceAll('-',' ').toUpperCase()}</b><span>TAKE layout</span></div>`).join('');symbols.innerHTML=['BTCUSD','ETHUSD','SOLUSD','SPX','NDX','GOLD'].map(x=>`<button class="symbol ${x===s.symbol?'active':''}" onclick="setSymbol('${x}')">${x}</button>`).join('');tickerList.innerHTML=s.ticker.map((x,i)=>`<div class="tickerItem"><div>${x}</div><button class="mini danger" onclick="delTicker(${i})">×</button></div>`).join('');sponsors.innerHTML=s.sponsors.map((x,i)=>`<div class="sponsorCard"><b>${x.name}</b><span>${x.msg}</span><button class="mini danger" style="margin-top:7px" onclick="delSponsor(${i})">REMOVE</button></div>`).join('')}ch.onmessage=e=>{if(e.data?.type==='hello')ch.postMessage({type:'state',state:s})};save();</script></body></html>
