<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>W3BC Show Control</title><style>:root{--c:#22d3e5;--bg:#07090b;--p:#0d1114;--l:#263139;--m:#7e8a92;--g:#58dfa2;--r:#ff7075}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4f6f7;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{height:3px;background:linear-gradient(90deg,var(--c),#8b5cf6)}header{height:76px;border-bottom:1px solid var(--l);display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:#090c0e;position:sticky;top:0;z-index:20}.brand{display:flex;align-items:center;gap:13px}.brand img{width:68px;height:50px;object-fit:contain}.brand b{letter-spacing:.13em}.brand small{display:block;color:#69767e;letter-spacing:.18em;font-size:7px;margin-top:4px}.btn,.mini{border:1px solid #34414a;background:#0a0e11;color:#fff;padding:9px 11px;font-size:8px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}.btn.primary,.mini.take{border-color:var(--c);color:var(--c)}.btn.primary{background:var(--c);color:#041013}.btn.danger,.mini.danger{color:var(--r)}main{display:grid;grid-template-columns:minmax(610px,1.18fr) minmax(430px,.82fr);gap:14px;padding:16px;max-width:1540px;margin:auto}.panel{background:var(--p);border:1px solid var(--l)}.ph{padding:14px 16px;border-bottom:1px solid var(--l);display:flex;justify-content:space-between;align-items:center}.ph h2{font-size:15px;margin:0}.ph span{font-size:8px;color:#718088;letter-spacing:.1em;text-transform:uppercase}.row{border-bottom:1px solid #20282d}.row.disabled{opacity:.33}.rowmain{display:grid;grid-template-columns:38px 1fr 80px 38px 170px;gap:9px;align-items:center;padding:11px}.row.live>.rowmain{background:linear-gradient(90deg,rgba(34,211,229,.12),rgba(34,211,229,.025));outline:1px solid rgba(34,211,229,.42)}.num{width:32px;height:32px;border:1px solid #354149;display:grid;place-items:center;font-weight:900}.live .num{background:var(--c);color:#041013}.name b{font-size:12px}.name small{display:block;color:#75828a;font-size:9px;margin-top:3px}.badge{font-size:7px;color:#8f9aa1;border:1px solid #303b42;padding:6px;text-align:center;text-transform:uppercase}.ctrl{display:flex;gap:5px;justify-content:flex-end}.switch{width:32px;height:17px;border-radius:18px;background:#273139;position:relative;cursor:pointer}.switch:after{content:'';position:absolute;width:11px;height:11px;border-radius:50%;background:#7f8b92;left:3px;top:3px}.switch.on{background:rgba(34,211,229,.24)}.switch.on:after{left:18px;background:var(--c)}.children{display:none;background:#090d0f;border-top:1px solid #20282d;padding:6px 10px 9px 58px}.row.open .children{display:block}.child{display:grid;grid-template-columns:26px 1fr 70px;gap:8px;align-items:center;padding:7px;border-bottom:1px solid #1d2429}.child.active{background:rgba(34,211,229,.07)}.child span{width:19px;height:19px;border:1px solid #354149;display:grid;place-items:center;font-size:8px}.child b{font-size:9px}.side{display:grid;gap:14px;align-content:start}.box{padding:17px}.ey{font-size:8px;color:var(--c);font-weight:900;letter-spacing:.13em;text-transform:uppercase}.box h1{font-size:27px;line-height:1.03;margin:8px 0}.box p{font-size:11px;color:#96a1a7;line-height:1.55}.powered{display:inline-flex;gap:6px;margin-top:9px;border:1px solid #324048;padding:6px 8px;font-size:8px;color:#8d9aa2;text-transform:uppercase}.powered b{color:#fff}.layouts{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:13px}.mode{border:1px solid #344149;background:#090d0f;padding:11px;cursor:pointer}.mode.active{border-color:var(--c);background:rgba(34,211,229,.07)}.mode b{font-size:9px}.mode span{display:block;color:#75828a;font-size:8px;margin-top:4px}.field{margin-top:10px}.field label{display:block;color:#77858d;font-size:8px;letter-spacing:.09em;text-transform:uppercase;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;background:#090d0f;border:1px solid #303b43;color:#fff;padding:9px;font-size:10px}.field textarea{min-height:66px;resize:vertical}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:8px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid #344149;background:#090d0f;color:#fff;padding:7px 9px;font-size:8px;font-weight:800;cursor:pointer}.chip.active{border-color:var(--c);color:var(--c)}.workspaceHero{padding:12px;border:1px solid #2a353d;background:linear-gradient(135deg,#0a0f12,#11191d);margin-bottom:10px}.workspaceHero b{font-size:12px}.workspaceHero span{display:block;color:#78858d;font-size:9px;margin-top:4px}.tickerItem{display:grid;grid-template-columns:1fr 28px;gap:5px;margin-top:5px}.tickerItem div{border:1px solid #29343b;padding:7px;font-size:9px;color:#aab4b9}.sponsorCard{border:1px solid #303b43;padding:10px;background:#0a0e11;margin-top:7px}.sponsorCard b{font-size:10px}.sponsorCard span{display:block;color:#7f8b92;font-size:9px;margin-top:3px}.preview{aspect-ratio:16/9;background:#030506}.preview iframe{width:100%;height:100%;border:0}.status{color:var(--g)!important}@media(max-width:1000px){main{grid-template-columns:1fr}.rowmain{grid-template-columns:36px 1fr 36px}.badge{display:none}.ctrl{grid-column:2/4;justify-content:flex-start}.three{grid-template-columns:1fr}}</style></head><body><div class="top"></div><header><div class="brand"><img src="assets/w3bc-logo-white.png"><div><b>W3BC SHOW CONTROL</b><small>MASTER RUNDOWN · LIVE GRAPHICS · PRODUCER TOOLS</small></div></div><button class="btn primary" onclick="launch()">Launch Fresh Program Output</button></header><main><section class="panel"><div class="ph"><h2>Today's Show Rundown</h2><span>Toggle · expand · take</span></div><div id="rundown"></div></section><aside class="side"><section class="panel"><div class="ph"><h2>On Air</h2><span id="count"></span></div><div class="box"><div class="ey" id="ey"></div><h1 id="ttl"></h1><p id="desc"></p><div id="power"></div><div class="layouts" id="layouts"></div></div></section><section class="panel"><div class="ph"><h2>Section Workspace</h2><span id="workspaceLabel"></span></div><div class="box" id="workspace"></div></section><section class="panel"><div class="ph"><h2>Live Ticker</h2><span class="status">● LIVE OUTPUT</span></div><div class="box"><div class="field"><label>Add update</label><input id="tickerInput" placeholder="Breaking headline, market move, show update"><button class="btn primary" style="width:100%;margin-top:6px" onclick="addTicker()">Add To Ticker</button></div><div id="tickerList"></div></div></section><section class="panel"><div class="ph"><h2>Sponsor Inventory</h2><span>General rotation</span></div><div class="box"><div class="field"><label>Name</label><input id="spName" placeholder="Sponsor"></div><div class="field"><label>Message</label><input id="spMsg" placeholder="Official partner of W3BC"></div><button class="btn" style="width:100%;margin-top:6px" onclick="addSponsor()">Add Sponsor</button><div id="sponsors"></div></div></section><section class="panel"><div class="ph"><h2>Program Preview</h2><span>16:9</span></div><div class="preview"><iframe id="preview" src="broadcast-show.html?v=2&preview=1"></iframe></div></section></aside></main><script>
const KEY='w3bcShowStateV1',ch=new BroadcastChannel('w3bc-show');const defs=[{name:'Open',kind:'camera',desc:'Full-screen host camera and lower third.',modes:['host-full'],sponsor:''},{name:'Markets Now',kind:'markets',desc:'Chart-first market analysis and technical levels.',modes:['chart-host','chart-full'],sponsor:'Bitunix'},{name:'News Desk',kind:'news',desc:'Daily intelligence presented story-by-story.',modes:['news-host','news-full'],sponsor:'',children:['Lead Story · Tokenization + Onchain Finance','Japan · Government Bonds','RWA · DeFi Utilization','Compound · Institutional DeFi','Tokenized Equities','Bitcoin · ETF Flows','Stablecoins · Policy']},{name:'AI + Technology',kind:'ai',desc:'AI, agents, chips, products and infrastructure.',modes:['ai-host','ai-full'],sponsor:''},{name:'Sports',kind:'sports',desc:'Major games, injuries, matchups and storylines.',modes:['sports-host','sports-full'],sponsor:''},{name:'Betting Desk',kind:'betting',desc:'Lines, movement, sportsbooks and betting context.',modes:['betting-host','betting-full'],sponsor:'BC.GAME'},{name:'Interview',kind:'interview',desc:'Two-person guest conversation.',modes:['interview-split'],sponsor:''},{name:'Open Panel',kind:'panel',desc:'Multi-guest discussion layout.',modes:['panel-grid'],sponsor:''},{name:'Close',kind:'camera',desc:'Camera-forward close and tomorrow watch list.',modes:['host-full'],sponsor:''}];const defaultStories=[{headline:'The financial system is moving onchain — piece by piece.',summary:'Tokenization is moving from theory into infrastructure. Governments, financial institutions and DeFi protocols are increasingly testing how traditional assets can be issued, settled and used onchain.',stats:[['THE SHIFT','RWA'],['FOCUS','SETTLEMENT'],['TREND','ONCHAIN']],quote:'The important story is not one product — it is the financial architecture being built underneath the market.'},{headline:'Japan tests blockchain around government bond activity.',summary:'Japan is exploring how blockchain infrastructure could improve parts of the government bond lifecycle, another signal that tokenization is expanding beyond private-market experiments.',stats:[['ASSET','BONDS'],['MARKET','JAPAN'],['WATCH','SETTLEMENT']],quote:'Government debt is one of the clearest tests of whether tokenized finance can operate at institutional scale.'},{headline:'Real-world assets are becoming productive inside DeFi.',summary:'Tokenized real-world assets are increasingly being used as financial building blocks rather than simply represented onchain, connecting traditional yield and collateral with decentralized markets.',stats:[['SECTOR','RWA'],['USE CASE','DEFI'],['FOCUS','UTILITY']],quote:'The next phase is utility: tokenized assets that can actually move, settle, collateralize and earn.'},{headline:'Compound pushes deeper into institutional DeFi.',summary:'Institutional DeFi is becoming a product-design problem around compliance, custody, liquidity and operational controls — not merely access to yield.',stats:[['FOCUS','INSTITUTIONS'],['SECTOR','DEFI'],['WATCH','CAPITAL']],quote:'The winners will make onchain finance usable for professional capital, not just technically possible.'},{headline:'Tokenized equities are expanding the investable onchain universe.',summary:'Stocks and equity-like exposure are increasingly joining treasuries and funds as part of the real-world asset opportunity.',stats:[['ASSET','EQUITIES'],['TREND','GROWTH'],['WATCH','LIQUIDITY']],quote:'Issuance matters, but distribution and liquidity determine whether tokenized equities become a real market.'},{headline:'Bitcoin ETF flows show institutions are not one trade.',summary:'Aggregate ETF flows can look simple while individual institutions are making very different allocation decisions underneath the surface.',stats:[['ASSET','BITCOIN'],['VEHICLE','ETF'],['WATCH','FLOWS']],quote:'Institutional adoption is thousands of allocators — not one giant buy or sell button.'},{headline:'Stablecoin policy is becoming settlement policy.',summary:'The stablecoin conversation is increasingly shifting from speculative crypto toward regulated payments, settlement and financial infrastructure.',stats:[['ASSET','STABLECOINS'],['FOCUS','PAYMENTS'],['WATCH','RULES']],quote:'Stablecoins may become one of the primary bridges between traditional finance and onchain markets.'}];let old=JSON.parse(localStorage.getItem(KEY)||'null')||{};let s={current:old.current??0,child:old.child??0,mode:old.mode||'host-full',segments:old.segments||defs,ticker:old.ticker||['W3BC LIVE · Markets · Technology · Sports · Betting · Culture'],sponsors:old.sponsors||[{name:'W3BC MEDIA',msg:'Turn Your Moment Into Momentum'}],market:old.market||{symbol:'BTCUSD',timeframe:'15m',note:'Watching support, resistance and momentum.'},ai:old.ai||{headline:'AI developments worth watching today',detail:'Agents, models, chips and infrastructure.'},sports:old.sports||{headline:'Top sports stories today',detail:'Major games, injuries and storylines.'},betting:old.betting||{event:'Featured betting market',line:'-110',movement:'Line movement pending',note:'Context before picks.'},newsStories:old.newsStories||defaultStories};s.segments.forEach((x,i)=>{if(x.enabled===undefined)x.enabled=true;if(x.sponsor===undefined)x.sponsor=defs[i]?.sponsor||'';if(x.kind==='desk')x.kind=defs[i]?.kind||'ai'});while(s.newsStories.length<defaultStories.length)s.newsStories.push(defaultStories[s.newsStories.length]);function save(){localStorage.setItem(KEY,JSON.stringify(s));ch.postMessage({type:'state',state:s});render()}function launch(){const url='broadcast-show.html?v='+Date.now();const w=window.open(url,'w3bcProgram_'+Date.now(),'width=1600,height=900,resizable=yes');setTimeout(()=>ch.postMessage({type:'state',state:s}),700)}function take(i){if(!s.segments[i].enabled)return;s.current=i;s.child=0;s.mode=s.segments[i].modes[0];save()}function toggle(i){document.querySelector(`[data-i="${i}"]`).classList.toggle('open')}function enable(i){s.segments[i].enabled=!s.segments[i].enabled;if(!s.segments[s.current].enabled){let n=s.segments.findIndex(x=>x.enabled);s.current=n<0?0:n}s.mode=s.segments[s.current].modes[0];save()}function takeChild(i,j){s.current=i;s.child=j;s.mode='news-host';save()}function setMode(m){s.mode=m;save()}function setMarket(k,v){s.market[k]=v;save()}function setObj(o,k,v){s[o][k]=v;save()}function addTicker(){let v=tickerInput.value.trim();if(!v)return;s.ticker.push(v);tickerInput.value='';save()}function delTicker(i){s.ticker.splice(i,1);save()}function addSponsor(){let n=spName.value.trim(),m=spMsg.value.trim();if(!n)return;s.sponsors.push({name:n,msg:m||'W3BC Partner'});spName.value='';spMsg.value='';save()}function delSponsor(i){s.sponsors.splice(i,1);save()}function setStory(k,v){s.newsStories[s.child][k]=v;save()}function setStat(i,k,v){s.newsStories[s.child].stats[i][k]=v;save()}function workspaceHTML(x){if(x.kind==='markets')return `<div class="workspaceHero"><b>MARKETS NOW</b><span>Powered by Bitunix</span></div><div class="field"><label>Symbol</label><div class="chips">${['BTCUSD','ETHUSD','SOLUSD','SPX','NDX','GOLD'].map(v=>`<button class="chip ${v===s.market.symbol?'active':''}" onclick="setMarket('symbol','${v}')">${v}</button>`).join('')}</div></div><div class="field"><label>Timeframe</label><div class="chips">${['1m','5m','15m','1h','4h','1D'].map(v=>`<button class="chip ${v===s.market.timeframe?'active':''}" onclick="setMarket('timeframe','${v}')">${v}</button>`).join('')}</div></div><div class="field"><label>Analyst note</label><textarea onchange="setMarket('note',this.value)">${s.market.note}</textarea></div><button class="btn primary" style="width:100%;margin-top:7px" onclick="window.open('markets-terminal.html?v='+Date.now(),'w3bcMarkets_'+Date.now(),'width=1500,height=900')">Open Fresh Markets Terminal</button>`;if(x.kind==='news'){let d=s.newsStories[s.child];return `<div class="workspaceHero"><b>NEWS DESK STORY ${s.child+1}</b><span>Headline · summary · stats · takeaway</span></div><div class="field"><label>Story</label><select onchange="takeChild(${s.current},+this.value)">${x.children.map((c,i)=>`<option value="${i}" ${i===s.child?'selected':''}>${i+1}. ${c}</option>`).join('')}</select></div><div class="field"><label>Headline</label><textarea onchange="setStory('headline',this.value)">${d.headline}</textarea></div><div class="field"><label>Readable summary</label><textarea onchange="setStory('summary',this.value)" style="min-height:105px">${d.summary}</textarea></div><div class="three">${d.stats.map((v,i)=>`<div><div class="field"><label>Stat ${i+1} Label</label><input value="${v[0]}" onchange="setStat(${i},0,this.value)"></div><div class="field"><label>Stat ${i+1} Value</label><input value="${v[1]}" onchange="setStat(${i},1,this.value)"></div></div>`).join('')}</div><div class="field"><label>Key takeaway / quote</label><textarea onchange="setStory('quote',this.value)">${d.quote}</textarea></div>`}if(x.kind==='ai')return `<div class="workspaceHero"><b>AI + TECHNOLOGY</b><span>Headline + context</span></div><div class="field"><label>Lead headline</label><input value="${s.ai.headline}" onchange="setObj('ai','headline',this.value)"></div><div class="field"><label>Context</label><textarea onchange="setObj('ai','detail',this.value)">${s.ai.detail}</textarea></div>`;if(x.kind==='sports')return `<div class="workspaceHero"><b>SPORTS</b><span>Headline + scoreboard context</span></div><div class="field"><label>Lead story</label><input value="${s.sports.headline}" onchange="setObj('sports','headline',this.value)"></div><div class="field"><label>Details</label><textarea onchange="setObj('sports','detail',this.value)">${s.sports.detail}</textarea></div>`;if(x.kind==='betting')return `<div class="workspaceHero"><b>BETTING DESK</b><span>Powered by BC.GAME</span></div><div class="field"><label>Featured market / event</label><input value="${s.betting.event}" onchange="setObj('betting','event',this.value)"></div><div class="twocol"><div class="field"><label>Current line</label><input value="${s.betting.line}" onchange="setObj('betting','line',this.value)"></div><div class="field"><label>Movement</label><input value="${s.betting.movement}" onchange="setObj('betting','movement',this.value)"></div></div><div class="field"><label>Context</label><textarea onchange="setObj('betting','note',this.value)">${s.betting.note}</textarea></div>`;if(x.kind==='interview')return `<div class="workspaceHero"><b>INTERVIEW</b><span>Two-person split screen</span></div>`;if(x.kind==='panel')return `<div class="workspaceHero"><b>OPEN PANEL</b><span>Four-camera grid</span></div>`;return `<div class="workspaceHero"><b>${x.name.toUpperCase()}</b><span>Camera-forward scene</span></div>`}function render(){let enabled=s.segments.filter(x=>x.enabled);rundown.innerHTML=s.segments.map((x,i)=>`<div class="row ${i===s.current?'live':''} ${x.children?'open':''} ${!x.enabled?'disabled':''}" data-i="${i}"><div class="rowmain"><div class="num">${String(i+1).padStart(2,'0')}</div><div class="name"><b>${x.name}</b><small>${x.desc}${x.sponsor?` · Powered by ${x.sponsor}`:''}</small></div><div class="badge">${x.kind}</div><div class="switch ${x.enabled?'on':''}" onclick="enable(${i})"></div><div class="ctrl">${x.children?`<button class="mini" onclick="toggle(${i})">▾ STORIES</button>`:''}<button class="mini take" onclick="take(${i})">TAKE</button></div></div>${x.children?`<div class="children">${x.children.map((c,j)=>`<div class="child ${i===s.current&&j===s.child?'active':''}"><span>${j+1}</span><b>${c}</b><button class="mini take" onclick="takeChild(${i},${j})">TAKE</button></div>`).join('')}</div>`:''}</div>`).join('');const x=s.segments[s.current];ey.textContent='LIVE · '+x.kind;ttl.textContent=x.name;desc.textContent=x.desc;count.textContent=`${enabled.indexOf(x)+1} / ${enabled.length} ACTIVE`;power.innerHTML=x.sponsor?`<div class="powered">POWERED BY <b>${x.sponsor}</b></div>`:'';layouts.innerHTML=x.modes.map(m=>`<div class="mode ${m===s.mode?'active':''}" onclick="setMode('${m}')"><b>${m.replaceAll('-',' ').toUpperCase()}</b><span>Take layout</span></div>`).join('');workspaceLabel.textContent=x.name+' controls';workspace.innerHTML=workspaceHTML(x);tickerList.innerHTML=s.ticker.map((x,i)=>`<div class="tickerItem"><div>${x}</div><button class="mini danger" onclick="delTicker(${i})">×</button></div>`).join('');sponsors.innerHTML=s.sponsors.map((x,i)=>`<div class="sponsorCard"><b>${x.name}</b><span>${x.msg}</span><button class="mini danger" style="margin-top:6px" onclick="delSponsor(${i})">REMOVE</button></div>`).join('')}ch.onmessage=e=>{if(e.data?.type==='hello')ch.postMessage({type:'state',state:s})};save();</script></body></html>
